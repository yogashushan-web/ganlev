[build]
  command = "npm install"
  publish = "."
  functions = "crm/netlify/functions"

[build.environment]
  # Node 22: supabase-js >=2.108 needs native WebSocket (Node 22+) at runtime,
  # and it also satisfies supabase's node>=20 install requirement.
  NODE_VERSION = "22"
  # SUPABASE_URL is a public endpoint that must appear in the CSP header below,
  # so exclude it from secrets scanning (real secrets stay scanned).
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"

[functions]
  node_bundler = "esbuild"
  # heic-convert / libheif-js load a .wasm file from disk at runtime, so keep them
  # unbundled (copied as-is with their assets) instead of letting esbuild inline them.
  external_node_modules = ["heic-convert", "heic-decode", "libheif-js"]

# Security headers applied to every response
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://zjawuhqldnqesnflmtoa.supabase.co; connect-src 'self' https://www.hebcal.com https://zjawuhqldnqesnflmtoa.supabase.co; frame-src https://calendar.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

# The album page bundles a HEIC->JPEG converter (libheif) that internally uses
# `new Function`, which requires 'unsafe-eval'. Relax script-src for THIS page
# only — every other page keeps the strict CSP defined in the /* block above.
[[headers]]
  for = "/crm/html/album.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://zjawuhqldnqesnflmtoa.supabase.co; connect-src 'self' https://www.hebcal.com https://zjawuhqldnqesnflmtoa.supabase.co; frame-src https://calendar.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

[[redirects]]
  from = "/"
  to = "/crm/html/login.html"
  status = 302

[[redirects]]
  from = "/crm"
  to = "/crm/html/login.html"
  status = 302

[[redirects]]
  from = "/crm/"
  to = "/crm/html/login.html"
  status = 302

# Short links for the public "זמן הורים" booking page — nice to paste in WhatsApp.
# status 200 = rewrite (the short URL stays in the address bar).
[[redirects]]
  from = "/meeting"
  to = "/crm/html/meeting.html"
  status = 200

[[redirects]]
  from = "/pt"
  to = "/crm/html/meeting.html"
  status = 200

# Short link for the public "שנת הצהריים" nap-ritual form (share with parents).
[[redirects]]
  from = "/nap"
  to = "/crm/html/nap.html"
  status = 200

# NOTE: SUPABASE_URL and SUPABASE_ANON_KEY are provided via Netlify dashboard
# env vars (all-context). They are intentionally NOT hardcoded here so the
# secrets scanner does not flag netlify.toml and fail the build.
