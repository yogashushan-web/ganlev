<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>סידור ישיבה — גן לב</title>
  <link href="https://fonts.googleapis.com/css2?family=Alef:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Alef',sans-serif; background:#F4EFE6; color:#3D3228; direction:rtl; min-height:100vh; }
    .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; padding-bottom:14px; border-bottom:2px solid #e8e4de; flex-wrap:wrap; gap:12px; }
    .header h1 { font-size:26px; color:#1F3D34; }
    .btn { background:#1F3D34; color:#fff; border:none; padding:11px 20px; border-radius:10px; cursor:pointer; font-family:'Alef'; font-weight:700; font-size:14px; }
    .btn.ghost { background:#efe9e0; color:#6f6457; }
    .btn.soft { background:#fff; color:#1F3D34; box-shadow:0 2px 8px rgba(0,0,0,.06); }
    .btn:disabled { opacity:.5; cursor:default; }
    .err,.ok { padding:12px; border-radius:10px; margin-bottom:14px; display:none; }
    .err { background:#fdf0ef; color:#c94147; } .ok { background:#d4edda; color:#155724; }
    .err.show,.ok.show { display:block; }
    .hide { display:none !important; }

    .steps { display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; }
    .step-pill { padding:7px 14px; border-radius:999px; font-size:12.5px; font-weight:700; background:#fff; color:#8a7f70; border:1px solid #e8e4de; cursor:pointer; font-family:'Alef'; }
    .step-pill:hover { border-color:#1F3D34; color:#1F3D34; }
    .step-pill.on { background:#1F3D34; color:#fff; border-color:#1F3D34; }
    .step-pill.done { background:#e6f4ec; color:#1F7a4f; border-color:#cfe7d9; }

    .card { background:#fff; border-radius:18px; padding:24px 26px; box-shadow:0 2px 14px rgba(0,0,0,.06); margin-bottom:16px; }
    .card h2 { font-size:20px; color:#1F3D34; margin-bottom:5px; }
    .card .sub { color:#9B8E82; font-size:13.5px; margin-bottom:18px; line-height:1.6; }
    .fld { margin-bottom:16px; }
    .fld label { display:block; font-size:13px; font-weight:700; color:#3D3228; margin-bottom:7px; }
    .fld input, .fld select { width:100%; max-width:340px; padding:11px 13px; border:1.5px solid #e8e4de; border-radius:10px; font-family:'Alef'; font-size:14px; outline:none; }
    .fld input:focus, .fld select:focus { border-color:#1F3D34; }
    .nav { display:flex; gap:10px; margin-top:20px; flex-wrap:wrap; }

    .pick { display:flex; gap:8px; flex-wrap:wrap; }
    .pick .p { border:1.5px solid #e8e4de; background:#fff; border-radius:999px; padding:8px 15px; font-family:'Alef'; font-size:13.5px; font-weight:700; cursor:pointer; color:#6f6457; }
    .pick .p.on { background:#1F3D34; border-color:#1F3D34; color:#fff; }
    .pick .p.staff.on { background:#C4846C; border-color:#C4846C; }
    .count-line { font-size:13px; color:#9B8E82; margin:12px 0 4px; font-weight:700; }
    .bulk { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
    .bulk-all { border-color:#1F3D34 !important; color:#1F3D34 !important; font-weight:700; }
    .bulk-all:hover { background:#1F3D34 !important; color:#fff !important; }
    .bulk-note { font-size:12px; color:#b3a899; font-weight:700; }

    /* ---- בחירת שולחנות, ויזואלית ---- */
    .palette { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
    .shape { border:2px solid #e8e4de; background:#fff; border-radius:14px; padding:10px 12px 8px; cursor:pointer;
             text-align:center; font-family:'Alef'; transition:.12s; }
    .shape:hover { border-color:#1F3D34; background:#f4f9f6; transform:translateY(-2px); }
    .shape.on { border-color:#1F3D34; background:#f4f9f6; }
    .shape .cap { font-size:11.5px; font-weight:700; color:#6f6457; margin-top:4px; }
    .tcards { display:flex; gap:12px; flex-wrap:wrap; }
    .tcard { position:relative; border:2px solid #e8e4de; border-radius:16px; padding:12px 14px 10px; background:#fff; text-align:center; }
    .tcard.picking { border-color:#C4846C; background:#fdf8f4; }
    .tcard b { color:#1F3D34; font-size:13px; display:block; margin-bottom:6px; }
    .tcard .swapline { font-size:11.5px; color:#9B8E82; margin-top:6px; }
    .tcard .kill { position:absolute; top:7px; left:8px; background:#f6f2ec; border:1px solid #e8e1d6; color:#8a7f70;
                   font-size:11px; font-weight:700; cursor:pointer; font-family:'Alef'; line-height:1;
                   border-radius:7px; padding:4px 8px; }
    .tcard .kill:hover { background:#fdf0ef; border-color:#f3cfc9; color:#c94147; }
    .capbar { height:16px; border-radius:999px; background:#efe9e0; overflow:hidden; display:flex; margin:6px 0 4px; max-width:420px; }
    .capbar i { display:block; height:100%; }
    .capbar i.kids { background:#5f93b8; } .capbar i.staff { background:#C4846C; }
    .capnote { font-size:13px; font-weight:700; color:#1F3D34; }
    .capnote.bad { color:#c94147; }

    /* ---- סקיצת השולחנות בשלב הכללים ---- */
    .sketch { background:#FAF8F4; border:1px solid #efe9e0; border-radius:14px; padding:14px 16px; margin-bottom:18px; }
    .sk-hint { font-size:12.5px; color:#9B8E82; font-weight:700; margin-bottom:10px; }
    .sk-tables { display:flex; gap:20px; flex-wrap:wrap; }
    .sk-one { text-align:center; }
    .sk-one .nm { font-size:11.5px; font-weight:700; color:#1F3D34; margin-bottom:4px; }
    .sk-wrap { position:relative; margin:0 auto; }
    .sk-surface { position:absolute; background:#efe6d8; border:1.5px solid #ddd0bb; }
    .sk-seat { position:absolute; width:30px; height:30px; border-radius:50%; border:2px solid #ddd0bb;
      background:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center;
      font-size:8.5px; font-weight:700; color:#b3a89a; }
    .sk-seat:hover { border-color:#1F3D34; }
    .sk-seat.sel { background:#1F7a4f; border-color:#1F7a4f; color:#fff; }
    .sk-seat.nb  { background:#fdf1e3; border-color:#C4846C; color:#8a5a33; }
    .sk-legend { font-size:12px; color:#6f6457; margin-top:11px; display:flex; gap:14px; flex-wrap:wrap; align-items:center; }
    .sk-legend i { display:inline-block; width:12px; height:12px; border-radius:50%; margin-left:5px; vertical-align:-2px; }

    /* ---- חלוקה ויזואלית ---- */
    .splits { display:grid; grid-template-columns:repeat(auto-fill,minmax(178px,1fr)); gap:11px; }
    .sp { border:2px solid #e8e4de; background:#fff; border-radius:16px; padding:14px 12px 12px; cursor:pointer;
          font-family:'Alef'; text-align:center; transition:.12s; }
    .sp:hover { border-color:#1F3D34; transform:translateY(-2px); }
    .sp.on { border-color:#1F3D34; background:#f4f9f6; }
    .sp .t { font-size:14px; font-weight:700; color:#1F3D34; margin-top:9px; }
    .sp .h { font-size:11.5px; color:#9B8E82; margin-top:2px; line-height:1.4; }
    .mini { display:flex; gap:7px; justify-content:center; align-items:flex-end; height:46px; }
    .mt { background:#efe6d8; border:1.5px solid #ddd0bb; border-radius:5px; width:34px; padding:4px 2px;
          display:flex; flex-wrap:wrap; gap:2px; justify-content:center; align-content:flex-end; min-height:22px; }
    .dot { border-radius:50%; background:#5f93b8; }
    .d-s { width:5px; height:5px; } .d-m { width:7px; height:7px; } .d-l { width:9px; height:9px; }

    .staff-row { display:flex; align-items:center; gap:10px; background:#FAF8F4; border-radius:11px; padding:11px 14px; margin-bottom:9px; flex-wrap:wrap; }
    .staff-row select { padding:7px 10px; border:1px solid #e8e4de; border-radius:9px; font-family:'Alef'; font-size:12.5px; }
    .swap { background:#fff; border:1px solid #eccfc2; color:#8a4d33; border-radius:999px; padding:5px 12px; font-family:'Alef'; font-size:12.5px; font-weight:700; cursor:pointer; }
    /* המצב עצמו הוא הכפתור: "יחד" או "⇄ מחליפות", ולחיצה מחליפה ביניהם */
    .both { background:#f4f9f6; border:1px solid #cfe7d9; color:#1F7a4f; border-radius:999px;
            padding:5px 14px; font-size:12.5px; font-weight:700; white-space:nowrap;
            font-family:'Alef'; cursor:pointer; }
    .both:hover { background:#e6f4ec; }
    .nms { font-size:12.5px; color:#6f6457; font-weight:700; }
    .swap:hover { background:#fbf1ec; }

    .rule-row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
    .rule-row select { padding:9px 11px; border:1.5px solid #e8e4de; border-radius:10px; font-family:'Alef'; font-size:13px; }
    .rule-list { display:flex; flex-direction:column; gap:7px; margin-top:14px; }
    .rule { display:flex; align-items:center; gap:10px; background:#FAF8F4; border-radius:10px; padding:9px 13px; font-size:13.5px; flex-wrap:wrap; }
    .rule .x { margin-right:auto; background:none; border:none; color:#c94147; cursor:pointer; font-size:13px; font-family:'Alef'; }
    .rule .state { border:1px solid #cfe7d9; background:#e6f4ec; color:#1F7a4f; border-radius:999px; padding:3px 11px; font-size:11.5px; font-weight:700; cursor:pointer; font-family:'Alef'; }
    .rule.off { opacity:.5; } .rule.off .state { background:#f6f2ec; color:#8a7f70; border-color:#e8e1d6; }

    .opt { display:block; width:100%; text-align:right; border:1.5px solid #e8e4de; background:#fff; border-radius:13px; padding:13px 16px; margin-bottom:9px; cursor:pointer; font-family:'Alef'; }
    .opt.on { border-color:#1F3D34; background:#f4f9f6; }
    .opt b { display:block; font-size:14.5px; color:#1F3D34; margin-bottom:3px; }
    .opt span { font-size:12.5px; color:#9B8E82; line-height:1.55; }

    /* ---------- לוח ---------- */
    .board-top { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
    /* החדר הוא דף A4 לרוחב (1123×794 בפיקסלים). על המסך הוא מוקטן
       כדי להיכנס לרוחב, ובהדפסה הוא חוזר לגודלו המלא ונכנס לעמוד אחד. */
    .room-outer { overflow:hidden; margin:6px 0 14px; }
    .room { position:relative; width:1123px; height:794px; background:#fffdf9;
            border:1.5px dashed #e0d7c7; border-radius:16px; transform-origin:top right; }
    /* שכבת גודל התוכן. היא בתוך הדף ולכן נצרבת גם בהדפסה, בניגוד
       להקטנה של .room שקיימת רק כדי שהדף ייכנס למסך. */
    .rscale { position:absolute; left:0; top:0; width:1123px; height:794px;
              transform-origin:561.5px 397px; }
    .zoombar { display:flex; align-items:center; gap:9px; margin-right:6px;
               padding-right:12px; border-right:1px solid #e8e4de; }
    .zoombar .zv { font-size:12.5px; color:#1F3D34; font-weight:700; min-width:40px;
                   font-variant-numeric:tabular-nums; }
    #zoomR { -webkit-appearance:none; appearance:none; width:132px; height:3px; border-radius:99px;
             background:#e0d7c7; outline:none; cursor:ew-resize; }
    #zoomR::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:14px; height:14px;
             border-radius:50%; background:#fff; border:2px solid #C4846C;
             box-shadow:0 1px 4px rgba(0,0,0,.18); cursor:grab; }
    #zoomR::-moz-range-thumb { width:12px; height:12px; border-radius:50%; background:#fff;
             border:2px solid #C4846C; box-shadow:0 1px 4px rgba(0,0,0,.18); cursor:grab; }
    #zoomR:focus-visible { outline:2px solid #1F3D34; outline-offset:4px; }
    .a4note { font-size:11.5px; color:#b3a89a; text-align:left; margin-bottom:4px; }
    .twrap { position:absolute; touch-action:none; }
    /* שם השולחן יושב במרכזו, וניתן ללחוץ עליו כדי לשנות */
    .tlabel { position:absolute; display:flex; align-items:center; gap:4px; font-size:12.5px; font-weight:700;
              color:#8a7f70; white-space:nowrap; z-index:5; }
    .tname { cursor:text; padding:2px 8px; border-radius:7px; border:1px dashed transparent; }
    .tname:hover { border-color:#C4846C; color:#1F3D34; background:rgba(255,255,255,.7); }
    .tname-input { width:92px; padding:3px 7px; border:1.5px solid #1F3D34; border-radius:7px;
                   font-family:'Alef'; font-size:12.5px; font-weight:700; text-align:center; outline:none; }
    /* ⟳ מסובב ברבע סיבוב — נשאר רק למסך צר, שם אין לאן לגרור ידית באצבע */
    .rot { display:none; background:rgba(255,255,255,.8); border:1px solid #e8e4de; border-radius:6px; font-size:10.5px; cursor:pointer; font-family:'Alef'; padding:1px 5px; }
    @media (max-width: 760px), (hover: none) { .rot { display:inline-block; } .rhandle { display:none; } }

    /* ידית הסיבוב: עיגול על גבעול קצר מראש השולחן, כמו בכל כלי גרפי */
    .rhandle { position:absolute; left:50%; top:-16px; transform:translateX(-50%);
               width:26px; height:26px; cursor:grab; z-index:8; opacity:0; transition:opacity .12s; }
    .twrap:hover .rhandle, .rhandle:active { opacity:1; }
    .rhandle::before { content:''; position:absolute; left:50%; top:13px; width:1.5px; height:15px;
                       background:#C4846C; transform:translateX(-50%); }
    .rhandle span { position:absolute; left:50%; top:2px; transform:translateX(-50%);
                    width:13px; height:13px; border-radius:50%; background:#fff;
                    border:2px solid #C4846C; box-shadow:0 1px 4px rgba(0,0,0,.15); display:block; }
    .rhandle:active { cursor:grabbing; }
    /* מספר המעלות החי ליד האצבע */
    .rot-tag { position:fixed; z-index:10002; pointer-events:none; background:#fff; color:#9B8E82;
               border:1.5px solid #e8e4de; border-radius:999px; padding:3px 11px; font-size:12px;
               font-weight:700; box-shadow:0 3px 10px rgba(0,0,0,.14); white-space:nowrap; }
    .rot-tag.snap { color:#8a5a44; border-color:#C4846C; background:#fdf6f2; }
    /* כפתור הביטול אומר מה הוא מבטל: "⟲ בטל הזזת שולחן". החץ לבדו,
       ובעיקר המילה "ביטול" לבדה, נקראים בעברית כ-Cancel. */
    .undo-btn { display:inline-flex; align-items:center; gap:6px; }
    .undo-btn b { font-weight:700; }
    .undo-btn .ua { font-size:15px; line-height:1; transform:translateY(1px); }
    .undo-btn:not(:disabled):hover { border-color:#1F3D34; background:#f4f9f6; }
    .undo-btn:disabled { opacity:.45; cursor:default; }
    /* שם האחראית מתחת לשולחן בסקיצה, בצבע שלה */
    .sk-who { font-size:10.5px; font-weight:700; text-align:center; margin-top:4px; }


    /* גרירת ילד: צל שעוקב אחרי האצבע, וכיסא שמואר כשמתקרבים אליו */
    .dragghost { position:fixed; pointer-events:none; z-index:10000; width:54px; height:54px; border-radius:50%;
             background:#eef5fb; border:2px solid #5f93b8; color:#2c4d66; display:flex; align-items:center;
             justify-content:center; text-align:center; font-size:11px; font-weight:700; padding:3px;
             line-height:1.12; overflow:hidden; box-shadow:0 6px 18px rgba(0,0,0,.2); opacity:.95; }
    .seat.target { border-color:#1F7a4f !important; background:#e6f4ec !important;
                   box-shadow:0 0 0 4px rgba(31,122,79,.18); transform:scale(1.1); }
    /* בזמן גרירה כל הכיסאות הפנויים מסומנים בעדינות, כדי שיהיה ברור לאן אפשר */
    .seat.open { border-color:#9dc4ad; background:#f4faf6; }
    .seat.from { opacity:.34; }                       /* המקור נשאר חצי-שקוף, לא מתרוקן */
    .seat .preview { opacity:.5; font-style:italic; } /* שם הילד מוצג בתוך הכיסא היעד */
    .seat.swap::before { content:'⇄'; position:absolute; top:-9px; left:50%; transform:translateX(-50%);
                         background:#1F7a4f; color:#fff; border-radius:999px; width:17px; height:17px;
                         font-size:11px; line-height:17px; text-align:center; }
    .room { direction:ltr; }                          /* מיקום פיזי — ראו roomPoint */
    .seat, .parked, .pmark, .tlabel, .gap-tag { direction:rtl; }
    .drag-live .seat, .drag-live .parked { transition:none; }
    .seat.landed { animation:land .12s ease-out; }
    @keyframes land { from { transform:scale(1.18); } to { transform:scale(1); } }
    /* הודעת ביטול אחרי כל העברה */
    .undo { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:10001;
            background:#1F3D34; color:#fff; border-radius:999px; padding:9px 10px 9px 18px;
            font-size:12.5px; font-weight:700; display:flex; align-items:center; gap:10px;
            box-shadow:0 6px 20px rgba(0,0,0,.22); }
    .undo button { background:#fff; color:#1F3D34; border:0; border-radius:999px; padding:5px 13px;
                   font-family:'Alef'; font-size:12px; font-weight:700; cursor:pointer; }
    /* ילד שהוצא מכיסא נשאר בדיוק איפה שהונח — המיקום הוא מידע ("שם הוא
       אמור לשבת"). אבל המצב חייב להיות חד-משמעי: קו מקווקו, גוון דהוי,
       ותווית "ממתין". והוא לא מודפס — ראו @media print למטה. */
    .parked { position:absolute; width:54px; height:54px; border-radius:50%;
              border:2px dashed #C4846C; background:#fdf6f2; color:#8a5a44;
              display:flex; align-items:center; justify-content:center;
              text-align:center; font-size:11px; font-weight:700; padding:3px; line-height:1.12;
              overflow:visible; cursor:grab; touch-action:none; z-index:7; opacity:.9; }
    .parked::after { content:'ממתין'; position:absolute; bottom:-9px; left:50%;
                     transform:translateX(-50%); background:#C4846C; color:#fff;
                     border-radius:999px; padding:1px 7px; font-size:9px; font-weight:700;
                     letter-spacing:.3px; white-space:nowrap; }
    .parked:hover { opacity:1; border-style:solid; }
    /* אותו שם במד למעלה, כדי שיהיה ברור שמדובר באותו ילד */
    /* ---- אלרגיה על הכיסא ---- */
    /* תג קטן מתחת לכיסא. אדום כי זה הדבר היחיד בדף שקריאתו דחופה. */
    .algw { position:absolute; width:54px; height:54px; pointer-events:none; z-index:9; }
    .algw .alg { position:absolute; top:45px; left:50%; transform:translateX(-50%);
                 background:#c94147; color:#fff; border-radius:999px; padding:1.5px 8px;
                 font-size:9.5px; font-weight:700; white-space:nowrap; letter-spacing:.2px;
                 box-shadow:0 1px 4px rgba(0,0,0,.18); }
    /* בחירת פריט בחלון */
    .ipick { display:grid; grid-template-columns:repeat(2,1fr); gap:9px; }
    .ipick button { display:flex; align-items:center; gap:9px; background:#FAF8F4;
                    border:1px solid #efe9e0; border-radius:12px; padding:12px 14px;
                    font-family:'Alef'; font-size:13.5px; font-weight:700; color:#1F3D34;
                    cursor:pointer; text-align:right; }
    .ipick button:hover { border-color:#1F3D34; background:#f4f9f6; }
    .ipick .e { font-size:20px; }
    /* רשימת האלרגיות */
    .alrow { display:flex; align-items:center; gap:10px; padding:9px 2px;
             border-bottom:1px solid #f1ece4; flex-wrap:wrap; }
    .alrow > b { color:#1F3D34; font-size:13.5px; min-width:110px; }
    .alrow .bub { display:flex; gap:5px; flex-wrap:wrap; flex:1; }
    .alrow .none { color:#c4bbb0; font-size:12px; font-weight:700; }
    .alrow .al { background:#fdf0ef; border:1px solid #f3cfc9; color:#c94147; border-radius:999px;
                 padding:3px 10px; font-size:11.5px; font-weight:700; font-family:'Alef'; cursor:pointer; }
    .alrow .al:hover { background:#c94147; color:#fff; border-color:#c94147; }
    .alrow select { border:1px solid #e8e4de; border-radius:8px; padding:5px 8px;
                    font-family:'Alef'; font-size:12px; color:#6f6457; }
    .hint-box { background:#fdf6e9; border:1px solid #e8c88a; border-radius:12px;
                padding:13px 15px; margin-bottom:14px; }
    .hint-box b { color:#b8801f; font-size:13.5px; }
    .hint-box p { font-size:12px; color:#8a6a23; line-height:1.65; margin:4px 0 9px; }
    .hint-box .hb { background:#fff; border:1px solid #e8c88a; color:#8a6a23; border-radius:999px;
                    padding:5px 12px; font-size:12px; font-weight:700; font-family:'Alef';
                    cursor:pointer; margin:0 0 5px 5px; }

    /* ---- מקרא בתחתית הדף ---- */
    .rlegend { position:absolute; left:0; right:0; bottom:9px; display:flex; flex-wrap:wrap;
               justify-content:center; gap:7px 16px; padding:0 30px; direction:rtl; }
    .rlegend .lg { display:inline-flex; align-items:center; gap:6px; font-size:11px; }
    .rlegend .lg i { width:11px; height:11px; border-radius:3px; display:inline-block; flex:0 0 auto; }
    .rlegend .lg b { color:#3D3228; font-weight:700; }
    .rlegend .lg em { color:#9B8E82; font-style:normal; font-weight:700; }

    /* ---- פריטים בחדר: עמדת הגשה, פינוי, כיור, דלת ---- */
    /* נייטרליים בכוונה — הצבע בדף שמור לאחריות של הצוות, ופריט צבעוני
       היה נקרא כאילו מישהי אחראית עליו. */
    .ritem { position:absolute; display:flex; align-items:center; justify-content:center;
             background:#f6f2ea; border:1.5px dashed #c9bda9; border-radius:9px;
             color:#6f6457; font-size:12px; font-weight:700; cursor:grab;
             touch-action:none; z-index:4; text-align:center; padding:2px 6px; }
    .ritem:active { cursor:grabbing; }
    .ritem.door { background:#fff; border-style:solid; border-width:0 0 4px 0;
                  border-color:#9B8E82; border-radius:0; font-size:11px; align-items:flex-end; }
    .ritem .iico { font-size:15px; margin-left:5px; }
    .ritem .inm { cursor:text; padding:1px 4px; border-radius:5px; border:1px dashed transparent; }
    .ritem .inm:hover { border-color:#C4846C; background:rgba(255,255,255,.75); }
    .ritem .idel { position:absolute; top:-9px; left:-6px; background:#fff; border:1px solid #e8e1d6;
                   color:#8a7f70; border-radius:7px; padding:1px 6px; font-size:10px; font-weight:700;
                   font-family:'Alef'; cursor:pointer; opacity:0; transition:opacity .12s; }
    .ritem:hover .idel { opacity:1; }
    .ritem .idel:hover { background:#fdf0ef; border-color:#f3cfc9; color:#c94147; }

    .tsurface { position:absolute; background:#efe6d8; border:2px solid #ddd0bb; cursor:grab; }
    .seat { position:absolute; width:54px; height:54px; border-radius:50%; border:2px dashed #ddd0bb; background:#fff;
      display:flex; align-items:center; justify-content:center; text-align:center; font-size:11px; font-weight:700;
      color:#8a7f70; cursor:pointer; line-height:1.12; padding:3px; overflow:hidden; }
    .seat.filled { border-style:solid; border-color:#cfe0ec; background:#eef5fb; color:#2c4d66; }
    .seat.staff { border-color:#eccfc2; background:#fbf1ec; color:#8a4d33; }
    /* בחירה = פעולה שממתינה, לא סימון קבוע. ⇄ אומר מה יקרה בלחיצה הבאה */
    .seat.sel { outline:3px solid #1F3D34; outline-offset:2px; }
    .seat.sel::before { content:'⇄'; position:absolute; top:-9px; left:50%; transform:translateX(-50%);
                        background:#1F3D34; color:#fff; border-radius:999px; width:17px; height:17px;
                        font-size:11px; line-height:17px; text-align:center; }
    .seat.bad { border-color:#e0837a; background:#fdf0ef; color:#a33; }
    .seat.lock::after { content:'🔒'; position:absolute; top:-1px; left:2px; font-size:10px; }
    /* ---- סמן איש צוות שלא יושב בתוך השולחן ---- */
    /* גלולת הצוות: מסגרת עבה והילה באותו צבע, כדי שהקשר לשולחן שצבוע
       באותו גוון ייקלט בלי קו מחבר ובלי מקרא */
    /* משבצת בלי שם = תפקיד ולא אדם. מקווקו, כמו כל דבר שעוד לא סופי. */
    .p.open-slot { border-style:dashed; border-color:#C4846C; color:#8a5a44; }
    .p.open-slot:hover { background:#fdf6f2; }
    .slot-label { width:120px; padding:5px 10px; border:1.5px dashed #C4846C; border-radius:999px;
                  font-family:'Alef'; font-size:12.5px; font-weight:700; color:#8a5a44;
                  background:#fdf6f2; outline:none; }
    .slot-label:focus { border-style:solid; border-color:#1F3D34; color:#1F3D34; }
    .seat.open-slot, .pmark.open-slot { border-style:dashed !important; }

    /* סמן הצוות הוא עיגול ולא גלולה: גלולה ברוחב 200 פיקסל לא אומרת
       איפה בדיוק היא עומדת, ולעיגול יש מרכז אחד. השם יורד מתחתיו —
       אותה שפה של תג האלרגיה: נקודה בחלל ועליה תווית. */
    .pmark { position:absolute; width:54px; height:54px; border-radius:50%; background:#fff;
             border:3px solid #C4846C; display:flex; align-items:center; justify-content:center;
             cursor:grab; box-shadow:0 2px 8px rgba(0,0,0,.10); touch-action:none; z-index:6; }
    .pmark:active { cursor:grabbing; }
    .pmark .ico { font-size:21px; line-height:1; }
    .pmark .who { position:absolute; top:58px; left:50%; transform:translateX(-50%);
                  background:#fff; border:1.5px solid currentColor; border-radius:999px;
                  padding:2px 10px; font-size:11px; font-weight:700; white-space:nowrap;
                  box-shadow:0 1px 4px rgba(0,0,0,.10); }
    .pmark.open-slot, .pmark.open-slot .who { border-style:dashed; }

    /* ---- קווי עזר ליישור בזמן גרירה ---- */
    #guides { position:absolute; inset:0; pointer-events:none; z-index:8; }
    .gline { position:absolute; }
    .gline.v { top:0; bottom:0; width:0; border-right:1.5px dashed #C4846C; }
    .gline.h { left:0; right:0; height:0; border-bottom:1.5px dashed #C4846C; }
    .gap-tag { position:absolute; background:#C4846C; color:#fff; font-size:10px; font-weight:700;
               border-radius:5px; padding:1px 6px; transform:translate(50%,-50%); }

    /* ---- עמוד הפתיחה ---- */
    .welcome { text-align:center; }
    .wtitle { font-size:25px; color:#1F3D34; margin-bottom:10px; }
    .wlead { font-size:14.5px; color:#6f6457; line-height:1.85; max-width:480px;
             margin:0 auto 26px; }
    .wdemo { background:#FAF8F4; border:1px solid #efe9e0; border-radius:16px;
             padding:20px 18px 14px; margin-bottom:26px; display:flex;
             flex-wrap:wrap; justify-content:center; gap:18px; }
    .wt { flex:0 1 210px; }
    .wtn { font-size:12.5px; font-weight:700; margin-bottom:7px; }
    .wts { border:2px solid; border-radius:12px; padding:13px 10px; display:flex;
           flex-wrap:wrap; gap:6px; justify-content:center; }
    .wts span { background:#fff; border:1.5px solid #e2ecf3; color:#2c4d66; border-radius:999px;
                padding:5px 13px; font-size:12px; font-weight:700; }
    .wcap { flex:1 0 100%; font-size:11.5px; color:#9B8E82; font-weight:700; margin-top:2px; }
    .whow { display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr));
            gap:12px; text-align:right; margin-bottom:8px; }
    .wstep { display:flex; gap:11px; align-items:flex-start; background:#fff;
             border:1px solid #efe9e0; border-radius:13px; padding:13px 14px; }
    .wn { flex:0 0 25px; height:25px; border-radius:50%; background:#1F3D34; color:#fff;
          font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center; }
    .wstep b { display:block; color:#1F3D34; font-size:13.5px; margin-bottom:2px; }
    .wstep em { font-style:normal; font-size:12px; color:#9B8E82; line-height:1.55; }
    .wnav { justify-content:center; }
    .btn.big { font-size:15px; padding:13px 34px; }

    /* ---- חסם מעבר: בעיה מבנית שלא תיפתר בשום סידור ---- */
    .blockers { margin:16px 0 4px; display:flex; flex-direction:column; gap:9px; }
    .bk { background:#fdf6e9; border:1px solid #e8c88a; border-radius:12px; padding:13px 16px; }
    .bk b { color:#b8801f; font-size:14px; }
    .bk p { font-size:13px; color:#8a6a23; line-height:1.7; margin-top:4px; }
    .bkx { margin-top:9px; background:#fff; border:1px solid #e8c88a; color:#8a6a23;
           border-radius:9px; padding:6px 13px; font-family:'Alef'; font-size:12.5px;
           font-weight:700; cursor:pointer; }
    .btn:disabled { opacity:.42; cursor:not-allowed; }

    /* ---- מסילת כלים אנכית בצד הדף ----
       שורת כפתורים מעל הדף גנבה ממנו גובה ונקראה כניווט כללי. מסילה
       צמודה לצידו נקראת כ"כלים של הדף הזה", ולא עולה כלום בגובה.
       האייקונים הם משפחה אחת של קווים — אותו עובי, אותו צבע, אותו
       ריבוע — כי אמוג'י לא יכולים להיות סרגל: כל אחד מהם משקל ויזואלי
       ופלטה אחרים, ושורה שלהם נקראת כמדבקות. */
    .sheet-wrap { display:flex; align-items:flex-start; gap:10px; }
    .sheet-wrap .room-outer { flex:1; min-width:0; }
    .rail { flex:0 0 42px; display:flex; flex-direction:column; align-items:center; gap:2px;
            background:#fff; border:1px solid #ece7df; border-radius:12px; padding:5px 4px 8px;
            box-shadow:0 1px 3px rgba(0,0,0,.03); }
    .rb { width:32px; height:32px; border-radius:9px; border:0; background:none; color:#8a7f70;
          cursor:pointer; position:relative; display:flex; align-items:center; justify-content:center;
          font-family:'Alef'; transition:background .12s, color .12s; }
    .rb:hover { background:#f2f6f3; color:#1F3D34; }
    .rb.on { background:#1F3D34; color:#fff; }
    /* התווית נפתחת בריחוף — המסילה נשארת צרה, ושום דבר לא מנוחש */
    .rb::after { content:attr(data-t); position:absolute; right:calc(100% + 9px); top:50%;
                 transform:translateY(-50%); background:#1F3D34; color:#fff; border-radius:6px;
                 padding:4px 9px; font-size:11.5px; font-weight:700; white-space:nowrap;
                 opacity:0; pointer-events:none; transition:opacity .12s; z-index:20; }
    .rb:hover::after { opacity:1; }
    .rsep { width:18px; height:1px; background:#ece7df; margin:5px 0; }
    .rzoom { height:84px; display:flex; align-items:center; justify-content:center; margin-top:2px; }
    .rzoom input { -webkit-appearance:none; appearance:none; width:76px; height:3px; border-radius:99px;
                   background:#ece7df; outline:none; cursor:ns-resize; transform:rotate(-90deg); }
    .rzoom input::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:12px; height:12px;
                   border-radius:50%; background:#fff; border:2px solid #C4846C;
                   box-shadow:0 1px 3px rgba(0,0,0,.2); cursor:grab; }
    .rzoom input::-moz-range-thumb { width:11px; height:11px; border-radius:50%; background:#fff;
                   border:2px solid #C4846C; }
    .rzv { font-size:10px; color:#b3a899; font-weight:700; font-variant-numeric:tabular-nums;
           letter-spacing:.2px; }
    @media (max-width: 700px) {
      .sheet-wrap { flex-direction:column-reverse; }
      .rail { flex-direction:row; flex:none; width:100%; justify-content:center; flex-wrap:wrap; gap:4px; }
      .rsep { width:1px; height:18px; margin:0 4px; }
      .rzoom { height:auto; } .rzoom input { transform:none; width:100px; }
      .rb::after { right:auto; left:50%; top:calc(100% + 6px); transform:translateX(-50%); }
    }

    .toolbar, .layouts { display:flex; gap:7px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
    .toolbar .lb, .layouts .lb { background:#fff; border:1px solid #e8e4de; border-radius:9px;
      padding:0 14px; height:34px; display:inline-flex; align-items:center; gap:6px;
      font-family:'Alef'; font-size:12.5px; font-weight:700; color:#1F3D34; cursor:pointer; }
    .toolbar .lb:hover, .layouts .lb:hover { border-color:#1F3D34; background:#f4f9f6; }

    /* ---- רצועת בקרה מתחת לדף ---- */
    /* נמוכה בכוונה: היא עונה על "סיימתי?" ולא על "מה עכשיו", ולכן אסור
       לה לתפוס את המקום של הסידור עצמו. */
    .status { margin:10px 0 4px; }
    .srow { display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
    .srow.wait { margin-top:8px; }
    .chip { display:inline-flex; align-items:center; border-radius:999px; padding:4px 12px;
            font-size:12px; font-weight:700; font-family:'Alef'; border:1px solid transparent; }
    .chip.good { background:#e6f4ec; border-color:#cfe7d9; color:#1F7a4f; }
    .chip.warn { background:#fdf6e9; border-color:#e8c88a; color:#b8801f; }
    .chip.bad  { background:#fdf0ef; border-color:#f3cfc9; color:#c94147; cursor:pointer; }
    .chip.quiet { background:#FAF8F4; border-color:#e8e4de; color:#9B8E82; cursor:pointer; }
    .sbar { flex:1; min-width:70px; max-width:180px; height:4px; border-radius:99px;
            background:#e8e2d8; overflow:hidden; }
    .sbar i { display:block; height:100%; border-radius:99px; background:#1F7a4f; transition:width .25s; }
    .smuted { font-size:12px; color:#9B8E82; font-weight:700; }
    .wchip { background:#fff; border:1.5px dashed #C4846C; color:#8a5a44; border-radius:999px;
             padding:4px 12px; font-family:'Alef'; font-size:12px; font-weight:700; cursor:pointer; }
    .wchip:hover { background:#C4846C; color:#fff; border-style:solid; }
    .wchip.onpage { border-style:solid; background:#fdf6f2; }
    .status .viol { margin-top:10px; }
    .ipick button span b { display:block; }
    .ipick button span em { display:block; font-style:normal; font-size:11.5px;
                            color:#9B8E82; font-weight:700; margin-top:1px; }
    .legend { font-size:12.5px; color:#9B8E82; text-align:center; margin:4px 0 16px; line-height:1.7; }

    .viol { background:#fdf0ef; border:1px solid #f3cfc9; border-radius:12px; padding:14px 16px; margin-bottom:14px; }
    .viol h4 { color:#c94147; font-size:14.5px; margin-bottom:8px; }
    .viol .v { display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:13.5px;
               color:#8a3b34; padding:7px 0; flex-wrap:wrap; border-top:1px solid #f6dedb; }
    .viol .v:first-of-type { border-top:0; }
    .vbtns { display:flex; gap:6px; }
    .viol .v button { background:#fff; border:1px solid #f3cfc9; color:#c94147; border-radius:8px; padding:4px 10px; font-family:'Alef'; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap; }
    .viol .v button:first-child { border-color:#cfe7d9; color:#1F7a4f; }
    /* כלל שבור — לא באשמת הסידור, ולכן לא בצבע של שגיאה */
    .viol .v.stuck { color:#8a5a44; }
    .viol .v.stuck .wh { font-size:12px; color:#9B8E82; font-weight:700; margin-top:2px; }
    .okd { display:flex; flex-wrap:wrap; gap:8px; margin:-6px 0 14px; }
    .okd span { display:inline-flex; align-items:center; gap:7px; background:#FAF8F4; border:1px solid #e8e4de;
                border-radius:999px; padding:4px 6px 4px 13px; font-size:12px; color:#6f6457; font-weight:700; }
    .okd button { background:none; border:0; color:#9B8E82; font-family:'Alef'; font-size:11.5px;
                  font-weight:700; cursor:pointer; text-decoration:underline; padding:0 4px; }
    .conflict { background:#fdf6e9; border:1px solid #e8c88a; border-radius:12px; padding:16px 18px; margin-bottom:14px; }
    .conflict h4 { color:#b8801f; margin-bottom:8px; font-size:15px; }
    .conflict p { font-size:13.5px; color:#8a6a23; line-height:1.7; margin-bottom:12px; }
    .conflict .opts { display:flex; gap:8px; flex-wrap:wrap; }
    .conflict .opts button { background:#fff; border:1px solid #e8c88a; color:#8a6a23; border-radius:9px; padding:8px 13px; font-family:'Alef'; font-size:13px; font-weight:700; cursor:pointer; }
    /* ---- חלון בתוך העמוד, במקום חלונות הדפדפן ---- */
    .ov { position:fixed; inset:0; background:rgba(31,61,52,.45); display:none;
          align-items:center; justify-content:center; z-index:9999; padding:18px; }
    .ov.show { display:flex; }
    .modal { background:#fff; border-radius:18px; padding:24px 26px; width:100%; max-width:460px;
             max-height:86vh; overflow:auto; box-shadow:0 20px 60px rgba(0,0,0,.3); }
    .modal h3 { color:#1F3D34; font-size:19px; margin-bottom:4px; }
    .modal .msub { color:#9B8E82; font-size:13px; margin-bottom:16px; line-height:1.6; }
    .modal input[type=text] { width:100%; padding:11px 13px; border:1.5px solid #e8e4de;
             border-radius:10px; font-family:'Alef'; font-size:14px; outline:none; }
    .modal input[type=text]:focus { border-color:#1F3D34; }
    .m-actions { display:flex; gap:9px; margin-top:18px; flex-wrap:wrap; }
    .plan-row { display:flex; align-items:center; gap:10px; background:#FAF8F4; border:1px solid #efe9e0;
             border-radius:12px; padding:12px 14px; margin-bottom:8px; cursor:pointer; }
    .plan-row:hover { border-color:#1F3D34; background:#f4f9f6; }
    .plan-row .nm { font-weight:700; color:#1F3D34; font-size:14.5px; }
    .plan-row .meta { font-size:12px; color:#9B8E82; }
    .plan-row .rm { margin-right:auto; background:#f6f2ec; border:1px solid #e8e1d6; color:#8a7f70;
             border-radius:8px; padding:5px 10px; font-size:11.5px; font-weight:700; cursor:pointer; font-family:'Alef'; }
    .plan-row .rm:hover { background:#fdf0ef; border-color:#f3cfc9; color:#c94147; }
    .empty-note { color:#9B8E82; font-size:13.5px; line-height:1.7; }

    /* ---- הדפסה: הדף על המסך והדף במדפסת חייבים להיות אותו דף ----
       שלוש מלכודות שנפלנו לתוכן, וכל אחת שוברת את הזהות הזו:
       1. שוליים ב-@page מקטינים את השטח מתחת ל-1123×794 והתוכן גלש לעמוד שני.
          לכן margin:0, והחדר מעט מתחת ל-A4 כדי לספוג עיגול של דפדפן.
       2. דפדפנים לא מדפיסים צבעי רקע כברירת מחדל — משטחי השולחנות יצאו
          לבנים. print-color-adjust:exact מכריח אותם.
       3. media (hover:none) מתקיים בהדפסה, ולכן כפתור ה-⟳ שמיועד לנייד
          חזר והופיע על כל שולחן. */
    @media print {
      @page { size: A4 landscape; margin: 0; }
      html, body { background:#fff !important; margin:0 !important; padding:0 !important; }
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important;
          box-shadow:none !important; }
      /* ילד ממתין לא מודפס: עיגול מרחף באמצע דף שתלוי על הקיר הוא רעש.
         שמו מופיע בשורת "לא יושבים" בתחתית ה-PDF במקום. */
      .header, .steps, .board-top, .layouts, .legend, .viol, .a4note,
      .undo, .parked, .rot, .rhandle, .rot-tag, .err, .ok, .ov, .idel,
      .toolbar, .status, .rail, .a4note,
      #crmSidebar, #crmMenuBtn, #trashFab, #error, #success { display:none !important; }
      /* המסילה הייתה פריט flex לצד הדף; בהדפסה היא נעלמת והמעטפת
         חייבת לחזור לבלוק, אחרת היא משאירה רוחב לפריט שלא קיים. */
      .sheet-wrap { display:block !important; gap:0 !important; }
      .room-outer { overflow:hidden !important; margin:0 !important; height:auto !important; }
      .room { transform:none !important; border:none !important; border-radius:0 !important;
              width:1118px !important; height:788px !important; overflow:hidden !important;
              background:#fff !important; }
      /* .rscale נשאר 1123×794 עם אותו transform-origin, כדי שההגדלה
         תיפול בדיוק באותו מקום כמו על המסך. החדר חותך 3 פיקסלים בקצה. */
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🍽️ סידור ישיבה</h1>
    <div style="display:flex; gap:8px; flex-wrap:wrap;" id="topActions"></div>
  </div>

  <div id="error" class="err"></div>
  <div id="success" class="ok"></div>

  <div class="steps" id="steps"></div>
  <div id="wizard"></div>
  <div id="board" class="hide"></div>

  <div class="ov" id="modalOv" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <h3 id="modalTitle"></h3>
      <div class="msub" id="modalSub"></div>
      <div id="modalBody"></div>
      <div class="m-actions" id="modalActions"></div>
    </div>
  </div>

<script src="js/common.js?v=28"></script>
<script src="js/api.js?v=24"></script>
<script src="js/seating-engine.js?v=4"></script>
<script>
const E = SeatingEngine;
const esc = s => (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid = () => 's' + Math.random().toString(36).slice(2, 9);

let allKids = [], allStaff = [], step = 1, plan = null, selectedSeat = null, built = false, kidFilter = '';

const STEPS = ['מי אוכל', 'שולחנות', 'צוות', 'כללי ישיבה', 'חלוקה'];
const WELCOME = 0;   // עמוד הפתיחה — לפני שלב 1

// שם ברירת המחדל נושא את החודש ואת שם הגן, כי אלה שני הדברים שמבדילים
// בין סידור לסידור ברשימה. שם הגן נלקח מהגן הפעיל, כך שכל גן מקבל את
// שמו שלו ולא "גן לב" קבוע.
const HE_MONTHS = ['ינואר', 'פברואר', 'מרץ', 'אפריל', 'מאי', 'יוני',
                   'יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר', 'נובמבר', 'דצמבר'];
function gardenName() {
  let g = '';
  try { g = window.crmGardenName || localStorage.getItem('crm_garden_name') || ''; } catch (e) {}
  return String(g).trim();
}
function defaultPlanName() {
  const d = new Date(), g = gardenName();
  const yy = String(d.getFullYear()).slice(2);
  return `סידור ישיבה - ${HE_MONTHS[d.getMonth()]} ${yy}` + (g ? ` - ${g}` : '');
}
function newPlan() {
  return { id: uid(), name: defaultPlanName(), childIds: [], tables: [], staff: {},
           rules: [], split: { mode: 'even' }, seats: {}, locks: {}, layout: {}, marks: {}, parked: {}, items: [], zoom: 1, fullNames: false };
}
const tplOf = t => E.TEMPLATES[t.templateId] || E.TEMPLATES.rect6_heads;
const kidName = id => (allKids.find(k => k.id === id) || {}).name || '';
// שם פרטי בלבד, חוץ מכשהוא לא מזהה. בגן שני אריאלים, ו"אריאל" לבד
// על שני כיסאות הוא בדיוק הסוג של טעות שמחכה לקרות (כלל 14).
function displayName(id) {
  const full = kidName(id);
  if (!full) return '';
  if (plan && plan.fullNames) return full;
  const first = full.split(/\s+/)[0];
  const clash = plan.childIds.some(c => c !== id && kidName(c).split(/\s+/)[0] === first);
  return clash ? full : first;
}
// כששם מלא מוצג, השם הפרטי עומד בשורה משלו מעל שם המשפחה. שבירה
// טבעית הייתה מפצלת לפי רוחב ולא לפי משמעות — "אדם סגל / רוזנבאום"
// במקום "אדם / סגל רוזנבאום".
function nameLines(id) {
  const full = kidName(id);
  if (!full) return [];
  const parts = full.split(/\s+/);
  if (parts.length < 2) return [full];
  const short = displayName(id);
  if (short !== full) return [short];
  return [parts[0], parts.slice(1).join(' ')];
}
function toggleNames() {
  pushUndo('שינוי תצוגת שמות');
  plan.fullNames = !plan.fullNames;
  renderBoard();
  showOk(plan.fullNames ? 'שם מלא' : 'שם פרטי · שם מלא רק כשיש כפילות');
}
const staffName = id => (allStaff.find(s => s.id === id) || {}).name || '';
// שם המשבצת: מי שפעילה כרגע מבין המחליפות
// משבצת בלי אנשים היא תפקיד ולא אדם — "מחליפה", "סטודנטית", "אחראית
// שולחן 2". התווית היא שמה, וברגע שיודעים מי זו מוסיפים אותה לאותה
// משבצת והיא הופכת לשם, בלי לאבד את הצבע, השולחן או הכללים.
const slotName = sid => {
  const s = plan.staff[sid]; if (!s) return '';
  if (!s.members.length) return (s.label || 'ללא שם').trim();
  return staffName(s.members[s.active || 0]);
};
const isOpenSlot = sid => {
  const s = plan.staff[sid]; return !!s && !s.members.length;
};
// מה שמוצג על הסידור. כיסא מחזיק אדם אחד — אי אפשר לשבת שתיים על אותו
// כיסא, ולכן משבצת שיושבת בתוך שולחן מציגה את הפעילה בלבד ומתחלפת ב-⇄.
// סמן של השגחה או ישיבה ליד השולחן הוא לא כיסא: אם שתיהן רשומות שם,
// שתיהן באמת עומדות שם יחד, ולכן שתיהן מופיעות.
// alt=true פירושו "מחליפות" — אחת במקום השנייה, ולכן רק אחת מוצגת.
// בכיסא זה תמיד כך, כי אי אפשר לשבת שתיים על אותו כיסא.
const slotLabel = sid => {
  const s = plan.staff[sid]; if (!s) return '';
  if (s.sits === 'seat' || s.alt || s.members.length < 2) return slotName(sid);
  return s.members.map(staffName).filter(Boolean).join(' · ');
};
function toggleAlt(sid) {
  const s = plan.staff[sid]; if (!s) return;
  s.alt = !s.alt; s.active = s.active || 0;
  renderStep(); if (built) renderBoard();
}

/* ---------- טעינה ---------- */
async function boot() {
  try {
    const [rc, rs] = await Promise.all([api.getChildren(), api.getStaff()]);
  loadHealth();   // ברקע — הדף לא מחכה לזה
    const year = currentSchoolYear();
    allKids = ((rc && rc.data) || [])
      .filter(c => (c.school_year || year) === year && c.status === 'active')
      .map(c => ({ id: c.id, name: (c.first_name_he + ' ' + (c.last_name_he || '')).trim(), birth: c.birth_date || '' }))
      .sort((a, b) => a.name.localeCompare(b.name, 'he'));
    allStaff = ((rs && rs.data) || []).filter(s => s.status === 'active')
      .map(s => ({ id: s.id, name: s.full_name_he })).sort((a, b) => a.name.localeCompare(b.name, 'he'));
  } catch (e) { showErr('שגיאה בטעינת הילדים והצוות: ' + e.message); }
  plan = newPlan();
  // שחזור טיוטה שנקטעה
  try {
    const d = JSON.parse(localStorage.getItem(DRAFT) || 'null');
    if (d && d.plan && (d.plan.childIds || []).length) {
      plan = Object.assign(newPlan(), d.plan);
      plan.layout = plan.layout || {};
      step = d.step || 1;
      if (Object.keys(plan.seats || {}).length) {
        built = true;
        document.getElementById('wizard').classList.add('hide');
        document.getElementById('steps').classList.add('hide');
        document.getElementById('board').classList.remove('hide');
        renderTop(); renderBoard(); return;
      }
      showOk('שוחזרה הטיוטה האחרונה');
    }
  } catch (e) {}
  // בלי טיוטה מתחילים בעמוד הפתיחה, שמסביר מה הכלי הזה עושה
  if (!plan.childIds.length) step = WELCOME;
  document.getElementById('steps').classList.toggle('hide', step === WELCOME);
  renderTop(); renderSteps(); renderStep();
}
function currentSchoolYear() { const d = new Date(), y = d.getFullYear(); const s = d.getMonth() >= 8 ? y : y - 1; return s + '-' + String(s + 1).slice(2); }

// חזרה ללוח בלי לפתור מחדש. בלי זה, מי שנכנסה ל"שינוי הגדרות" כדי
// להציץ נתקעה: הדרך היחידה קדימה עברה דרך שלב החלוקה, שבונה את
// הסידור מחדש ומוחק כל הזזה ידנית.
function backToBoard() {
  if (!Object.keys(plan.seats || {}).length) { goStep(1); return; }
  built = true;
  document.getElementById('wizard').classList.add('hide');
  document.getElementById('steps').classList.add('hide');
  document.getElementById('board').classList.remove('hide');
  renderTop(); renderBoard();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function renderTop() {
  const back = (!built && Object.keys(plan.seats || {}).length)
    ? `<button class="btn soft" onclick="backToBoard()">חזרה לסידור</button>` : '';
  document.getElementById('topActions').innerHTML = built
    ? `<button class="btn ghost" onclick="backToWizard()">שינוי הגדרות</button>
       <button class="btn ghost" onclick="openVersions()">גרסאות שמורות</button>
       <button class="btn" onclick="savePlan()">שמירה</button>`
    : back + `<button class="btn ghost" onclick="loadExisting()">סידורים שמורים</button>
       <button class="btn ghost" onclick="startFresh()">סידור חדש</button>`;
}
function renderSteps() {
  document.getElementById('steps').innerHTML = STEPS.map((s, i) => {
    const n = i + 1;
    return `<button class="step-pill ${n === step ? 'on' : n < step ? 'done' : ''}" onclick="goStep(${n})">${n}. ${s}</button>`;
  }).join('');
}
function goStep(n) {
  step = n; built = false;
  document.getElementById('board').classList.add('hide');
  document.getElementById('wizard').classList.remove('hide');
  document.getElementById('steps').classList.toggle('hide', n === WELCOME);
  renderTop(); renderSteps(); renderStep(); window.scrollTo({ top: 0, behavior: 'smooth' });
}
function backToWizard() { goStep(1); }

/* ---------- השאלון ---------- */
// טיוטה נשמרת בדפדפן אחרי כל שינוי, כדי שרענון או יציאה בטעות
// לא יאבדו את מה שהוזן. נמחקת כשנפתח סידור חדש או נטען סידור שמור.
const DRAFT = 'gl_seating_draft';
function saveDraft() { try { localStorage.setItem(DRAFT, JSON.stringify({ plan, step })); } catch (e) {} }
function clearDraft() { try { localStorage.removeItem(DRAFT); } catch (e) {} }

/* ---------- עמוד הפתיחה ---------- */
// מי שנכנסת לכאן בפעם הראשונה לא יודעת מה הכלי הזה עושה. במקום להתחיל
// ברשימת ילדים בלי הקשר, מסבירים בארבע שורות ומראים דוגמה של התוצאה —
// כי תמונה של שולחן מסודר אומרת יותר מכל משפט.
const HOW = [
  { n: 1, t: 'בוחרים מי אוכל',    d: 'מסמנים את הילדים שיושבים לארוחה היום.' },
  { n: 2, t: 'מגדירים שולחנות',  d: 'כמה שולחנות, ובאיזו צורה — כמה מקומות בכל אחד.' },
  { n: 3, t: 'מוסיפים כללים',     d: '"דני לא ליד לב", "אייה בראש השולחן". רק מה שחשוב.' },
  { n: 4, t: 'מקבלים סידור מוכן', d: 'דף A4 להדפסה ולתלייה על הקיר, עם מי יושב איפה.' },
];
const DEMO = [
  { t: 'שולחן 1', c: '#5f93b8', kids: ['יעל', 'דני', 'מאיה', 'תום'] },
  { t: 'שולחן 2', c: '#C4846C', kids: ['רותם', 'נועה', 'עומר', 'לי'] },
];
function stepWelcome() {
  return `<div class="card welcome">
    <h2 class="wtitle">ברוכים הבאים לסידור השולחנות 🌿</h2>
    <p class="wlead">בואו נסדר יחד את מקומות הישיבה בארוחה.<br>
      המערכת תבנה סידור מאוזן שמתחשב במספר המקומות, בהרכב הילדים
      ובכללים שלכם — ותתריע אם משהו לא מסתדר.</p>

    <div class="wdemo">
      ${DEMO.map(d => `<div class="wt">
        <div class="wtn" style="color:${d.c}">${d.t}</div>
        <div class="wts" style="border-color:${d.c}33;background:${d.c}14">
          ${d.kids.map(k => `<span>${k}</span>`).join('')}
        </div></div>`).join('')}
      <div class="wcap">כך נראה הסידור בסוף</div>
    </div>

    <div class="whow">
      ${HOW.map(h => `<div class="wstep">
        <span class="wn">${h.n}</span>
        <div><b>${h.t}</b><em>${h.d}</em></div></div>`).join('')}
    </div>

    <div class="nav wnav">
      <button class="btn big" onclick="goStep(1)">בואו נתחיל</button>
      <button class="btn ghost" onclick="loadExisting()">סידורים שמורים</button>
    </div></div>`;
}

/* ---------- בדיקת היתכנות לפני מעבר לשלב הבא ---------- */
// שני סוגי בעיות שונים, ורק אחד מהם עצר עד היום:
//   1. הפרת כלל — הסידור אפשרי, פשוט לא נעים. מתריעים בסוף.
//   2. בעיה מבנית — הסידור בלתי אפשרי. 7 ילדים לשולחן של 6 לא ייפתר
//      בשום סידור, ולכן אסור לתת להמשיך ולגלות את זה שלושה שלבים אחר כך.
// כל חסם אומר מה הבעיה במספרים, ומה בדיוק לעשות כדי לפתור.
function stepBlockers(n) {
  const out = [];
  const kids = plan.childIds.length;
  const seatedStaff = Object.keys(plan.staff).filter(s => plan.staff[s].sits === 'seat').length;
  const cap = plan.tables.reduce((s, t) => s + tplOf(t).seats.length, 0);

  if (n === 1 && !kids) {
    out.push({ t: 'עוד לא נבחרו ילדים', d: 'לחצי על שם כדי לצרף אותו לארוחה.' });
  }
  if (n === 2) {
    if (!plan.tables.length) out.push({ t: 'עוד לא נוספו שולחנות', d: 'לחצי על צורה כדי להוסיף שולחן.' });
    else if (cap < kids) out.push({
      t: 'אין מספיק מקומות',
      d: `יש ${cap} מקומות בסך הכול, אבל ${kids} ילדים אוכלים. חסרים ${kids - cap} מקומות — ` +
         `אפשר להוסיף שולחן, או להחליף שולחן בצורה עם יותר מקומות.` });
  }
  if (n === 3 && cap < kids + seatedStaff) out.push({
    t: 'אין מספיק מקומות לילדים ולצוות',
    d: `${kids} ילדים ועוד ${seatedStaff} מ${seatedStaff === 1 ? 'הצוות שיושבת' : 'הצוות שיושבות'} בשולחן — ` +
       `סה"כ ${kids + seatedStaff}, ויש ${cap} מקומות. חסרים ${kids + seatedStaff - cap}. ` +
       `אפשר להוסיף שולחן, או להגדיר מישהי כ"יושבת ליד" במקום "יושבת בשולחן".` });
  if (n === 4) {
    E.preflight(enginePlan(), tplOf).forEach(i => {
      if (i.kind === 'capacity') return;          // כבר נבדק בשלבים קודמים
      out.push({ t: 'הכללים סותרים זה את זה', d: i.text, rules: i.rules });
    });
    const grp = E.blockingGroup(enginePlan());
    if (grp && grp.length > plan.tables.length) out.push({
      t: 'אי אפשר להפריד ביניהם',
      d: `${grp.map(nameOf).join(', ')} — כולם מוגדרים "לא באותו שולחן" זה עם זה, ` +
         `כלומר צריך ${grp.length} שולחנות נפרדים, ויש ${plan.tables.length}.` });
  }
  return out;
}
function blockerHtml(n) {
  const b = stepBlockers(n);
  if (!b.length) return '';
  return `<div class="blockers">${b.map(x => `<div class="bk">
    <b>⚠️ ${esc(x.t)}</b><p>${esc(x.d)}</p>
    ${(x.rules || []).length ? `<button class="bkx" onclick="${x.rules.map(r => `killRule('${r}')`).join(';')}">בטלי את הכלל</button>` : ''}
  </div>`).join('')}</div>`;
}
const canAdvance = n => !stepBlockers(n).length;

function renderStep() {
  saveDraft();
  const w = document.getElementById('wizard');
  if (step === WELCOME) w.innerHTML = stepWelcome();
  if (step === 1) w.innerHTML = stepChildren();
  if (step === 2) w.innerHTML = stepTables();
  if (step === 3) w.innerHTML = stepStaff();
  if (step === 4) { w.innerHTML = stepRules(); renderRuleRow(); }
  if (step === 5) w.innerHTML = stepSplit();
  renderSteps();
}

function stepChildren() {
  const f = kidFilter.trim();
  const shown = f ? allKids.filter(k => k.name.includes(f)) : allKids;
  return `<div class="card">
    <h2>מי אוכל בארוחה?</h2>
    <div class="sub">בחרי את הילדים שמשתתפים. לא חייבים להיות כל ילדי הגן — אפשר להתאים לכל ארוחה.</div>
    <div class="fld"><label>שם הסידור</label>
      <input type="text" id="planName" value="${esc(plan.name)}" oninput="plan.name=this.value" placeholder="למשל: ארוחת בוקר"></div>
    <div class="fld"><label>חיפוש ילד/ה</label>
      <input type="text" id="kidSearch" value="${esc(kidFilter)}" placeholder="הקלידי שם…"
        oninput="kidFilter=this.value;renderStep();document.getElementById('kidSearch').focus()"></div>
    <!-- "כולם" לפני השמות: ברוב הארוחות כל הגן משתתף, וזו הפעולה
         הראשונה שמחפשים — לא אחרי שסורקים 19 שמות. -->
    <div class="bulk">
      <button class="p bulk-all" onclick="allKidsOn()">✓ כל ${allKids.length} הילדים</button>
      ${plan.childIds.length ? `<button class="p" onclick="plan.childIds=[];renderStep()">נקי בחירה</button>` : ''}
      <span class="bulk-note">או לסמן אחד-אחד למטה</span>
    </div>
    <div class="pick">
      ${shown.map(k => `<button class="p ${plan.childIds.includes(k.id) ? 'on' : ''}" onclick="toggleKid('${k.id}')">${esc(k.name)}</button>`).join('')
        || '<div class="count-line">לא נמצא ילד/ה בשם הזה.</div>'}
    </div>
    <div class="count-line">נבחרו ${plan.childIds.length} מתוך ${allKids.length} ילדים</div>
    <div class="nav">
      <button class="btn ghost" onclick="goStep(0)">חזרה</button>
      <button class="btn" ${canAdvance(1) ? "" : "disabled"} onclick="goStep(2)">המשך</button>
    </div></div>`;
}
function toggleKid(id) {
  const i = plan.childIds.indexOf(id);
  if (i >= 0) plan.childIds.splice(i, 1); else plan.childIds.push(id);
  renderStep();
}
function allKidsOn() { plan.childIds = allKids.map(k => k.id); renderStep(); }

let pickingTable = null;   // שולחן שממתין לבחירת צורה חדשה

function stepTables() {
  const need = plan.childIds.length;
  const seated = Object.keys(plan.staff).filter(k => plan.staff[k].sits === 'seat').length;
  const cap = plan.tables.reduce((s, t) => s + tplOf(t).seats.length, 0);
  const opts = Object.values(E.TEMPLATES);
  const w = cap ? Math.min(100, need / cap * 100) : 0;
  const ws = cap ? Math.min(100 - w, seated / cap * 100) : 0;

  return `<div class="card">
    <h2>השולחנות</h2>
    <div class="sub">לחצי על צורה כדי להוסיף שולחן. אפשר לערבב צורות.</div>

    <div class="palette">
      ${opts.map(t => `<button class="shape" onclick="addTable('${t.id}')" title="${esc(t.name)}">
        ${tplPreview(t, 20)}<div class="cap">${t.seats.length} מקומות</div></button>`).join('')}
    </div>

    ${plan.tables.length ? `
      <div style="margin-top:18px" class="tcards">
        ${plan.tables.map(t => pickingTable === t.id ? `
          <div class="tcard picking">
            <b>${esc(t.name)} — בחרי צורה</b>
            <div class="palette" style="justify-content:center;max-width:300px">
              ${opts.map(o => `<button class="shape ${t.templateId === o.id ? 'on' : ''}" onclick="setTpl('${t.id}','${o.id}')">
                ${tplPreview(o, 16)}<div class="cap">${o.seats.length}</div></button>`).join('')}
            </div>
            <div class="swapline"><a href="#" onclick="pickingTable=null;renderStep();return false" style="color:#9B8E82">ביטול</a></div>
          </div>` : `
          <div class="tcard">
            <button class="kill" onclick="removeTable('${t.id}')">הסר</button>
            <b>${esc(t.name)}</b>
            <div style="cursor:pointer" onclick="pickingTable='${t.id}';renderStep()">${tplPreview(tplOf(t), 26)}</div>
            <div class="swapline">${tplOf(t).seats.length} מקומות · לחיצה משנה צורה</div>
          </div>`).join('')}
      </div>

      <div style="margin-top:16px">
        <div class="capbar"><i class="kids" style="width:${w}%"></i><i class="staff" style="width:${ws}%"></i></div>
        <div class="capnote ${cap < need + seated ? 'bad' : ''}">
          👧 ${need} ילדים${seated ? ' · 🧑‍🏫 ' + seated + ' צוות' : ''} · 🪑 ${cap} מקומות —
          ${cap < need + seated
            ? '<b>חסרים ' + (need + seated - cap) + ' מקומות</b>'
            : (cap - need - seated === 0 ? '<b>בדיוק מספיק</b> ✓'
               : '<b>' + (cap - need - seated) + ' מקומות פנויים</b> ✓')}</div>
      </div>` : '<div class="count-line" style="margin-top:14px">עוד לא נוספו שולחנות.</div>'}

    ${blockerHtml(2)}
    <div class="nav">
      <button class="btn ghost" onclick="goStep(1)">חזרה</button>
      <button class="btn" ${canAdvance(2) ? "" : "disabled"} onclick="goStep(3)" >המשך</button>
    </div></div>`;
}
function addTable(tid) {
  const n = plan.tables.length + 1;
  plan.tables.push({ id: 't' + Date.now().toString(36), name: 'שולחן ' + n, templateId: tid });
  renderStep();
}
function removeTable(id) {
  plan.tables = plan.tables.filter(t => t.id !== id);
  plan.tables.forEach((t, i) => { t.name = 'שולחן ' + (i + 1); });
  delete plan.layout[id];
  renderStep();
}
function setTpl(tid, v) {
  const t = plan.tables.find(x => x.id === tid); if (t) t.templateId = v;
  pickingTable = null; renderStep();
}

function tplPreview(t, scale) {
  const S = scale || 24, PAD = Math.round(S * 0.58);
  const w = t.w * S, h = t.h * S;
  const d = Math.max(8, Math.round(S * 0.5));
  const seats = t.seats.map(s =>
    `<div style="position:absolute;width:${d}px;height:${d}px;border-radius:50%;background:#C4846C;
      left:${PAD + s.x * S - d / 2}px;top:${PAD + s.y * S - d / 2}px;"></div>`).join('');
  return `<div style="position:relative;width:${w + PAD * 2}px;height:${h + PAD * 2}px;margin:0 auto;">
    <div style="position:absolute;left:${PAD}px;top:${PAD}px;width:${w}px;height:${h}px;
      background:#efe6d8;border:1.5px solid #ddd0bb;${t.shape === 'round' ? 'border-radius:50%;' : 'border-radius:5px;'}"></div>
    ${seats}</div>`;
}

function stepStaff() {
  const used = new Set(Object.values(plan.staff).flatMap(s => s.members));

      על כיסא אחד יושבת אחת, ולכן שתיים שמתחלפות ביניהן נכנסות למשבצת אחת ומתחלפות ב-⇄.
      במשבצת של השגחה או ישיבה ליד השולחן אין כיסא — שם שתיהן יופיעו יחד על הסידור.</div>
    ${planSketch()}
    <div class="pick">
      ${allStaff.map(s => `<button class="p staff ${used.has(s.id) ? 'on' : ''}" onclick="toggleStaff('${s.id}')">${esc(s.name)}</button>`).join('')}

    </div>
    ${Object.keys(plan.staff).length ? `<div style="margin-top:18px;">
      ${Object.keys(plan.staff).map(sid => {
        const cfg = plan.staff[sid];
        const free = allStaff.filter(s => !used.has(s.id));
        return `<div class="staff-row">
          ${isOpenSlot(sid)
            ? `<input class="slot-label" value="${esc(slotName(sid))}" maxlength="22"
                 onchange="renameSlot('${sid}',this.value)" title="שם התפקיד">`
            : `<b style="color:#1F3D34;min-width:88px">${esc(slotLabel(sid))}</b>`}
          ${cfg.members.length > 1 ? (cfg.sits === 'seat'
            ? `<button class="swap" onclick="flipSlot('${sid}')" title="על כיסא אחד יושבת אחת">⇄ היום: ${esc(slotName(sid))}</button>`
            : `<button class="${cfg.alt ? 'swap' : 'both'}" onclick="toggleAlt('${sid}')"
                 title="${cfg.alt ? 'לחיצה: שתיהן נמצאות יחד' : 'לחיצה: הן מחליפות זו את זו'}"
                 >${cfg.alt ? '⇄ מחליפות' : 'יחד'}</button>
               ${cfg.alt
                 ? `<button class="swap" onclick="flipSlot('${sid}')">היום: ${esc(slotName(sid))}</button>`
                 : `<span class="nms">${esc(cfg.members.map(staffName).join(' · '))}</span>`}`) : ''}
          ${free.length ? `<select onchange="if(this.value)addAlt('${sid}',this.value)">
               <option value="">+ מחליפה…</option>
               ${free.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select>` : ''}
          <select onchange="plan.staff['${sid}'].sits=this.value;renderStep()">
            <option value="seat"   ${cfg.sits === 'seat' ? 'selected' : ''}>יושבת במקום בשולחן</option>
            <option value="beside" ${cfg.sits === 'beside' ? 'selected' : ''}>יושבת ליד השולחן</option>
            <option value="rove"   ${cfg.sits === 'rove' ? 'selected' : ''}>לא יושבת — משגיחה</option>
          </select>
          ${cfg.sits !== 'seat' ? `<span style="font-size:12px;color:#9B8E82;">אחראית על:</span>
            ${plan.tables.map(t => `<label style="font-size:12.5px;display:flex;align-items:center;gap:4px;">
              <input type="checkbox" ${(cfg.tables||[]).includes(t.id)?'checked':''} onchange="toggleResp('${sid}','${t.id}')"> ${esc(t.name)}</label>`).join('')}` : ''}
          <button class="x" style="margin-right:auto;background:none;border:none;color:#c94147;cursor:pointer;font-family:'Alef';font-size:13px"
            onclick="delSlot('${sid}')">הסר</button>
        </div>`;
      }).join('')}</div>` : '<div class="count-line">אפשר גם בלי אנשי צוות בסידור.</div>'}
    ${blockerHtml(3)}
    <div class="nav">
      <button class="btn ghost" onclick="goStep(2)">חזרה</button>
      <button class="btn" ${canAdvance(3) ? "" : "disabled"} onclick="goStep(4)">המשך</button>
    </div></div>`;
}
function toggleStaff(id) {
  const slot = Object.keys(plan.staff).find(k => plan.staff[k].members.includes(id));
  if (slot) {
    const s = plan.staff[slot];
    s.members = s.members.filter(m => m !== id);
    // משבצת שנוצרה כתפקיד נשארת גם כשמסירים ממנה את האדם
    if (!s.members.length && !s.label) delete plan.staff[slot];
    else s.active = 0;
  } else {
    plan.staff[uid()] = { members: [id], active: 0, sits: 'seat', tables: [] };
  }
  renderStep();
}
function addAlt(sid, staffId) { plan.staff[sid].members.push(staffId); renderStep(); }
const OPEN_ROLES = ['מחליפה', 'סטודנטית', 'מתנדבת', 'מלווה', 'סייעת'];
function addOpenSlot(label) {
  plan.staff[uid()] = { members: [], active: 0, label: label || 'מחליפה', sits: 'seat', tables: [] };
  closeModal(); renderStep();
}
function openRolePick() {
  openModal('משבצת בלי שם', 'תפקיד שיושב בשולחן גם כשעוד לא יודעים מי ימלא אותו. מוסיפים אדם למשבצת מאוחר יותר והיא הופכת לשם.',
    `<div class="ipick">${OPEN_ROLES.map(r => `<button onclick="addOpenSlot('${r}')">
       <span class="e">👤</span><span>${esc(r)}</span></button>`).join('')}</div>
     <div class="flab" style="font-size:12.5px;color:#9B8E82;font-weight:700;margin:14px 0 5px">או שם משלך</div>
     <input type="text" id="roleOther" placeholder="למשל: אחראית שולחן 2"
       onkeydown="if(event.key==='Enter')addOpenSlot(this.value.trim()||'ללא שם')">`,
    `<button class="btn" onclick="addOpenSlot((document.getElementById('roleOther')||{}).value.trim()||'ללא שם')">הוספה</button>
     <button class="btn ghost" onclick="closeModal()">ביטול</button>`);
}
function renameSlot(sid, v) {
  const s = plan.staff[sid]; if (!s) return;
  s.label = (v || '').trim() || 'ללא שם';
  renderStep(); if (built) renderBoard();
}
function flipSlot(sid) { const s = plan.staff[sid]; s.active = (s.active + 1) % s.members.length; renderStep(); if (built) renderBoard(); }
function delSlot(sid) { delete plan.staff[sid]; renderStep(); }
function toggleResp(sid, tid) {
  const a = plan.staff[sid].tables = plan.staff[sid].tables || [];
  const i = a.indexOf(tid); if (i >= 0) a.splice(i, 1); else a.push(tid);
}

function peopleOptions(kind) {
  const list = kind === 'staff'
    ? Object.keys(plan.staff).map(id => ({ id, name: slotName(id) }))
    : plan.childIds.map(id => ({ id, name: kidName(id) }));
  return list.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
}

// סקיצה חיה של מה שנבנה עד כה — מוצגת בכל שלב מהשולחנות והלאה,
// כדי שאפשר יהיה לדמיין את החדר בזמן ההחלטות ולא רק בסוף.
// mode='rules' מוסיף לחיצה על מושב שמדגישה את שכניו.
let sketchSel = null;
function planSketch(mode) {
  if (!plan.tables.length) return '';
  const interactive = mode === 'rules';
  const SK = 32, P = 20;
  const tables = plan.tables.map(t => {
    const tpl = tplOf(t), nb = E.neighborMap(tpl);
    const selHere = sketchSel && sketchSel.t === t.id ? sketchSel.s : null;
    const neigh = selHere ? (nb[selHere] || []) : [];
    const seats = tpl.seats.map(s => {
      const cls = ['sk-seat'];
      if (interactive && s.id === selHere) cls.push('sel');
      else if (interactive && neigh.indexOf(s.id) >= 0) cls.push('nb');
      // בלי טקסט בתוך המושב — הצורה כבר אומרת מי יושב לבד על צלע.
      // התפקיד נשאר ב-title לעכבר.
      const lbl = '';
      const click = interactive ? `onclick="sketchSel={t:'${t.id}',s:'${s.id}'};renderStep()"` : 'style2';
      return `<div class="${cls.join(' ')}" style="left:${P + s.x * SK - 15}px;top:${P + s.y * SK - 15}px${interactive ? '' : ';cursor:default'}"
        ${interactive ? click : ''} title="${s.role === 'head' ? 'ראש השולחן' : s.role === 'middle' ? 'אמצע הצלע' : 'קצה'}">${lbl}</div>`;
    }).join('');
    // השולחן נצבע בגוון של מי שאחראית עליו — נקלט מיד, בלי מקרא ובלי קווים
    const sk = tableSkin(t.id), who = tableStaff(t.id).map(slotLabel).join(' · ');
    return `<div class="sk-one"><div class="nm">${esc(t.name)}</div>
      <div class="sk-wrap" style="width:${tpl.w * SK + P * 2}px;height:${tpl.h * SK + P * 2}px">
        <div class="sk-surface" title="${esc(who)}" style="left:${P}px;top:${P}px;width:${tpl.w * SK}px;height:${tpl.h * SK}px;
          background:${sk.fill};border-color:${sk.line};
          ${tpl.shape === 'round' ? 'border-radius:50%' : 'border-radius:8px'}"></div>${seats}</div>
      ${who ? `<div class="sk-who" style="color:${markColor(tableStaff(t.id)[0])}">${esc(who)}</div>` : ''}</div>`;
  }).join('');
  const cap = plan.tables.reduce((s, t) => s + tplOf(t).seats.length, 0);
  const seated = Object.keys(plan.staff).filter(k => plan.staff[k].sits === 'seat').length;
  const head = `👧 ${plan.childIds.length} ילדים · 🪑 ${plan.tables.length} שולחנות · ${cap} מקומות`
    + (seated ? ` · 🧑‍🏫 ${seated} צוות בשולחן` : '');

  const hint = interactive
    ? (sketchSel ? (() => {
        const t = plan.tables.find(x => x.id === sketchSel.t);
        if (!t) return head;
        const n = (E.neighborMap(tplOf(t))[sketchSel.s] || []).length;
        return `<b style="color:#1F3D34">למושב הזה יש ${n} שכנים</b> — רק הם נחשבים "יושבים לידו".`;
      })() : 'לחצי על מושב כדי לראות מי נחשב יושב לידו 👇')
    : head;

  const legend = interactive ? `<div class="sk-legend">
      <span><i style="background:#1F7a4f"></i>המושב שנבחר</span>
      <span><i style="background:#fdf1e3;border:1.5px solid #C4846C"></i>השכנים שלו</span>
      <span style="color:#b3a89a">מי שיושב מולו לא נחשב "ליד"</span>
    </div>` : '';

  return `<div class="sketch">
    <div class="sk-hint">${hint}</div>
    <div class="sk-tables">${tables}</div>
    ${legend}</div>`;
}

function stepRules() {
  return `<div class="card">
    <h2>כללי ישיבה</h2>
    <div class="sub">שימי לב להבדל: <b>"לא באותו שולחן"</b> מרחיק לגמרי,
      ואילו <b>"לא אחד ליד השני"</b> מאפשר אותו שולחן ובלבד שלא במושבים צמודים.</div>

      <select id="rType" onchange="renderRuleRow()">

function renderRuleRow() {
  const t = document.getElementById('rType').value;
  const el = document.getElementById('ruleFields');
  const kids = `<select id="rA">${peopleOptions('child')}</select>`;
  if (E.RULE_TYPES[t].pair) { el.innerHTML = kids + `<select id="rB">${peopleOptions('child')}</select>`; return; }
  if (t === 'position') {
    el.innerHTML = kids + `<select id="rPos">
      <option value="head">בראש השולחן</option><option value="edge">בקצה הצלע</option>
      <option value="middle">באמצע הצלע</option></select>`; return;
  }
  el.innerHTML = kids + `<select id="rB"><option value="">כל איש צוות</option>${peopleOptions('staff')}</select>`;

function addRule() {
  const type = document.getElementById('rType').value;
  const a = (document.getElementById('rA') || {}).value;
  const b = (document.getElementById('rB') || {}).value || null;
  const pos = (document.getElementById('rPos') || {}).value || null;
  if (!a) return;
  if (E.RULE_TYPES[type].pair && a === b) { showErr('צריך לבחור שני ילדים שונים'); return; }
  plan.rules.push({ id: uid(), type, a, b, pos, active: true });
  renderStep();
}
function ruleHtml(r) {
  return `<div class="rule ${r.active === false ? 'off' : ''}">
    <span class="state" onclick="toggleRule('${r.id}')">${r.active === false ? 'מבוטל' : 'פעיל'}</span>
    <b>${esc(E.RULE_TYPES[r.type].label)}:</b> ${esc(ruleText(r))}
    <button class="x" onclick="delRule('${r.id}')">מחק</button></div>`;
}
function ruleText(r) {
  const nm = id => kidName(id) || slotName(id) || '—';
  if (r.type === 'position') {
    const L = { head: 'בראש השולחן', edge: 'בקצה הצלע', middle: 'באמצע הצלע' };
    return nm(r.a) + ' — ' + (L[r.pos] || r.pos);
  }
  return nm(r.a) + (r.b ? ' · ' + nm(r.b) : ' · כל איש צוות');
}
function toggleRule(id) { const r = plan.rules.find(x => x.id === id); r.active = r.active === false; built ? renderBoard() : renderStep(); }
function delRule(id) { plan.rules = plan.rules.filter(x => x.id !== id); built ? renderBoard() : renderStep(); }

/* ---------- חלוקה ---------- */

const mt = arr => `<div class="mt">${dots(arr)}</div>`;
const SPLITS = [
  { id: 'even',   t: 'שווה',        h: 'אותו מספר בכל שולחן',

    fig: mt(['l','l','l']) + mt(['m','m','m']) + mt(['s','s','s']) },
  { id: 'mixed',  t: 'ערבוב גילים', h: 'גדולים וקטנים יחד',

  { id: 'fill',   t: 'אחד אחרי השני', h: 'ממלא שולחן ועובר לבא',

          <div class="mt" style="align-items:center;font-size:12px;font-weight:700;color:#8a7f70">4</div>
          <div class="mt" style="align-items:center;font-size:12px;font-weight:700;color:#8a7f70">3</div>` },
  { id: 'any',    t: 'לא משנה לי',  h: 'מה שיסתדר הכי פשוט',
    fig: mt(['s','l']) + mt(['m','m','s','l']) + mt(['l','s','m']) },
];
function stepSplit() {
  const m = plan.split.mode;
  return `<div class="card">
    <h2>איך לחלק את הילדים?</h2>
    <div class="sub">כל נקודה היא ילד/ה — גודל הנקודה מסמן גיל.</div>

    </div>

      <div class="staff-row"><b style="min-width:84px">${esc(t.name)}</b>

          value="${(plan.split.counts && plan.split.counts[t.id]) || ''}" oninput="setCount('${t.id}',this.value)">

    <div class="count-line" style="margin-top:16px;">
