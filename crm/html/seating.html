/* ---------- בנייה ---------- */
function enginePlan() {
  const people = {};
  plan.childIds.forEach(id => { people[id] = { name: kidName(id), kind: 'child' }; });
  Object.keys(plan.staff).forEach(sid => {
    people[sid] = { name: slotName(sid), kind: 'staff', sits: plan.staff[sid].sits, tables: plan.staff[sid].tables };
  });
  return { tables: plan.tables, people, rules: plan.rules, seats: plan.seats };
}
// חלוקה לפי גיל / ערבוב / מילוי → שולחן מועדף לכל ילד
function preferMap() {
  const m = plan.split.mode;
  if (m !== 'age' && m !== 'mixed' && m !== 'fill') return {};
  const kids = plan.childIds.slice();
  if (m === 'age' || m === 'mixed') kids.sort((a, b) => String((allKids.find(k => k.id === a) || {}).birth)
    .localeCompare(String((allKids.find(k => k.id === b) || {}).birth)));
  const T = plan.tables.length, pref = {};
  kids.forEach((id, i) => {
    const idx = (m === 'mixed') ? i % T : Math.floor(i / Math.ceil(kids.length / T));
    pref[id] = plan.tables[Math.min(idx, T - 1)].id;
  });
  return pref;
}
function buildPlan() {
  const ep = enginePlan();
  const res = E.solve(ep, tplOf, { split: plan.split, locks: plan.locks, prefer: preferMap() });
  if (!res.ok) { showConflict(res); return; }
  plan.seats = res.seats;
  if (!Object.keys(plan.layout).length) autoLayout('row', true);
  built = true;
  document.getElementById('wizard').classList.add('hide');
  document.getElementById('steps').classList.add('hide');
  document.getElementById('board').classList.remove('hide');
  renderTop(); renderBoard(); window.scrollTo({ top: 0, behavior: 'smooth' });
}
function showConflict(res) {
  const box = document.getElementById('wizard');
  let html = '';
  (res.issues || []).forEach(i => { html += `<div class="conflict"><h4>צריך לשים לב</h4><p>${esc(i.text)}</p></div>`; });
  if (res.group) {
    const pairs = [];
    for (let i = 0; i < res.group.length; i++)
      for (let j = i + 1; j < res.group.length; j++) pairs.push([res.group[i], res.group[j]]);
    html += `<div class="conflict">
      <h4>מצאתי בעיה — הכללים הנוכחיים לא מאפשרים סידור</h4>
      <p>הגדרת ש<b>${res.group.map(kidName).join(', ')}</b> לא יכולים לשבת יחד — זה ${res.group.length} ילדים
         שצריכים ${res.group.length} שולחנות שונים, אבל יש רק ${plan.tables.length}.</p>
      <p><b>שאלה אחת תפתור את זה:</b> איזה זוג מתוכם כן יכול לשבת באותו שולחן?</p>
      <div class="opts">${pairs.map(p => `<button onclick="resolvePair('${p[0]}','${p[1]}')">${esc(kidName(p[0]))} ו${esc(kidName(p[1]))}</button>`).join('')}</div></div>`;
  } else if (res.exhausted) {
    html += `<div class="conflict"><h4>לא מצאתי סידור שמקיים את כל הכללים</h4>
      <p>הכללים לא סותרים זה את זה ישירות, אבל יחד הם לא מותירים אפשרות. אפשר לבטל כלל ולנסות שוב, או להוסיף שולחן.</p>
      <div class="opts">${plan.rules.filter(r => r.active !== false).map(r =>
        `<button onclick="toggleRule('${r.id}');buildPlan()">בטלי: ${esc(E.RULE_TYPES[r.type].label)} — ${esc(ruleText(r))}</button>`).join('')}</div></div>`;
  }
  box.innerHTML = html + `<div class="nav"><button class="btn ghost" onclick="goStep(4)">חזרה לכללים</button></div>`;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function resolvePair(a, b) {
  plan.rules.forEach(r => { if (r.type === 'not_same_table' &&
    ((r.a === a && r.b === b) || (r.a === b && r.b === a))) r.active = false; });
  buildPlan();
}

/* ---------- פריסת החדר (קנבס A4 לרוחב) ---------- */
const ROOM_W = 1123, ROOM_H = 794;
const S = 50, PAD = 30, GAP = 26;
function tableBox(t) { const tp = tplOf(t); return { w: tp.w * S + PAD * 2, h: tp.h * S + PAD * 2 }; }

// מרכוז הפריסה בתוך הדף, כך שמה שנראה על המסך הוא מה שיודפס.
function centerLayout(L) {
  const ids = Object.keys(L); if (!ids.length) return L;
  const boxes = {}; plan.tables.forEach(t => { boxes[t.id] = tableBox(t); });
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  ids.forEach(id => {
    const b = boxes[id], l = L[id];
    const rot = ((l.rot % 180) + 180) % 180;
    const w = rot === 90 ? b.h : b.w, h = rot === 90 ? b.w : b.h;
    minX = Math.min(minX, l.x); minY = Math.min(minY, l.y);
    maxX = Math.max(maxX, l.x + w); maxY = Math.max(maxY, l.y + h);
  });
  const dx = (ROOM_W - (maxX - minX)) / 2 - minX;
  const dy = (ROOM_H - (maxY - minY)) / 2 - minY;
  ids.forEach(id => { L[id].x = Math.round(L[id].x + dx); L[id].y = Math.round(L[id].y + dy); });
  return L;
}

function autoLayout(kind, silent) {
  if (!silent && built) pushUndo();
  const boxes = plan.tables.map(t => ({ id: t.id, ...tableBox(t) }));
  const L = {};
  if (kind === 'row') {
    // אם שורה אחת רחבה מהדף — נשברת לשתי שורות מעצמה
    const total = boxes.reduce((s, b) => s + b.w + GAP, -GAP);
    if (total > ROOM_W) return autoLayout('two', silent);
    let x = 0; boxes.forEach(b => { L[b.id] = { x, y: 0, rot: 0 }; x += b.w + GAP; });
  } else if (kind === 'two') {
    const half = Math.ceil(boxes.length / 2);
    const rowH = Math.max(...boxes.map(b => b.h));
    let x = 0;
    boxes.forEach((b, i) => {
      if (i === half) x = 0;
      L[b.id] = { x, y: i < half ? 0 : rowH + GAP, rot: 0 };
      x += b.w + GAP;
    });
  } else if (kind === 'parallel') {
    let x = 0; boxes.forEach(b => { L[b.id] = { x, y: 0, rot: 90 }; x += b.h + GAP; });
  } else if (kind === 'circle') {
    const R = Math.min(ROOM_W, ROOM_H) / 2 - Math.max(...boxes.map(b => Math.max(b.w, b.h))) / 2;
    boxes.forEach((b, i) => {
      const a = (i / boxes.length) * Math.PI * 2 - Math.PI / 2;
      L[b.id] = { x: R + Math.cos(a) * R - b.w / 2, y: R + Math.sin(a) * R - b.h / 2, rot: 0 };
    });
  } else { // grid
    const cols = Math.ceil(Math.sqrt(boxes.length));
    const cw = Math.max(...boxes.map(b => b.w)) + GAP, ch = Math.max(...boxes.map(b => b.h)) + GAP;
    boxes.forEach((b, i) => { L[b.id] = { x: (i % cols) * cw, y: Math.floor(i / cols) * ch, rot: 0 }; });
  }
  plan.layout = centerLayout(L);
  if (!silent) renderBoard();
}

/* ---------- צבע לכל אשת צוות ---------- */
// צבע אחד לכל משבצת, שנושא את כל המידע על אחריות: הוא צובע את השולחנות
// שבאחריותה ואת הגלולה עם שמה. בלי קווים מחברים — קו לכל שולחן הופך
// תרשים נקי לרשת של חוטים, והצבע אומר את אותו דבר בלי רעש.
const MARK_COLORS = ['#C4846C', '#5f93b8', '#7a54a8', '#1F7a4f', '#b8801f', '#a0526d'];
const allSlots = () => Object.keys(plan.staff);
const offSlots = () => allSlots().filter(id => plan.staff[id].sits !== 'seat');
const markColor = sid => MARK_COLORS[allSlots().indexOf(sid) % MARK_COLORS.length];

// מי אחראית על השולחן הזה
const tableStaff = tid => allSlots().filter(sid => (plan.staff[sid].tables || []).includes(tid));

const rgbOf = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function mix(a, b, t) {                       // t=0 מחזיר את a, t=1 את b
  const A = rgbOf(a), B = rgbOf(b);
  return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
const SURF = '#efe6d8', SURF_LINE = '#ddd0bb';

// משטח השולחן בגוון של האחראית. שתי אחראיות — חצי-חצי, בלי מעבר מטושטש,
// כדי שיהיה ברור שאלו שתיים ולא צבע שלישי חדש.
function tableSkin(tid) {
  const cols = tableStaff(tid).map(markColor);
  if (!cols.length) return { fill: SURF, line: SURF_LINE };
  const fills = cols.map(c => mix(SURF, c, 0.22));
  const line = mix(SURF_LINE, cols[0], 0.6);
  if (fills.length === 1) return { fill: fills[0], line };
  const step = 100 / fills.length;
  const stops = fills.map((f, i) => `${f} ${i * step}% ${(i + 1) * step}%`).join(',');
  return { fill: `linear-gradient(90deg, ${stops})`, line };
}

// מיקום התחלתי: "יושבת ליד" — צמוד לשולחן שבאחריותה; "משגיחה" — בשוליים.
function ensureMarkers() {
  plan.marks = plan.marks || {};
  offSlots().forEach((sid, i) => {
    if (plan.marks[sid]) return;
    const cfg = plan.staff[sid];
    const tid = (cfg.tables || [])[0];
    const l = tid ? plan.layout[tid] : null;
    if (cfg.sits === 'beside' && l) {
      const b = tableBox(plan.tables.find(t => t.id === tid));
      plan.marks[sid] = { x: Math.round(l.x + b.w / 2 - 40), y: Math.round(l.y + b.h + 4) };
    } else {
      plan.marks[sid] = { x: 30, y: 30 + i * 40 };
    }
  });
  Object.keys(plan.marks).forEach(sid => { if (!plan.staff[sid]) delete plan.marks[sid]; });
}

function markersHtml() {
  ensureMarkers();
  return offSlots().map(sid => {
    const cfg = plan.staff[sid], m = plan.marks[sid], c = markColor(sid);
    const tables = (cfg.tables || []).map(tid => {
      const t = plan.tables.find(x => x.id === tid); return t ? t.name : '';
    }).filter(Boolean);
    const ico = cfg.sits === 'beside' ? '🪑' : '👀';
    const ttl = cfg.sits === 'beside' ? 'יושבת ליד השולחן' : 'משגיחה';
    return `<div class="pmark" style="left:${m.x}px;top:${m.y}px;border-color:${c};color:${c};
      box-shadow:0 0 0 4px ${mix('#ffffff', c, 0.16)},0 2px 8px rgba(0,0,0,.10)"
      onpointerdown="startDragMark(event,'${sid}')"
      title="${ttl}${tables.length ? ' · ' + esc(tables.join(', ')) : ''}">
      <span class="ico">${ico}</span>${esc(slotName(sid))}</div>`;
  }).join('');
}

// הסמן של "יושבת ליד" נוסע עם השולחן שלה כשגוררים אותו.
function moveMarksWithTable(tid, dx, dy) {
  offSlots().forEach(sid => {
    const cfg = plan.staff[sid];
    if (cfg.sits !== 'beside') return;
    if ((cfg.tables || [])[0] !== tid) return;
    const m = plan.marks && plan.marks[sid]; if (!m) return;
    m.x = Math.round(m.x + dx); m.y = Math.round(m.y + dy);
  });
}

let dragMark = null;
function startDragMark(ev, sid) {
  ev.preventDefault(); ev.stopPropagation();
  if (built) pushUndo();
  const m = plan.marks[sid];
  dragMark = { sid, sx: ev.clientX, sy: ev.clientY, ox: m.x, oy: m.y };
  window.addEventListener('pointermove', onDragMark);
  window.addEventListener('pointerup', endDragMark, { once: true });
}
function onDragMark(ev) {
  if (!dragMark) return;
  const room = document.getElementById('room');
  const sc = room ? (room.getBoundingClientRect().width / ROOM_W) || 1 : 1;
  const m = plan.marks[dragMark.sid];
  m.x = Math.max(0, Math.round(dragMark.ox + (ev.clientX - dragMark.sx) / sc));
  m.y = Math.max(0, Math.round(dragMark.oy + (ev.clientY - dragMark.sy) / sc));
  const el = [...document.querySelectorAll('.pmark')][offSlots().indexOf(dragMark.sid)];
  if (el) { el.style.left = m.x + 'px'; el.style.top = m.y + 'px'; }
}
function endDragMark() { window.removeEventListener('pointermove', onDragMark); dragMark = null; renderBoard(); }

// הקטנת הדף כך שייכנס לרוחב המסך, בלי לשנות את הפריסה עצמה.
function fitRoom() {
  const outer = document.getElementById('roomOuter'), room = document.getElementById('room');
  if (!outer || !room) return;
  const scale = Math.min(1, outer.clientWidth / ROOM_W);
  room.style.transform = 'scale(' + scale + ')';
  outer.style.height = (ROOM_H * scale) + 'px';
}
window.addEventListener('resize', fitRoom);
// כפתור ה-⟳ נשאר למסך צר, שם אין לאן לגרור ידית קטנה באצבע
function rotateTable(tid) {
  pushUndo();
  const l = plan.layout[tid] || { x: 0, y: 0, rot: 0 };
  l.rot = (l.rot + 45) % 360; plan.layout[tid] = l; renderBoard();
}
function resetRot(tid) {
  const l = plan.layout[tid]; if (!l || !l.rot) return;
  pushUndo();
  l.rot = 0; renderBoard();
}

/* ---------- סיבוב ידני בגרירה ---------- */
// מגנט כל 22.5° — כלומר 0, 22.5, 45, 67.5, 90 וכן הלאה — ובנוסף לזווית של
// כל שולחן אחר בחדר, כי חדר נראה מסודר כששולחנות מקבילים זה לזה ולא דווקא
// כשהם על זוויות עגולות. Alt בזמן הגרירה מבטל את המגנט.
const ROT_STEP = 22.5, ROT_PULL = 5;
let rotDrag = null;

function snapAngle(tid, deg, free) {
  const norm = a => ((a % 360) + 360) % 360;
  deg = norm(deg);
  if (free) return { deg: Math.round(deg * 10) / 10, hit: null };
  const cands = [];
  for (let a = 0; a < 360; a += ROT_STEP) cands.push({ a, why: null });
  plan.tables.forEach(t => {
    if (t.id === tid) return;
    const r = norm((plan.layout[t.id] || {}).rot || 0);
    cands.push({ a: r, why: t.name });
  });
  let best = null;
  cands.forEach(c => {
    let d = Math.abs(norm(deg - c.a));
    if (d > 180) d = 360 - d;
    if (d <= ROT_PULL && (!best || d < best.d)) best = { d, a: c.a, why: c.why };
  });
  return best ? { deg: best.a, hit: best.why || 'step' } : { deg: Math.round(deg * 10) / 10, hit: null };
}

function startRotate(ev, tid) {
  ev.preventDefault(); ev.stopPropagation();
  pushUndo();
  const wrap = document.querySelector(`.twrap[data-t="${tid}"]`);
  const r = wrap.getBoundingClientRect();
  rotDrag = { tid, cx: r.left + r.width / 2, cy: r.top + r.height / 2,
              start: (plan.layout[tid] || {}).rot || 0 };
  // הזווית שבה האצבע נמצאת ברגע התפיסה, כדי שהשולחן לא יקפוץ
  rotDrag.grab = Math.atan2(ev.clientY - rotDrag.cy, ev.clientX - rotDrag.cx) * 180 / Math.PI;
  try { ev.currentTarget.setPointerCapture(ev.pointerId); } catch (e) {}
  window.addEventListener('pointermove', onRotate);
  window.addEventListener('pointerup', endRotate, { once: true });
}

function onRotate(ev) {
  if (!rotDrag) return;
  const now = Math.atan2(ev.clientY - rotDrag.cy, ev.clientX - rotDrag.cx) * 180 / Math.PI;
  const res = snapAngle(rotDrag.tid, rotDrag.start + (now - rotDrag.grab), ev.altKey);
  const l = plan.layout[rotDrag.tid] || (plan.layout[rotDrag.tid] = { x: 0, y: 0, rot: 0 });
  l.rot = res.deg;

  // סיבוב חי בלי לבנות מחדש את הלוח — רק הטרנספורמים זזים
  const wrap = document.querySelector(`.twrap[data-t="${rotDrag.tid}"]`);
  if (wrap) {
    wrap.style.transform = `rotate(${l.rot}deg)`;
    wrap.querySelectorAll('.seat').forEach(s => { s.style.transform = `rotate(${-l.rot}deg)`; });
    const lb = wrap.querySelector('.tlabel');
    if (lb) lb.style.transform = `translate(-50%,-50%) rotate(${-l.rot}deg)`;
  }
  showAngle(res, ev);
}

// מספר המעלות ליד האצבע — כתום כשהמגנט תפס, אפור כשחופשי
function showAngle(res, ev) {
  let tag = document.getElementById('rotTag');
  if (!tag) { tag = document.createElement('div'); tag.id = 'rotTag'; tag.className = 'rot-tag'; document.body.appendChild(tag); }
  const txt = Number.isInteger(res.deg) ? `${res.deg}°` : `${res.deg.toFixed(1)}°`;
  tag.textContent = res.hit && res.hit !== 'step' ? `${txt} · כמו ${res.hit}` : txt;
  tag.classList.toggle('snap', !!res.hit);
  tag.style.left = (ev.clientX + 16) + 'px';
  tag.style.top = (ev.clientY - 30) + 'px';
}

function endRotate() {
  window.removeEventListener('pointermove', onRotate);
  const tag = document.getElementById('rotTag'); if (tag) tag.remove();
  if (!rotDrag) return;
  rotDrag = null;
  renderBoard();
}

/* ---------- הלוח ---------- */
function startFresh() {
  // הטיוטה הנוכחית אינה שמורה בשרת, ולכן כאן כן מתריעים לפני שמאבדים אותה.
  if (!plan.childIds.length) { doFresh(); return; }
  openModal('סידור חדש', 'הטיוטה הנוכחית תימחק. אם רוצים לשמור אותה — סגרי ולחצי "שמירה" קודם.',
    `<div class="empty-note"><b>${esc(plan.name)}</b> · ${plan.childIds.length} ילדים · ${plan.tables.length} שולחנות</div>`,
    `<button class="btn" onclick="doFresh()">התחלה מחדש</button>
     <button class="btn ghost" onclick="closeModal()">ביטול</button>`);
}
function doFresh() { closeModal(); clearDraft(); plan = newPlan(); built = false; goStep(1); }

// ---- הורדה ל-PDF ----
// הדפדפן הוא המקור היחיד לגאומטריה: הוא שולח מרכזי מושבים מוחלטים, אחרי
// שהסיבוב כבר חושב. כך הדף המודפס לא יכול להתרחק ממה שרואים על המסך.
function sheetData() {
  const ep = enginePlan();
  const tables = plan.tables.map(t => {
    const l = plan.layout[t.id] || { x: 0, y: 0, rot: 0 }, tp = tplOf(t);
    // הגוונים של האחראיות עוברים לדף המודפס — שם זו הדרך היחידה לדעת
    const cols = tableStaff(t.id).map(markColor);
    return { name: t.name, shape: tp.shape === 'round' ? 'round' : 'rect', rot: l.rot || 0,
             x: l.x + PAD, y: l.y + PAD, w: tp.w * S, h: tp.h * S,
             fills: cols.length ? cols.map(c => mix('#efe6d8', c, 0.22)) : null,
             line: cols.length ? mix('#ddd0bb', cols[0], 0.6) : null };
  });
  const seats = [];
  plan.tables.forEach(t => tplOf(t).seats.forEach(s => {
    const c = seatCenter(t, s), pid = plan.seats[E.key(t.id, s.id)];
    const p = pid ? ep.people[pid] : null;
    seats.push({ x: Math.round(c.x), y: Math.round(c.y),
                 label: p ? p.name : '', kind: p ? p.kind : 'empty' });
  }));
  ensureMarkers();
  const marks = offSlots().map(sid => ({
    x: plan.marks[sid].x, y: plan.marks[sid].y,
    label: slotName(sid), color: markColor(sid),
  }));

  const taken = new Set(Object.values(plan.seats));
  const out = plan.childIds.filter(c => !taken.has(c));
  const d = new Date();
  const dd = `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}.${d.getFullYear()}`;

  return {
    name: plan.name, tables, seats, marks,
    meta: `${dd}  ·  ${plan.childIds.length - out.length}/${plan.childIds.length}`,
    note: out.length ? `לא יושבים: ${out.map(nameOf).join(', ')}` : '',
  };
}

async function downloadPdf() {
  const btn = document.getElementById('pdfBtn');
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = 'מכין…';
  try {
    const res = await fetch('/.netlify/functions/seating-pdf', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json',
                 'Authorization': 'Bearer ' + localStorage.getItem('crm_token') },
      body: JSON.stringify({ sheet: sheetData() }),
    });
    if (!res.ok) throw new Error('סטטוס ' + res.status);
    const url = URL.createObjectURL(await res.blob());
    const a = document.createElement('a');
    a.href = url;
    a.download = `סידור ישיבה — ${plan.name}.pdf`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch (e) {
    showErr('ההורדה נכשלה: ' + e.message + ' — אפשר בינתיים דרך הדפסה ושמירה כ-PDF');
  } finally { btn.disabled = false; btn.textContent = label; }
}

// האם הכלל בכלל ניתן לקיום בסידור הזה? חריגה שנובעת מכלל שבור היא לא
// בעיה בישיבה — אין שום גרירה שתפתור אותה, ולכן אסור להציג אותה כאילו
// המשתמש עוד לא סיים. מחזיר טקסט הסבר, או null אם הכלל בר-קיום.
function whyImpossible(r) {
  // שימו לב: staff[sid].active הוא אינדקס לחברה הפעילה במשבצת, לא דגל כן/לא.
  // "יושבת בשולחן" נקבע לפי sits === 'seat' בלבד.
  const sits = sid => plan.staff[sid] && plan.staff[sid].sits === 'seat';
  const anyStaffSits = Object.keys(plan.staff).some(sits);
  const seated = new Set(Object.values(plan.seats));

  if (r.type === 'near_staff' || r.type === 'staff_table') {
    if (r.b && !sits(r.b)) return `${slotName(r.b)} לא יושבת בשולחן, אלא מסתובבת בחדר`;
    if (!r.b && !anyStaffSits) return 'אף איש צוות לא יושב בשולחן בסידור הזה';
  }
  if ((r.type === 'adjacent' || r.type === 'same_table') && r.b && !seated.has(r.b)) {
    return `${nameOf(r.b)} לא יושב/ת באף מקום`;
  }
  // כלל מיקום שאין לו אף מקום מתאים בשולחנות שנבחרו — למשל "בראש השולחן"
  // כשכל השולחנות הם 3 בכל צלע, שאין בהם ראש בכלל
  if (r.type === 'position' && r.pos) {
    const L = { head: 'בראש השולחן', edge: 'בקצה', middle: 'באמצע הצלע', round: 'סביב שולחן עגול' };
    const n = plan.tables.reduce((s, t) => s + E.countRole(tplOf(t), r.pos), 0);
    if (!n) return `אין באף שולחן שנבחר מקום ${L[r.pos] || r.pos}`;
  }
  if (r.type === 'adjacent' && r.a && r.b) {
    // שני ילדים שחייבים לשבת זה ליד זה — צריך שולחן עם לפחות שני מקומות
    const maxSeats = Math.max(0, ...plan.tables.map(t => tplOf(t).seats.length));
    if (maxSeats < 2) return 'אין שולחן עם שני מקומות סמוכים';
  }
  return null;
}

// "בסדר, ככה זה טוב" — החריגה מאושרת, האדום נעלם, והסידור נחשב גמור.
// תמיד הפיך, ותמיד נספר בגלוי כדי שלא ייעלם מידע בשקט.
function acceptViol(id) { pushUndo(); plan.okRules[id] = true; renderBoard(); }
function unacceptViol(id) { pushUndo(); delete plan.okRules[id]; renderBoard(); }

// מד שלמות: כמה ילדים באמת יושבים, ומי לא. תמיד מול העיניים, כדי שלא
// ייגמר סידור עם שני ילדים שנשכחו בצד או שלא הגיעו לשום כיסא.
function seatedMeter() {
  const taken = new Set(Object.values(plan.seats));
  const parked = plan.parked || {};
  const out = plan.childIds.filter(c => !taken.has(c));
  const n = plan.childIds.length, sat = n - out.length;
  const seatsTotal = plan.tables.reduce((s, t) => s + tplOf(t).seats.length, 0);
  const free = seatsTotal - Object.keys(plan.seats).length;
  const pct = n ? Math.round(sat / n * 100) : 100;

  // אנשי צוות שהוגדר שהם יושבים בשולחן אבל אין להם כיסא
  const staffOut = Object.keys(plan.staff)
    .filter(sid => plan.staff[sid].active && plan.staff[sid].sits && !taken.has(sid));

  const done = !out.length && !staffOut.length;
  const freeTxt = free === 0 ? 'כל המקומות תפוסים'
    : free === 1 ? 'מקום אחד פנוי' : `${free} מקומות פנויים`;

  return `<div class="meter ${done ? 'done' : ''}">
    <div class="mtop">
      <b>${done ? `כל ${n} הילדים יושבים` : `${sat} מתוך ${n} ילדים יושבים`}</b>
      <span>${freeTxt}</span>
    </div>
    <div class="mbar"><i style="width:${pct}%"></i></div>
    ${done ? '' : `<div class="mwho">
      ${out.map(c => `<button onclick="seatChild('${c}')">${esc(nameOf(c))}${parked[c] ? ' · בצד' : ''}</button>`).join('')}
      ${staffOut.map(s => `<button onclick="seatChild('${s}')">${esc(nameOf(s))} · צוות</button>`).join('')}
      <span class="mhint">לחיצה על שם מושיבה במקום הפנוי הראשון</span></div>`}
  </div>`;
}

// הושבה מהמד — המקום הפנוי הראשון, כדי שלא צריך לגרור כשרק אחד נשכח
function seatChild(cid) {
  for (const t of plan.tables) {
    for (const s of tplOf(t).seats) {
      const k = E.key(t.id, s.id);
      if (plan.seats[k] || plan.locks[k]) continue;
      pushUndo();
      if (plan.parked) delete plan.parked[cid];
      plan.seats[k] = cid;
      renderBoard();
      const el = document.querySelector(`.seat[data-k="${k}"]`);
      if (el) el.classList.add('landed');
      showUndo(`${nameOf(cid)} הושב ב${t.name}`);
      return;
    }
  }
  showErr('אין מקום פנוי — חזרי לשלב השולחנות והוסיפי שולחן');
}

function renderBoard() {
  saveDraft();
  const ep = enginePlan(); ep.seats = plan.seats;
  plan.okRules = plan.okRules || {};
  const all = E.checkViolations(ep, tplOf);
  const viols = all.filter(v => !plan.okRules[v.ruleId]);   // חריגות שאושרו לא צובעות באדום
  const okd = all.filter(v => plan.okRules[v.ruleId]);
  // אדום על ילד אומר "הזיזי אותו". כלל שלא ניתן לקיום לא זוכה לאדום,
  // כי שום הזזה לא תפתור אותו — הוא מוצג כאזהרה בפאנל בלבד.
  const bad = new Set();
  viols.forEach(v => {
    const r = plan.rules.find(x => x.id === v.ruleId);
    if (!r || whyImpossible(r)) return;
    bad.add(r.a); if (r.b) bad.add(r.b);
  });

  let maxX = 0, maxY = 0;
  const tablesHtml = plan.tables.map(t => {
    const tpl = tplOf(t), box = tableBox(t);
    const l = plan.layout[t.id] || { x: 0, y: 0, rot: 0 };
    maxX = Math.max(maxX, l.x + box.w); maxY = Math.max(maxY, l.y + box.h);
    const seats = tpl.seats.map(s => {
      const k = E.key(t.id, s.id), pid = plan.seats[k], p = pid ? ep.people[pid] : null;
      const cls = ['seat'];
      if (p) cls.push('filled');
      if (p && p.kind === 'staff') cls.push('staff');
      if (pid && bad.has(pid)) cls.push('bad');
      if (selectedSeat === k) cls.push('sel');
      if (plan.locks[k]) cls.push('lock');
      return `<div class="${cls.join(' ')}" data-k="${k}" style="left:${PAD + s.x * S - 27}px;top:${PAD + s.y * S - 27}px;
        transform:rotate(${-l.rot}deg)"
        onpointerdown="startChildDrag(event,'seat','${k}')"
        oncontextmenu="event.preventDefault();toggleLock('${k}')"
        title="${p ? esc(p.name) : 'מקום פנוי'}">${p ? esc(p.name) : ''}</div>`;
    }).join('');
    // אין יותר נקודות צבע ליד השם — הן דרכו על הכיסא הסמוך. הצבע עבר
    // למשטח השולחן עצמו, שם יש לו מקום והוא נקלט מרחוק.
    const sk = tableSkin(t.id), who = tableStaff(t.id).map(slotName).join(' · ');
    return `<div class="twrap" data-t="${t.id}" style="left:${l.x}px;top:${l.y}px;width:${box.w}px;height:${box.h}px;
      transform:rotate(${l.rot}deg);transform-origin:center">
      <div class="tlabel" style="left:50%;top:50%;transform:translate(-50%,-50%) rotate(${-l.rot}deg)">
        <span class="tname" onclick="renameTable('${t.id}')" title="לחיצה משנה את השם">${esc(t.name)}</span>
        <button class="rot" onclick="rotateTable('${t.id}')" title="סיבוב ברבע סיבוב">⟳</button></div>
      <div class="tsurface" onpointerdown="startDrag(event,'${t.id}')" title="${esc(who)}"
        style="left:${PAD}px;top:${PAD}px;width:${tpl.w * S}px;height:${tpl.h * S}px;
        background:${sk.fill};border-color:${sk.line};
        ${tpl.shape === 'round' ? 'border-radius:50%;' : 'border-radius:10px;'}"></div>
      <div class="rhandle" onpointerdown="startRotate(event,'${t.id}')" ondblclick="resetRot('${t.id}')"
        title="גרירה מסובבת · לחיצה כפולה מיישרת"><span></span></div>
      ${seats}</div>`;
  }).join('');

  document.getElementById('board').innerHTML = `
    <div class="board-top">
      <div><b style="font-size:18px;color:#1F3D34">${esc(plan.name)}</b>
        <span style="color:#9B8E82;font-size:13px"> · ${plan.childIds.length} ילדים · ${plan.tables.length} שולחנות</span></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn ghost undo-btn" onclick="undoMove()" ${undoStack.length ? '' : 'disabled'}
          title="${undoStack.length ? 'ביטול הפעולה האחרונה' : 'אין מה לבטל'}">↶ ביטול</button>
        <button class="btn soft" onclick="reSolve()">סדרי מחדש</button>
        <button class="btn ghost" id="pdfBtn" onclick="downloadPdf()">📄 הורדה ל-PDF</button>
        <button class="btn ghost" onclick="window.print()">הדפסה</button>
      </div>
    </div>
    ${seatedMeter()}
    ${viols.length ? `<div class="viol"><h4>${viols.length === 1 ? 'כלל ישיבה אחד לא מתקיים' : `${viols.length} כללי ישיבה לא מתקיימים`}</h4>
      ${viols.map(v => {
        const r = plan.rules.find(x => x.id === v.ruleId) || {};
        const why = whyImpossible(r);
        return `<div class="v ${why ? 'stuck' : ''}">
          <div><b>${why ? '⚠️' : '🔴'} ${esc(v.text)}</b>
          ${why ? `<div class="wh">הכלל לא ניתן לקיום: ${esc(why)}. שום שינוי בישיבה לא יפתור אותו.</div>` : ''}</div>
          <div class="vbtns">
            <button onclick="acceptViol('${v.ruleId}')">בסדר, השאירי כך</button>
            <button onclick="killRule('${v.ruleId}')">בטלי את הכלל</button>
          </div></div>`;
      }).join('')}</div>`
      : `<div class="allgood">🟢 הסידור מקיים את כל כללי הישיבה${okd.length ? ` · ${okd.length} ${okd.length === 1 ? 'חריגה אושרה' : 'חריגות אושרו'}` : ''}</div>`}
    ${okd.length ? `<div class="okd">${okd.map(v => `<span>✓ ${esc(v.text)}
        <button onclick="unacceptViol('${v.ruleId}')">החזירי לבדיקה</button></span>`).join('')}</div>` : ''}
    <div class="layouts"><span style="font-size:12.5px;color:#9B8E82;font-weight:700">פריסת החדר:</span>
      <button class="lb" onclick="autoLayout('row')">שורה אחת</button>
      <button class="lb" onclick="autoLayout('two')">שתי שורות</button>
      <button class="lb" onclick="autoLayout('parallel')">מקבילים</button>
      <button class="lb" onclick="autoLayout('grid')">רשת</button>
      <button class="lb" onclick="autoLayout('circle')">מעגל</button>
      <button class="lb" style="border-color:#C4846C;color:#8a5a44" onclick="tidyLayout()">✨ סדר יפה</button>
    </div>
    <div class="a4note">📄 הדף בגודל A4 לרוחב — מה שנראה כאן הוא בדיוק מה שיודפס</div>
    <div class="room-outer" id="roomOuter"><div class="room" id="room" onclick="clearSel(event)">${tablesHtml}${markersHtml()}${parkedHtml()}<div id="guides"></div></div></div>
    <div class="legend">לחיצה על ילד/ה ואז על מקום אחר — מחליפה ביניהם · קליק ימני על מקום נועל אותו 🔒 ·
      גרירת שם השולחן מזיזה אותו בחדר · ⟳ מסובב</div>`;
  fitRoom();
}

/* ---------- גרירה עם קווי עזר ---------- */
const SNAP = 9;   // מרחק בפיקסלים שבו השולחן "נתפס" לקו יישור

// תיבת השולחן בחדר, בהתחשב בסיבוב
function tableRect(t, l) {
  const b = tableBox(t);
  const rot = (((l.rot || 0) % 180) + 180) % 180;
  const w = rot === 90 ? b.h : b.w, h = rot === 90 ? b.w : b.h;
  return { x: l.x, y: l.y, w, h };
}

// יישור לשולחנות האחרים: קצוות ומרכזים, ועוד מרכז החדר.
// מחזיר גם את הקווים לציור וגם את ההיסט שצריך להחיל.
function snapDrag(tid, x, y) {
  const me = plan.tables.find(t => t.id === tid);
  const r = tableRect(me, { x, y, rot: (plan.layout[tid] || {}).rot });
  const xs = [], ys = [];
  plan.tables.forEach(t => {
    if (t.id === tid) return;
    const l = plan.layout[t.id]; if (!l) return;
    const o = tableRect(t, l);
    xs.push(o.x, o.x + o.w / 2, o.x + o.w);
    ys.push(o.y, o.y + o.h / 2, o.y + o.h);
  });
  xs.push(ROOM_W / 2); ys.push(ROOM_H / 2);

  const guides = [];
  let bx = null, by = null;
  [[r.x, 0], [r.x + r.w / 2, r.w / 2], [r.x + r.w, r.w]].forEach(([edge, off]) => {
    xs.forEach(v => {
      const d = Math.abs(edge - v);
      if (d <= SNAP && (bx === null || d < bx.d)) bx = { d, x: v - off, line: v };
    });
  });
  [[r.y, 0], [r.y + r.h / 2, r.h / 2], [r.y + r.h, r.h]].forEach(([edge, off]) => {
    ys.forEach(v => {
      const d = Math.abs(edge - v);
      if (d <= SNAP && (by === null || d < by.d)) by = { d, y: v - off, line: v };
    });
  });
  if (bx) { x = Math.round(bx.x); guides.push({ dir: 'v', at: bx.line }); }
  if (by) { y = Math.round(by.y); guides.push({ dir: 'h', at: by.line }); }

  // רווחים שווים: אם המרווח לשכן הקרוב שווה למרווח קיים אחר — נתפס אליו
  const eq = equalGap(tid, x, r);
  if (eq !== null) { x = eq.x; guides.push({ dir: 'gap', at: eq.mid, y: eq.y, text: eq.gap + 'px' }); }
  return { x, y, guides };
}

// מרווחים אופקיים בין השולחנות האחרים — מנסים לשמור על אותו רווח
function equalGap(tid, x, r) {
  const others = plan.tables.filter(t => t.id !== tid && plan.layout[t.id])
    .map(t => tableRect(t, plan.layout[t.id])).sort((a, b) => a.x - b.x);
  if (others.length < 2) return null;
  const gaps = [];
  for (let i = 1; i < others.length; i++) gaps.push(Math.round(others[i].x - (others[i - 1].x + others[i - 1].w)));
  const common = gaps.filter(g => g > 0).sort((a, b) => a - b)[0];
  if (!common) return null;
  for (const o of others) {
    const right = o.x + o.w + common;          // ממוקם מימין לשולחן קיים
    const left = o.x - common - r.w;           // או משמאלו
    for (const cand of [right, left]) {
      if (Math.abs(x - cand) <= SNAP) {
        const midX = cand > o.x ? o.x + o.w + common / 2 : cand + r.w + common / 2;
        return { x: Math.round(cand), mid: midX, y: o.y + o.h / 2, gap: common };
      }
    }
  }
  return null;
}

function drawGuides(list) {
  const g = document.getElementById('guides');
  if (!g) return;
  // הכל נמדד מהקצה השמאלי, כמו מיקום השולחנות והמושבים
  g.innerHTML = (list || []).map(a => {
    if (a.dir === 'v') return `<div class="gline v" style="left:${a.at}px"></div>`;
    if (a.dir === 'h') return `<div class="gline h" style="top:${a.at}px"></div>`;
    return `<div class="gap-tag" style="left:${a.at}px;top:${a.y}px">${esc(a.text)}</div>`;
  }).join('');
}

let drag = null;
function startDrag(ev, tid) {
  ev.preventDefault();
  if (built) pushUndo();
  const l = plan.layout[tid] || { x: 0, y: 0, rot: 0 };
  drag = { tid, sx: ev.clientX, sy: ev.clientY, ox: l.x, oy: l.y };
  window.addEventListener('pointermove', onDrag);
  window.addEventListener('pointerup', endDrag, { once: true });
}
function onDrag(ev) {
  if (!drag) return;
  const el = document.querySelector('.twrap[data-t="' + drag.tid + '"]');
  // המסך מציג את הדף מוקטן, אז מרחק העכבר מחולק ביחס ההקטנה
  const room = document.getElementById('room');
  const sc = room ? (room.getBoundingClientRect().width / ROOM_W) || 1 : 1;
  let x = Math.max(0, drag.ox + (ev.clientX - drag.sx) / sc);
  let y = Math.max(0, drag.oy + (ev.clientY - drag.sy) / sc);
  const snapped = snapDrag(drag.tid, x, y);            // הצמדה לקווי יישור
  x = snapped.x; y = snapped.y;
  drawGuides(snapped.guides);
  const cur = plan.layout[drag.tid] || { x: 0, y: 0, rot: 0 };
  moveMarksWithTable(drag.tid, x - cur.x, y - cur.y);   // הסמן נוסע עם השולחן
  plan.layout[drag.tid] = Object.assign(cur, { x, y });
  if (el) { el.style.left = x + 'px'; el.style.top = y + 'px'; }
}
function endDrag() { window.removeEventListener('pointermove', onDrag); drag = null; drawGuides([]); renderBoard(); }

// "סדר יפה": לוקח את הסידור הידני כמו שהוא, מקבץ שולחנות לשורות לפי
// הגובה שלהם, מיישר כל שורה לאותו קו, מפזר ברווחים שווים וממרכז בדף.
// הכוונה של הגננת נשמרת — רק הדיוק מתווסף.
function tidyLayout() {
  if (plan.tables.length < 2) return;
  pushUndo();
  const items = plan.tables.map(t => ({ t, l: plan.layout[t.id] || { x: 0, y: 0, rot: 0 } }))
    .map(o => ({ ...o, r: tableRect(o.t, o.l) }));

  // קיבוץ לשורות: שולחנות שמרכזיהם קרובים אנכית שייכים לאותה שורה
  const byY = items.slice().sort((a, b) => (a.r.y + a.r.h / 2) - (b.r.y + b.r.h / 2));
  const rows = [];
  byY.forEach(o => {
    const cy = o.r.y + o.r.h / 2;
    const row = rows.find(rw => Math.abs(rw.cy - cy) < Math.max(70, o.r.h * 0.6));
    if (row) { row.items.push(o); row.cy = (row.cy * (row.items.length - 1) + cy) / row.items.length; }
    else rows.push({ cy, items: [o] });
  });

  // כל שורה: מסודרת לפי X, רווח אחיד, ומיושרת למרכז אנכי משותף
  const GAPX = 30, GAPY = 34;
  const rowSizes = rows.map(rw => ({
    w: rw.items.reduce((s, o) => s + o.r.w, 0) + GAPX * (rw.items.length - 1),
    h: Math.max(...rw.items.map(o => o.r.h)),
  }));
  const totalH = rowSizes.reduce((s, r) => s + r.h, 0) + GAPY * (rows.length - 1);
  let y = Math.max(0, Math.round((ROOM_H - totalH) / 2));

  rows.forEach((rw, i) => {
    rw.items.sort((a, b) => a.r.x - b.r.x);
    let x = Math.max(0, Math.round((ROOM_W - rowSizes[i].w) / 2));
    const rowH = rowSizes[i].h;
    rw.items.forEach(o => {
      const nx = Math.round(x), ny = Math.round(y + (rowH - o.r.h) / 2);
      moveMarksWithTable(o.t.id, nx - o.l.x, ny - o.l.y);
      plan.layout[o.t.id] = Object.assign(o.l, { x: nx, y: ny });
      x += o.r.w + GAPX;
    });
    y += rowH + GAPY;
  });
  renderBoard();
  showOk('סודר — שורות ישרות ורווחים שווים');
}

/* ---------- שינוי שם שולחן ---------- */
function renameTable(tid) {
  const t = plan.tables.find(x => x.id === tid); if (!t) return;
  const el = document.querySelector(`.twrap[data-t="${tid}"] .tname`); if (!el) return;
  const inp = document.createElement('input');
  inp.className = 'tname-input'; inp.value = t.name; inp.maxLength = 22;
  el.replaceWith(inp); inp.focus(); inp.select();
  let done = false;
  const finish = save => {
    if (done) return; done = true;
    if (save) { const v = inp.value.trim(); if (v && v !== t.name) { pushUndo(); t.name = v; } }
    renderBoard();
  };
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  });
  inp.addEventListener('blur', () => finish(true));
  inp.addEventListener('pointerdown', e => e.stopPropagation());
}

/* ---------- גרירת ילד ---------- */
// מרכז הכיסא בקואורדינטות החדר, כולל סיבוב השולחן.
function seatCenter(t, seat) {
  const l = plan.layout[t.id] || { x: 0, y: 0, rot: 0 };
  const b = tableBox(t);
  const dx = (PAD + seat.x * S) - b.w / 2, dy = (PAD + seat.y * S) - b.h / 2;
  const a = (l.rot || 0) * Math.PI / 180;
  return { x: l.x + b.w / 2 + dx * Math.cos(a) - dy * Math.sin(a),
           y: l.y + b.h / 2 + dx * Math.sin(a) + dy * Math.cos(a) };
}
// המרת מיקום העכבר לקואורדינטות הדף.
// המושבים ממוקמים ב-CSS לפי left — מהקצה השמאלי — גם כשהאתר מימין לשמאל,
// כי getBoundingClientRect מחזיר תמיד קופסה פיזית. יחס ההקטנה נגזר מהמדידה
// עצמה ולא ממשתנה, כדי שיעבוד גם אם הדפדפן מוסיף זום משלו.
function roomPoint(ev) {
  const room = document.getElementById('room');
  const r = room.getBoundingClientRect();
  const sc = (r.width / (room.offsetWidth || ROOM_W)) || 1;
  return { x: (ev.clientX - r.left) / sc, y: (ev.clientY - r.top) / sc, sc };
}

// זיהוי הכיסא: קודם מה שנמצא ממש מתחת לסמן (חסין להקטנה ולכיווניות),
// ואם אין — הכיסא הקרוב ביותר ברדיוס משיכה. שני רדיוסים שונים לתפיסה
// ולשחרור, כדי שהסימון לא יהבהב כשהיד רועדת על הגבול.
const SNAP_GRAB = 38, SNAP_RELEASE = 52;
function seatAt(ev, current) {
  const el = document.elementFromPoint(ev.clientX, ev.clientY);
  const hit = el && el.closest ? el.closest('.seat') : null;
  if (hit && hit.dataset.k) return hit.dataset.k;

  const p = roomPoint(ev);
  let best = null;
  plan.tables.forEach(t => {
    tplOf(t).seats.forEach(s => {
      const c = seatCenter(t, s);
      const d = Math.hypot(c.x - p.x, c.y - p.y);
      const limit = (current === E.key(t.id, s.id)) ? SNAP_RELEASE : SNAP_GRAB;
      if (d <= limit && (!best || d < best.d)) best = { d, key: E.key(t.id, s.id) };
    });
  });
  return best ? best.key : null;
}

let childDrag = null;
function nameOf(cid) { return (enginePlan().people[cid] || {}).name || ''; }

function startChildDrag(ev, kind, id) {
  const who = kind === 'seat' ? plan.seats[id] : id;
  if (!who) { tapSeat(id); return; }          // כיסא ריק — התנהגות הקשה רגילה
  ev.preventDefault(); ev.stopPropagation();
  // תפיסת הסמן: הגרירה נשארת שלנו גם אם האצבע יוצאת מהאלמנט או מהחלון
  try { ev.currentTarget.setPointerCapture(ev.pointerId); } catch (e) {}
  childDrag = {
    kind, id, who, pid: ev.pointerId, sx: ev.clientX, sy: ev.clientY,
    moved: false, target: null,
    // באצבע צריך שהיית-מגע כדי שגלילה של העמוד לא תיהפך בטעות לגרירה
    slop: ev.pointerType === 'touch' ? 10 : 5,
    t0: Date.now(), touch: ev.pointerType === 'touch'
  };
  window.addEventListener('pointermove', onChildDrag);
  window.addEventListener('pointerup', endChildDrag, { once: true });
  window.addEventListener('pointercancel', endChildDrag, { once: true });
}

function onChildDrag(ev) {
  if (!childDrag || ev.pointerId !== childDrag.pid) return;
  const dist = Math.hypot(ev.clientX - childDrag.sx, ev.clientY - childDrag.sy);
  if (!childDrag.moved) {
    if (dist < childDrag.slop) return;
    if (childDrag.touch && Date.now() - childDrag.t0 < 200) { childDrag = null; return; }
    childDrag.moved = true;
    selectedSeat = null;      // גרירה מבטלת בחירה קודמת, אחרת נשאר עיגול תקוע
    document.getElementById('room').classList.add('drag-live');
    const g = document.createElement('div');
    g.className = 'dragghost'; g.id = 'dragghost';
    g.textContent = nameOf(childDrag.who);
    document.body.appendChild(g);
    // המקור נשאר חצי-שקוף כדי שיהיה ברור מאיפה באנו
    if (childDrag.kind === 'seat') {
      const el = document.querySelector(`.seat[data-k="${childDrag.id}"]`);
      if (el) el.classList.add('from');
    }
    // כל הכיסאות הפנויים מסומנים — רואים מיד לאן אפשר להניח
    document.querySelectorAll('.seat').forEach(el => {
      if (!plan.seats[el.dataset.k] && !plan.locks[el.dataset.k]) el.classList.add('open');
    });
  }
  const g = document.getElementById('dragghost');
  if (g) { g.style.left = (ev.clientX - 27) + 'px'; g.style.top = (ev.clientY - 27) + 'px'; }

  // המושב הקרוב, עם השהיה בשחרור כדי שהסימון לא יהבהב על הגבול
  const key = seatAt(ev, childDrag.target);
  if (key === childDrag.target) return;
  clearTarget();
  childDrag.target = key;
  if (!key) return;
  const el = document.querySelector(`.seat[data-k="${key}"]`);
  if (!el) return;
  el.classList.add('target');
  if (plan.seats[key] && plan.seats[key] !== childDrag.who) el.classList.add('swap');
  else if (!plan.seats[key]) {
    // תצוגה מקדימה של השם בתוך הכיסא, כדי שהתוצאה תיראה לפני השחרור
    el.innerHTML = `<span class="preview">${esc(nameOf(childDrag.who))}</span>`;
  }
}
function clearTarget() {
  document.querySelectorAll('.seat.target').forEach(el => {
    el.classList.remove('target', 'swap');
    const pv = el.querySelector('.preview'); if (pv) pv.remove();
  });
}

function endChildDrag(ev) {
  window.removeEventListener('pointermove', onChildDrag);
  const g = document.getElementById('dragghost'); if (g) g.remove();
  const room = document.getElementById('room');
  if (room) room.classList.remove('drag-live');
  clearTarget();
  document.querySelectorAll('.seat.open,.seat.from').forEach(el => el.classList.remove('open', 'from'));
  const d = childDrag; childDrag = null;
  if (!d) return;
  if (!d.moved) { if (d.kind === 'seat') tapSeat(d.id); return; }   // לא זז — הקשה
  if (ev.type === 'pointercancel') { renderBoard(); return; }

  const key = d.target;
  if (key && plan.locks[key]) { showErr('המקום נעול — קליק ימני משחרר'); renderBoard(); return; }

  pushUndo();
  const p = roomPoint(ev);
  plan.parked = plan.parked || {};
  if (d.kind === 'seat') delete plan.seats[d.id]; else delete plan.parked[d.who];

  let msg;
  if (key) {
    const sitting = plan.seats[key];
    if (sitting && sitting !== d.who) {
      // החלפה הדדית — מי שישב שם עובר למקום שהתפנה, ולא נדחק הלאה
      if (d.kind === 'seat') plan.seats[d.id] = sitting;
      else plan.parked[sitting] = { x: Math.round(p.x - 27), y: Math.round(p.y - 27) };
      msg = `${nameOf(d.who)} ו${nameOf(sitting)} התחלפו`;
    } else {
      msg = `${nameOf(d.who)} הושב`;
    }
    plan.seats[key] = d.who;
  } else {
    plan.parked[d.who] = { x: Math.max(0, Math.round(p.x - 27)), y: Math.max(0, Math.round(p.y - 27)) };
    msg = `${nameOf(d.who)} מחכה בצד`;
  }
  renderBoard();
  if (key) {
    const el = document.querySelector(`.seat[data-k="${key}"]`);
    if (el) el.classList.add('landed');
  }
  showUndo(msg);
}

// ---- ביטול ----
// צילום של כל מה שאפשר לשנות ביד: מי יושב איפה, מי בצד, איפה השולחנות
// ובאיזו זווית, איפה הסמנים, השמות, ואילו חריגות אושרו. כך החץ מבטל את
// הפעולה האחרונה יהיה אשר תהיה, ולא רק העברת ילד.
let undoStack = [], undoTimer = null;
function snapshot() {
  return JSON.stringify({
    seats: plan.seats, parked: plan.parked || {}, layout: plan.layout,
    marks: plan.marks || {}, okRules: plan.okRules || {},
    names: plan.tables.map(t => t.name),
  });
}
function pushUndo() {
  const s = snapshot();
  if (undoStack[undoStack.length - 1] === s) return;   // בלי כפילויות
  undoStack.push(s);
  if (undoStack.length > 40) undoStack.shift();
}
function showUndo(msg) {
  const old = document.getElementById('undoBar'); if (old) old.remove();
  clearTimeout(undoTimer);
  const b = document.createElement('div');
  b.className = 'undo'; b.id = 'undoBar';
  b.innerHTML = `<span>${esc(msg)}</span><button onclick="undoMove()">ביטול</button>`;
  document.body.appendChild(b);
  undoTimer = setTimeout(() => b.remove(), 6000);
}
function undoMove() {
  const s = undoStack.pop(); if (!s) return;
  const p = JSON.parse(s);
  plan.seats = p.seats; plan.parked = p.parked; plan.layout = p.layout;
  plan.marks = p.marks; plan.okRules = p.okRules;
  (p.names || []).forEach((n, i) => { if (plan.tables[i]) plan.tables[i].name = n; });
  selectedSeat = null;
  const b = document.getElementById('undoBar'); if (b) b.remove();
  renderBoard();
}

function parkedHtml() {
  const ep = enginePlan();
  return Object.keys(plan.parked || {}).map(cid => {
    const m = plan.parked[cid];
    return `<div class="parked" style="left:${m.x}px;top:${m.y}px"
      onpointerdown="startChildDrag(event,'park','${cid}')"
      title="בצד — לגרור אל כיסא">${esc((ep.people[cid] || {}).name || '')}</div>`;
  }).join('');
}

// לחיצה על רקע החדר משחררת בחירה תקועה — אין דרך להישאר "באמצע פעולה"
function clearSel(ev) {
  if (!selectedSeat) return;
  if (ev.target.closest && ev.target.closest('.seat,.parked,.pmark,.tlabel')) return;
  selectedSeat = null; renderBoard();
}

function tapSeat(k) {
  if (drag) return;
  if (!selectedSeat) { if (plan.seats[k]) { selectedSeat = k; renderBoard(); } return; }
  if (selectedSeat === k) { selectedSeat = null; renderBoard(); return; }
  if (plan.locks[selectedSeat] || plan.locks[k]) { showErr('אחד המקומות נעול — קליק ימני משחרר'); selectedSeat = null; renderBoard(); return; }
  pushUndo();
  const a = plan.seats[selectedSeat], b = plan.seats[k];
  if (b) plan.seats[selectedSeat] = b; else delete plan.seats[selectedSeat];
  plan.seats[k] = a; selectedSeat = null; renderBoard();
  showUndo(b ? `${nameOf(a)} ו${nameOf(b)} התחלפו` : `${nameOf(a)} הושב`);
}
function toggleLock(k) {
  if (!plan.seats[k]) return;
  pushUndo();
  if (plan.locks[k]) delete plan.locks[k]; else plan.locks[k] = plan.seats[k];
  renderBoard();
}
function killRule(id) { const r = plan.rules.find(x => x.id === id); if (r) r.active = false; renderBoard(); }
function reSolve() {
  pushUndo();
  const res = E.solve(enginePlan(), tplOf, { split: plan.split, locks: plan.locks, prefer: preferMap() });
  if (!res.ok) { showErr('לא נמצא סידור טוב יותר עם הכללים הנוכחיים'); return; }
  plan.seats = res.seats; plan.parked = {}; renderBoard(); showOk('סודר מחדש');
}

/* ---------- שמירה ---------- */
async function savePlan() {
  try { await api.saveSeatingPlan(plan); showOk('הסידור נשמר'); }
  catch (e) { showErr('השמירה נכשלה: ' + e.message); }
}
/* ---------- חלון בתוך העמוד ---------- */
function openModal(title, sub, body, actions) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalSub').textContent = sub || '';
  document.getElementById('modalBody').innerHTML = body || '';
  document.getElementById('modalActions').innerHTML = actions || '';
  document.getElementById('modalOv').classList.add('show');
}
function closeModal() { document.getElementById('modalOv').classList.remove('show'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function saveVersion() {
  const def = 'גרסה מ-' + new Date().toLocaleDateString('he-IL');
  openModal('שמירת גרסה', 'הגרסה נשמרת בנפרד, ואפשר לחזור אליה בכל זמן.',
    `<input type="text" id="verName" value="${esc(def)}">`,
    `<button class="btn" onclick="doSaveVersion()">שמירה</button>
     <button class="btn ghost" onclick="closeModal()">ביטול</button>`);
  setTimeout(() => { const el = document.getElementById('verName'); if (el) { el.focus(); el.select(); } }, 60);
}
async function doSaveVersion() {
  const note = (document.getElementById('verName') || {}).value || '';
  if (!note.trim()) { showErr('צריך לתת שם לגרסה'); return; }
  closeModal();
  try { await api.saveSeatingPlan(plan); await api.saveSeatingVersion(plan, note.trim()); showOk('נשמרה גרסה'); }
  catch (e) { showErr('שמירת הגרסה נכשלה: ' + e.message); }
}

let savedPlans = [];
async function loadExisting() {
  openModal('סידורים שמורים', '', '<div class="empty-note">טוען…</div>',
    `<button class="btn ghost" onclick="closeModal()">סגירה</button>`);
  try {
    const r = await api.getSeatingPlans();
    savedPlans = (r && r.plans) || [];
    renderPlanList();
  } catch (e) {
    document.getElementById('modalBody').innerHTML =
      `<div class="empty-note">הטעינה נכשלה: ${esc(e.message)}</div>`;
  }
}
function renderPlanList() {
  const body = savedPlans.length
    ? savedPlans.map((p, i) => {
        const seats = Object.keys((p.plan && p.plan.seats) || {}).length;
        const when = (p.updated || '').slice(0, 10).split('-').reverse().join('.');
        return `<div class="plan-row" onclick="openPlan(${i})">
          <div><div class="nm">${esc(p.name)}</div>
            <div class="meta">${seats ? seats + ' מקומות' : 'טרם נוצר סידור'}${when ? ' · ' + when : ''}</div></div>
          <button class="rm" onclick="event.stopPropagation();removePlan(${i})">הסר</button>
        </div>`;
      }).join('')
    : `<div class="empty-note">אין עדיין סידורים שמורים.<br>סגרי את החלון, בני סידור ולחצי "שמירה".</div>`;
  document.getElementById('modalBody').innerHTML = body;
}
function openPlan(i) {
  const p = savedPlans[i]; if (!p) return;
  closeModal();
  plan = Object.assign(newPlan(), p.plan);
  plan.layout = plan.layout || {};
  if (Object.keys(plan.seats || {}).length) {
    if (!Object.keys(plan.layout).length) autoLayout('row', true);
    built = true;
    document.getElementById('wizard').classList.add('hide');
    document.getElementById('steps').classList.add('hide');
    document.getElementById('board').classList.remove('hide');
    renderTop(); renderBoard();
  } else { built = false; renderTop(); goStep(1); }
  showOk('נטען: ' + plan.name);
}
// מחיקה בלי שאלה — הסידור עובר לפח וניתן לשחזור.
async function removePlan(i) {
  const p = savedPlans[i]; if (!p) return;
  savedPlans.splice(i, 1); renderPlanList();
  try { await api.deleteSeatingPlan(p.id); showOk('הוסר · ניתן לשחזור מהפח'); }
  catch (e) { showErr('ההסרה נכשלה: ' + e.message); }
}

function showErr(m) { const el = document.getElementById('error'); el.textContent = m; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 5000); }
function showOk(m) { const el = document.getElementById('success'); el.textContent = m; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 3000); }

boot();
</script>
