<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>הורים ודמי לימוד — מערכת גנים</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Heebo',sans-serif;
      background:#F4EFE6;
      color:#3D3228;
      direction:rtl;
      min-height:100vh;
      padding:30px 20px;
    }
    .container { max-width:1200px; margin:0 auto; }
    .tabs { display:flex; gap:10px; margin-bottom:30px; border-bottom:2px solid #e8e4de; }
    .tab { padding:12px 20px; background:none; border:none; cursor:pointer; font-family:'Heebo'; font-weight:600; color:#9B8E82; }
    .tab.active { color:#1F3D34; border-bottom:3px solid #C4846C; }
    .tab-content { display:none; }
    .tab-content.active { display:block; }
    .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:25px; }
    .header h2 { font-size:22px; color:#1F3D34; }
    .btn-add { background:#1F3D34; color:#FFF; border:none; padding:10px 20px; border-radius:10px; cursor:pointer; font-family:'Heebo'; font-weight:600; font-size:13px; }
    .form-container { background:#FFF; border-radius:16px; padding:25px; box-shadow:0 2px 12px rgba(0,0,0,0.05); margin-bottom:25px; display:none; }
    .form-container.show { display:block; }
    .form-group { margin-bottom:15px; }
    label { display:block; font-size:12px; color:#3D3228; font-weight:600; margin-bottom:6px; }
    input, select { width:100%; padding:10px 12px; border:1px solid #e8e4de; border-radius:8px; font-family:'Heebo'; font-size:13px; outline:none; direction:ltr; text-align:right; }
    input:focus, select:focus { border-color:#1F3D34; }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:15px; }
    .btn-submit { background:#1F3D34; color:#FFF; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; font-family:'Heebo'; font-weight:600; }
    table { width:100%; border-collapse:collapse; background:#FFF; border-radius:16px; overflow:hidden; box-shadow:0 2px 12px rgba(0,0,0,0.05); }
    th { background:#1F3D34; color:#FFF; padding:12px; font-weight:600; font-size:12px; text-align:right; }
    td { padding:12px; border-bottom:1px solid #f0ece6; font-size:12px; }
    tr:hover td { background:#FAF8F4; }
    .badge { display:inline-block; padding:3px 10px; border-radius:15px; font-size:11px; font-weight:600; }
    .badge-pending { background:#fff3cd; color:#856404; }
    .badge-paid { background:#d4edda; color:#155724; }
    .badge-overdue { background:#f8d7da; color:#721c24; }
    .actions { display:flex; gap:6px; }
    .btn-mark-paid { padding:5px 10px; border:none; border-radius:6px; cursor:pointer; font-size:11px; background:#27ae60; color:#FFF; }
    .btn-delete { padding:5px 10px; border:none; border-radius:6px; cursor:pointer; font-size:11px; background:#e74c3c; color:#FFF; }
    .error { background:#fdf0ef; color:#c94147; padding:10px; border-radius:10px; margin-bottom:15px; display:none; }
    .error.show { display:block; }
    .success { background:#d4edda; color:#155724; padding:10px; border-radius:10px; margin-bottom:15px; display:none; }
    .success.show { display:block; }
    .stats { display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom:25px; }
    .stat { background:#FFF; border-radius:12px; padding:15px; box-shadow:0 2px 12px rgba(0,0,0,0.05); }
    .stat-label { font-size:12px; color:#9B8E82; margin-bottom:5px; }
    .stat-value { font-size:20px; font-weight:700; color:#1F3D34; }
    .loading { text-align:center; padding:30px; color:#9B8E82; }
    .back-link { display:inline-block; margin-bottom:20px; color:#1F3D34; text-decoration:none; font-weight:600; font-size:13px; }
  </style>
</head>
<body>

<div class="container">
  <a href="dashboard.html" class="back-link">← חזור לעמוד הבית</a>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('tuition')">💰 דמי לימוד</button>
    <button class="tab" onclick="switchTab('parents')">👨‍👩‍👧 הורים</button>
  </div>

  <div id="error" class="error"></div>
  <div id="success" class="success"></div>

  <!-- TUITION TAB -->
  <div id="tuition" class="tab-content active">
    <div class="header">
      <h2>ניהול דמי לימוד</h2>
      <button class="btn-add" onclick="toggleTuitionForm()">+ דמי לימוד חדשים</button>
    </div>

    <div id="tuitionForm" class="form-container">
      <h3 style="margin-bottom:15px;">הוסף דמי לימוד</h3>
      <form id="tuitionFormElement">
        <div class="form-row">
          <div class="form-group">
            <label for="tuitionChild">בחרו ילד *</label>
            <select id="tuitionChild" required>
              <option value="">-- בחרו --</option>
            </select>
          </div>
          <div class="form-group">
            <label for="tuitionParent">הורה *</label>
            <select id="tuitionParent" required>
              <option value="">-- בחרו --</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="tuitionAmount">סכום *</label>
            <input type="number" id="tuitionAmount" step="0.01" required>
          </div>
          <div class="form-group">
            <label for="tuitionDue">תאריך יעד *</label>
            <input type="date" id="tuitionDue" required>
          </div>
        </div>
        <button type="submit" class="btn-submit">שמור</button>
        <button type="button" class="btn-submit" style="background:#999;" onclick="toggleTuitionForm()">ביטול</button>
      </form>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">סה״כ ממתין</div>
        <div class="stat-value" id="totalPending">₪0</div>
      </div>
      <div class="stat">
        <div class="stat-label">מספר דמים ממתינים</div>
        <div class="stat-value" id="countPending">0</div>
      </div>
    </div>

    <div id="tuitionTable" class="loading">טוען...</div>
  </div>

  <!-- PARENTS TAB -->
  <div id="parents" class="tab-content">
    <div class="header">
      <h2>ניהול הורים</h2>
      <button class="btn-add" onclick="toggleParentForm()">+ הורה חדש</button>
    </div>

    <div id="parentForm" class="form-container">
      <h3 style="margin-bottom:15px;">הוסף הורה לילד</h3>
      <form id="parentFormElement">
        <div class="form-group">
          <label for="parentChild">בחרו ילד *</label>
          <select id="parentChild" required onchange="selectParentChild()">
            <option value="">-- בחרו --</option>
          </select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="parentName">שם *</label>
            <input type="text" id="parentName" required>
          </div>
          <div class="form-group">
            <label for="parentRelation">קשר *</label>
            <select id="parentRelation" required>
              <option value="mother">אם</option>
              <option value="father">אב</option>
              <option value="guardian">אפוטרופוס</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="parentPhone">טלפון</label>
            <input type="tel" id="parentPhone">
          </div>
          <div class="form-group">
            <label for="parentEmail">דוא״ל</label>
            <input type="email" id="parentEmail">
          </div>
        </div>
        <div class="form-group" style="display:flex; align-items:center;">
          <input type="checkbox" id="parentPrimary" style="width:auto; margin-left:10px;">
          <label for="parentPrimary" style="margin:0;">זהו ההורה הראשי (לחיוב)</label>
        </div>
        <button type="submit" class="btn-submit">שמור</button>
        <button type="button" class="btn-submit" style="background:#999;" onclick="toggleParentForm()">ביטול</button>
      </form>
    </div>

    <div id="parentTable" class="loading">טוען...</div>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/api.js"></script>
<script>
let children = [];
let parents = [];
let tuition = [];
let selectedChildId = null;

async function loadChildren() {
  try {
    const res = await api.getChildren();
    if (res.success) {
      children = res.data.filter(c => c.status === 'active');
      populateChildSelects();
    }
  } catch (err) {
    console.error('Error loading children:', err);
  }
}

function populateChildSelects() {
  const selects = ['tuitionChild', 'parentChild'];
  selects.forEach(id => {
    const select = document.getElementById(id);
    select.innerHTML = '<option value="">-- בחרו --</option>';
    children.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.id;
      opt.textContent = `${c.first_name_he} ${c.last_name_he}`;
      select.appendChild(opt);
    });
  });
}

async function loadParentsByChild(childId) {
  try {
    const res = await api.getParents(childId);
    if (res.success) {
      parents = res.data;
      populateParentSelect(childId);
    }
  } catch (err) {
    console.error('Error loading parents:', err);
  }
}

function populateParentSelect(childId) {
  const select = document.getElementById('tuitionParent');
  select.innerHTML = '<option value="">-- בחרו --</option>';
  parents.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.id;
    opt.textContent = p.full_name_he;
    select.appendChild(opt);
  });
}

async function loadTuition() {
  try {
    const res = await api.getTuition();
    if (res.success) {
      tuition = res.data;
      const pending = tuition.filter(t => t.status === 'pending');
      const total = pending.reduce((sum, t) => sum + parseFloat(t.amount || 0), 0);
      document.getElementById('totalPending').textContent = formatCurrency(total);
      document.getElementById('countPending').textContent = pending.length;
      renderTuitionTable();
    }
  } catch (err) {
    showError('שגיאה בטעינת דמי לימוד: ' + err.message);
  }
}

function renderTuitionTable() {
  if (!tuition.length) {
    document.getElementById('tuitionTable').innerHTML = '<p style="padding:20px; text-align:center;">אין דמי לימוד</p>';
    return;
  }

  const rows = tuition.map(t => `
    <tr>
      <td>${t.child_name}</td>
      <td>${t.parent_name}</td>
      <td>${formatCurrency(t.amount)}</td>
      <td>${formatDate(t.due_date)}</td>
      <td><span class="badge badge-${t.status}">${t.status === 'pending' ? 'ממתין' : t.status === 'paid' ? 'שולם' : 'אחר'}</span></td>
      <td>
        <div class="actions">
          ${t.status !== 'paid' ? `<button class="btn-mark-paid" onclick="markTuitionPaid('${t.id}')">סימון כשולם</button>` : ''}
          <button class="btn-delete" onclick="deleteTuition('${t.id}')">מחק</button>
        </div>
      </td>
    </tr>
  `).join('');

  document.getElementById('tuitionTable').innerHTML = `
    <table>
      <thead><tr>
        <th>ילד</th>
        <th>הורה</th>
        <th>סכום</th>
        <th>תאריך יעד</th>
        <th>סטטוס</th>
        <th>פעולות</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

async function loadParentsTable() {
  try {
    const res = await api.getParents();
    if (res.success) {
      renderParentsTable(res.data);
    }
  } catch (err) {
    showError('שגיאה בטעינת הורים: ' + err.message);
  }
}

function renderParentsTable(parentsList) {
  if (!parentsList.length) {
    document.getElementById('parentTable').innerHTML = '<p style="padding:20px; text-align:center;">אין הורים</p>';
    return;
  }

  const rows = parentsList.map(p => `
    <tr>
      <td>${p.full_name_he}</td>
      <td>${p.phone || '-'}</td>
      <td>${p.email || '-'}</td>
      <td>${p.relationship_type === 'mother' ? 'אם' : p.relationship_type === 'father' ? 'אב' : 'אפוטרופוס'}</td>
      <td><span class="badge" style="background:${p.is_primary ? '#d4edda' : '#f5f5f5'}; color:${p.is_primary ? '#155724' : '#666'};">${p.is_primary ? 'ראשי' : 'משני'}</span></td>
    </tr>
  `).join('');

  document.getElementById('parentTable').innerHTML = `
    <table>
      <thead><tr>
        <th>שם</th>
        <th>טלפון</th>
        <th>דוא״ל</th>
        <th>קשר</th>
        <th>סוג</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.querySelector(`[onclick="switchTab('${tab}')"]`).classList.add('active');
  document.getElementById(tab).classList.add('active');
  if (tab === 'parents') loadParentsTable();
}

function toggleTuitionForm() {
  document.getElementById('tuitionForm').classList.toggle('show');
}

function toggleParentForm() {
  document.getElementById('parentForm').classList.toggle('show');
}

function selectParentChild() {
  selectedChildId = document.getElementById('parentChild').value;
  if (selectedChildId) {
    loadParentsByChild(selectedChildId);
  }
}

document.getElementById('tuitionChild').addEventListener('change', (e) => {
  if (e.target.value) {
    loadParentsByChild(e.target.value);
  }
});

document.getElementById('tuitionFormElement').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    const data = {
      child_id: document.getElementById('tuitionChild').value,
      parent_id: document.getElementById('tuitionParent').value,
      amount: parseFloat(document.getElementById('tuitionAmount').value),
      due_date: document.getElementById('tuitionDue').value,
    };
    await api.createTuition(data);
    showSuccess('דמי לימוד נוספו בהצלחה');
    toggleTuitionForm();
    document.getElementById('tuitionFormElement').reset();
    loadTuition();
  } catch (err) {
    showError('שגיאה: ' + err.message);
  }
});

document.getElementById('parentFormElement').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    const data = {
      child_id: document.getElementById('parentChild').value,
      full_name_he: document.getElementById('parentName').value,
      phone: document.getElementById('parentPhone').value || null,
      email: document.getElementById('parentEmail').value || null,
      relationship_type: document.getElementById('parentRelation').value,
      is_primary: document.getElementById('parentPrimary').checked,
    };
    await api.createParent(data);
    showSuccess('הורה נוסף בהצלחה');
    toggleParentForm();
    document.getElementById('parentFormElement').reset();
    loadParentsTable();
  } catch (err) {
    showError('שגיאה: ' + err.message);
  }
});

async function markTuitionPaid(id) {
  try {
    await api.updateTuition(id, { status: 'paid' });
    showSuccess('דמים סומנו כשולמים');
    loadTuition();
  } catch (err) {
    showError('שגיאה: ' + err.message);
  }
}

async function deleteTuition(id) {
  if (!confirm('מחק דמי לימוד?')) return;
  try {
    // Note: no delete, update status
    showError('שלוך לא זמין, יש לערוך ידנית');
  } catch (err) {
    showError('שגיאה: ' + err.message);
  }
}

loadChildren();
loadTuition();
</script>

</body>
</html>
