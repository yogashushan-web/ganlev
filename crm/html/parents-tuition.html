<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>הורים — מערכת גנים</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Heebo',sans-serif; background:#F4EFE6; color:#3D3228; direction:rtl; min-height:100vh; }
    .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; flex-wrap:wrap; gap:12px; }
    .header h1 { font-size:26px; color:#1F3D34; }
    .btn-add { background:#1F3D34; color:#FFF; border:none; padding:12px 22px; border-radius:10px; cursor:pointer; font-family:'Heebo'; font-weight:700; }
    .btn-add:hover { background:#154428; }
    .toolbar { display:flex; gap:10px; align-items:center; margin-bottom:18px; flex-wrap:wrap; }
    .toolbar input { padding:10px 14px; border:1.5px solid #e3ddd2; border-radius:10px; font-family:'Heebo'; font-size:14px; outline:none; min-width:260px; }
    .toolbar input:focus { border-color:#1F3D34; }
    .count-pill { background:#fff; border-radius:20px; padding:8px 16px; font-size:13px; box-shadow:0 2px 8px rgba(0,0,0,.05); font-weight:600; color:#1F3D34; }
    .form-container { background:#FFF; border-radius:16px; padding:26px; box-shadow:0 2px 12px rgba(0,0,0,0.05); margin-bottom:24px; display:none; }
    .form-container.show { display:block; }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .form-group { margin-bottom:16px; }
    label { display:block; font-size:12px; color:#3D3228; font-weight:700; margin-bottom:6px; }
    input { width:100%; padding:11px 13px; border:1px solid #e8e4de; border-radius:10px; font-family:'Heebo'; font-size:14px; outline:none; text-align:right; }
    input:focus { border-color:#1F3D34; }
    .btn-submit { background:#1F3D34; color:#FFF; border:none; padding:12px 24px; border-radius:10px; cursor:pointer; font-family:'Heebo'; font-weight:700; }
    .btn-cancel { background:#f0ece6; color:#333; border:none; padding:12px 24px; border-radius:10px; cursor:pointer; font-family:'Heebo'; margin-right:10px; }
    .error { background:#fdf0ef; color:#c94147; padding:12px; border-radius:10px; margin-bottom:16px; display:none; }
    .error.show { display:block; }
    .success { background:#d4edda; color:#155724; padding:12px; border-radius:10px; margin-bottom:16px; display:none; }
    .success.show { display:block; }
    .tbl-wrap { overflow-x:auto; border-radius:16px; box-shadow:0 2px 12px rgba(0,0,0,0.05); }
    table { width:100%; border-collapse:collapse; background:#FFF; }
    th { background:#1F3D34; color:#FFF; padding:12px 14px; font-weight:600; font-size:12px; text-align:right; white-space:nowrap; }
    td { padding:11px 14px; border-bottom:1px solid #f0ece6; font-size:13px; }
    tr:last-child td { border-bottom:none; }
    tr:hover td { background:#FAF8F4; }
    td.ltr { direction:ltr; text-align:right; }
    a.tel { color:#1F7a4f; text-decoration:none; font-weight:600; }
    .muted { color:#c4bcae; }
    .btn-edit, .btn-delete { padding:6px 11px; border:none; border-radius:8px; cursor:pointer; font-size:12px; font-family:'Heebo'; }
    .btn-edit { background:#C4846C; color:#FFF; }
    .btn-delete { background:#e74c3c; color:#FFF; }
    .loading { text-align:center; padding:40px; color:#9B8E82; }
  </style>
</head>
<body>

  <div class="header">
    <h1>👨‍👩‍👧 הורים</h1>
    <button class="btn-add" onclick="toggleForm()">+ הוסף הורה</button>
  </div>

  <div class="toolbar">
    <input type="text" id="search" placeholder="🔍 חיפוש לפי שם / טלפון / עיסוק...">
    <span class="count-pill" id="countPill">—</span>
  </div>

  <div id="error" class="error"></div>
  <div id="success" class="success"></div>

  <div id="form" class="form-container">
    <h2 style="margin-bottom:18px; color:#1F3D34;">הוסף / ערוך הורה</h2>
    <form id="parentForm">
      <div class="form-row">
        <div class="form-group"><label>שם *</label><input type="text" id="pName" required></div>
        <div class="form-group"><label>מספר טלפון נייד</label><input type="tel" id="pPhone" dir="ltr"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>כתובת</label><input type="text" id="pAddress"></div>
        <div class="form-group"><label>עיסוק</label><input type="text" id="pOccupation"></div>
      </div>
      <div style="display:flex; gap:10px; margin-top:8px;">
        <button type="submit" class="btn-submit">שמור</button>
        <button type="button" class="btn-cancel" onclick="toggleForm()">ביטול</button>
      </div>
    </form>
  </div>

  <div id="table" class="loading">טוען...</div>

<script src="js/common.js?v=5"></script>
<script src="js/api.js?v=5"></script>
<script>
let parents = [];
let editingId = null;

async function loadParents() {
  try {
    const res = await api.getParents();
    if (res.success) { parents = res.data || []; renderTable(); }
  } catch (err) { showError('שגיאה בטעינת ההורים: ' + err.message); }
}

function renderTable() {
  const q = (document.getElementById('search').value || '').trim();
  const list = q ? parents.filter(p =>
    ((p.full_name_he || '') + ' ' + (p.phone || '') + ' ' + (p.occupation || '') + ' ' + (p.address || '')).includes(q)) : parents;
  document.getElementById('countPill').textContent = list.length + ' הורים';

  if (!list.length) {
    document.getElementById('table').innerHTML = '<p style="padding:24px; color:#9B8E82; text-align:center;">אין הורים עדיין. אפשר להוסיף.</p>';
    return;
  }

  const rows = list.map(p => `
    <tr>
      <td><b>${p.full_name_he || ''}</b></td>
      <td class="ltr">${p.phone ? `<a class="tel" href="${waHref(p.phone)}" target="_blank">💬 ${p.phone}</a>` : '<span class="muted">-</span>'}</td>
      <td>${p.address || '<span class="muted">-</span>'}</td>
      <td>${p.occupation || '<span class="muted">-</span>'}</td>
      <td style="display:flex; gap:6px;">
        <button class="btn-edit" onclick="editParent('${p.id}')">ערוך</button>
        <button class="btn-delete" onclick="deleteParent('${p.id}')">מחק</button>
      </td>
    </tr>`).join('');

  document.getElementById('table').innerHTML = `
    <div class="tbl-wrap"><table>
      <thead><tr><th>שם</th><th>מספר טלפון נייד</th><th>כתובת</th><th>עיסוק</th><th>פעולות</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
}

document.getElementById('search').addEventListener('input', renderTable);

function toggleForm() {
  const f = document.getElementById('form');
  f.classList.toggle('show');
  if (!f.classList.contains('show')) resetForm();
}
function resetForm() { document.getElementById('parentForm').reset(); editingId = null; }

function editParent(id) {
  const p = parents.find(x => x.id === id);
  if (!p) return;
  editingId = id;
  document.getElementById('pName').value = p.full_name_he || '';
  document.getElementById('pPhone').value = p.phone || '';
  document.getElementById('pAddress').value = p.address || '';
  document.getElementById('pOccupation').value = p.occupation || '';
  document.getElementById('form').classList.add('show');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function deleteParent(id) {
  if (!confirm('למחוק את ההורה?')) return;
  try {
    const res = await api.deleteParent(id);
    if (res.success) { showSuccess('ההורה נמחק'); loadParents(); }
  } catch (err) { showError('שגיאה במחיקה: ' + err.message); }
}

document.getElementById('parentForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const data = {
    full_name_he: document.getElementById('pName').value,
    phone: document.getElementById('pPhone').value || null,
    address: document.getElementById('pAddress').value || null,
    occupation: document.getElementById('pOccupation').value || null,
  };
  try {
    const res = editingId ? await api.updateParent(editingId, data) : await api.createParent(data);
    if (res.success) { showSuccess(editingId ? 'ההורה עודכן' : 'ההורה נוסף'); toggleForm(); resetForm(); loadParents(); }
  } catch (err) { showError('שגיאה: ' + err.message); }
});

loadParents();
</script>

</body>
</html>
