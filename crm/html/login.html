<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>כניסה — גן לב</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html { -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
    body {
      font-family:'Heebo',sans-serif;
      background:
        radial-gradient(1100px 520px at 80% -10%, rgba(196,132,108,.30), transparent 60%),
        radial-gradient(900px 500px at 0% 110%, rgba(39,174,96,.18), transparent 55%),
        linear-gradient(150deg, #1F3D34 0%, #244c40 45%, #16302a 100%);
      color:#3D3228; direction:rtl; min-height:100vh;
      display:flex; align-items:center; justify-content:center; padding:20px;
    }
    .login-container {
      background:#FFF; border-radius:26px; padding:46px 40px 40px; max-width:430px; width:100%;
      box-shadow:0 30px 80px rgba(12,30,24,.45), 0 2px 0 rgba(255,255,255,.6) inset;
      animation:rise .5s cubic-bezier(.2,.7,.2,1) both;
    }
    @keyframes rise { from { opacity:0; transform:translateY(16px) scale(.985); } to { opacity:1; transform:none; } }
    .login-header { text-align:center; margin-bottom:30px; }
    .login-header img {
      width:92px; height:92px; border-radius:50%; object-fit:cover; background:#F4EFE6;
      display:block; margin:0 auto 14px;
      box-shadow:0 10px 28px rgba(31,61,52,.28), 0 0 0 6px rgba(196,132,108,.12);
    }
    .login-header h1 { font-size:27px; color:#1F3D34; margin-bottom:5px; letter-spacing:.3px; }
    .login-header p { font-size:13.5px; color:#9B8E82; }
    .form-group { margin-bottom:17px; }
    label { display:block; font-size:12.5px; color:#6f6457; font-weight:700; margin-bottom:7px; }
    .input-wrap { position:relative; }
    .input-wrap .ic { position:absolute; top:50%; transform:translateY(-50%); right:14px; font-size:16px; opacity:.6; pointer-events:none; }
    input[type=email], input[type=password] {
      width:100%; padding:14px 42px 14px 16px; border:1.5px solid #e8e4de; border-radius:13px;
      font-family:'Heebo',sans-serif; font-size:15px; outline:none; direction:ltr; text-align:right;
      background:#FBFAF7; transition:border-color .18s, box-shadow .18s, background .18s;
    }
    input:focus { border-color:#C4846C; background:#fff; box-shadow:0 0 0 4px rgba(196,132,108,.14); }
    .remember { display:flex; align-items:center; gap:9px; font-size:13px; color:#6f6457; margin:2px 0 6px; cursor:pointer; user-select:none; }
    .remember input { width:17px; height:17px; accent-color:#C4846C; cursor:pointer; }
    .btn-login {
      width:100%; padding:15px; border:none; border-radius:13px;
      background:linear-gradient(135deg,#1F3D34,#2c5a4c); color:#FFF;
      font-family:'Heebo',sans-serif; font-size:16px; font-weight:700; cursor:pointer; margin-top:12px;
      box-shadow:0 10px 24px rgba(31,61,52,.30); transition:transform .12s, box-shadow .18s, filter .18s;
    }
    .btn-login:hover { filter:brightness(1.08); box-shadow:0 14px 30px rgba(31,61,52,.38); }
    .btn-login:active { transform:scale(.985); }
    .btn-login:disabled { opacity:.6; cursor:not-allowed; box-shadow:none; }
    .error, .success { padding:12px 16px; border-radius:11px; font-size:13px; margin-bottom:18px; display:none; }
    .error { background:#fdf0ef; border:1px solid #f5c6c0; color:#c94147; }
    .error.show { display:block; }
    .success { background:#e7f6ec; border:1px solid #bfe3ca; color:#1F7a4f; }
    .success.show { display:block; }
    .foot { text-align:center; margin-top:22px; font-size:11.5px; color:#c4bcae; letter-spacing:.4px; }
    @media(max-width:480px) { .login-container { padding:34px 22px 28px; } .login-header h1 { font-size:23px; } }
  </style>
</head>
<body>

<div class="login-container">
  <div class="login-header">
    <img src="logo.png" alt="גן לב">
    <h1>גן לב</h1>
    <p>מערכת ניהול הגן · כניסה למשתמשים מורשים</p>
  </div>

  <div id="error" class="error"></div>
  <div id="success" class="success"></div>

  <form id="loginForm">
    <div class="form-group">
      <label for="email">דוא״ל</label>
      <div class="input-wrap">
        <span class="ic">✉️</span>
        <input type="email" id="email" name="email" autocomplete="username" placeholder="user@example.com" required>
      </div>
    </div>

    <div class="form-group">
      <label for="password">סיסמה</label>
      <div class="input-wrap">
        <span class="ic">🔒</span>
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
      </div>
    </div>

    <label class="remember">
      <input type="checkbox" id="remember" checked>
      זכור אותי במכשיר הזה
    </label>

    <button type="submit" class="btn-login" id="loginBtn">כניסה</button>
  </form>

  <div class="foot">🌿 גן לב · מערכת ניהול</div>
</div>

<script>
const API = '/.netlify/functions/auth-login';

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const errorEl = document.getElementById('error');
  const successEl = document.getElementById('success');
  const btnEl = document.getElementById('loginBtn');

  errorEl.classList.remove('show');
  successEl.classList.remove('show');

  btnEl.disabled = true;

  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });

    const data = await res.json();

    if (!data.success) {
      errorEl.textContent = data.error || 'שגיאה בכניסה';
      errorEl.classList.add('show');
      return;
    }

    // Save token to localStorage
    localStorage.setItem('crm_token', data.token);
    localStorage.setItem('crm_user', JSON.stringify(data.user));
    localStorage.setItem('crm_garden_id', data.user.garden_id);

    successEl.textContent = 'כניסה בוצעה בהצלחה, מעביר אותך...';
    successEl.classList.add('show');

    setTimeout(() => {
      window.location.href = '/crm/html/dashboard.html';
    }, 500);
  } catch (err) {
    errorEl.textContent = 'שגיאת רשת: ' + err.message;
    errorEl.classList.add('show');
  } finally {
    btnEl.disabled = false;
  }
});
</script>

</body>
</html>
