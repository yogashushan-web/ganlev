<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>כניסה למערכת הניהול — גנים</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Heebo',sans-serif;
      background: linear-gradient(135deg, #1F3D34 0%, #2D5A50 100%);
      color:#3D3228;
      direction:rtl;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }
    .login-container {
      background:#FFF;
      border-radius:20px;
      padding:50px 40px;
      max-width:420px;
      width:100%;
      box-shadow:0 20px 60px rgba(0,0,0,0.3);
    }
    .login-header {
      text-align:center;
      margin-bottom:40px;
    }
    .login-header h1 {
      font-size:28px;
      color:#1F3D34;
      margin-bottom:8px;
    }
    .login-header p {
      font-size:14px;
      color:#9B8E82;
    }
    .form-group {
      margin-bottom:20px;
    }
    label {
      display:block;
      font-size:13px;
      color:#3D3228;
      font-weight:500;
      margin-bottom:8px;
    }
    input, select {
      width:100%;
      padding:14px 16px;
      border:2px solid #e8e4de;
      border-radius:12px;
      font-family:'Heebo',sans-serif;
      font-size:15px;
      outline:none;
      direction:ltr;
      text-align:right;
      transition:border-color 0.2s;
    }
    input:focus, select:focus {
      border-color:#1F3D34;
    }
    .btn-login {
      width:100%;
      padding:14px;
      border:none;
      border-radius:12px;
      background:#1F3D34;
      color:#FFF;
      font-family:'Heebo',sans-serif;
      font-size:16px;
      font-weight:600;
      cursor:pointer;
      transition:background 0.2s;
      margin-top:10px;
    }
    .btn-login:hover { background:#154428; }
    .btn-login:disabled { background:#ccc; cursor:not-allowed; }
    .error {
      background:#fdf0ef;
      border:1px solid #f5c6c0;
      color:#c94147;
      padding:12px 16px;
      border-radius:10px;
      font-size:13px;
      margin-bottom:20px;
      display:none;
    }
    .error.show { display:block; }
    .success {
      background:#d4edda;
      border:1px solid #b8d4bc;
      color:#155724;
      padding:12px 16px;
      border-radius:10px;
      font-size:13px;
      margin-bottom:20px;
      display:none;
    }
    .success.show { display:block; }
    .loading { opacity:0.6; }
    @media(max-width:500px) {
      .login-container { padding:30px 20px; }
      .login-header h1 { font-size:22px; }
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="login-header">
    <h1>מערכת ניהול גנים</h1>
    <p>כניסה למשתמשים מורשים</p>
  </div>

  <div id="error" class="error"></div>
  <div id="success" class="success"></div>

  <form id="loginForm">
    <div class="form-group">
      <label for="email">דוא״ל:</label>
      <input type="email" id="email" name="email" autocomplete="username" placeholder="user@example.com" required>
    </div>

    <div class="form-group">
      <label for="password">סיסמה:</label>
      <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
    </div>

    <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:#3D3228; margin:4px 0 4px; cursor:pointer;">
      <input type="checkbox" id="remember" checked style="width:auto;">
      זכור אותי במכשיר הזה
    </label>

    <button type="submit" class="btn-login" id="loginBtn">כניסה</button>
  </form>
</div>

<script>
const API = '/.netlify/functions/auth-login';

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const errorEl = document.getElementById('error');
  const successEl = document.getElementById('success');
  const btnEl = document.getElementById('loginBtn');

  errorEl.classList.remove('show');
  successEl.classList.remove('show');

  btnEl.disabled = true;
  btnEl.classList.add('loading');

  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });

    const data = await res.json();

    if (!data.success) {
      errorEl.textContent = data.error || 'שגיאה בכניסה';
      errorEl.classList.add('show');
      return;
    }

    // Save token to localStorage
    localStorage.setItem('crm_token', data.token);
    localStorage.setItem('crm_user', JSON.stringify(data.user));
    localStorage.setItem('crm_garden_id', data.user.garden_id);

    successEl.textContent = 'כניסה בוצעה בהצלחה, מעביר אותכם...';
    successEl.classList.add('show');

    setTimeout(() => {
      window.location.href = '/crm/html/dashboard.html';
    }, 500);
  } catch (err) {
    errorEl.textContent = 'שגיאת רשת: ' + err.message;
    errorEl.classList.add('show');
  } finally {
    btnEl.disabled = false;
    btnEl.classList.remove('loading');
  }
});
</script>

</body>
</html>
