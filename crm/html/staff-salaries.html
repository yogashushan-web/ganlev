<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>עובדים — מערכת גנים</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Heebo',sans-serif; background:#F4EFE6; color:#3D3228; direction:rtl; min-height:100vh; }
    .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; flex-wrap:wrap; gap:10px; }
    .header h1 { font-size:26px; color:#1F3D34; }
    .acts { display:flex; gap:8px; flex-wrap:wrap; }
    .btn-add { background:#1F3D34; color:#FFF; border:none; padding:11px 20px; border-radius:10px; cursor:pointer; font-family:'Heebo'; font-weight:700; font-size:13px; }
    .btn-add:hover { background:#154428; }
    .btn-link { background:#C4846C; color:#fff; border:none; padding:11px 18px; border-radius:10px; cursor:pointer; font-family:'Heebo'; font-weight:700; font-size:13px; }
    .btn-link:hover { background:#a96b54; }
    .error, .success { padding:12px; border-radius:10px; margin-bottom:16px; display:none; }
    .error { background:#fdf0ef; color:#c94147; } .error.show { display:block; }
    .success { background:#d4edda; color:#155724; } .success.show { display:block; }
    .form-container { background:#FFF; border-radius:16px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.05); margin-bottom:22px; display:none; }
    .form-container.show { display:block; }
    .form-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
    @media(max-width:700px){ .form-row{grid-template-columns:1fr 1fr;} }
    .fg { margin-bottom:14px; }
    label { display:block; font-size:12px; color:#3D3228; font-weight:700; margin-bottom:5px; }
    input, select, textarea { width:100%; padding:10px 12px; border:1px solid #e8e4de; border-radius:9px; font-family:'Heebo'; font-size:14px; outline:none; }
    input:focus, select:focus { border-color:#1F3D34; }
    .btn-submit { background:#1F3D34; color:#FFF; border:none; padding:11px 22px; border-radius:10px; cursor:pointer; font-family:'Heebo'; font-weight:700; }
    .btn-cancel { background:#f0ece6; color:#333; border:none; padding:11px 22px; border-radius:10px; cursor:pointer; font-family:'Heebo'; margin-right:10px; }
    .tbl-wrap { overflow-x:auto; border-radius:16px; box-shadow:0 2px 12px rgba(0,0,0,0.05); }
    table { width:100%; border-collapse:collapse; background:#FFF; }
    th { background:#1F3D34; color:#FFF; padding:12px 14px; font-size:12px; text-align:right; white-space:nowrap; }
    td { padding:11px 14px; border-bottom:1px solid #f0ece6; font-size:13px; }
    tr:last-child td { border-bottom:none; }
    tr:hover td { background:#FAF8F4; }
    .name-link { color:#1F3D34; font-weight:700; cursor:pointer; text-decoration:underline; }
    a.wa { color:#1F7a4f; text-decoration:none; font-weight:600; direction:ltr; display:inline-block; }
    .muted { color:#c4bcae; }
    .btn-edit,.btn-delete { padding:6px 11px; border:none; border-radius:8px; cursor:pointer; font-size:12px; font-family:'Heebo'; }
    .btn-edit { background:#C4846C; color:#FFF; } .btn-delete { background:#e74c3c; color:#FFF; }
    .loading { text-align:center; padding:40px; color:#9B8E82; }
    /* profile modal */
    .ov { position:fixed; inset:0; background:rgba(31,61,52,.45); display:none; align-items:center; justify-content:center; z-index:99999; }
    .ov.show { display:flex; }
    .pf { background:#fff; border-radius:18px; padding:26px; width:92%; max-width:460px; max-height:85vh; overflow:auto; box-shadow:0 20px 60px rgba(0,0,0,.3); }
    .pf h2 { color:#1F3D34; margin-bottom:4px; }
    .pf .role { color:#9B8E82; font-size:13px; margin-bottom:16px; }
    .pf .row { display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid #f3efe8; font-size:14px; }
    .pf .row .k { color:#9B8E82; }
    .pf .row .v { font-weight:600; text-align:left; }
    .pf .close { margin-top:18px; width:100%; background:#f0ece6; border:none; border-radius:10px; padding:11px; font-family:'Heebo'; font-weight:700; cursor:pointer; }
  </style>
</head>
<body>

  <div class="header">
    <h1>👔 עובדים</h1>
    <div class="acts">
      <button class="btn-link" onclick="copyIntakeLink(this)">📋 העתק לינק שאלון</button>
      <button class="btn-add" onclick="toggleForm()">+ הוסף עובד</button>
    </div>
  </div>

  <div id="error" class="error"></div>
  <div id="success" class="success"></div>

  <div id="form" class="form-container">
    <h2 style="margin-bottom:16px; color:#1F3D34;">הוסף / ערוך עובד</h2>
    <form id="staffForm">
      <div class="form-row">
        <div class="fg"><label>שם מלא *</label><input type="text" id="sName" required></div>
        <div class="fg"><label>טלפון</label><input type="tel" id="sPhone" dir="ltr"></div>
        <div class="fg"><label>אימייל</label><input type="email" id="sEmail" dir="ltr"></div>
      </div>
      <div class="form-row">
        <div class="fg"><label>תעודת זהות</label><input type="text" id="sNid" dir="ltr"></div>
        <div class="fg"><label>תאריך לידה</label><input type="date" id="sBirth"></div>
        <div class="fg"><label>תפקיד</label><input type="text" id="sPosition" placeholder="גננת / סייעת"></div>
      </div>
      <div class="form-row">
        <div class="fg"><label>כתובת</label><input type="text" id="sAddress"></div>
        <div class="fg"><label>תאריך תחילת עבודה</label><input type="date" id="sHire"></div>
        <div class="fg"><label>שנות ניסיון</label><input type="number" id="sExp" min="0"></div>
      </div>
      <div class="form-row">
        <div class="fg"><label>הכשרה לגיל הרך</label><select id="sEce"><option value="">--</option><option>כן</option><option>לא</option><option>בתהליך</option></select></div>
        <div class="fg"><label>מגורים בשכונה</label><select id="sHood"><option value="">--</option><option>כן</option><option>לא</option></select></div>
        <div class="fg"><label>היקף משרה</label><select id="sScope"><option value="">--</option><option>מלאה</option><option>חלקית</option></select></div>
      </div>
      <div class="form-row">
        <div class="fg"><label>סוג שכר</label><select id="sSalary"><option value="">--</option><option>גלובלי</option><option>שעתי</option></select></div>
        <div class="fg" style="grid-column:span 2;"><label>הערות</label><input type="text" id="sNotes"></div>
      </div>
      <div style="display:flex; gap:10px; margin-top:8px;">
        <button type="submit" class="btn-submit">שמור</button>
        <button type="button" class="btn-cancel" onclick="toggleForm()">ביטול</button>
      </div>
    </form>
  </div>

  <div id="table" class="loading">טוען...</div>

  <div class="ov" id="pfOv"><div class="pf" id="pfBox"></div></div>

<script src="js/common.js?v=6"></script>
<script src="js/api.js?v=6"></script>
<script>
let staff = [];
let editingId = null;
const esc = s => (s || '').replace(/</g, '&lt;');

function ageStr(bd) {
  if (!bd) return '-';
  const b = new Date(bd), n = new Date();
  let y = n.getFullYear() - b.getFullYear();
  if (n.getMonth() < b.getMonth() || (n.getMonth() === b.getMonth() && n.getDate() < b.getDate())) y--;
  return y >= 0 ? y : '-';
}

async function loadStaff() {
  try { const r = await api.getStaff(); staff = r.data || []; renderTable(); }
  catch (e) { showError('שגיאה בטעינה: ' + e.message); }
}

function renderTable() {
  if (!staff.length) {
    document.getElementById('table').innerHTML = '<p style="padding:24px;color:#9B8E82;text-align:center;">אין עובדים עדיין. אפשר להוסיף או לשלוח לינק שאלון.</p>';
    return;
  }
  const rows = staff.map(s => `
    <tr>
      <td><span class="name-link" onclick="showProfile('${s.id}')">${esc(s.full_name_he)}</span></td>
      <td>${esc(s.position_he) || '<span class="muted">-</span>'}</td>
      <td>${s.phone ? `<a class="wa" href="${waHref(s.phone)}" target="_blank">💬 ${esc(s.phone)}</a>` : '<span class="muted">-</span>'}</td>
      <td>${esc(s.job_scope) || '<span class="muted">-</span>'}</td>
      <td>${ageStr(s.birth_date)}</td>
      <td style="display:flex;gap:6px;">
        <button class="btn-edit" onclick="editStaff('${s.id}')">ערוך</button>
        <button class="btn-delete" onclick="deleteStaff('${s.id}')">מחק</button>
      </td>
    </tr>`).join('');
  document.getElementById('table').innerHTML = `<div class="tbl-wrap"><table>
    <thead><tr><th>שם</th><th>תפקיד</th><th>טלפון</th><th>היקף משרה</th><th>גיל</th><th>פעולות</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

function row(k, v) { return v ? `<div class="row"><span class="k">${k}</span><span class="v">${esc(String(v))}</span></div>` : ''; }
function showProfile(id) {
  const s = staff.find(x => x.id === id); if (!s) return;
  const phone = s.phone ? `<a class="wa" href="${waHref(s.phone)}" target="_blank">💬 ${esc(s.phone)}</a>` : '';
  document.getElementById('pfBox').innerHTML =
    `<h2>${esc(s.full_name_he)}</h2><div class="role">${esc(s.position_he) || 'עובד/ת'}</div>` +
    (phone ? `<div class="row"><span class="k">טלפון</span><span class="v">${phone}</span></div>` : '') +
    row('אימייל', s.email) + row('גיל', ageStr(s.birth_date) !== '-' ? ageStr(s.birth_date) + ' (' + formatDate(s.birth_date) + ')' : '') +
    row('תעודת זהות', s.national_id) + row('כתובת', s.address) +
    row('שנות ניסיון בחינוך', s.years_experience) + row('הכשרה לגיל הרך', s.ece_training) +
    row('מגורים בשכונה', s.in_neighborhood) + row('היקף משרה', s.job_scope) +
    row('סוג שכר', s.salary_type) + row('תחילת עבודה', s.hire_date ? formatDate(s.hire_date) : '') +
    row('הערות', s.notes_he) +
    `<button class="close" onclick="document.getElementById('pfOv').classList.remove('show')">סגור</button>`;
  document.getElementById('pfOv').classList.add('show');
}

function toggleForm() {
  const f = document.getElementById('form');
  f.classList.toggle('show');
  if (!f.classList.contains('show')) { document.getElementById('staffForm').reset(); editingId = null; }
}
function editStaff(id) {
  const s = staff.find(x => x.id === id); if (!s) return;
  editingId = id;
  const set = (k, v) => document.getElementById(k).value = v || '';
  set('sName', s.full_name_he); set('sPhone', s.phone); set('sEmail', s.email); set('sNid', s.national_id);
  set('sBirth', s.birth_date); set('sPosition', s.position_he); set('sAddress', s.address); set('sHire', s.hire_date);
  set('sExp', s.years_experience); set('sEce', s.ece_training); set('sHood', s.in_neighborhood);
  set('sScope', s.job_scope); set('sSalary', s.salary_type); set('sNotes', s.notes_he);
  document.getElementById('form').classList.add('show');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
async function deleteStaff(id) {
  if (!confirm('למחוק את העובד? (אפשר לשחזר מהפח)')) return;
  try { const r = await api.deleteStaff(id); if (r.success) { showSuccess('נמחק'); loadStaff(); } }
  catch (e) { showError('שגיאה: ' + e.message); }
}

document.getElementById('staffForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const g = k => document.getElementById(k).value;
  const data = {
    full_name_he: g('sName'), phone: g('sPhone') || null, email: g('sEmail') || null,
    national_id: g('sNid') || null, birth_date: g('sBirth') || null, position_he: g('sPosition') || null,
    address: g('sAddress') || null, hire_date: g('sHire') || null, years_experience: g('sExp') || null,
    ece_training: g('sEce') || null, in_neighborhood: g('sHood') || null, job_scope: g('sScope') || null,
    salary_type: g('sSalary') || null, notes_he: g('sNotes') || null,
  };
  try {
    const r = editingId ? await api.updateStaff(editingId, data) : await api.createStaff(data);
    if (r.success) { showSuccess(editingId ? 'עודכן' : 'נוסף'); toggleForm(); loadStaff(); }
  } catch (e2) { showError('שגיאה: ' + e2.message); }
});

function copyIntakeLink(btn) {
  const url = location.origin + '/crm/html/staff-intake.html?garden=' + getGardenId();
  navigator.clipboard.writeText(url).then(() => {
    btn.textContent = '✓ הועתק!';
    setTimeout(() => btn.textContent = '📋 העתק לינק שאלון', 2000);
  }, () => { prompt('העתיקי את הלינק:', url); });
}

loadStaff();
</script>
</body>
</html>
