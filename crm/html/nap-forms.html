<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>שנת הצהריים — טקסי הירדמות</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Heebo',sans-serif; background:#F4EFE6; color:#3D3228; direction:rtl; min-height:100vh; }
    .wrap { max-width:820px; margin:0 auto; padding:22px 18px 60px; }
    .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; flex-wrap:wrap; gap:10px; }
    h1 { font-size:25px; color:#3a5b73; }
    .back { color:#9B8E82; font-size:13px; text-decoration:none; font-weight:600; }
    .back:hover { color:#1F3D34; }
    .lead { color:#9B8E82; font-size:14px; margin-bottom:16px; line-height:1.6; }
    .bar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px; }
    .btn { background:#5f93b8; color:#fff; border:none; padding:11px 17px; border-radius:11px; cursor:pointer; font-family:'Heebo'; font-weight:700; font-size:13px; }
    .btn:hover { background:#4e7ca1; }
    .btn.ghost { background:#efe9e0; color:#6f6457; }

    .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    @media(max-width:640px){ .grid { grid-template-columns:1fr; } }
    .card { background:#fff; border-radius:18px; padding:17px 18px; box-shadow:0 3px 14px rgba(90,120,150,.09); border-top:4px solid #9cc3de; }
    .cname { font-size:18px; font-weight:800; color:#3a5b73; margin-bottom:2px; }
    .cdate { font-size:11.5px; color:#a49b8c; margin-bottom:11px; }
    .chips { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:12px; }
    .chip { background:#eef5fb; color:#3a5b73; border-radius:999px; padding:5px 12px; font-size:13px; font-weight:600; }
    .chip.other { background:#f5efe6; color:#8a7a63; }
    .block { margin-top:10px; }
    .block .bt { font-size:12px; font-weight:700; color:#7fb0d0; margin-bottom:2px; }
    .block .bv { font-size:14px; color:#43413c; line-height:1.6; white-space:pre-wrap; }
    .empty { color:#b6ab9d; font-size:15px; background:#fbf9f5; border:1px dashed #e3d9c8; border-radius:14px; padding:26px; text-align:center; grid-column:1/-1; }
    .toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:#3a5b73; color:#fff; padding:11px 20px; border-radius:12px; font-weight:600; font-size:14px; opacity:0; transition:.2s; pointer-events:none; }
    .toast.show { opacity:1; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <h1>🌙 שנת הצהריים</h1>
      <a class="back" href="content.html">‹ חזרה לתוכן חינוכי</a>
    </div>
    <div class="lead">טקסי ההירדמות שההורים מילאו — כדי שנלווה כל ילד/ה לשינה קרובה ככל האפשר לבית. (ספטמבר · הסתגלות)</div>
    <div class="bar">
      <button class="btn" onclick="copyLink()">🔗 העתק קישור להורים</button>
      <button class="btn" id="fullBtn" style="background:#3a5b73; display:none;" onclick="openFull()">🖨️ לוח שינה מלא</button>
      <button class="btn ghost" onclick="load()">↻ רענון</button>
    </div>
    <div id="grid" class="grid"><div class="empty">טוען…</div></div>
  </div>
  <div class="toast" id="toast"></div>

<script src="js/common.js?v=16"></script>
<script src="js/api.js?v=16"></script>
<script>
  const NEED_IC = { 'בקבוק':'🍼','מוצץ':'👶','דובי / בובה':'🧸','שמיכה':'☁️','חיתול':'🤍','הנקה':'🤱' };
  const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const $ = id => document.getElementById(id);

  function copyLink() {
    const url = location.origin + '/nap';
    navigator.clipboard.writeText(url).then(() => toast('הקישור הועתק: ' + url))
      .catch(() => toast(url));
  }
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2600); }

  let OWNER_KEY = '';
  (async function () { try { const r = await api.getOwnerKey(); OWNER_KEY = r.admin_key || ''; if (OWNER_KEY) $('fullBtn').style.display = ''; } catch (e) {} })();
  function openFull() { if (OWNER_KEY) window.open('nap-board.html?admin=' + encodeURIComponent(OWNER_KEY), '_blank'); }

  async function load() {
    try {
      const r = await api.getNapForms();
      const rows = r.data || [];
      if (!rows.length) { $('grid').innerHTML = '<div class="empty">עדיין לא התקבלו מילויים. שלחו את הקישור להורים 🌙</div>'; return; }
      $('grid').innerHTML = rows.map(cardHtml).join('');
    } catch (e) { $('grid').innerHTML = '<div class="empty">שגיאה בטעינה: ' + esc(e.message) + '</div>'; }
  }
  function cardHtml(r) {
    const needs = (r.needs || []).map(n => `<span class="chip">${NEED_IC[n]||'•'} ${esc(n)}</span>`).join('');
    const other = r.needs_other ? `<span class="chip other">➕ ${esc(r.needs_other)}</span>` : '';
    const d = r.updated_at ? new Date(r.updated_at).toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit',year:'numeric'}) : '';
    const block = (t,v) => v ? `<div class="block"><div class="bt">${t}</div><div class="bv">${esc(v)}</div></div>` : '';
    return `<div class="card">
      <div class="cname">${esc(r.child_name || '—')}${r.id ? ` <button onclick="delNap('${r.id}')" title="מחיקה" style="float:left;background:none;border:none;color:#c48;cursor:pointer;font-size:15px;">🗑</button>` : ''}</div>
      <div class="cdate">מולא ב-${d}</div>
      ${(needs||other) ? `<div class="chips">${needs}${other}</div>` : ''}
      ${block('טקס ההירדמות', r.ritual)}
      ${block('חשוב לדעת', r.notes)}
    </div>`;
  }
  async function delNap(id) {
    if (!confirm('למחוק את הכרטיס הזה?')) return;
    try { await api.deleteEvent(id); toast('נמחק'); load(); }
    catch (e) { toast('שגיאה: ' + e.message); }
  }
  load();
</script>
</body>
</html>
