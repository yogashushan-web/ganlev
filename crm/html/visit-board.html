<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>לוח ימי היכרות — גן לב</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Heebo',sans-serif; background:#F4EFE6; color:#2b2b2b; direction:rtl; }
    .wrap { max-width:820px; margin:0 auto; padding:24px 18px 60px; }
    .bar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
    .btn { border:none; padding:11px 18px; border-radius:11px; cursor:pointer; font-family:'Heebo'; font-weight:700; font-size:14px; }
    .btn.print { background:#1F3D34; color:#fff; } .btn.mail { background:#5f93b8; color:#fff; } .btn.ghost { background:#efe9e0; color:#6f6457; }
    h1 { font-size:24px; color:#1F3D34; text-align:center; margin-bottom:4px; }
    .sub { text-align:center; color:#9B8E82; font-size:13px; margin-bottom:20px; }
    .day { background:#fff; border-radius:14px; padding:15px 18px; box-shadow:0 2px 10px rgba(0,0,0,.06); margin-bottom:14px; break-inside:avoid; }
    .day-h { font-size:17px; font-weight:800; color:#1F3D34; margin-bottom:10px; border-bottom:2px solid #eee; padding-bottom:6px; }
    .caps { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    @media(max-width:560px){ .caps{grid-template-columns:1fr;} }
    .cap-h { font-weight:800; color:#0d8a7a; font-size:15px; margin-bottom:6px; direction:ltr; text-align:right; }
    .cap-h .cnt { color:#9B8E82; font-size:12px; font-weight:600; }
    ol { margin:0 18px; } li { font-size:14.5px; padding:2px 0; }
    .empty { color:#c3b8a8; font-style:italic; font-size:13px; }
    @media print { body{background:#fff;} .bar{display:none;} .day{box-shadow:none;border:1px solid #ddd;} }
    .msg { text-align:center; color:#c0492a; padding:30px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar">
      <button class="btn print" onclick="window.print()">🖨️ הדפסה</button>
      <button class="btn mail" onclick="emailBoard()">✉️ שלח למייל</button>
      <button class="btn ghost" onclick="location.reload()">↻ רענון</button>
    </div>
    <h1>🏠 לוח ימי היכרות · אוגוסט</h1>
    <div class="sub">גן לב · 23–27 ו-30–31 באוגוסט</div>
    <div id="board"><div class="msg">טוען…</div></div>
  </div>

<script>
  const API = '/.netlify/functions/visit-book';
  const GID = '5120efca-8bb0-47a3-90d2-2c6a5a013e31';
  const KEY = new URLSearchParams(location.search).get('admin') || '';
  const DAY_NAMES = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
  const MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
  const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function fmtDate(d){ const [y,m,dd]=d.split('-').map(Number); const dow=new Date(y,m-1,dd).getDay(); return `יום ${DAY_NAMES[dow]} · ${dd} ב${MONTHS[m-1]}`; }

  async function load() {
    if (!KEY) { document.getElementById('board').innerHTML = '<div class="msg">קישור לא תקין — חסר קוד גישה.</div>'; return; }
    try {
      const d = await (await fetch(`${API}?garden_id=${GID}&admin=${encodeURIComponent(KEY)}`)).json();
      if (!d.board) { document.getElementById('board').innerHTML = '<div class="msg">אין הרשאה לצפייה בלוח.</div>'; return; }
      const dates = d.dates || [], slots = d.slots || [], cap = d.capacity || 6, board = d.board;
      document.getElementById('board').innerHTML = dates.map(date => {
        const caps = slots.map(sl => {
          const names = board[date+'|'+sl.s] || [];
          const list = names.length ? '<ol>' + names.map(n => `<li>${esc(n)}</li>`).join('') + '</ol>' : '<div class="empty">— אין רישומים —</div>';
          return `<div><div class="cap-h">${sl.s}–${sl.e} <span class="cnt">(${names.length}/${cap})</span></div>${list}</div>`;
        }).join('');
        return `<div class="day"><div class="day-h">${fmtDate(date)}</div><div class="caps">${caps}</div></div>`;
      }).join('');
    } catch(e){ document.getElementById('board').innerHTML = '<div class="msg">שגיאה: ' + esc(e.message) + '</div>'; }
  }
  async function emailBoard() {
    try {
      const r = await (await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ action:'email_board', garden_id:GID, admin:KEY }) })).json();
      alert(r.success ? 'הלוח נשלח למייל 📩' : ('שגיאה: ' + (r.error||'')));
    } catch(e){ alert('שגיאה: ' + e.message); }
  }
  load();
</script>
</body>
</html>
