<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>רישוי — מערכת גנים</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Heebo',sans-serif; background:#F4EFE6; color:#3D3228; direction:rtl; min-height:100vh; }
    h1 { font-size:26px; color:#1F3D34; margin-bottom:6px; }
    .lead { color:#9B8E82; font-size:14px; margin-bottom:18px; }
    .section-title { font-size:18px; font-weight:700; color:#1F3D34; margin:18px 0 14px; }
    .toolbar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
    .seed-btn { background:#1F3D34; color:#fff; border:none; padding:11px 18px; border-radius:10px; cursor:pointer; font-family:'Heebo'; font-weight:700; font-size:13px; }
    .seed-btn:hover { background:#154428; }
    .seed-btn.alt { background:#C4846C; }
    .seed-btn.alt:hover { background:#a96b54; }

    .bodies { display:grid; grid-template-columns:repeat(auto-fill, minmax(330px,1fr)); gap:16px; }
    .body-card { background:#FFF; border-radius:16px; padding:18px; box-shadow:0 2px 12px rgba(0,0,0,0.05); border-top:4px solid #C4846C; }
    .body-head { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:10px; }
    .body-head h3 { font-size:16px; color:#1F3D34; }
    .x { background:none; border:none; color:#c4847c; cursor:pointer; font-size:18px; line-height:1; }
    .quick { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
    .ql { text-decoration:none; padding:7px 12px; border-radius:20px; font-size:12px; font-weight:700; display:inline-flex; gap:4px; align-items:center; }
    .ql.call { background:#dcfce7; color:#166534; }
    .ql.mail { background:#dbeafe; color:#1e4e8c; }
    .ql.web  { background:#f3e8ff; color:#6b21a8; }
    .fld { margin-bottom:8px; }
    .fld label { display:block; font-size:11px; color:#9B8E82; font-weight:700; margin-bottom:3px; }
    .fld input { width:100%; padding:8px 11px; border:1px solid #e8e4de; border-radius:8px; font-family:'Heebo'; font-size:13px; outline:none; }
    .fld input:focus { border-color:#1F3D34; }
    .two { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .save { width:100%; margin-top:8px; background:#1F3D34; color:#fff; border:none; padding:9px; border-radius:9px; cursor:pointer; font-family:'Heebo'; font-weight:700; font-size:13px; }
    .save:hover { background:#154428; }
    .empty { color:#9B8E82; font-size:14px; padding:20px; text-align:center; background:#fff; border-radius:14px; }

    /* documents (compact, bottom) */
    .card { background:#FFF; border-radius:16px; padding:20px; box-shadow:0 2px 12px rgba(0,0,0,0.05); margin-top:8px; }
    .doc-row { display:flex; justify-content:space-between; align-items:center; padding:9px 12px; border-radius:10px; background:#FAF8F4; margin-bottom:8px; flex-wrap:wrap; gap:8px; }
    .dl { background:#1F3D34; color:#fff; text-decoration:none; padding:6px 14px; border-radius:8px; font-size:12px; font-weight:600; }
    .del { background:#e74c3c; color:#fff; border:none; padding:6px 12px; border-radius:8px; font-size:12px; cursor:pointer; font-family:'Heebo'; }
    .upload-row { display:flex; gap:10px; align-items:center; margin-top:12px; flex-wrap:wrap; padding-top:12px; border-top:1px dashed #e3ddd2; }
    .upload-row input[type=text] { flex:1; min-width:200px; padding:10px 13px; border:1.5px solid #e3ddd2; border-radius:10px; font-family:'Heebo'; font-size:14px; outline:none; }
    .up-btn { background:#C4846C; color:#fff; border:none; padding:10px 18px; border-radius:10px; cursor:pointer; font-family:'Heebo'; font-weight:700; font-size:13px; }
    .error { background:#fdf0ef; color:#c94147; padding:12px; border-radius:10px; margin-bottom:16px; display:none; }
    .error.show { display:block; }
  </style>
</head>
<body>

  <h1>🏛️ רישוי</h1>
  <div class="lead">רשימות רישוי - מסמכים ואישורים לכל גוף, וספריית אנשי הקשר למטה.</div>
  <div id="error" class="error"></div>

  <div class="section-title">📋 רשימות רישוי</div>
  <div style="margin-bottom:12px;"><button class="seed-btn" onclick="addLicenseList()">+ הוסף רשימה</button></div>
  <div id="licLists"></div>

  <div class="section-title">📞 גופים ואנשי קשר</div>
  <div class="toolbar">
    <button class="seed-btn" onclick="seedRecommended(this)">⚡ טען את כל הגופים המומלצים</button>
    <button class="seed-btn alt" onclick="addBlank()">+ הוסף גוף ריק</button>
  </div>

  <div id="bodies" class="bodies"></div>

  <div class="section-title">📑 מסמכים ואישורים מצורפים (לא חובה)</div>
  <div class="card">
    <div id="docList"></div>
    <div class="upload-row">
      <input type="text" list="dlAuth" id="docTitle" placeholder="שם המסמך (לדוגמה: אישור בטיחות)">
      <datalist id="dlAuth">
        <option value="אישור משרד החינוך"><option value="אישור בטיחות"><option value="אישור מכבי אש"><option value="תכנית הגן (שטח)">
      </datalist>
      <input type="file" id="docFile">
      <button class="up-btn" onclick="uploadDoc(this)">⬆ העלה</button>
    </div>
  </div>

<script src="js/common.js?v=15"></script>
<script src="js/api.js?v=15"></script>
<script>
const esc = s => (s || '').replace(/</g, '&lt;');
const attr = s => (s || '').replace(/"/g, '&quot;');
function telHref(p) { return 'tel:' + (p || '').replace(/[^0-9*+]/g, ''); }

// Recommended Israeli bodies for a (Tel Aviv) kindergarten/daycare, with known contacts
const TEMPLATES = [
  { kind:'משרד החינוך (גנים)',         phone:'073-3983960',  email:'',                     website:'https://www.gov.il/he/departments/ministry_of_education', notes:'סמל מוסד' },
  { kind:'משרד העבודה - מעונות יום',    phone:'073-2458356',  email:'',                     website:'https://www.gov.il', notes:'סמל מעון / הכרה' },
  { kind:'עיריית תל אביב (מוקד 106)',   phone:'03-5238888',   email:'',                     website:'https://www.tel-aviv.gov.il', notes:'ארנונה - מספר נכס/משלם, רישוי עסק' },
  { kind:'מי אביבים (מים)',            phone:'1-800-071202', email:'pniot@mei-avivim.co.il', website:'https://www.mei-avivim.co.il', notes:'מספר צרכן / חשבון מים' },
  { kind:'חברת החשמל',                 phone:'103',          email:'103@iec.co.il',         website:'https://www.iec.co.il', notes:'מספר חוזה (בראש חשבון החשמל)' },
  { kind:'כבאות והצלה',                phone:'102',          email:'tservice@102.gov.il',   website:'https://www.gov.il/he/departments/topics/fire_safety_main', notes:'מספר תיק / אישור כבאות' },
  { kind:'ביטוח לאומי',                phone:'*6050',        email:'',                     website:'https://www.btl.gov.il', notes:'מספר תיק ניכויים' },
  { kind:'רשות המסים (מס הכנסה)',       phone:'*4954',        email:'',                     website:'https://www.gov.il/he/departments/israel_tax_authority', notes:'מספר תיק / עוסק' },
  { kind:'מכון התקנים',                phone:'03-6465154',   email:'',                     website:'https://www.sii.org.il', notes:'תו תקן / אישור בטיחות' },
];

let bodies = [];
async function loadBodies() {
  try { const r = await api.getUtilities(); bodies = r.data || []; }
  catch (e) { bodies = []; showError('שגיאה בטעינה (ייתכן שצריך להריץ את ה-SQL): ' + e.message); }
  renderBodies();
}

function ql(b) {
  let h = '';
  if (b.phone)   h += `<a class="ql call" href="${telHref(b.phone)}">📞 התקשר</a>`;
  if (b.email)   h += `<a class="ql mail" href="mailto:${attr(b.email)}">✉️ מייל</a>`;
  if (b.website) h += `<a class="ql web" target="_blank" href="${attr(b.website)}">🌐 אתר</a>`;
  return h;
}

function renderBodies() {
  const el = document.getElementById('bodies');
  if (!bodies.length) {
    el.innerHTML = '<div class="empty">אין גופים עדיין. לחצי על "⚡ טען את כל הגופים המומלצים" כדי להתחיל.</div>';
    return;
  }
  el.innerHTML = bodies.map(b => `
    <div class="body-card">
      <div class="body-head">
        <h3>${esc(b.kind)}</h3>
        <button class="x" title="מחק" onclick="delBody('${b.id}')">✕</button>
      </div>
      <div class="quick">${ql(b)}</div>
      <div class="fld"><label>מספר מנוי / חשבון</label><input id="acc-${b.id}" value="${attr(b.account_number)}" placeholder="המספר שצריך כדי להזדהות"></div>
      <div class="two">
        <div class="fld"><label>טלפון</label><input id="ph-${b.id}" value="${attr(b.phone)}"></div>
        <div class="fld"><label>מייל</label><input id="em-${b.id}" value="${attr(b.email)}" dir="ltr"></div>
      </div>
      <div class="fld"><label>אתר</label><input id="web-${b.id}" value="${attr(b.website)}" dir="ltr"></div>
      <div class="two">
        <div class="fld"><label>חוזה / מנוי</label><input id="con-${b.id}" value="${attr(b.contract)}"></div>
        <div class="fld"><label>הערות</label><input id="not-${b.id}" value="${attr(b.notes)}"></div>
      </div>
      <button class="save" onclick="saveBody('${b.id}')">💾 שמור</button>
    </div>`).join('');
}

async function saveBody(id) {
  const g = s => document.getElementById(s + '-' + id).value || null;
  try {
    await api.updateUtility(id, {
      account_number: g('acc'), phone: g('ph'), email: g('em'),
      website: g('web'), contract: g('con'), notes: g('not'),
    });
    loadBodies();
  } catch (e) { alert('שגיאה בשמירה: ' + e.message); }
}

async function delBody(id) {
  if (!confirm('למחוק את הגוף?')) return;
  try { await api.deleteUtility(id); loadBodies(); } catch (e) { alert(e.message); }
}

async function seedRecommended(btn) {
  btn.disabled = true; btn.textContent = 'טוען...';
  const have = new Set(bodies.map(b => b.kind));
  try {
    for (const t of TEMPLATES) {
      if (!have.has(t.kind)) await api.createUtility(t);
    }
    await loadBodies();
  } catch (e) { showError('שגיאה: ' + e.message); }
  btn.disabled = false; btn.textContent = '⚡ טען את כל הגופים המומלצים';
}

async function addBlank() {
  const name = prompt('שם הגוף:');
  if (!name) return;
  try { await api.createUtility({ kind: name }); loadBodies(); } catch (e) { alert(e.message); }
}

/* ---------- documents (compact) ---------- */
let docs = [];
async function loadDocs() {
  try { const r = await api.getDocuments('authorities'); docs = r.data || []; } catch (e) { docs = []; }
  renderDocs();
}
function renderDocs() {
  document.getElementById('docList').innerHTML = docs.length ? docs.map(d => `
    <div class="doc-row">
      <span style="font-weight:600;font-size:14px;">📄 ${esc(d.title)}</span>
      <span style="display:flex;gap:8px;">
        ${d.file_url ? `<a class="dl" href="${d.file_url}" target="_blank">פתח / הורד</a>` : ''}
        <button class="del" onclick="delDoc('${d.id}')">מחק</button>
      </span>
    </div>`).join('') : '<div style="color:#9B8E82;font-size:13px;padding:6px;">אין מסמכים מצורפים.</div>';
}
function fileToB64(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result.split(',')[1]); r.onerror = rej; r.readAsDataURL(file); }); }
async function uploadDoc(btn) {
  const title = document.getElementById('docTitle').value.trim();
  const file = document.getElementById('docFile').files[0];
  if (!title) { alert('צריך שם למסמך'); return; }
  if (!file) { alert('בחרי קובץ'); return; }
  if (file.size > 5 * 1024 * 1024) { alert('הקובץ גדול מדי (מקסימום 5MB)'); return; }
  btn.disabled = true; btn.textContent = 'מעלה...';
  try {
    const b64 = await fileToB64(file);
    await api.uploadDocument({ section: 'authorities', category: 'אישורים', title, file_base64: b64, file_name: file.name, content_type: file.type });
    document.getElementById('docTitle').value = ''; document.getElementById('docFile').value = '';
    loadDocs();
  } catch (e) { alert('שגיאה: ' + e.message); }
  btn.disabled = false; btn.textContent = '⬆ העלה';
}
async function delDoc(id) { if (!confirm('למחוק את המסמך?')) return; try { await api.deleteDocument(id); loadDocs(); } catch (e) { alert(e.message); } }

/* ---------- רשימות רישוי (per-list document collections) ---------- */
const DEFAULT_LIC_LISTS = ['משרד החינוך', 'עיריית תל אביב יפו'];
const LIC_PREFIX = 'licensing:';
let licDocs = [], extraLists = [], currentLicLists = [];
const licScope = name => LIC_PREFIX + name;

async function loadLic() {
  try { const r = await api.getDocuments(); licDocs = (r.data || []).filter(d => (d.section || '').indexOf(LIC_PREFIX) === 0); }
  catch (e) { licDocs = []; }
  renderLic();
}
function renderLic() {
  const byList = {};
  licDocs.forEach(d => { const n = d.section.slice(LIC_PREFIX.length); (byList[n] = byList[n] || []).push(d); });
  const found = licDocs.map(d => d.section.slice(LIC_PREFIX.length));
  currentLicLists = Array.from(new Set([...DEFAULT_LIC_LISTS, ...found, ...extraLists]));
  document.getElementById('licLists').innerHTML = currentLicLists.map((name, i) => {
    const files = byList[name] || [];
    const filesHtml = files.length ? files.map(f =>
      `<div class="doc-row"><span style="font-weight:600;font-size:14px;">📄 ${esc(f.title)}</span>` +
      `<span style="display:flex;gap:8px;">${f.file_url ? `<a class="dl" href="${f.file_url}" target="_blank">פתח / הורד</a>` : ''}` +
      `<button class="del" onclick="delLicDoc('${f.id}')">מחק</button></span></div>`).join('')
      : '<div style="color:#9B8E82;font-size:13px;padding:6px;">אין מסמכים ברשימה.</div>';
    return `<div class="card" style="margin-bottom:14px;">
      <div style="font-size:16px;font-weight:800;color:#1F3D34;margin-bottom:10px;">🗂️ ${esc(name)}</div>
      <div>${filesHtml}</div>
      <div class="upload-row">
        <input type="text" id="lt-${i}" placeholder="שם המסמך (לדוגמה: רישיון, אישור)">
        <input type="file" id="lf-${i}">
        <button class="up-btn" onclick="uploadLic(${i})">⬆ העלה</button>
      </div>
    </div>`;
  }).join('');
}
function addLicenseList() {
  const n = (prompt('שם הרשימה החדשה:') || '').trim();
  if (!n) return;
  if (!currentLicLists.includes(n)) extraLists.push(n);
  renderLic();
}
async function uploadLic(i) {
  const name = currentLicLists[i];
  const title = document.getElementById('lt-' + i).value.trim();
  const file = document.getElementById('lf-' + i).files[0];
  if (!title) { alert('צריך שם למסמך'); return; }
  if (!file) { alert('בחרי קובץ'); return; }
  if (file.size > 5 * 1024 * 1024) { alert('הקובץ גדול מדי (מקסימום 5MB)'); return; }
  try {
    const b64 = await fileToB64(file);
    await api.uploadDocument({ section: licScope(name), category: 'רישוי', title, file_base64: b64, file_name: file.name, content_type: file.type });
    loadLic();
  } catch (e) { alert('שגיאה: ' + e.message); }
}
async function delLicDoc(id) { if (!confirm('למחוק את המסמך? (אפשר לשחזר מהפח)')) return; try { await api.deleteDocument(id); loadLic(); } catch (e) { alert(e.message); } }

loadBodies();
loadDocs();
loadLic();
</script>

</body>
</html>
