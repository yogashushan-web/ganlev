<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מתעניינים — מערכת גנים</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Heebo',sans-serif; background:#F4EFE6; color:#3D3228; direction:rtl; min-height:100vh; }
    .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; padding-bottom:14px; border-bottom:2px solid #e8e4de; flex-wrap:wrap; gap:12px; }
    .header h1 { font-size:26px; color:#1F3D34; }
    .link-box { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .link-box input { padding:9px 12px; border:1.5px solid #e3ddd2; border-radius:9px; font-family:'Heebo'; font-size:13px; width:64px; text-align:center; outline:none; }
    .btn-link { background:#C4846C; color:#fff; border:none; padding:11px 18px; border-radius:10px; cursor:pointer; font-family:'Heebo'; font-weight:700; font-size:13px; }
    .btn-link:hover { background:#a96b54; }
    .toolbar { display:flex; gap:10px; align-items:center; margin-bottom:18px; flex-wrap:wrap; }
    .toolbar input[type="text"] { padding:10px 14px; border:1.5px solid #e3ddd2; border-radius:10px; font-family:'Heebo'; font-size:14px; outline:none; min-width:260px; }
    .toolbar input:focus { border-color:#1F3D34; }
    .status-tabs { display:flex; gap:8px; flex-wrap:wrap; }
    .status-tab { padding:8px 16px; border:none; background:#fff; border-radius:10px; cursor:pointer; font-family:'Heebo'; font-weight:700; font-size:13px; color:#9B8E82; box-shadow:0 2px 8px rgba(0,0,0,.04); }
    .status-tab:hover { background:#f1ece3; }
    .status-tab.active { background:#1F3D34; color:#fff; }
    .count-pill { background:#fff; border-radius:20px; padding:8px 16px; font-size:13px; box-shadow:0 2px 8px rgba(0,0,0,.05); font-weight:600; color:#1F3D34; margin-right:auto; }
    .error { background:#fdf0ef; color:#c94147; padding:12px; border-radius:10px; margin-bottom:16px; display:none; }
    .error.show { display:block; }
    .success { background:#d4edda; color:#155724; padding:12px; border-radius:10px; margin-bottom:16px; display:none; }
    .success.show { display:block; }
    .cards { display:flex; flex-direction:column; gap:12px; }
    .lead-card { background:#fff; border-radius:16px; padding:18px 20px; box-shadow:0 2px 12px rgba(0,0,0,0.05); }
    .lead-top { display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:12px; margin-bottom:10px; }
    .lead-name { font-size:17px; font-weight:800; color:#1F3D34; }
    .lead-meta { font-size:12.5px; color:#9B8E82; margin-top:3px; }
    .lead-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    select.status-sel { padding:8px 12px; border-radius:9px; border:1.5px solid #e3ddd2; font-family:'Heebo'; font-size:12.5px; font-weight:700; cursor:pointer; outline:none; }
    .btn-delete { padding:8px 12px; border:none; border-radius:9px; cursor:pointer; font-size:12px; font-family:'Heebo'; background:#e74c3c; color:#fff; }
    .lead-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px 20px; margin-bottom:10px; }
    @media(max-width:640px){ .lead-grid{grid-template-columns:1fr;} }
    .lead-field .lbl { font-size:11px; color:#9B8E82; font-weight:700; margin-bottom:2px; }
    .lead-field .val { font-size:14px; }
    a.tel { color:#1F7a4f; text-decoration:none; font-weight:600; }
    .muted { color:#c4bcae; }
    .lead-note { background:#FAF8F4; border-radius:10px; padding:10px 12px; font-size:13.5px; line-height:1.6; margin-top:6px; }
    .lead-note .lbl { font-size:11px; color:#9B8E82; font-weight:700; margin-bottom:3px; }
    .loading { text-align:center; padding:40px; color:#9B8E82; }
    .btn-whatsapp { padding:8px 12px; border:none; border-radius:9px; cursor:pointer; font-size:12px; font-family:'Heebo'; font-weight:700; background:#25D366; color:#fff; }
    .lead-tour { font-size:12.5px; font-weight:700; color:#1F3D34; background:#f1f5f2; border-radius:8px; padding:5px 10px; display:inline-block; margin-top:6px; }
    .tour-box { background:#fff; border-radius:16px; padding:18px 20px; box-shadow:0 2px 12px rgba(0,0,0,0.05); margin-bottom:20px; }
    .tour-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
    .tour-head h2 { font-size:16px; color:#1F3D34; }
    .tour-slot-row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid #f0ece6; font-size:13.5px; flex-wrap:wrap; cursor:pointer; }
    .tour-slot-row:hover { background:#FAF8F4; }
    .tour-slot-info { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .tour-slot-cap { font-size:12px; color:#9B8E82; font-weight:600; }
    .tour-slot-names { background:#FAF8F4; border-radius:10px; padding:8px 12px; margin:2px 0 8px; }
    .tour-name-row { font-size:13px; padding:4px 0; }
    .tour-help { font-size:13px; color:#9B8E82; line-height:1.6; margin-bottom:12px; }
    .add-slot-form { display:none; gap:14px; flex-wrap:wrap; align-items:flex-end; margin-top:12px; padding-top:14px; border-top:1px dashed #e3ddd2; }
    .add-slot-form.show { display:flex; }
    .slot-field { display:flex; flex-direction:column; gap:5px; }
    .slot-field label { font-size:11.5px; color:#9B8E82; font-weight:700; }
    .add-slot-form input { padding:9px 11px; border:1.5px solid #e3ddd2; border-radius:9px; font-family:'Heebo'; font-size:13.5px; outline:none; }
    .add-slot-form input:focus { border-color:#1F3D34; }
    .add-slot-form input[type="date"] { width:150px; }
    .add-slot-form input[type="time"] { width:110px; }
    .add-slot-form input[type="number"] { width:190px; }
    .slot-field.cap label { max-width:190px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>📝 מתעניינים</h1>
    <div class="link-box">
      <span style="font-size:13px; color:#9B8E82; font-weight:600;">שנה:</span>
      <input type="text" id="yearInput" value="">
      <button class="btn-link" onclick="copyFormLink(this)">📋 העתק לינק לטופס</button>
    </div>
  </div>

  <div id="error" class="error"></div>
  <div id="success" class="success"></div>

  <div class="tour-box">
    <div class="tour-head">
      <h2>🗓️ תאריכי סיור מקדים</h2>
      <button class="btn-link" onclick="toggleAddSlot()">+ הוסף תאריך סיור</button>
    </div>
    <p class="tour-help">
      כאן קובעים את התאריכים שבהם אפשר יהיה לתאם סיור היכרות בגן. כל תאריך שתוסיפו יופיע אוטומטית בקישור האישי שנשלח למשפחה (כפתור "📤 שלח הזמנה לסיור" בכרטיס הפנייה למטה), וההורים יבחרו מתוכו את התאריך הנוח להם.
    </p>
    <div id="slotsList" style="color:#9B8E82; font-size:13px;">טוען...</div>
    <div class="add-slot-form" id="addSlotForm">
      <div class="slot-field">
        <label>תאריך הסיור</label>
        <input type="date" id="slotDate">
      </div>
      <div class="slot-field">
        <label>משעה (לא חובה)</label>
        <input type="time" id="slotTimeStart">
      </div>
      <div class="slot-field">
        <label>עד שעה (לא חובה)</label>
        <input type="time" id="slotTimeEnd">
      </div>
      <div class="slot-field cap">
        <label>כמה משפחות יכולות להירשם לתאריך הזה</label>
        <input type="number" id="slotCapacity" value="10" min="1">
      </div>
      <button class="btn-link" onclick="addSlot()">שמור תאריך</button>
    </div>
  </div>

  <div class="toolbar">
    <input type="text" id="search" placeholder="🔍 חיפוש לפי שם ילד / הורה / טלפון...">
    <div class="status-tabs" id="statusTabs"></div>
    <span class="count-pill" id="countPill">—</span>
  </div>

  <div id="list" class="loading">טוען...</div>

<script src="js/common.js?v=17"></script>
<script src="js/api.js?v=17"></script>
<script>
const STATUS_LABELS = { new:'חדש', contacted:'יצרנו קשר', waitlist:'רשימת המתנה', accepted:'התקבל/ה', declined:'לא ממשיך/ה' };
const STATUS_ORDER = ['new', 'contacted', 'waitlist', 'accepted', 'declined'];
let items = [], tourSlots = [], statusFilter = 'all';

const esc = s => (s == null ? '' : String(s)).replace(/</g, '&lt;');
const norm = s => (s || '').replace(/\s+/g, ' ').trim().toLowerCase();

function nextSchoolYear() {
  const d = new Date(), y = d.getFullYear();
  const s = (d.getMonth() >= 8 ? y : y - 1) + 1;
  return s + '-' + String(s + 1).slice(2);
}
document.getElementById('yearInput').value = nextSchoolYear();

const DAY_NAMES = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
function fmtSlotDate(d) {
  const [y, m, dd] = d.split('-').map(Number);
  const dow = new Date(Date.UTC(y, m - 1, dd)).getUTCDay();
  return `יום ${DAY_NAMES[dow]}, ${dd} ב${MONTHS[m - 1]}`;
}

async function loadTourSlots() {
  try {
    const res = await api.getTourSlots();
    tourSlots = res.data || [];
    renderSlots();
    if (items.length) render();
  } catch (err) { document.getElementById('slotsList').textContent = 'שגיאה בטעינת התאריכים: ' + err.message; }
}

function slotBookings(slotId) { return items.filter(it => it.tour_slot_id === slotId); }

function renderSlots() {
  const el = document.getElementById('slotsList');
  if (!tourSlots.length) { el.innerHTML = '<div style="color:#9B8E82; font-size:13px;">עדיין לא נוספו תאריכים. לחצי על "+ הוסף תאריך".</div>'; return; }
  el.innerHTML = tourSlots.map(s => {
    const timeStr = s.time_start ? (s.time_start + (s.time_end ? '–' + s.time_end : '')) : '';
    const bookings = slotBookings(s.id);
    const totalAttendees = bookings.reduce((sum, b) => sum + (b.tour_attendees || 1), 0);
    const namesHtml = bookings.length
      ? bookings.map(b => `<div class="tour-name-row">${esc(b.child_name)}${b.parent1_name ? ' · הורה: ' + esc(b.parent1_name) : ''}${b.parent1_phone ? ` · <a class="tel" href="${waHref(b.parent1_phone)}" target="_blank">💬 ${esc(b.parent1_phone)}</a>` : ''} · ${b.tour_attendees || 1} ${b.tour_attendees === 2 ? 'הורים מגיעים' : 'הורה מגיע/ה'}</div>`).join('')
      : '<div class="tour-name-row muted">עדיין אין רשומים לתאריך הזה</div>';
    return `<div>
      <div class="tour-slot-row" onclick="toggleSlotNames('${s.id}')">
        <div class="tour-slot-info"><b>${fmtSlotDate(s.date)}</b>${timeStr ? ' · ' + esc(timeStr) : ''}
          <span class="tour-slot-cap">${s.booked} מתוך ${s.capacity} משפחות נרשמו${bookings.length ? ' · ' + totalAttendees + ' הורים בסך הכל' : ''} · לחצו לפרטים ⌄</span>
        </div>
        <button class="btn-delete" onclick="event.stopPropagation(); deleteSlot('${s.id}')">מחק</button>
      </div>
      <div class="tour-slot-names" id="names-${s.id}" style="display:none;">${namesHtml}</div>
    </div>`;
  }).join('');
}

function toggleSlotNames(id) {
  const box = document.getElementById('names-' + id);
  if (box) box.style.display = box.style.display === 'none' ? 'block' : 'none';
}

function toggleAddSlot() { document.getElementById('addSlotForm').classList.toggle('show'); }

async function addSlot() {
  const date = document.getElementById('slotDate').value;
  if (!date) { alert('נא לבחור תאריך'); return; }
  const data = {
    date,
    time_start: document.getElementById('slotTimeStart').value.trim() || null,
    time_end: document.getElementById('slotTimeEnd').value.trim() || null,
    capacity: Number(document.getElementById('slotCapacity').value) || 10,
  };
  try {
    await api.createTourSlot(data);
    document.getElementById('slotDate').value = '';
    document.getElementById('slotTimeStart').value = '';
    document.getElementById('slotTimeEnd').value = '';
    document.getElementById('slotCapacity').value = '10';
    document.getElementById('addSlotForm').classList.remove('show');
    loadTourSlots();
  } catch (err) { alert('שגיאה: ' + err.message); }
}

async function deleteSlot(id) {
  if (!confirm('למחוק את התאריך?')) return;
  try { await api.deleteTourSlot(id); loadTourSlots(); }
  catch (err) { alert('שגיאה: ' + err.message); }
}

function sendTourInvite(id) {
  const it = items.find(x => x.id === id);
  if (!it) return;
  if (!tourSlots.length) { alert('קודם צריך להוסיף לפחות תאריך סיור אחד'); return; }
  if (!it.parent1_phone) { alert('אין מספר טלפון להורה 1'); return; }
  const link = location.origin + '/crm/html/tour-book.html?lead=' + it.id;
  const firstName = it.parent1_name ? it.parent1_name.split(' ')[0] : '';
  const text = (firstName ? `היי ${firstName}! ` : 'היי! ') + `תודה שהשארתם לנו פרטים על ${it.child_name} 💛\nנשמח להזמין אתכם לסיור מקדים בגן לב.\nבחרו תאריך נוח כאן: ${link}`;
  window.open(waHref(it.parent1_phone) + '?text=' + encodeURIComponent(text), '_blank');
}

function ageYM(bd) {
  if (!bd) return '';
  const b = new Date(bd), n = new Date();
  let months = (n.getFullYear() - b.getFullYear()) * 12 + (n.getMonth() - b.getMonth());
  if (n.getDate() < b.getDate()) months--;
  if (months < 0) return '';
  return Math.floor(months / 12) + '.' + (months % 12);
}
function formatSubmitted(dateStr) {
  if (!dateStr) return '';
  return new Date(dateStr).toLocaleDateString('he-IL', { year:'numeric', month:'2-digit', day:'2-digit' });
}

function renderStatusTabs() {
  const tabs = [{ key:'all', label:'הכל' }].concat(STATUS_ORDER.map(k => ({ key:k, label:STATUS_LABELS[k] })));
  document.getElementById('statusTabs').innerHTML = tabs.map(t =>
    `<button class="status-tab ${t.key === statusFilter ? 'active' : ''}" onclick="selectStatus('${t.key}')">${t.label}</button>`).join('');
}
function selectStatus(k) { statusFilter = k; renderStatusTabs(); render(); }

async function load() {
  try {
    const res = await api.getInterestForms();
    items = res.data || [];
    render();
    if (tourSlots.length) renderSlots();
  } catch (err) { showError('שגיאה בטעינה: ' + err.message); }
}

function slotLabel(id) {
  const s = tourSlots.find(x => x.id === id);
  if (!s) return null;
  const timeStr = s.time_start ? (' · ' + s.time_start + (s.time_end ? '–' + s.time_end : '')) : '';
  return fmtSlotDate(s.date) + timeStr;
}

function render() {
  const q = norm(document.getElementById('search').value);
  const filtered = items.filter(it => {
    if (statusFilter !== 'all' && (it.status || 'new') !== statusFilter) return false;
    if (!q) return true;
    const hay = norm([it.child_name, it.parent1_name, it.parent1_phone, it.parent2_name, it.parent2_phone].join(' '));
    return hay.includes(q);
  });
  document.getElementById('countPill').textContent = filtered.length + ' פניות';

  if (!filtered.length) {
    document.getElementById('list').innerHTML = '<p style="padding:24px; color:#9B8E82; text-align:center;">אין פניות להצגה.</p>';
    return;
  }

  document.getElementById('list').innerHTML = '<div class="cards">' + filtered.map(it => {
    const age = ageYM(it.birth_date);
    return `<div class="lead-card">
      <div class="lead-top">
        <div>
          <div class="lead-name">${esc(it.child_name)}${it.gender ? ' · ' + esc(it.gender) : ''}${age ? ' · גיל ' + age : ''}</div>
          <div class="lead-meta">התקבל ב-${formatSubmitted(it.created_at)}${it.school_year ? ' · לשנת ' + esc(it.school_year) : ''}</div>
        </div>
        <div class="lead-actions">
          <select class="status-sel" onchange="updateStatus('${it.id}', this.value)">
            ${STATUS_ORDER.map(k => `<option value="${k}" ${(it.status || 'new') === k ? 'selected' : ''}>${STATUS_LABELS[k]}</option>`).join('')}
          </select>
          <button class="btn-whatsapp" onclick="sendTourInvite('${it.id}')">📤 שלח הזמנה לסיור</button>
          <button class="btn-delete" onclick="deleteItem('${it.id}')">מחק</button>
        </div>
      </div>
      <div class="lead-grid">
        <div class="lead-field"><div class="lbl">הורה 1</div><div class="val">${esc(it.parent1_name) || '<span class=\"muted\">-</span>'}${it.parent1_phone ? ` · <a class="tel" href="${waHref(it.parent1_phone)}" target="_blank">💬 ${esc(it.parent1_phone)}</a>` : ''}</div></div>
        <div class="lead-field"><div class="lbl">הורה 2</div><div class="val">${esc(it.parent2_name) || '<span class=\"muted\">-</span>'}${it.parent2_phone ? ` · <a class="tel" href="${waHref(it.parent2_phone)}" target="_blank">💬 ${esc(it.parent2_phone)}</a>` : ''}</div></div>
      </div>
      ${it.tour_slot_id ? `<div class="lead-tour">🗓️ נקבע סיור: ${esc(slotLabel(it.tour_slot_id) || '')} · ${it.tour_attendees || 1} ${it.tour_attendees === 2 ? 'הורים מגיעים' : 'הורה מגיע/ה'}</div>` : ''}
      ${it.family_info ? `<div class="lead-note"><div class="lbl">על המשפחה</div>${esc(it.family_info)}</div>` : ''}
      ${it.child_info ? `<div class="lead-note"><div class="lbl">על הילד/ה</div>${esc(it.child_info)}</div>` : ''}
    </div>`;
  }).join('') + '</div>';
}

async function updateStatus(id, status) {
  try { await api.updateInterestForm(id, { status }); const it = items.find(x => x.id === id); if (it) it.status = status; showSuccess('הסטטוס עודכן'); render(); }
  catch (err) { showError('שגיאה בעדכון: ' + err.message); }
}

async function deleteItem(id) {
  if (!confirm('למחוק את הפנייה?')) return;
  try { await api.deleteInterestForm(id); showSuccess('נמחק'); load(); }
  catch (err) { showError('שגיאה במחיקה: ' + err.message); }
}

function copyFormLink(btn) {
  const year = document.getElementById('yearInput').value.trim() || nextSchoolYear();
  const url = location.origin + '/crm/html/interest-form.html?garden=' + getGardenId() + '&year=' + encodeURIComponent(year);
  navigator.clipboard.writeText(url).then(() => {
    btn.textContent = '✓ הועתק!';
    setTimeout(() => btn.textContent = '📋 העתק לינק לטופס', 2000);
  }, () => { prompt('העתיקי את הלינק:', url); });
}

document.getElementById('search').addEventListener('input', render);
renderStatusTabs();
loadTourSlots();
load();
</script>

</body>
</html>
