<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>זמן הורים — גן לב ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Heebo',sans-serif; background:#F4EFE6; color:#3D3228; direction:rtl; min-height:100vh; padding:18px; }
    .wrap { max-width:680px; margin:0 auto; }
    .hero { background:#FFF; border-radius:18px; padding:24px 22px; box-shadow:0 2px 14px rgba(0,0,0,0.06); margin-bottom:18px; }
    .hero h1 { font-size:24px; color:#1F3D34; margin-bottom:10px; }
    .hero p { font-size:15px; line-height:1.7; color:#5c5347; }
    .hero .hint { font-size:13px; color:#9B8E82; margin-top:12px; }
    .msg { padding:13px 15px; border-radius:12px; margin-bottom:16px; font-weight:600; display:none; }
    .msg.show { display:block; }
    .msg.ok { background:#dcfce7; color:#166534; }
    .msg.err { background:#fdf0ef; color:#c94147; }

    .day { background:#FFF; border-radius:16px; padding:16px 18px; box-shadow:0 2px 12px rgba(0,0,0,0.05); margin-bottom:14px; }
    .day h3 { font-size:16px; color:#1F3D34; margin-bottom:12px; border-bottom:2px solid #f0ece6; padding-bottom:9px; }
    .slots { display:flex; flex-wrap:wrap; gap:9px; }
    .slot { border:1.5px solid #cfe3d8; background:#f4faf6; color:#1F3D34; border-radius:11px; padding:10px 14px; cursor:pointer; font-family:'Heebo'; font-weight:700; font-size:14px; text-align:center; transition:all .15s; }
    .slot:hover { background:#1F3D34; color:#fff; border-color:#1F3D34; transform:translateY(-1px); }
    .slot.taken { background:#f3f0eb; color:#9b8f7e; border-color:#e8e2d8; cursor:default; }
    .slot.taken:hover { transform:none; background:#f3f0eb; color:#9b8f7e; border-color:#e8e2d8; }
    .slot.taken .who { display:block; font-size:11px; font-weight:600; margin-top:2px; opacity:.85; }
    .slot.mine { border-color:#C4846C; background:#fbf1ec; }
    .cancel-mine { display:block; margin-top:5px; font-size:11px; color:#c0492a; background:none; border:none; cursor:pointer; font-family:'Heebo'; font-weight:700; text-decoration:underline; }
    .empty { text-align:center; color:#9B8E82; padding:36px 12px; font-size:15px; }

    .ov { position:fixed; inset:0; background:rgba(31,61,52,.5); display:none; align-items:center; justify-content:center; z-index:99; padding:18px; }
    .ov.show { display:flex; }
    .modal { background:#fff; border-radius:18px; padding:24px; width:100%; max-width:440px; max-height:90vh; overflow:auto; box-shadow:0 20px 60px rgba(0,0,0,.3); }
    .modal h2 { color:#1F3D34; font-size:19px; margin-bottom:4px; }
    .modal .when { color:#9B8E82; font-size:14px; margin-bottom:16px; }
    .modal label { display:block; font-size:13px; font-weight:700; color:#3D3228; margin:14px 0 6px; }
    .modal input[type=text], .modal textarea { width:100%; padding:12px 14px; border:1.5px solid #e3ddd2; border-radius:11px; font-family:'Heebo'; font-size:15px; outline:none; text-align:right; }
    .modal input:focus, .modal textarea:focus { border-color:#1F3D34; }
    .ac { position:relative; }
    .ac-list { position:absolute; top:100%; right:0; left:0; background:#fff; border:1.5px solid #e3ddd2; border-top:none; border-radius:0 0 12px 12px; max-height:230px; overflow:auto; z-index:5; display:none; box-shadow:0 10px 24px rgba(0,0,0,.13); }
    .ac-list.show { display:block; }
    .ac-item { padding:12px 14px; cursor:pointer; font-size:16px; border-bottom:1px solid #f4efe6; }
    .ac-item:last-child { border-bottom:none; }
    .ac-item:active, .ac-item:hover { background:#f4faf6; color:#1F3D34; }
    .ac-item b { color:#1F3D34; }
    .ac-empty { padding:12px 14px; color:#9B8E82; font-size:14px; }
    .parents { display:flex; flex-direction:column; gap:8px; margin-top:4px; }
    .pchk { display:flex; align-items:center; gap:9px; background:#FAF8F4; border:1.5px solid #eee6da; border-radius:10px; padding:10px 12px; cursor:pointer; font-size:15px; font-weight:600; }
    .pchk input { width:18px; height:18px; accent-color:#1F3D34; }
    .pnote { font-size:12px; color:#9B8E82; margin-top:6px; }
    .mErr { color:#c94147; font-size:13px; font-weight:600; margin-top:10px; min-height:16px; }
    .mBtns { display:flex; gap:10px; margin-top:18px; }
    .ok { flex:1; background:#1F3D34; color:#fff; border:none; padding:13px; border-radius:12px; cursor:pointer; font-family:'Heebo'; font-weight:700; font-size:15px; }
    .ok:hover { background:#154428; }
    .ok:disabled { background:#9aa7a0; cursor:progress; }
    .cancelb { background:#f0ece6; color:#333; border:none; padding:13px 20px; border-radius:12px; cursor:pointer; font-family:'Heebo'; font-weight:600; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <h1>זמן הורים</h1>
      <p>בחרו שעה פנויה מהרשימה 👇 אם לא מצאתם זמן שמתאים, כתבו לנו בפרטי ונמצא יחד.</p>
    </div>

    <div id="msg" class="msg"></div>
    <div id="days"><div class="empty">טוען שעות פנויות…</div></div>
  </div>

  <div class="ov" id="ov">
    <div class="modal">
      <h2>השתבצות לשיחה</h2>
      <div class="when" id="mWhen"></div>

      <label>שם הילד/ה</label>
      <div class="ac">
        <input type="text" id="child" autocomplete="off" placeholder="התחילו להקליד את השם…">
        <div class="ac-list" id="acList"></div>
      </div>

      <div id="parentsWrap" style="display:none;">
        <label>מי מההורים מגיע/ים? <span style="font-weight:400;color:#9B8E82;">(סמנו)</span></label>
        <div class="parents" id="parents"></div>
      </div>

      <label>נושא השיחה <span style="font-weight:400;color:#9B8E82;">(לא חובה)</span></label>
      <textarea id="topic" rows="3" placeholder="משהו שתרצו שנתייחס אליו? אפשר גם להשאיר ריק"></textarea>

      <div class="mErr" id="mErr"></div>
      <div class="mBtns">
        <button class="ok" id="okBtn">אישור השתבצות</button>
        <button class="cancelb" onclick="closeOv()">ביטול</button>
      </div>
    </div>
  </div>

<script>
const API = '/.netlify/functions/meetings';
const LS = 'ganlev_meetings';
const DOW = ['יום ראשון','יום שני','יום שלישי','יום רביעי','יום חמישי','יום שישי','שבת'];
const MON = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
let slots = [], children = [], selected = null;
const esc = s => (s == null ? '' : String(s)).replace(/</g, '&lt;');

function mine() { try { return JSON.parse(localStorage.getItem(LS) || '[]'); } catch (e) { return []; } }
function saveMine(a) { localStorage.setItem(LS, JSON.stringify(a)); }
function tokenFor(id) { const m = mine().find(x => x.slot_id === id); return m ? m.cancel_token : null; }

function fmtDay(d) { const dt = new Date(d + 'T00:00:00'); return DOW[dt.getDay()] + ' · ' + dt.getDate() + ' ב' + MON[dt.getMonth()]; }
function showMsg(t, k) { const el = document.getElementById('msg'); el.textContent = t; el.className = 'msg show ' + k; window.scrollTo({ top: 0, behavior: 'smooth' }); }

async function load() {
  try {
    const d = await (await fetch(API)).json();
    slots = d.slots || []; children = d.children || [];
    render();
  } catch (e) {
    document.getElementById('days').innerHTML = '<div class="empty">שגיאה בטעינה. נסו לרענן 🙏</div>';
  }
}

function render() {
  if (!slots.length) {
    document.getElementById('days').innerHTML = '<div class="empty">אין כרגע שעות פנויות. אם כולן נתפסו — כתבו לנו בפרטי 🙏</div>';
    return;
  }
  const byDay = {};
  slots.forEach(s => { (byDay[s.date] = byDay[s.date] || []).push(s); });
  document.getElementById('days').innerHTML = Object.keys(byDay).sort().map(date => {
    const chips = byDay[date].map(s => {
      const t = s.time + (s.end ? '–' + s.end : '');
      if (!s.taken) return `<div class="slot" onclick="openBook('${s.id}')">${t}</div>`;
      const isMine = !!tokenFor(s.id);
      return `<div class="slot taken ${isMine ? 'mine' : ''}">${t}<span class="who">${esc(s.child)}${isMine ? ' (שלכם)' : ''}</span>${isMine ? `<button class="cancel-mine" onclick="cancelMine('${s.id}')">בטל את הפגישה שלי</button>` : ''}</div>`;
    }).join('');
    return `<div class="day"><h3>${fmtDay(date)}</h3><div class="slots">${chips}</div></div>`;
  }).join('');
}

function openBook(id) {
  selected = slots.find(s => s.id === id); if (!selected) return;
  document.getElementById('mWhen').textContent = fmtDay(selected.date) + ' · ' + selected.time + (selected.end ? '–' + selected.end : '');
  document.getElementById('child').value = '';
  document.getElementById('acList').className = 'ac-list';
  document.getElementById('topic').value = '';
  document.getElementById('mErr').textContent = '';
  document.getElementById('parentsWrap').style.display = 'none';
  document.getElementById('parents').innerHTML = '';
  document.getElementById('ov').classList.add('show');
  setTimeout(() => document.getElementById('child').focus(), 100);
}
function closeOv() { document.getElementById('ov').classList.remove('show'); }

// ---- custom child-name autocomplete + load that child's parents ----
const childInput = document.getElementById('child');
const acList = document.getElementById('acList');
let parentReqSeq = 0;

function highlight(name, q) {
  const i = name.indexOf(q);
  if (i < 0) return esc(name);
  return esc(name.slice(0, i)) + '<b>' + esc(name.slice(i, i + q.length)) + '</b>' + esc(name.slice(i + q.length));
}
function renderAc() {
  const q = childInput.value.trim();
  if (!q) { acList.className = 'ac-list'; acList.innerHTML = ''; return; }
  const m = children.filter(c => c.name.includes(q)).slice(0, 15);
  acList.className = 'ac-list show';
  acList.innerHTML = m.length
    ? m.map(c => `<div class="ac-item" data-name="${esc(c.name)}">${highlight(c.name, q)}</div>`).join('')
    : '<div class="ac-empty">לא נמצא ילד/ה בשם הזה</div>';
}
function pickChild(name) { childInput.value = name; acList.className = 'ac-list'; loadParentsFor(name); }

async function loadParentsFor(name) {
  const kid = children.find(c => c.name === (name || '').trim());
  const wrap = document.getElementById('parentsWrap'), box = document.getElementById('parents');
  if (!kid) { wrap.style.display = 'none'; box.innerHTML = ''; return; }
  const seq = ++parentReqSeq;
  box.innerHTML = '<div class="pnote">טוען הורים…</div>'; wrap.style.display = 'block';
  try {
    const d = await (await fetch(API + '?parents_for=' + encodeURIComponent(kid.id))).json();
    if (seq !== parentReqSeq) return;
    const ps = d.parents || [];
    box.innerHTML = ps.length
      ? ps.map(p => `<label class="pchk"><input type="checkbox" class="pcheck" value="${esc(p)}" checked> ${esc(p)}</label>`).join('')
      : '<div class="pnote">לא נמצאו הורים רשומים — אפשר להמשיך בלי לסמן.</div>';
  } catch (e) { box.innerHTML = '<div class="pnote">לא הצלחנו לטעון הורים — אפשר להמשיך.</div>'; }
}

childInput.addEventListener('input', () => { renderAc(); loadParentsFor(childInput.value); });
childInput.addEventListener('focus', renderAc);
childInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); const f = acList.querySelector('.ac-item'); if (f) pickChild(f.dataset.name); }
});
// mousedown (not click) so the pick registers before the input loses focus
acList.addEventListener('mousedown', e => { const it = e.target.closest('.ac-item'); if (it) { e.preventDefault(); pickChild(it.dataset.name); } });
document.addEventListener('click', e => { if (!e.target.closest('.ac')) acList.className = 'ac-list'; });

async function book() {
  const child = document.getElementById('child').value.trim();
  const topic = document.getElementById('topic').value.trim();
  const kid = children.find(c => c.name === child);
  if (!child) { document.getElementById('mErr').textContent = 'בבקשה בחרו שם ילד/ה מהרשימה'; return; }
  const parents = [...document.querySelectorAll('.pcheck:checked')].map(c => c.value);
  const btn = document.getElementById('okBtn'); btn.disabled = true; btn.textContent = 'משבץ…';
  try {
    const d = await (await fetch(API, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'book', slot_id: selected.id, child_id: kid ? kid.id : null, child_name: child, parents, topic }),
    })).json();
    if (!d.success) throw new Error(d.error || 'שגיאה');
    const arr = mine(); arr.push({ slot_id: selected.id, cancel_token: d.cancel_token, child }); saveMine(arr);
    closeOv();
    showMsg('✅ נשמר! נתראה ב' + fmtDay(d.slot.date) + ' בשעה ' + d.slot.time + '. תודה ❤️', 'ok');
    await load();
  } catch (e) {
    document.getElementById('mErr').textContent = e.message;
    btn.disabled = false; btn.textContent = 'אישור השתבצות';
    if (String(e.message).includes('נתפסה')) { closeOv(); await load(); }
  }
}
document.getElementById('okBtn').addEventListener('click', book);

async function cancelMine(id) {
  if (!confirm('לבטל את הפגישה?')) return;
  const token = tokenFor(id);
  try {
    const d = await (await fetch(API, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'cancel', slot_id: id, cancel_token: token }),
    })).json();
    if (!d.success) throw new Error(d.error || 'שגיאה');
    saveMine(mine().filter(x => x.slot_id !== id));
    showMsg('הפגישה בוטלה. המשבצת שוב פנויה 🙏', 'ok');
    await load();
  } catch (e) { showMsg('שגיאה בביטול: ' + e.message, 'err'); }
}

load();
</script>
</body>
</html>
