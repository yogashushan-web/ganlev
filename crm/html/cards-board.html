<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>לוח כרטיסים אישיים — גן לב</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Heebo',sans-serif; background:#F4EFE6; color:#2b2b2b; direction:rtl; }
    .wrap { max-width:820px; margin:0 auto; padding:24px 18px 60px; }
    .bar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
    .btn { border:none; padding:11px 18px; border-radius:11px; cursor:pointer; font-family:'Heebo'; font-weight:700; font-size:14px; }
    .btn.print { background:#1F3D34; color:#fff; } .btn.mail { background:#5f93b8; color:#fff; } .btn.ghost { background:#efe9e0; color:#6f6457; }
    h1 { font-size:24px; color:#1F3D34; text-align:center; margin-bottom:4px; }
    .sub { text-align:center; color:#9B8E82; font-size:13px; margin-bottom:20px; }
    .kid { background:#fff; border-radius:14px; padding:16px 18px; box-shadow:0 2px 10px rgba(0,0,0,.06); margin-bottom:16px; break-inside:avoid; border-top:4px solid #C4846C; }
    .kh { display:flex; align-items:center; gap:14px; margin-bottom:10px; flex-wrap:wrap; }
    .kh img { width:66px; height:66px; border-radius:50%; object-fit:cover; border:2px solid #eee; }
    .kh .noimg { width:66px; height:66px; border-radius:50%; background:#f1ece3; display:flex; align-items:center; justify-content:center; font-size:26px; color:#c3b8a8; }
    .kh .nm { font-size:19px; font-weight:800; color:#1F3D34; }
    .kh .age { font-size:12.5px; color:#9B8E82; display:block; margin-top:2px; }
    .song { background:#fbf4ef; border-radius:10px; padding:8px 12px; font-size:14px; color:#a05a3d; margin:6px 0 10px; }
    .qa { margin-top:9px; } .qa .q { font-size:12.5px; font-weight:700; color:#a05a3d; } .qa .a { font-size:14.5px; line-height:1.6; white-space:pre-wrap; }
    .todo { color:#c48a3a; font-weight:700; font-size:14px; }
    @media print { body{background:#fff;} .bar{display:none;} .kid{box-shadow:none;border:1px solid #ddd;} }
    .msg { text-align:center; color:#c0492a; padding:30px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar">
      <button class="btn print" onclick="window.print()">🖨️ הדפסה</button>
      <button class="btn mail" onclick="emailBoard()">✉️ שלח למייל</button>
      <button class="btn ghost" onclick="location.reload()">↻ רענון</button>
    </div>
    <h1>🗳️ לוח כרטיסים אישיים</h1>
    <div class="sub">גן לב · מהמבוגר/ת לצעיר/ה</div>
    <div id="board"><div class="msg">טוען…</div></div>
  </div>
<script>
  const API = '/.netlify/functions/child-boards';
  const GID = '5120efca-8bb0-47a3-90d2-2c6a5a013e31';
  const KEY = new URLSearchParams(location.search).get('admin') || '';
  const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function age(bd){ if(!bd) return ''; const [y,m,d]=bd.split('-').map(Number); const n=new Date(); let mo=(n.getFullYear()-y)*12+(n.getMonth()+1-m); if(n.getDate()<d) mo--; const yy=Math.floor(mo/12), mm=mo%12; return (yy?yy+' ש׳ ':'')+(mm?mm+' ח׳':'') || 'פחות מחודש'; }
  function fmtBd(bd){ if(!bd) return ''; const [y,m,d]=bd.split('-'); return `${d}.${m}.${y}`; }
  function filled(d){ return !!(d && ((d.answers&&d.answers.some(a=>a&&a.a))||d.favorite_song||d.photo)); }

  async function load() {
    if (!KEY) { document.getElementById('board').innerHTML='<div class="msg">קישור לא תקין — חסר קוד גישה.</div>'; return; }
    try {
      const d = await (await fetch(`${API}?garden_id=${GID}&type=cards&admin=${encodeURIComponent(KEY)}`)).json();
      if (!d.success) { document.getElementById('board').innerHTML='<div class="msg">אין הרשאה.</div>'; return; }
      document.getElementById('board').innerHTML = (d.rows||[]).map(cardHtml).join('');
    } catch(e){ document.getElementById('board').innerHTML='<div class="msg">שגיאה: '+esc(e.message)+'</div>'; }
  }
  function cardHtml(r) {
    const d = r.data;
    const img = (d && d.photo) ? `<img src="${d.photo}" alt="">` : `<div class="noimg">🧒</div>`;
    const head = `<div class="kh">${img}<div><span class="nm">${esc(r.name)}</span>${r.birth_date?`<span class="age">${fmtBd(r.birth_date)} · ${age(r.birth_date)}</span>`:''}</div></div>`;
    if (!filled(d)) return `<div class="kid">${head}<div class="todo">טרם מולא</div></div>`;
    const song = d.favorite_song ? `<div class="song">🎵 שיר אהוב: ${esc(d.favorite_song)}</div>` : '';
    const qa = (d.answers||[]).filter(a=>a&&a.a).map(a=>`<div class="qa"><div class="q">${esc(a.q)}</div><div class="a">${esc(a.a)}</div></div>`).join('');
    return `<div class="kid">${head}${song}${qa}</div>`;
  }
  async function emailBoard() {
    try { const r = await (await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'email',type:'cards',garden_id:GID,admin:KEY})})).json();
      alert(r.success?'הלוח נשלח למייל 📩':('שגיאה: '+(r.error||''))); } catch(e){ alert('שגיאה: '+e.message); }
  }
  load();
</script>
</body>
</html>
