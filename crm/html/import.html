<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ייבוא מטבלה — מערכת ניהול גנים</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Heebo',sans-serif; background:#F4EFE6; color:#3D3228; direction:rtl; min-height:100vh; }
    h1 { font-size:26px; color:#1F3D34; margin-bottom:6px; }
    .lead { color:#9B8E82; font-size:14px; margin-bottom:24px; }
    .card { background:#FFF; border-radius:18px; padding:24px; box-shadow:0 4px 16px rgba(31,61,52,0.06); margin-bottom:22px; }
    .types { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:6px; }
    .type-btn { flex:1; min-width:150px; background:#F4EFE6; border:2px solid transparent; border-radius:14px; padding:16px; cursor:pointer; font-family:'Heebo'; text-align:center; transition:all .18s; }
    .type-btn .t-ico { font-size:26px; display:block; margin-bottom:6px; }
    .type-btn .t-lbl { font-weight:700; color:#1F3D34; font-size:15px; }
    .type-btn:hover { background:#ece6db; }
    .type-btn.active { border-color:#1F3D34; background:#fff; box-shadow:0 4px 14px rgba(31,61,52,0.12); }
    .hint { background:#f3f8f3; border:1px solid #d9ead9; border-radius:12px; padding:14px 16px; font-size:13px; color:#3D3228; margin:18px 0; line-height:1.7; }
    .hint code { background:#1F3D34; color:#fff; padding:2px 8px; border-radius:6px; font-size:12px; margin:0 2px; display:inline-block; }
    label { display:block; font-size:13px; font-weight:700; color:#1F3D34; margin-bottom:8px; }
    textarea { width:100%; min-height:160px; padding:14px; border:1.5px solid #e3ddd2; border-radius:12px; font-family:'Heebo',monospace; font-size:13px; outline:none; resize:vertical; direction:ltr; text-align:right; }
    textarea:focus { border-color:#1F3D34; }
    .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:14px; }
    .btn { background:#1F3D34; color:#fff; border:none; border-radius:12px; padding:13px 26px; font-family:'Heebo'; font-weight:700; font-size:14px; cursor:pointer; transition:all .2s; }
    .btn:hover { background:#154428; transform:translateY(-1px); }
    .btn.alt { background:#C4846C; }
    .btn.alt:hover { background:#a96b54; }
    .btn:disabled { background:#cfc8bd; cursor:not-allowed; transform:none; }
    .file-label { font-size:13px; color:#9B8E82; cursor:pointer; text-decoration:underline; }
    input[type=file] { display:none; }
    table { width:100%; border-collapse:collapse; margin-top:8px; font-size:13px; }
    th { background:#1F3D34; color:#fff; padding:10px 12px; text-align:right; font-weight:500; font-size:12px; position:sticky; top:0; }
    td { padding:9px 12px; border-bottom:1px solid #f0ece6; }
    tr.bad td { background:#fdf0ef; }
    .tbl-wrap { max-height:360px; overflow:auto; border-radius:12px; border:1px solid #f0ece6; }
    .summary { display:flex; gap:18px; flex-wrap:wrap; margin:14px 0; }
    .pill { padding:8px 16px; border-radius:20px; font-weight:700; font-size:14px; }
    .pill.ok { background:#d4edda; color:#155724; }
    .pill.warn { background:#fff3cd; color:#856404; }
    .msg { padding:14px 16px; border-radius:12px; margin-top:16px; font-size:14px; font-weight:600; display:none; }
    .msg.show { display:block; }
    .msg.success { background:#d4edda; color:#155724; }
    .msg.error { background:#fdf0ef; color:#c0563f; }
    @media(max-width:600px){ .type-btn{min-width:120px;} }
  </style>
</head>
<body>

  <h1>📥 ייבוא מטבלה</h1>
  <div class="lead">העתיקי טבלה מ-Excel / Numbers / Google Sheets והדביקי כאן, או טעני קובץ CSV. נראה תצוגה מקדימה לפני שמייבאים.</div>

  <div class="card">
    <label>מה מייבאים?</label>
    <div class="types">
      <div class="type-btn active" data-type="children"><span class="t-ico">👶</span><span class="t-lbl">ילדים חדשים</span></div>
      <div class="type-btn" data-type="income"><span class="t-ico">📈</span><span class="t-lbl">הכנסות</span></div>
      <div class="type-btn" data-type="expenses"><span class="t-ico">📉</span><span class="t-lbl">הוצאות</span></div>
    </div>
    <div class="hint" id="hint"></div>

    <label for="data">הדביקי כאן את הטבלה (שורה ראשונה = כותרות)</label>
    <textarea id="data" placeholder="שם פרטי	שם משפחה	תאריך לידה&#10;נועה	כהן	2021-03-15&#10;איתי	לוי	2020-11-02"></textarea>

    <div class="row">
      <button class="btn" id="parseBtn">🔍 נתח טבלה</button>
      <label class="file-label" for="fileInput">או טעני קובץ CSV</label>
      <input type="file" id="fileInput" accept=".csv,.tsv,.txt">
    </div>
  </div>

  <div class="card" id="previewCard" style="display:none;">
    <label>תצוגה מקדימה</label>
    <div class="summary" id="summary"></div>
    <div class="tbl-wrap"><table id="previewTable"></table></div>
    <div class="row">
      <button class="btn alt" id="importBtn">✅ ייבא עכשיו</button>
      <span style="color:#9B8E82;font-size:13px;">שורות עם נתון חסר (באדום) ידולגו אוטומטית.</span>
    </div>
    <div class="msg" id="msg"></div>
  </div>

<script src="js/common.js"></script>
<script src="js/api.js"></script>
<script>
let currentType = 'children';
let parsedRows = [];

const SCHEMAS = {
  children: {
    fields: ['first_name_he', 'last_name_he', 'name_en', 'gender_he', 'national_id', 'birth_date'],
    headers: { first_name_he: 'שם פרטי', last_name_he: 'שם משפחה', name_en: 'Name', gender_he: 'מין', national_id: 'ת"ז', birth_date: 'תאריך לידה' },
    required: ['first_name_he'],
    hint: 'עמודות: <code>שם פרטי</code> <code>שם משפחה</code> <code>Name</code> <code>מין</code> <code>תאריך לידה</code> - הכל לא חובה חוץ מהשם. אפשר גם עמודה אחת <code>שם מלא</code>.',
  },
  income: {
    fields: ['source_he', 'amount', 'receipt_date', 'category_he', 'notes_he'],
    headers: { source_he: 'מקור', amount: 'סכום', receipt_date: 'תאריך', category_he: 'קטגוריה', notes_he: 'הערות' },
    required: ['source_he', 'amount'],
    hint: 'עמודות: <code>מקור</code> <code>סכום</code> <code>תאריך</code> <code>קטגוריה</code> (לא חובה) <code>הערות</code> (לא חובה).',
  },
  expenses: {
    fields: ['description_he', 'amount', 'expense_date', 'category_he', 'payment_method_he'],
    headers: { description_he: 'תיאור', amount: 'סכום', expense_date: 'תאריך', category_he: 'קטגוריה', payment_method_he: 'אמצעי תשלום' },
    required: ['description_he', 'amount'],
    hint: 'עמודות: <code>תיאור</code> <code>סכום</code> <code>תאריך</code> <code>קטגוריה</code> <code>אמצעי תשלום</code> (לא חובה).',
  },
};

const SYNONYMS = {
  first_name_he: ['שם פרטי', 'פרטי', 'first name', 'firstname', 'first'],
  last_name_he: ['שם משפחה', 'משפחה', 'last name', 'lastname', 'surname'],
  _full: ['שם מלא', 'שם הילד', 'ילד', 'child', 'full name'],
  name_en: ['name', 'english', 'אנגלית', 'שם באנגלית', 'name en'],
  gender_he: ['מין', 'gender', 'sex'],
  national_id: ['תעודת זהות', 'ת"ז', 'תז', 'national id'],
  birth_date: ['תאריך לידה', 'לידה', 'birth', 'birthday', 'birthdate', 'dob'],
  source_he: ['מקור', 'source', 'סוג', 'type'],
  amount: ['סכום', 'amount', '₪', 'price', 'סך', 'עלות', 'total'],
  receipt_date: ['תאריך', 'date', 'תאריך קבלה', 'יום'],
  expense_date: ['תאריך', 'date', 'תאריך הוצאה'],
  category_he: ['קטגוריה', 'category', 'קט'],
  notes_he: ['הערות', 'הערה', 'notes', 'note'],
  payment_method_he: ['אמצעי תשלום', 'תשלום', 'payment', 'method', 'אמצעי'],
  description_he: ['תיאור', 'description', 'פירוט', 'הוצאה', 'פריט', 'item'],
};

function setType(type) {
  currentType = type;
  document.querySelectorAll('.type-btn').forEach(b => b.classList.toggle('active', b.dataset.type === type));
  document.getElementById('hint').innerHTML = SCHEMAS[type].hint;
  document.getElementById('previewCard').style.display = 'none';
}

document.querySelectorAll('.type-btn').forEach(b => b.addEventListener('click', () => setType(b.dataset.type)));

function normalizeDate(v) {
  if (!v) return '';
  const s = String(v).trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);
  if (m) {
    let [, d, mo, y] = m;
    if (y.length === 2) y = '20' + y;
    return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`;
  }
  return '';
}

function fieldForHeader(header, type) {
  const h = String(header).trim().toLowerCase();
  const fields = SCHEMAS[type].fields.concat(type === 'children' ? ['_full'] : []);
  for (const f of fields) {
    const syns = SYNONYMS[f] || [];
    if (syns.some(s => h === s.toLowerCase() || h.includes(s.toLowerCase()))) return f;
  }
  return null;
}

function parseTable(text, type) {
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length);
  if (lines.length < 2) return [];
  const delim = lines[0].includes('\t') ? '\t' : ',';
  const headers = lines[0].split(delim).map(h => h.trim());
  const map = headers.map(h => fieldForHeader(h, type));

  return lines.slice(1).map(line => {
    const cells = line.split(delim);
    const obj = {};
    map.forEach((field, i) => {
      if (!field) return;
      const val = (cells[i] || '').trim();
      if (field === '_full') {
        const parts = val.split(/\s+/);
        obj.first_name_he = obj.first_name_he || parts.shift() || '';
        obj.last_name_he = obj.last_name_he || parts.join(' ');
      } else if (field === 'birth_date' || field === 'receipt_date' || field === 'expense_date') {
        obj[field] = normalizeDate(val);
      } else {
        obj[field] = val;
      }
    });
    return obj;
  });
}

function rowValid(row, type) {
  return SCHEMAS[type].required.every(f => {
    const v = row[f];
    if (f === 'amount') return v !== undefined && v !== '' && !isNaN(parseFloat(String(v).replace(/[₪,\s]/g,'')));
    return v !== undefined && String(v).trim() !== '';
  });
}

function renderPreview() {
  const type = currentType;
  const sc = SCHEMAS[type];
  const valid = parsedRows.filter(r => rowValid(r, type));
  const invalid = parsedRows.length - valid.length;

  document.getElementById('summary').innerHTML =
    `<span class="pill ok">✓ ${valid.length} שורות תקינות</span>` +
    (invalid ? `<span class="pill warn">⚠ ${invalid} ידולגו</span>` : '');

  const head = '<thead><tr>' + sc.fields.map(f => `<th>${sc.headers[f]}</th>`).join('') + '</tr></thead>';
  const body = '<tbody>' + parsedRows.slice(0, 50).map(r => {
    const bad = !rowValid(r, type);
    return `<tr class="${bad ? 'bad' : ''}">` + sc.fields.map(f => `<td>${r[f] || ''}</td>`).join('') + '</tr>';
  }).join('') + '</tbody>';
  document.getElementById('previewTable').innerHTML = head + body;
  document.getElementById('previewCard').style.display = 'block';
  document.getElementById('msg').classList.remove('show');
  document.getElementById('importBtn').disabled = valid.length === 0;
}

function doParse() {
  const text = document.getElementById('data').value;
  parsedRows = parseTable(text, currentType);
  if (parsedRows.length === 0) {
    alert('לא זוהו שורות. ודאי ששורה ראשונה היא כותרות ושיש לפחות שורת נתונים אחת.');
    return;
  }
  renderPreview();
}

document.getElementById('parseBtn').addEventListener('click', doParse);

document.getElementById('fileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => { document.getElementById('data').value = reader.result; doParse(); };
  reader.readAsText(file, 'UTF-8');
});

document.getElementById('importBtn').addEventListener('click', async () => {
  const type = currentType;
  const valid = parsedRows.filter(r => rowValid(r, type));
  const btn = document.getElementById('importBtn');
  const msg = document.getElementById('msg');
  btn.disabled = true; btn.textContent = 'מייבא...';
  try {
    const res = await api.importRows(type, valid);
    msg.className = 'msg success show';
    msg.innerHTML = `✅ יובאו ${res.inserted} רשומות בהצלחה` + (res.skipped ? ` (${res.skipped} דולגו)` : '') +
      '. <a href="dashboard.html" style="color:#155724;">חזרה ללוח הבקרה</a>';
    document.getElementById('data').value = '';
    parsedRows = [];
    document.getElementById('previewCard').querySelector('.tbl-wrap').style.display = 'none';
  } catch (err) {
    msg.className = 'msg error show';
    msg.textContent = '❌ שגיאה בייבוא: ' + err.message;
  } finally {
    btn.disabled = false; btn.textContent = '✅ ייבא עכשיו';
  }
});

setType('children');
</script>

</body>
</html>
