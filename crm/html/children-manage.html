<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ניהול ילדים — מערכת גנים</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Heebo',sans-serif; background:#F4EFE6; color:#3D3228; direction:rtl; min-height:100vh; }
    .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; padding-bottom:14px; border-bottom:2px solid #e8e4de; flex-wrap:wrap; gap:12px; }
    .header h1 { font-size:26px; color:#1F3D34; }
    .header .sub { font-size:13px; color:#9B8E82; }
    .btn-add { background:#1F3D34; color:#FFF; border:none; padding:12px 22px; border-radius:10px; cursor:pointer; font-family:'Heebo'; font-weight:700; }
    .btn-add:hover { background:#154428; }
    .toolbar { display:flex; gap:10px; align-items:center; margin-bottom:18px; flex-wrap:wrap; }
    .toolbar input { padding:9px 14px; border:1.5px solid #e3ddd2; border-radius:10px; font-family:'Heebo'; font-size:13px; outline:none; flex:1; min-width:160px; }
    .toolbar input:focus { border-color:#1F3D34; }
    th.sortable { cursor:pointer; user-select:none; }
    th.sortable:hover { background:#2a5246; }
    th .arr { font-size:10px; margin-right:4px; }
    .count-pill { background:#fff; border-radius:20px; padding:8px 16px; font-size:13px; box-shadow:0 2px 8px rgba(0,0,0,.05); font-weight:600; color:#1F3D34; }
    .year-tabs { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
    .year-tab { padding:9px 18px; border:none; background:#fff; border-radius:10px; cursor:pointer; font-family:'Heebo'; font-weight:700; font-size:14px; color:#9B8E82; box-shadow:0 2px 8px rgba(0,0,0,.04); transition:all .15s; }
    .year-tab:hover { background:#f1ece3; }
    .year-tab.active { background:#1F3D34; color:#fff; }
    .form-container { background:#FFF; border-radius:16px; padding:26px; box-shadow:0 2px 12px rgba(0,0,0,0.05); margin-bottom:24px; display:none; }
    .form-container.show { display:block; }
    .form-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; }
    .form-group { margin-bottom:16px; }
    label { display:block; font-size:12px; color:#3D3228; font-weight:700; margin-bottom:6px; }
    input, select { width:100%; padding:11px 13px; border:1px solid #e8e4de; border-radius:10px; font-family:'Heebo'; font-size:14px; outline:none; text-align:right; }
    input:focus, select:focus { border-color:#1F3D34; }
    .btn-submit { background:#1F3D34; color:#FFF; border:none; padding:12px 24px; border-radius:10px; cursor:pointer; font-family:'Heebo'; font-weight:700; }
    .btn-submit:hover { background:#154428; }
    .btn-cancel { background:#f0ece6; color:#333; border:none; padding:12px 24px; border-radius:10px; cursor:pointer; font-family:'Heebo'; margin-right:10px; }
    .error { background:#fdf0ef; color:#c94147; padding:12px; border-radius:10px; margin-bottom:16px; display:none; }
    .error.show { display:block; }
    .success { background:#d4edda; color:#155724; padding:12px; border-radius:10px; margin-bottom:16px; display:none; }
    .success.show { display:block; }
    .tbl-wrap { overflow-x:auto; border-radius:16px; box-shadow:0 2px 12px rgba(0,0,0,0.05); }
    table { width:100%; border-collapse:collapse; background:#FFF; }
    th { background:#1F3D34; color:#FFF; padding:12px 14px; font-weight:600; font-size:12px; text-align:right; white-space:nowrap; }
    td { padding:11px 14px; border-bottom:1px solid #f0ece6; font-size:13px; white-space:nowrap; }
    tr:last-child td { border-bottom:none; }
    tr:hover td { background:#FAF8F4; }
    td.en { direction:ltr; text-align:left; color:#6f6457; }
    .g-badge { display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; }
    .g-m { background:#dbeafe; color:#1e4e8c; }
    .g-f { background:#fce7f3; color:#9d2463; }
    .fee-badge { display:inline-block; margin-right:8px; padding:2px 9px; border-radius:20px; font-size:11px; font-weight:700; background:#f3ede3; color:#6f6457; vertical-align:middle; cursor:help; }
    .fee-free { background:#dcf5e7; color:#1F3D34; }
    .muted { color:#c4bcae; }
    .btn-edit, .btn-delete { padding:6px 11px; border:none; border-radius:8px; cursor:pointer; font-size:12px; font-family:'Heebo'; }
    .btn-edit { background:#C4846C; color:#FFF; }
    .btn-delete { background:#e74c3c; color:#FFF; }
    .name-link { color:#1F3D34; font-weight:700; cursor:pointer; text-decoration:underline; }
    .name-link:hover { color:#C4846C; }
    .ov { position:fixed; inset:0; background:rgba(31,61,52,.45); display:none; align-items:center; justify-content:center; z-index:99999; padding:18px; }
    .ov.show { display:flex; }
    .pf { background:#fff; border-radius:18px; padding:26px; width:100%; max-width:480px; max-height:86vh; overflow:auto; box-shadow:0 20px 60px rgba(0,0,0,.3); }
    .pf h2 { color:#1F3D34; margin-bottom:4px; font-size:21px; }
    .pf .role { color:#9B8E82; font-size:13px; margin-bottom:10px; }
    .docs-head { font-weight:800; color:#1F3D34; margin:14px 0 10px; font-size:15px; border-top:1px solid #f0ece6; padding-top:14px; }
    .doc-file { display:flex; justify-content:space-between; align-items:center; gap:8px; background:#FAF8F4; border:1px solid #f0ece6; border-radius:9px; padding:9px 11px; font-size:13px; margin-bottom:7px; }
    .doc-file a, .doc-file .open { color:#1F7a4f; text-decoration:none; font-weight:700; cursor:pointer; background:none; border:none; font-family:'Heebo'; font-size:13px; padding:0; }
    .doc-file .open:hover { text-decoration:underline; }
    .doc-file .del { background:none; border:none; color:#e74c3c; cursor:pointer; font-size:14px; }
    .doc-file.contract { background:#f4f9f6; border-color:#d8ebe1; }
    .doc-file.contract.missing { background:#FAF8F4; border-style:dashed; border-color:#e2dcd2; }
    .cp-add { background:#1F3D34; color:#fff; border:none; border-radius:8px; padding:8px 14px; font-size:12px; font-family:'Heebo'; font-weight:700; cursor:pointer; }
    .cp-close { margin-top:18px; width:100%; background:#f0ece6; border:none; border-radius:10px; padding:11px; font-family:'Heebo'; font-weight:700; cursor:pointer; }
    .card-q { font-weight:700; color:#1F3D34; font-size:13px; margin-top:13px; }
    .card-a { font-size:14px; color:#3D3228; white-space:pre-wrap; line-height:1.55; }
    .loading { text-align:center; padding:40px; color:#9B8E82; }
    .contract-drop { border:2px dashed #C4846C; border-radius:12px; padding:18px 16px; text-align:center; color:#8a5a44; background:#FBF6F2; cursor:pointer; margin-bottom:20px; transition:background .15s,border-color .15s; line-height:1.5; }
    .contract-drop:hover { background:#f6ebe3; }
    .contract-drop.over { border-color:#16a34a; background:#f0faf2; color:#16a34a; }
    .contract-drop.busy { opacity:.7; pointer-events:none; }
    .contract-drop .cd-icon { font-size:26px; display:block; margin-bottom:6px; }
    .contract-drop .cd-sub { font-size:12px; color:#9B8E82; }
    .cd-status { margin-top:9px; font-size:13px; font-weight:700; }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h1>👶 ילדים</h1>
      <div class="sub" id="gardenSub"></div>
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn-add" style="background:#2D5A50;" onclick="location.href='visit-manage.html'">🏠 ימי היכרות</button>
      <button class="btn-add" id="cardsBoardBtn" style="background:#C4846C; display:none;" onclick="openCardsBoard()">🗳️ לוח כרטיסים מלא</button>
      <button class="btn-add" onclick="toggleForm()">+ הוסף ילד</button>
    </div>
  </div>

  <div class="year-tabs" id="yearTabs"></div>

  <div class="toolbar">
    <input type="text" id="search" placeholder="🔍 חיפוש...">
    <span class="count-pill" id="countPill">—</span>
  </div>

  <div id="error" class="error"></div>
  <div id="success" class="success"></div>

  <div id="form" class="form-container">
    <div id="contractDrop" class="contract-drop">
      <span class="cd-icon">📄⬇️</span>
      <div><b>גררו לכאן חוזה חתום של הילד/ה</b> (PDF או תמונה)</div>
      <div class="cd-sub">המערכת תקרא את החוזה ותמלא את הפרטים אוטומטית — כולל שני ההורים</div>
      <div class="cd-status" id="cdStatus"></div>
    </div>
    <input type="file" id="contractInput" accept="application/pdf,image/*" style="display:none">
    <h2 style="margin-bottom:18px; color:#1F3D34;">הוסף / ערוך ילד</h2>
    <form id="childForm">
      <div class="form-row">
        <div class="form-group"><label>שם פרטי *</label><input type="text" id="firstName" required></div>
        <div class="form-group"><label>שם משפחה *</label><input type="text" id="lastName" required></div>
        <div class="form-group"><label>שם באנגלית</label><input type="text" id="nameEn" dir="ltr"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>מין</label>
          <select id="gender"><option value="">--</option><option value="זכר">זכר</option><option value="נקבה">נקבה</option></select>
        </div>
        <div class="form-group"><label>תעודת זהות</label><input type="text" id="nationalId" dir="ltr"></div>
        <div class="form-group"><label>תאריך לידה</label><input type="date" id="birthDate"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>מסגרת קודמת</label><input type="text" id="prevFramework"></div>
        <div class="form-group"><label>שנת לימוד</label><select id="schoolYear"></select></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>שכר לימוד חודשי (₪)</label><input type="number" id="monthlyFee" min="0" step="1" placeholder="ריק = כרגיל"></div>
        <div class="form-group" style="flex:2;"><label>הערת תשלום</label><input type="text" id="feeNote" placeholder="למשל: פטור מלא — נמצא בגן בחינם השנה"></div>
      </div>
      <div style="display:flex; gap:10px; margin-top:8px;">
        <button type="submit" class="btn-submit">שמור</button>
        <button type="button" class="btn-cancel" onclick="toggleForm()">ביטול</button>
      </div>
    </form>
  </div>

  <div id="table" class="loading">טוען...</div>

<script src="js/common.js?v=11"></script>
<script src="js/api.js?v=12"></script>
<script>
let children = [];
let editingId = null;
let pendingParents = [];
// החוזה שנקרא ב-AI, ממתין להישמר כקובץ מצורף ברגע שהילד נוצר.
let pendingContract = null;

function currentSchoolYear() {
  const d = new Date(), y = d.getFullYear();
  const s = d.getMonth() >= 8 ? y : y - 1;
  return s + '-' + String(s + 1).slice(2);
}
const CUR_YEAR = currentSchoolYear();
const startY = parseInt(CUR_YEAR);
const SCHOOL_YEARS = [startY - 2, startY - 1, startY, startY + 1].map(y => y + '-' + String(y + 1).slice(2));
let selectedYear = CUR_YEAR;

function renderYearTabs() {
  document.getElementById('yearTabs').innerHTML = SCHOOL_YEARS.map(y =>
    `<button class="year-tab ${y === selectedYear ? 'active' : ''}" onclick="selectYear('${y}')">${y}${y === CUR_YEAR ? ' (נוכחית)' : ''}</button>`).join('');
}
function selectYear(y) { selectedYear = y; renderYearTabs(); renderTable(); }
function fillYearSelect(val) {
  document.getElementById('schoolYear').innerHTML = SCHOOL_YEARS.map(y =>
    `<option value="${y}">${y}${y === CUR_YEAR ? ' (נוכחית)' : ''}</option>`).join('');
  document.getElementById('schoolYear').value = val || selectedYear;
}

const monthNames = ['','ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];

function ageStr(bd) {
  if (!bd) return '-';
  const b = new Date(bd), n = new Date();
  let months = (n.getFullYear() - b.getFullYear()) * 12 + (n.getMonth() - b.getMonth());
  if (n.getDate() < b.getDate()) months--;
  if (months < 0) return '-';
  return Math.floor(months / 12) + ':' + (months % 12);
}
function birthMonthNum(bd) { return bd ? (new Date(bd).getMonth() + 1) : '-'; }

// שכר לימוד חריג בלבד — ילד ששכר הלימוד שלו רגיל (monthly_fee ריק) לא מקבל תגית.
const attrEsc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
function feeBadge(c) {
  if (c.monthly_fee == null || c.monthly_fee === '') return '';
  const fee = Number(c.monthly_fee);
  if (!isFinite(fee)) return '';
  const note = c.fee_note ? ' — ' + c.fee_note : '';
  if (fee === 0) return `<span class="fee-badge fee-free" title="${attrEsc('פטור מלא' + note)}">חינם · ₪0 לחודש</span>`;
  return `<span class="fee-badge" title="${attrEsc('שכר לימוד חריג' + note)}">₪${fee.toLocaleString('he-IL')} לחודש</span>`;
}

async function loadChildren() {
  try {
    const res = await api.getChildren();
    if (res.success) { children = res.data || []; renderTable(); }
  } catch (err) {
    showError('שגיאה בטעינת הנתונים: ' + err.message);
  }
}

function renderTable() {
  const q = (document.getElementById('search').value || '').trim();
  let list = children.filter(c => (c.school_year || CUR_YEAR) === selectedYear);
  if (q) list = list.filter(c =>
    ((c.first_name_he || '') + ' ' + (c.last_name_he || '') + ' ' + (c.name_en || '')).includes(q));
  list.sort((a, b) => {
    let r;
    if (sortKey === 'birth_date') r = (a.birth_date || '').localeCompare(b.birth_date || '');
    else if (sortKey === 'month') r = (a.birth_date ? new Date(a.birth_date).getMonth() : 99) - (b.birth_date ? new Date(b.birth_date).getMonth() : 99);
    else r = String(a[sortKey] || '').localeCompare(String(b[sortKey] || ''), 'he');
    return sortDir === 'asc' ? r : -r;
  });

  document.getElementById('countPill').textContent = list.length + ' ילדים';

  if (!list.length) {
    document.getElementById('table').innerHTML = `<p style="padding:24px; color:#9B8E82; text-align:center;">אין ילדים בשנת ${selectedYear}. אפשר להוסיף ילד או לייבא מטבלה.</p>`;
    return;
  }

  const rows = list.map(c => {
    const g = c.gender_he;
    const gBadge = g === 'זכר' ? '<span class="g-badge g-m">זכר</span>'
                 : g === 'נקבה' ? '<span class="g-badge g-f">נקבה</span>'
                 : '<span class="muted">-</span>';
    return `
    <tr>
      <td><b class="name-link" onclick="openChildProfile('${c.id}')">${c.first_name_he} ${c.last_name_he || ''}</b>${feeBadge(c)}</td>
      <td class="en">${c.name_en || '<span class="muted">-</span>'}</td>
      <td>${gBadge}</td>
      <td>${c.national_id || '<span class="muted">-</span>'}</td>
      <td>${c.birth_date ? formatDate(c.birth_date) : '<span class="muted">-</span>'}</td>
      <td>${ageStr(c.birth_date)}</td>
      <td>${c.birth_date ? monthNames[birthMonthNum(c.birth_date)] : '<span class="muted">-</span>'}</td>
      <td style="display:flex; gap:6px;">
        <button class="btn-edit" onclick="editChild('${c.id}')">ערוך</button>
        <button class="btn-delete" onclick="deleteChild('${c.id}')">מחק</button>
      </td>
    </tr>`;
  }).join('');

  document.getElementById('table').innerHTML = `
    <div class="tbl-wrap"><table>
      <thead><tr>
        <th class="sortable" onclick="sortByCol('first_name_he')">שם הילד ${arrow('first_name_he')}</th>
        <th class="sortable" onclick="sortByCol('name_en')">Name ${arrow('name_en')}</th>
        <th class="sortable" onclick="sortByCol('gender_he')">מין ${arrow('gender_he')}</th>
        <th class="sortable" onclick="sortByCol('national_id')">ת"ז ${arrow('national_id')}</th>
        <th class="sortable" onclick="sortByCol('birth_date')">תאריך לידה ${arrow('birth_date')}</th>
        <th class="sortable" onclick="sortByCol('birth_date')">גיל ${arrow('birth_date')}</th>
        <th class="sortable" onclick="sortByCol('month')">חודש לידה ${arrow('month')}</th>
        <th>פעולות</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
}

let sortKey = 'birth_date';
let sortDir = 'asc';
document.getElementById('search').addEventListener('input', renderTable);
function sortByCol(key) {
  if (sortKey === key) sortDir = (sortDir === 'asc' ? 'desc' : 'asc');
  else { sortKey = key; sortDir = 'asc'; }
  renderTable();
}
function arrow(key) { return sortKey === key ? `<span class="arr">${sortDir === 'asc' ? '▲' : '▼'}</span>` : ''; }

function toggleForm() {
  const f = document.getElementById('form');
  f.classList.toggle('show');
  if (!f.classList.contains('show')) { resetForm(); }
  else if (!editingId) { fillYearSelect(selectedYear); }
}
function resetForm() {
  document.getElementById('childForm').reset();
  editingId = null;
  pendingParents = [];
  pendingContract = null;
  const st = document.getElementById('cdStatus'); if (st) st.textContent = '';
}

function editChild(id) {
  const c = children.find(x => x.id === id);
  if (!c) return;
  editingId = id;
  pendingParents = [];
  pendingContract = null;
  const st = document.getElementById('cdStatus'); if (st) st.textContent = '';
  document.getElementById('firstName').value = c.first_name_he || '';
  document.getElementById('lastName').value = c.last_name_he || '';
  document.getElementById('nameEn').value = c.name_en || '';
  document.getElementById('gender').value = c.gender_he || '';
  document.getElementById('nationalId').value = c.national_id || '';
  document.getElementById('birthDate').value = c.birth_date || '';
  document.getElementById('prevFramework').value = c.prev_framework || '';
  document.getElementById('monthlyFee').value = (c.monthly_fee == null ? '' : c.monthly_fee);
  document.getElementById('feeNote').value = c.fee_note || '';
  fillYearSelect(c.school_year || CUR_YEAR);
  document.getElementById('form').classList.add('show');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function deleteChild(id) {
  if (!confirm('למחוק את הילד?')) return;
  try {
    const res = await api.deleteChild(id);
    if (res.success) { showSuccess('הילד נמחק'); loadChildren(); }
  } catch (err) { showError('שגיאה במחיקה: ' + err.message); }
}

document.getElementById('childForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const data = {
    first_name_he: document.getElementById('firstName').value,
    last_name_he: document.getElementById('lastName').value,
    name_en: document.getElementById('nameEn').value || null,
    gender_he: document.getElementById('gender').value || null,
    national_id: document.getElementById('nationalId').value || null,
    birth_date: document.getElementById('birthDate').value || null,
    prev_framework: document.getElementById('prevFramework').value || null,
    school_year: document.getElementById('schoolYear').value || selectedYear,
    // ריק = שכר לימוד רגיל. 0 = פטור מלא (ואז חובה לנמק בהערת התשלום).
    monthly_fee: document.getElementById('monthlyFee').value === '' ? null : Number(document.getElementById('monthlyFee').value),
    fee_note: document.getElementById('feeNote').value.trim() || null,
  };
  if (data.monthly_fee === 0 && !data.fee_note) {
    showError('שכר לימוד 0 — צריך לכתוב בהערת התשלום למה הילד פטור');
    return;
  }
  try {
    const res = editingId ? await api.updateChild(editingId, data) : await api.createChild(data);
    if (res.success) {
      // On a NEW child, also create the parents extracted from the contract.
      const newId = res.data && res.data.id;
      let addedParents = 0;
      if (!editingId && newId && pendingParents.length) {
        for (let i = 0; i < pendingParents.length; i++) {
          const p = pendingParents[i];
          try {
            await api.createParent({
              child_id: newId,
              full_name_he: p.full_name_he,
              phone: p.phone || null,
              email: p.email || null,
              relationship_type: p.relationship_type || null,
              address: p.address || null,
              is_primary: i === 0,
            });
            addedParents++;
          } catch (pe) { console.error('parent create failed', pe); }
        }
      }
      pendingParents = [];

      // ...וגם את החוזה החתום עצמו, כקובץ מצורף בכרטיס הילד.
      let contractSaved = false;
      if (!editingId && newId && pendingContract) {
        try { await uploadContractDoc(newId, data, pendingContract); contractSaved = true; }
        catch (ce) { console.error('contract upload failed', ce); }
      }
      const savedContract = !!pendingContract;
      pendingContract = null;

      showSuccess(editingId ? 'הילד עודכן' : ('הילד נוסף' + (addedParents ? ` + ${addedParents} הורים` : '') + (contractSaved ? ' + החוזה החתום' : '')));
      if (savedContract && !contractSaved) showError('הילד נשמר, אבל צירוף החוזה נכשל — אפשר לצרף אותו מכרטיס הילד');
      const br = res.birthday_reminder;
      if (br && br.reason === 'past') {
        alert('🎂 שים לב: יום ההולדת של ' + (br.name || 'הילד/ה') + ' כבר קרוב/עבר — לא נוצרה תזכורת אוטומטית. כדאי לתכנן את החגיגה ידנית.');
      }
      toggleForm(); resetForm(); loadChildren();
    }
  } catch (err) { showError('שגיאה: ' + err.message); }
});

// ---- Fill the form from a dragged, signed child contract (AI) ----
function isHeicFile(f) {
  const t = (f.type || '').toLowerCase(), n = (f.name || '').toLowerCase();
  return t.includes('heic') || t.includes('heif') || n.endsWith('.heic') || n.endsWith('.heif');
}

async function handleContract(file) {
  if (!file) return;
  const dz = document.getElementById('contractDrop');
  const st = document.getElementById('cdStatus');
  if (file.size > 15 * 1024 * 1024) { st.textContent = '❌ הקובץ גדול מדי (עד 15MB)'; return; }
  dz.classList.add('busy');
  try {
    let base64, srcMime = file.type || '';
    if (isHeicFile(file)) {
      st.textContent = '⏳ ממיר תמונה...';
      const raw = await fileToB64(file);
      const conv = await api.convertHeic(raw);
      base64 = conv.jpeg_base64; srcMime = 'image/jpeg';
    } else {
      base64 = await fileToB64(file);
    }
    const isPdf = srcMime === 'application/pdf' || (file.name || '').toLowerCase().endsWith('.pdf');
    let contentType;
    if (isPdf) {
      contentType = 'application/pdf';
    } else {
      // Re-encode + shrink so the image is within the AI's limits (oversized iPhone photos
      // otherwise fail with "Could not process image"). Also normalizes any odd format to JPEG.
      st.textContent = '⏳ מכין את התמונה...';
      base64 = await downscaleImage(base64, srcMime || 'image/jpeg');
      contentType = 'image/jpeg';
    }
    st.textContent = '🔎 קורא את החוזה ומחלץ פרטים... (כמה שניות)';
    const res = await api.parseChildContract(base64, contentType);
    const d = (res && res.data) || {};

    if (!document.getElementById('form').classList.contains('show')) document.getElementById('form').classList.add('show');
    fillYearSelect(d.school_year || selectedYear);
    document.getElementById('firstName').value = d.first_name_he || '';
    document.getElementById('lastName').value = d.last_name_he || '';
    document.getElementById('nameEn').value = d.name_en || '';
    document.getElementById('gender').value = (d.gender_he === 'זכר' || d.gender_he === 'נקבה') ? d.gender_he : '';
    document.getElementById('nationalId').value = d.national_id || '';
    document.getElementById('birthDate').value = d.birth_date || '';
    if (d.school_year) document.getElementById('schoolYear').value = d.school_year;

    // החוזה עצמו, כדי לצרף אותו לילד (PDF כמו שהוא, תמונה בגרסה המוקטנת).
    const contractFile = (base64.length * 3 / 4) > CONTRACT_MAX_BYTES
      ? null
      : { base64, contentType, fileName: file.name || 'contract.pdf' };

    // הילד כבר קיים? מצרפים אליו את החוזה במקום ליצור כפילות.
    const existing = findExistingChild(d);
    if (existing) {
      const nm = ((existing.first_name_he || '') + ' ' + (existing.last_name_he || '')).trim();
      if (confirm(`${nm} כבר קיים במערכת (שנה ${existing.school_year || '—'}).\n\nלצרף אליו את החוזה במקום ליצור ילד חדש?`)) {
        if (!contractFile) { st.textContent = '❌ החוזה גדול מדי לשמירה (עד 4MB)'; return; }
        st.textContent = '⏳ מצרף את החוזה...';
        await replaceContractDoc(existing, contractFile);
        st.textContent = `✅ החוזה צורף ל${nm}.`;
        pendingContract = null;
        loadChildren();
        return;
      }
    }

    pendingParents = (d.parents || []).filter(p => p && p.full_name_he);
    pendingContract = contractFile;
    editingId = null; // ensure this saves as a NEW child (so parents attach)
    const pTxt = pendingParents.length ? ` · ${pendingParents.length} הורים יתווספו עם השמירה (${pendingParents.map(p => p.full_name_he).join(', ')})` : '';
    const cTxt = pendingContract ? ' · החוזה יישמר כקובץ מצורף' : ' · ⚠️ החוזה גדול מדי לשמירה כקובץ מצורף — אפשר לצרף אותו ידנית מכרטיס הילד';
    st.textContent = `✅ הפרטים מולאו${pTxt}${cTxt}. בדקו, השלימו חוסרים ולחצו "שמור".`;
    document.getElementById('firstName').focus();
  } catch (e) {
    st.textContent = '❌ שגיאה בקריאת החוזה: ' + e.message;
  } finally {
    dz.classList.remove('busy');
    document.getElementById('contractInput').value = '';
  }
}

(function wireContractDrop() {
  const dz = document.getElementById('contractDrop');
  const inp = document.getElementById('contractInput');
  if (!dz || !inp) return;
  dz.addEventListener('click', () => inp.click());
  inp.addEventListener('change', () => handleContract(inp.files[0]));
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); });
  dz.addEventListener('dragleave', e => { if (e.target === dz) dz.classList.remove('over'); });
  dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('over'); if (e.dataTransfer.files && e.dataTransfer.files[0]) handleContract(e.dataTransfer.files[0]); });
  // don't let the browser open a file dropped elsewhere on the page
  ['dragover', 'drop'].forEach(ev => window.addEventListener(ev, e => { if (e.target !== dz) e.preventDefault(); }));
})();

// ---- per-child profile: attached files + the registration "כרטיס אישי" ----
const esc = s => (s || '').replace(/</g, '&lt;');
function fileToB64(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',').pop()); r.onerror = rej; r.readAsDataURL(file); }); }
// Shrink + re-encode an image (base64 in -> JPEG base64 out) so it fits the AI's size limits.
function downscaleImage(base64, mime, maxDim = 2000, quality = 0.85) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      try {
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale)), h = Math.max(1, Math.round(img.height * scale));
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', quality).split(',').pop());
      } catch (e) { reject(e); }
    };
    img.onerror = () => reject(new Error('לא ניתן לפענח את התמונה'));
    img.src = 'data:' + (mime || 'image/jpeg') + ';base64,' + base64;
  });
}
const childDocScope = id => 'child:' + id;
let pfChildId = null;

// ---- חוזה חתום ----
// גבול העלאה: Netlify חוסם בקשה מעל ~6MB, ו-base64 מנפח ב-33%.
const CONTRACT_MAX_BYTES = 4 * 1024 * 1024;
const CONTRACT_CATEGORY = 'חוזה';
const contractTitle = c => 'חוזה חתום - ' + ((c.first_name_he || '') + ' ' + (c.last_name_he || '')).trim();

// זיהוי ילד קיים מתוך מה שה-AI חילץ מהחוזה: ת"ז קודמת לשם, כי היא חד-משמעית.
const normName = s => (s || '').replace(/\s+/g, ' ').trim();
const normId = s => (s || '').replace(/\D/g, '');
function findExistingChild(d) {
  const id = normId(d.national_id);
  if (id) {
    const byId = children.find(c => normId(c.national_id) === id);
    if (byId) return byId;
  }
  const full = normName((d.first_name_he || '') + ' ' + (d.last_name_he || ''));
  if (!full) return null;
  // שם זהה — נחשב אותו ילד רק אם גם תאריך הלידה מסכים (או שחסר באחד הצדדים).
  return children.find(c => {
    if (normName((c.first_name_he || '') + ' ' + (c.last_name_he || '')) !== full) return false;
    if (d.birth_date && c.birth_date) return d.birth_date === c.birth_date;
    return true;
  }) || null;
}

// חוזה אחד לילד: הישן עובר לפח (ניתן לשחזור) והחדש נכנס במקומו.
async function replaceContractDoc(child, payload) {
  try {
    const r = await api.getDocuments(childDocScope(child.id));
    const old = (r.data || []).filter(x => x.category === CONTRACT_CATEGORY);
    for (const o of old) { try { await api.deleteDocument(o.id); } catch (e) {} }
  } catch (e) {}
  return uploadContractDoc(child.id, child, payload);
}

// מעלה את החוזה כקובץ מצורף של הילד, תחת הכותרת האחידה.
async function uploadContractDoc(childId, child, { base64, contentType, fileName }) {
  return api.uploadDocument({
    section: childDocScope(childId),
    category: CONTRACT_CATEGORY,
    title: contractTitle(child),
    file_base64: base64,
    file_name: fileName || 'contract.pdf',
    content_type: contentType || 'application/pdf',
  });
}

function closeOv(ovId) { document.getElementById(ovId).classList.remove('show'); }

async function openChildProfile(id) {
  const c = children.find(x => x.id === id); if (!c) return;
  pfChildId = id;
  document.getElementById('cpBox').innerHTML =
    `<h2>${esc(c.first_name_he)} ${esc(c.last_name_he || '')}</h2>` +
    `<div class="role">${c.birth_date ? 'תאריך לידה: ' + formatDate(c.birth_date) + ' · גיל ' + ageStr(c.birth_date) : 'ילד/ה'} · שנה ${esc(c.school_year || selectedYear)}</div>` +
    `<div class="docs-head">📎 קבצים מצורפים</div><div id="childFiles"><span class="muted">טוען...</span></div>` +
    `<button class="cp-close" onclick="closeOv('cpOv')">סגור</button>`;
  document.getElementById('cpOv').classList.add('show');
  loadChildFiles(id);
}

async function loadChildFiles(id) {
  const el = document.getElementById('childFiles'); if (!el) return;
  let docs = [], card = null;
  try {
    const [dRes, eRes] = await Promise.all([
      api.getDocuments(childDocScope(id)).catch(() => ({ data: [] })),
      api.getEvents('child-card').catch(() => ({ data: [] })),
    ]);
    docs = dRes.data || [];
    card = (eRes.data || []).find(e => e.category === id);
  } catch (e) {}
  // החוזה החתום נעוץ בראש הרשימה — הוא המסמך שמחפשים הכי הרבה.
  const contracts = docs.filter(d => d.category === CONTRACT_CATEGORY);
  const rest = docs.filter(d => d.category !== CONTRACT_CATEGORY);

  let html = '';
  html += contracts.map(d => `<div class="doc-file contract"><a href="${d.file_url || '#'}" target="_blank">📄 ${esc(d.title || 'חוזה חתום')}</a><button class="del" title="מחק" onclick="delChildDoc('${d.id}')">🗑</button></div>`).join('');
  if (!contracts.length) html += `<div class="doc-file contract missing"><span class="muted">📄 אין חוזה חתום</span><button class="open" onclick="document.getElementById('childContractInput').click()">צרף חוזה</button></div>`;
  if (card) html += `<div class="doc-file"><button class="open" onclick="openCardView('${id}')">📋 כרטיס אישי</button><span class="muted">מתוך טופס הרישום</span></div>`;
  html += rest.map(d => `<div class="doc-file"><a href="${d.file_url || '#'}" target="_blank">🔗 ${esc(d.title || 'קובץ')}</a><button class="del" title="מחק" onclick="delChildDoc('${d.id}')">🗑</button></div>`).join('');
  html += `<div style="margin-top:12px;"><button class="cp-add" onclick="document.getElementById('childDocInput').click()">➕ צרף קובץ</button></div>`;
  el.innerHTML = html;
}

// צירוף חוזה חתום לילד קיים — נשמר תמיד תחת אותה כותרת, לא לפי שם הקובץ.
async function handleChildContractFile(file) {
  const input = document.getElementById('childContractInput');
  if (!file || !pfChildId) { input.value = ''; return; }
  const child = children.find(x => x.id === pfChildId);
  if (!child) { input.value = ''; return; }
  if (file.size > CONTRACT_MAX_BYTES) {
    alert('הקובץ גדול מדי (עד 4MB). אפשר לסרוק אותו שוב באיכות נמוכה יותר.');
    input.value = ''; return;
  }
  const el = document.getElementById('childFiles');
  if (el) el.insertAdjacentHTML('afterbegin', '<div class="muted" id="cdUpNote">⏳ מעלה את החוזה...</div>');
  try {
    const b64 = await fileToB64(file);
    await replaceContractDoc(child, {
      base64: b64,
      contentType: file.type || 'application/pdf',
      fileName: file.name,
    });
    loadChildFiles(pfChildId);
  } catch (e) {
    alert('שגיאה בהעלאת החוזה: ' + e.message);
    const n = document.getElementById('cdUpNote'); if (n) n.remove();
  }
  input.value = '';
}

async function handleChildDocFile(file) {
  if (!file || !pfChildId) return;
  if (file.size > 5 * 1024 * 1024) { alert('הקובץ גדול מדי (עד 5MB)'); return; }
  const el = document.getElementById('childFiles');
  if (el) el.insertAdjacentHTML('afterbegin', '<div class="muted" id="cdUpNote">⏳ מעלה...</div>');
  try {
    const b64 = await fileToB64(file);
    await api.uploadDocument({ section: childDocScope(pfChildId), category: 'כללי', title: file.name, file_base64: b64, file_name: file.name, content_type: file.type || 'application/octet-stream' });
    loadChildFiles(pfChildId);
  } catch (e) { alert('שגיאה בהעלאה: ' + e.message); const n = document.getElementById('cdUpNote'); if (n) n.remove(); }
  document.getElementById('childDocInput').value = '';
}

async function delChildDoc(id) {
  if (!confirm('למחוק את הקובץ? (אפשר לשחזר מהפח)')) return;
  try { await api.deleteDocument(id); loadChildFiles(pfChildId); }
  catch (e) { alert('שגיאה: ' + e.message); }
}

async function openCardView(id) {
  const box = document.getElementById('cardBox');
  box.innerHTML = '<span class="muted">טוען...</span>';
  document.getElementById('cardOv').classList.add('show');
  let card = null;
  try { const r = await api.getEvents('child-card'); card = (r.data || []).find(e => e.category === id); } catch (e) {}
  if (!card) { box.innerHTML = '<div class="muted">לא נמצא כרטיס אישי.</div><button class="cp-close" onclick="closeOv(\'cardOv\')">סגור</button>'; return; }
  let parsed = {}; try { parsed = JSON.parse(card.notes || '{}'); } catch (e) {}
  const ans = (parsed.answers || []).filter(a => a && a.a);
  const c = children.find(x => x.id === id);
  const photo = parsed.photo ? `<img src="${parsed.photo}" alt="" onclick="zoomPhoto(this.src)" title="לחצו להגדלה" style="width:100%;max-width:260px;border-radius:14px;display:block;margin:10px auto 4px;cursor:zoom-in;">` : '';
  const song = parsed.favorite_song ? `<div class="card-q">🎵 שיר אהוב</div><div class="card-a">${esc(parsed.favorite_song)}</div>` : '';
  box.innerHTML = `<h2>📋 כרטיס אישי</h2>` +
    `<div class="role">${c ? esc(c.first_name_he) + ' ' + esc(c.last_name_he || '') : ''}${parsed.birth_date ? ' · נולד/ה ' + formatDate(parsed.birth_date) : ''}</div>` +
    photo + song +
    (ans.length ? ans.map(a => `<div class="card-q">${esc(a.q)}</div><div class="card-a">${esc(a.a)}</div>`).join('') : '<div class="muted">לא מולאו תשובות בטופס.</div>') +
    `<button class="cp-close" onclick="closeOv('cardOv')">סגור</button>`;
}

let OWNER_KEY = '';
(async function () { try { const r = await api.getOwnerKey(); OWNER_KEY = r.admin_key || ''; if (OWNER_KEY) document.getElementById('cardsBoardBtn').style.display = ''; } catch (e) {} })();
function openCardsBoard() { if (OWNER_KEY) window.open('cards-board.html?admin=' + encodeURIComponent(OWNER_KEY), '_blank'); }

renderYearTabs();
loadChildren();
</script>
