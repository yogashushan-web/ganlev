<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ניהול ילדים — מערכת גנים</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Heebo',sans-serif; background:#F4EFE6; color:#3D3228; direction:rtl; min-height:100vh; }
    .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:12px; }
    .header h1 { font-size:26px; color:#1F3D34; }
    .header .sub { font-size:13px; color:#9B8E82; }
    .btn-add { background:#1F3D34; color:#FFF; border:none; padding:12px 22px; border-radius:10px; cursor:pointer; font-family:'Heebo'; font-weight:700; }
    .btn-add:hover { background:#154428; }
    .toolbar { display:flex; gap:10px; align-items:center; margin-bottom:18px; flex-wrap:wrap; }
    .toolbar input { padding:9px 14px; border:1.5px solid #e3ddd2; border-radius:10px; font-family:'Heebo'; font-size:13px; outline:none; flex:1; min-width:160px; }
    .toolbar input:focus { border-color:#1F3D34; }
    .btn-group { display:flex; align-items:center; gap:4px; background:#fff; border-radius:10px; padding:3px; box-shadow:0 2px 8px rgba(0,0,0,.04); }
    .grp-lbl { font-size:11px; color:#9B8E82; font-weight:700; padding:0 5px; white-space:nowrap; }
    .sb, .gf { padding:6px 11px; border:none; background:transparent; border-radius:8px; cursor:pointer; font-family:'Heebo'; font-weight:700; font-size:12px; color:#9B8E82; white-space:nowrap; }
    .sb:hover, .gf:hover { background:#f1ece3; }
    .sb.active, .gf.active { background:#1F3D34; color:#fff; }
    .count-pill { background:#fff; border-radius:20px; padding:8px 16px; font-size:13px; box-shadow:0 2px 8px rgba(0,0,0,.05); font-weight:600; color:#1F3D34; }
    .year-tabs { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
    .year-tab { padding:9px 18px; border:none; background:#fff; border-radius:10px; cursor:pointer; font-family:'Heebo'; font-weight:700; font-size:14px; color:#9B8E82; box-shadow:0 2px 8px rgba(0,0,0,.04); transition:all .15s; }
    .year-tab:hover { background:#f1ece3; }
    .year-tab.active { background:#1F3D34; color:#fff; }
    .form-container { background:#FFF; border-radius:16px; padding:26px; box-shadow:0 2px 12px rgba(0,0,0,0.05); margin-bottom:24px; display:none; }
    .form-container.show { display:block; }
    .form-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; }
    .form-group { margin-bottom:16px; }
    label { display:block; font-size:12px; color:#3D3228; font-weight:700; margin-bottom:6px; }
    input, select { width:100%; padding:11px 13px; border:1px solid #e8e4de; border-radius:10px; font-family:'Heebo'; font-size:14px; outline:none; text-align:right; }
    input:focus, select:focus { border-color:#1F3D34; }
    .btn-submit { background:#1F3D34; color:#FFF; border:none; padding:12px 24px; border-radius:10px; cursor:pointer; font-family:'Heebo'; font-weight:700; }
    .btn-submit:hover { background:#154428; }
    .btn-cancel { background:#f0ece6; color:#333; border:none; padding:12px 24px; border-radius:10px; cursor:pointer; font-family:'Heebo'; margin-right:10px; }
    .error { background:#fdf0ef; color:#c94147; padding:12px; border-radius:10px; margin-bottom:16px; display:none; }
    .error.show { display:block; }
    .success { background:#d4edda; color:#155724; padding:12px; border-radius:10px; margin-bottom:16px; display:none; }
    .success.show { display:block; }
    .tbl-wrap { overflow-x:auto; border-radius:16px; box-shadow:0 2px 12px rgba(0,0,0,0.05); }
    table { width:100%; border-collapse:collapse; background:#FFF; }
    th { background:#1F3D34; color:#FFF; padding:12px 14px; font-weight:600; font-size:12px; text-align:right; white-space:nowrap; }
    td { padding:11px 14px; border-bottom:1px solid #f0ece6; font-size:13px; white-space:nowrap; }
    tr:last-child td { border-bottom:none; }
    tr:hover td { background:#FAF8F4; }
    td.en { direction:ltr; text-align:left; color:#6f6457; }
    .g-badge { display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; }
    .g-m { background:#dbeafe; color:#1e4e8c; }
    .g-f { background:#fce7f3; color:#9d2463; }
    .muted { color:#c4bcae; }
    .btn-edit, .btn-delete { padding:6px 11px; border:none; border-radius:8px; cursor:pointer; font-size:12px; font-family:'Heebo'; }
    .btn-edit { background:#C4846C; color:#FFF; }
    .btn-delete { background:#e74c3c; color:#FFF; }
    .loading { text-align:center; padding:40px; color:#9B8E82; }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h1>👶 ניהול ילדים</h1>
      <div class="sub" id="gardenSub"></div>
    </div>
    <button class="btn-add" onclick="toggleForm()">+ הוסף ילד</button>
  </div>

  <div class="year-tabs" id="yearTabs"></div>

  <div class="toolbar">
    <input type="text" id="search" placeholder="🔍 חיפוש...">
    <div class="btn-group">
      <span class="grp-lbl">מיון</span>
      <button class="sb active" data-sort="age">גיל</button>
      <button class="sb" data-sort="name">שם</button>
      <button class="sb" data-sort="gender">מין</button>
    </div>
    <div class="btn-group" id="genderFilter">
      <button class="gf active" data-g="all">הכל</button>
      <button class="gf" data-g="זכר">זכר</button>
      <button class="gf" data-g="נקבה">נקבה</button>
    </div>
    <span class="count-pill" id="countPill">—</span>
  </div>

  <div id="error" class="error"></div>
  <div id="success" class="success"></div>

  <div id="form" class="form-container">
    <h2 style="margin-bottom:18px; color:#1F3D34;">הוסף / ערוך ילד</h2>
    <form id="childForm">
      <div class="form-row">
        <div class="form-group"><label>שם פרטי *</label><input type="text" id="firstName" required></div>
        <div class="form-group"><label>שם משפחה *</label><input type="text" id="lastName" required></div>
        <div class="form-group"><label>שם באנגלית</label><input type="text" id="nameEn" dir="ltr"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>מין</label>
          <select id="gender"><option value="">--</option><option value="זכר">זכר</option><option value="נקבה">נקבה</option></select>
        </div>
        <div class="form-group"><label>תעודת זהות</label><input type="text" id="nationalId" dir="ltr"></div>
        <div class="form-group"><label>תאריך לידה</label><input type="date" id="birthDate"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>מסגרת קודמת</label><input type="text" id="prevFramework"></div>
        <div class="form-group"><label>שנת לימוד</label><select id="schoolYear"></select></div>
      </div>
      <div style="display:flex; gap:10px; margin-top:8px;">
        <button type="submit" class="btn-submit">שמור</button>
        <button type="button" class="btn-cancel" onclick="toggleForm()">ביטול</button>
      </div>
    </form>
  </div>

  <div id="table" class="loading">טוען...</div>

<script src="js/common.js?v=3"></script>
<script src="js/api.js?v=3"></script>
<script>
let children = [];
let editingId = null;

function currentSchoolYear() {
  const d = new Date(), y = d.getFullYear();
  const s = d.getMonth() >= 8 ? y : y - 1;
  return s + '-' + String(s + 1).slice(2);
}
const CUR_YEAR = currentSchoolYear();
const startY = parseInt(CUR_YEAR);
const SCHOOL_YEARS = [startY - 2, startY - 1, startY, startY + 1].map(y => y + '-' + String(y + 1).slice(2));
let selectedYear = CUR_YEAR;

function renderYearTabs() {
  document.getElementById('yearTabs').innerHTML = SCHOOL_YEARS.map(y =>
    `<button class="year-tab ${y === selectedYear ? 'active' : ''}" onclick="selectYear('${y}')">${y}${y === CUR_YEAR ? ' (נוכחית)' : ''}</button>`).join('');
}
function selectYear(y) { selectedYear = y; renderYearTabs(); renderTable(); }
function fillYearSelect(val) {
  document.getElementById('schoolYear').innerHTML = SCHOOL_YEARS.map(y =>
    `<option value="${y}">${y}${y === CUR_YEAR ? ' (נוכחית)' : ''}</option>`).join('');
  document.getElementById('schoolYear').value = val || selectedYear;
}

const monthNames = ['','ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];

function ageStr(bd) {
  if (!bd) return '-';
  const b = new Date(bd), n = new Date();
  let months = (n.getFullYear() - b.getFullYear()) * 12 + (n.getMonth() - b.getMonth());
  if (n.getDate() < b.getDate()) months--;
  if (months < 0) return '-';
  return Math.floor(months / 12) + ':' + (months % 12);
}
function birthMonthNum(bd) { return bd ? (new Date(bd).getMonth() + 1) : '-'; }

async function loadChildren() {
  try {
    const res = await api.getChildren();
    if (res.success) { children = res.data || []; renderTable(); }
  } catch (err) {
    showError('שגיאה בטעינת הנתונים: ' + err.message);
  }
}

function renderTable() {
  const q = (document.getElementById('search').value || '').trim();
  let list = children.filter(c => (c.school_year || CUR_YEAR) === selectedYear);
  if (genderFilter !== 'all') list = list.filter(c => c.gender_he === genderFilter);
  if (q) list = list.filter(c =>
    ((c.first_name_he || '') + ' ' + (c.last_name_he || '') + ' ' + (c.name_en || '')).includes(q));
  list.sort((a, b) => {
    if (sortBy === 'name')
      return ((a.first_name_he || '') + ' ' + (a.last_name_he || '')).localeCompare((b.first_name_he || '') + ' ' + (b.last_name_he || ''), 'he');
    if (sortBy === 'gender') {
      const g = (a.gender_he || '').localeCompare(b.gender_he || '', 'he');
      return g !== 0 ? g : (a.birth_date || '').localeCompare(b.birth_date || '');
    }
    return (a.birth_date || '').localeCompare(b.birth_date || ''); // age: oldest first
  });

  document.getElementById('countPill').textContent = list.length + ' ילדים';

  if (!list.length) {
    document.getElementById('table').innerHTML = `<p style="padding:24px; color:#9B8E82; text-align:center;">אין ילדים בשנת ${selectedYear}. אפשר להוסיף ילד או לייבא מטבלה.</p>`;
    return;
  }

  const rows = list.map(c => {
    const g = c.gender_he;
    const gBadge = g === 'זכר' ? '<span class="g-badge g-m">זכר</span>'
                 : g === 'נקבה' ? '<span class="g-badge g-f">נקבה</span>'
                 : '<span class="muted">-</span>';
    return `
    <tr>
      <td><b>${c.first_name_he} ${c.last_name_he || ''}</b></td>
      <td class="en">${c.name_en || '<span class="muted">-</span>'}</td>
      <td>${gBadge}</td>
      <td>${c.national_id || '<span class="muted">-</span>'}</td>
      <td>${c.birth_date ? formatDate(c.birth_date) : '<span class="muted">-</span>'}</td>
      <td>${ageStr(c.birth_date)}</td>
      <td>${c.birth_date ? monthNames[birthMonthNum(c.birth_date)] : '<span class="muted">-</span>'}</td>
      <td style="display:flex; gap:6px;">
        <button class="btn-edit" onclick="editChild('${c.id}')">ערוך</button>
        <button class="btn-delete" onclick="deleteChild('${c.id}')">מחק</button>
      </td>
    </tr>`;
  }).join('');

  document.getElementById('table').innerHTML = `
    <div class="tbl-wrap"><table>
      <thead><tr>
        <th>שם הילד</th><th>Name</th><th>מין</th><th>ת"ז</th>
        <th>תאריך לידה</th><th>גיל</th><th>חודש לידה</th><th>פעולות</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
}

let genderFilter = 'all';
let sortBy = 'age';
document.getElementById('search').addEventListener('input', renderTable);
document.querySelectorAll('.sb').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.sb').forEach(x => x.classList.remove('active'));
  b.classList.add('active'); sortBy = b.dataset.sort; renderTable();
}));
document.querySelectorAll('#genderFilter .gf').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#genderFilter .gf').forEach(x => x.classList.remove('active'));
  b.classList.add('active'); genderFilter = b.dataset.g; renderTable();
}));

function toggleForm() {
  const f = document.getElementById('form');
  f.classList.toggle('show');
  if (!f.classList.contains('show')) { resetForm(); }
  else if (!editingId) { fillYearSelect(selectedYear); }
}
function resetForm() { document.getElementById('childForm').reset(); editingId = null; }

function editChild(id) {
  const c = children.find(x => x.id === id);
  if (!c) return;
  editingId = id;
  document.getElementById('firstName').value = c.first_name_he || '';
  document.getElementById('lastName').value = c.last_name_he || '';
  document.getElementById('nameEn').value = c.name_en || '';
  document.getElementById('gender').value = c.gender_he || '';
  document.getElementById('nationalId').value = c.national_id || '';
  document.getElementById('birthDate').value = c.birth_date || '';
  document.getElementById('prevFramework').value = c.prev_framework || '';
  fillYearSelect(c.school_year || CUR_YEAR);
  document.getElementById('form').classList.add('show');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function deleteChild(id) {
  if (!confirm('למחוק את הילד?')) return;
  try {
    const res = await api.deleteChild(id);
    if (res.success) { showSuccess('הילד נמחק'); loadChildren(); }
  } catch (err) { showError('שגיאה במחיקה: ' + err.message); }
}

document.getElementById('childForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const data = {
    first_name_he: document.getElementById('firstName').value,
    last_name_he: document.getElementById('lastName').value,
    name_en: document.getElementById('nameEn').value || null,
    gender_he: document.getElementById('gender').value || null,
    national_id: document.getElementById('nationalId').value || null,
    birth_date: document.getElementById('birthDate').value || null,
    prev_framework: document.getElementById('prevFramework').value || null,
    school_year: document.getElementById('schoolYear').value || selectedYear,
  };
  try {
    const res = editingId ? await api.updateChild(editingId, data) : await api.createChild(data);
    if (res.success) {
      showSuccess(editingId ? 'הילד עודכן' : 'הילד נוסף');
      toggleForm(); resetForm(); loadChildren();
    }
  } catch (err) { showError('שגיאה: ' + err.message); }
});

renderYearTabs();
loadChildren();
</script>

</body>
</html>
