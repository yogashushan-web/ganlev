<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ניהול ילדים — מערכת גנים</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Heebo',sans-serif;
      background:#F4EFE6;
      color:#3D3228;
      direction:rtl;
      min-height:100vh;
      padding:30px 20px;
    }
    .container { max-width:1000px; margin:0 auto; }
    .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; }
    .header h1 { font-size:28px; color:#1F3D34; }
    .btn-add { background:#1F3D34; color:#FFF; border:none; padding:12px 24px; border-radius:10px; cursor:pointer; font-family:'Heebo'; font-weight:600; }
    .btn-add:hover { background:#154428; }
    .form-container { background:#FFF; border-radius:16px; padding:30px; box-shadow:0 2px 12px rgba(0,0,0,0.05); margin-bottom:30px; display:none; }
    .form-container.show { display:block; }
    .form-group { margin-bottom:20px; }
    label { display:block; font-size:13px; color:#3D3228; font-weight:600; margin-bottom:8px; }
    input, textarea, select { width:100%; padding:12px 14px; border:1px solid #e8e4de; border-radius:10px; font-family:'Heebo'; font-size:14px; outline:none; direction:ltr; text-align:right; }
    input:focus, textarea:focus, select:focus { border-color:#1F3D34; }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
    .btn-submit { background:#1F3D34; color:#FFF; border:none; padding:12px 24px; border-radius:10px; cursor:pointer; font-family:'Heebo'; font-weight:600; width:100%; }
    .btn-submit:hover { background:#154428; }
    .btn-cancel { background:#f0f0f0; color:#333; border:none; padding:12px 24px; border-radius:10px; cursor:pointer; font-family:'Heebo'; margin-right:10px; }
    .btn-cancel:hover { background:#e0e0e0; }
    .error { background:#fdf0ef; color:#c94147; padding:12px; border-radius:10px; margin-bottom:20px; display:none; }
    .error.show { display:block; }
    .success { background:#d4edda; color:#155724; padding:12px; border-radius:10px; margin-bottom:20px; display:none; }
    .success.show { display:block; }
    table { width:100%; border-collapse:collapse; background:#FFF; border-radius:16px; overflow:hidden; box-shadow:0 2px 12px rgba(0,0,0,0.05); }
    th { background:#1F3D34; color:#FFF; padding:14px; font-weight:600; font-size:13px; text-align:right; }
    td { padding:14px; border-bottom:1px solid #f0ece6; font-size:13px; }
    tr:last-child td { border-bottom:none; }
    tr:hover td { background:#FAF8F4; }
    .badge { display:inline-block; padding:4px 12px; border-radius:20px; font-size:11px; font-weight:600; }
    .badge-active { background:#d4edda; color:#155724; }
    .actions { display:flex; gap:8px; }
    .btn-edit, .btn-delete { padding:6px 12px; border:none; border-radius:8px; cursor:pointer; font-size:12px; font-family:'Heebo'; }
    .btn-edit { background:#C4846C; color:#FFF; }
    .btn-edit:hover { background:#b57058; }
    .btn-delete { background:#e74c3c; color:#FFF; }
    .btn-delete:hover { background:#c0392b; }
    .loading { text-align:center; padding:40px; color:#9B8E82; }
    .back-link { display:inline-block; margin-bottom:20px; color:#1F3D34; text-decoration:none; font-weight:600; }
    .back-link:hover { text-decoration:underline; }
  </style>
</head>
<body>

<div class="container">
  <a href="dashboard.html" class="back-link">← חזור לעמוד הבית</a>

  <div class="header">
    <h1>ניהול ילדים</h1>
    <button class="btn-add" onclick="toggleForm()">+ הוסף ילד</button>
  </div>

  <div id="error" class="error"></div>
  <div id="success" class="success"></div>

  <div id="form" class="form-container">
    <h2 style="margin-bottom:20px;">הוסף / ערוך ילד</h2>
    <form id="childForm">
      <div class="form-row">
        <div class="form-group">
          <label for="firstName">שם פרטי *</label>
          <input type="text" id="firstName" required>
        </div>
        <div class="form-group">
          <label for="lastName">שם משפחה *</label>
          <input type="text" id="lastName" required>
        </div>
      </div>
      <div class="form-group">
        <label for="birthDate">תאריך לידה</label>
        <input type="date" id="birthDate">
      </div>
      <div style="display:flex; gap:10px;">
        <button type="submit" class="btn-submit">שמור</button>
        <button type="button" class="btn-cancel" onclick="toggleForm()">ביטול</button>
      </div>
    </form>
  </div>

  <div id="table" class="loading">טוען...</div>
</div>

<script src="js/common.js"></script>
<script src="js/api.js"></script>
<script>
let children = [];
let editingId = null;

async function loadChildren() {
  try {
    const res = await api.getChildren();
    if (res.success) {
      children = res.data;
      renderTable();
    }
  } catch (err) {
    showError('שגיאה בטעינת הנתונים: ' + err.message);
  }
}

function renderTable() {
  if (!children.length) {
    document.getElementById('table').innerHTML = '<p style="padding:20px; color:#9B8E82; text-align:center;">אין ילדים</p>';
    return;
  }

  const rows = children.map(c => `
    <tr>
      <td>${c.first_name_he} ${c.last_name_he}</td>
      <td>${c.birth_date ? formatDate(c.birth_date) : '-'}</td>
      <td><span class="badge badge-active">${c.status === 'active' ? 'פעיל' : c.status}</span></td>
      <td>
        <div class="actions">
          <button class="btn-edit" onclick="editChild('${c.id}')">ערוך</button>
          <button class="btn-delete" onclick="deleteChild('${c.id}')">מחק</button>
        </div>
      </td>
    </tr>
  `).join('');

  document.getElementById('table').innerHTML = `
    <table>
      <thead><tr>
        <th>שם</th>
        <th>תאריך לידה</th>
        <th>סטטוס</th>
        <th>פעולות</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function toggleForm() {
  document.getElementById('form').classList.toggle('show');
  if (!document.getElementById('form').classList.contains('show')) {
    resetForm();
  }
}

function resetForm() {
  document.getElementById('childForm').reset();
  editingId = null;
}

async function editChild(id) {
  const child = children.find(c => c.id === id);
  if (!child) return;

  editingId = id;
  document.getElementById('firstName').value = child.first_name_he;
  document.getElementById('lastName').value = child.last_name_he;
  document.getElementById('birthDate').value = child.birth_date || '';
  document.getElementById('form').classList.add('show');
}

async function deleteChild(id) {
  if (!confirm('האם ברצונך למחוק את הילד?')) return;

  try {
    const res = await api.deleteChild(id);
    if (res.success) {
      showSuccess('הילד נמחק בהצלחה');
      loadChildren();
    }
  } catch (err) {
    showError('שגיאה במחיקת הילד: ' + err.message);
  }
}

document.getElementById('childForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const data = {
    first_name_he: document.getElementById('firstName').value,
    last_name_he: document.getElementById('lastName').value,
    birth_date: document.getElementById('birthDate').value || null,
  };

  try {
    let res;
    if (editingId) {
      res = await api.updateChild(editingId, data);
    } else {
      res = await api.createChild(data);
    }

    if (res.success) {
      showSuccess(editingId ? 'הילד עודכן בהצלחה' : 'הילד נוסף בהצלחה');
      toggleForm();
      resetForm();
      loadChildren();
    }
  } catch (err) {
    showError('שגיאה: ' + err.message);
  }
});

loadChildren();
</script>

</body>
</html>
