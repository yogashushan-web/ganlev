<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>לוח בקרה — מערכת ניהול גנים</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Heebo',sans-serif; background:#F4EFE6; color:#3D3228; direction:rtl; min-height:100vh; }

    .header { display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:28px; padding-bottom:18px; border-bottom:2px solid #e8e4de; }
    .header h1 { font-size:28px; color:#1F3D34; }
    .header .sub { font-size:13px; color:#9B8E82; margin-top:4px; }
    .user-info { display:flex; align-items:center; gap:12px; }
    .user-avatar { width:42px; height:42px; border-radius:50%; background:#C4846C; color:#FFF; display:flex; align-items:center; justify-content:center; font-weight:700; }
    .user-text { text-align:left; }
    .user-name { font-weight:700; color:#1F3D34; font-size:13px; }
    .user-role { font-size:12px; color:#9B8E82; }

    .kpis { display:grid; grid-template-columns:repeat(auto-fit, minmax(210px,1fr)); gap:18px; margin-bottom:14px; }
    .kpi { background:#FFF; border-radius:18px; padding:20px 22px; box-shadow:0 4px 16px rgba(31,61,52,0.06); position:relative; overflow:hidden; }
    .kpi::before { content:''; position:absolute; top:0; right:0; width:6px; height:100%; background:var(--c,#C4846C); }
    .kpi .ico { font-size:20px; margin-bottom:10px; display:inline-block; }
    .kpi .lbl { font-size:13px; color:#9B8E82; margin-bottom:6px; }
    .kpi .val { font-size:27px; font-weight:800; color:#1F3D34; line-height:1.1; }
    .kpi .meta { font-size:12px; margin-top:6px; color:var(--c,#C4846C); font-weight:600; }

    .chips { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:28px; }
    .chip { background:#FFF; border-radius:12px; padding:10px 16px; box-shadow:0 2px 8px rgba(0,0,0,0.04); font-size:13px; color:#3D3228; }
    .chip b { color:#1F3D34; font-size:15px; }

    .panel { background:#FFF; border-radius:18px; padding:22px 24px; box-shadow:0 4px 16px rgba(31,61,52,0.06); margin-bottom:24px; }
    .panel h3 { font-size:15px; color:#1F3D34; margin-bottom:16px; }
    .bar-row { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
    .bar-row .name { width:90px; font-size:13px; color:#3D3228; }
    .bar-track { flex:1; background:#F0ECE6; border-radius:10px; height:22px; overflow:hidden; }
    .bar-fill { height:100%; border-radius:10px; transition:width .6s cubic-bezier(.2,1,.3,1); }
    .bar-row .amt { width:110px; text-align:left; font-weight:700; font-size:14px; }

    .actions { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px,1fr)); gap:13px; margin-bottom:30px; }
    .action-btn { background:#1F3D34; color:#FFF; border:none; border-radius:13px; padding:15px 18px; font-family:'Heebo'; font-size:14px; font-weight:700; cursor:pointer; transition:all .2s; }
    .action-btn:hover { background:#154428; transform:translateY(-2px); box-shadow:0 6px 16px rgba(31,61,52,0.22); }
    .action-btn.alt { background:#C4846C; }
    .action-btn.alt:hover { background:#a96b54; }

    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
    @media(max-width:1100px){ .grid2 { grid-template-columns:1fr; } }
    .section-title { font-size:16px; font-weight:700; color:#1F3D34; margin-bottom:14px; }
    table { width:100%; border-collapse:collapse; background:#FFF; border-radius:16px; overflow:hidden; box-shadow:0 2px 12px rgba(0,0,0,0.05); }
    th { background:#1F3D34; color:#FFF; padding:12px 14px; font-weight:500; font-size:12px; text-align:right; }
    td { padding:11px 14px; border-bottom:1px solid #f0ece6; font-size:13px; }
    tr:last-child td { border-bottom:none; }
    tr:hover td { background:#FAF8F4; }
    .amt-pos { color:#1F7a4f; font-weight:700; }
    .amt-neg { color:#c0563f; font-weight:700; }
    .loading { text-align:center; padding:30px; color:#9B8E82; }
    .empty { padding:18px; color:#9B8E82; font-size:13px; }
    .error { background:#fdf0ef; border:1px solid #f5c6c0; color:#c94147; padding:14px; border-radius:12px; margin-bottom:20px; display:none; }
    .error.show { display:block; }
    @media(max-width:600px){ .header{flex-direction:column;align-items:flex-start;gap:14px;} }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h1>לוח בקרה</h1>
      <div class="sub" id="gardenSub">טוען...</div>
    </div>
    <div class="user-info">
      <div class="user-avatar" id="userAvatar">👤</div>
      <div class="user-text">
        <div class="user-name" id="currentUser">משתמש</div>
        <div class="user-role" id="currentRole">מנהל</div>
      </div>
    </div>
  </div>

  <div id="error" class="error"></div>

  <div class="kpis">
    <div class="kpi" style="--c:#1F7a4f;">
      <span class="ico">📈</span>
      <div class="lbl">הכנסות החודש</div>
      <div class="val" id="kpiIncome">-</div>
    </div>
    <div class="kpi" style="--c:#c0563f;">
      <span class="ico">📉</span>
      <div class="lbl">הוצאות החודש</div>
      <div class="val" id="kpiExpense">-</div>
    </div>
    <div class="kpi" id="kpiNetCard" style="--c:#1F3D34;">
      <span class="ico">⚖️</span>
      <div class="lbl">מאזן החודש</div>
      <div class="val" id="kpiNet">-</div>
      <div class="meta" id="kpiNetMeta"></div>
    </div>
    <div class="kpi" style="--c:#C4846C;">
      <span class="ico">⏳</span>
      <div class="lbl">דמי לימוד שטרם שולמו</div>
      <div class="val" id="kpiOutstanding">-</div>
      <div class="meta" id="kpiOutstandingMeta"></div>
    </div>
  </div>

  <div class="chips">
    <div class="chip">👶 ילדים פעילים: <b id="chipChildren">-</b></div>
    <div class="chip">👔 עובדים: <b id="chipStaff">-</b></div>
    <div class="chip">📅 <span id="chipMonth"></span></div>
  </div>

  <div class="panel">
    <h3>הכנסות מול הוצאות — החודש</h3>
    <div class="bar-row">
      <div class="name">הכנסות</div>
      <div class="bar-track"><div class="bar-fill" id="barIncome" style="width:0; background:linear-gradient(90deg,#2e9b66,#1F7a4f);"></div></div>
      <div class="amt amt-pos" id="barIncomeAmt">₪0</div>
    </div>
    <div class="bar-row">
      <div class="name">הוצאות</div>
      <div class="bar-track"><div class="bar-fill" id="barExpense" style="width:0; background:linear-gradient(90deg,#d77a63,#c0563f);"></div></div>
      <div class="amt amt-neg" id="barExpenseAmt">₪0</div>
    </div>
  </div>

  <div class="actions">
    <button class="action-btn" onclick="location.href='children-manage.html'">+ ילד חדש</button>
    <button class="action-btn" onclick="location.href='income-expenses.html'">+ הכנסה</button>
    <button class="action-btn" onclick="location.href='income-expenses.html#expenses'">+ הוצאה</button>
    <button class="action-btn" onclick="location.href='parents-tuition.html'">+ דמי לימוד</button>
    <button class="action-btn alt" onclick="location.href='import.html'">📥 ייבוא מטבלה</button>
  </div>

  <div class="grid2">
    <div>
      <div class="section-title">דמי לימוד שטרם שולמו</div>
      <div id="pendingTuitionTable" class="loading">טוען...</div>
    </div>
    <div>
      <div class="section-title">תנועות אחרונות</div>
      <div id="recentTxTable" class="loading">טוען...</div>
    </div>
  </div>

<script src="js/common.js"></script>
<script src="js/api.js"></script>
<script>
const monthNames = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];

function sumBy(arr, key) {
  return (arr || []).reduce((s, x) => s + (parseFloat(x[key]) || 0), 0);
}

async function loadGardenName() {
  try {
    const token = localStorage.getItem('crm_token');
    const res = await fetch('/.netlify/functions/gardens', { headers: { 'Authorization': 'Bearer ' + token } });
    const json = await res.json();
    const active = getGardenId();
    const g = (json.data || []).find(x => x.id === active);
    return g ? g.name : '';
  } catch (e) { return ''; }
}

async function loadDashboard() {
  try {
    const user = getUser();
    document.getElementById('currentUser').textContent = user?.full_name_he || 'משתמש';
    document.getElementById('currentRole').textContent =
      { admin:'מנהל', manager:'מנהל גן', staff:'עובד' }[user?.role] || 'משתמש';

    const now = new Date();
    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
    const todayStr = now.toISOString().split('T')[0];
    document.getElementById('chipMonth').textContent = monthNames[now.getMonth()] + ' ' + now.getFullYear();

    loadGardenName().then(name => {
      document.getElementById('gardenSub').textContent = name ? ('גן פעיל: ' + name) : '';
    });

    const [summary, incomeRes, expenseRes, tuitionRes] = await Promise.all([
      api.getDashboardSummary().catch(() => ({})),
      api.getIncome(monthStart, todayStr).catch(() => ({ data: [] })),
      api.getExpenses(monthStart, todayStr).catch(() => ({ data: [] })),
      api.getTuition('pending').catch(() => ({ data: [] })),
    ]);

    const income = incomeRes.data || [];
    const expenses = expenseRes.data || [];
    const tuition = tuitionRes.data || [];

    const incomeTotal = sumBy(income, 'amount');
    const expenseTotal = sumBy(expenses, 'amount');
    const net = incomeTotal - expenseTotal;
    const outstanding = (summary.data && summary.data.pending_tuition_amount) || sumBy(tuition, 'amount');

    document.getElementById('kpiIncome').textContent = formatCurrency(incomeTotal);
    document.getElementById('kpiExpense').textContent = formatCurrency(expenseTotal);
    document.getElementById('kpiNet').textContent = formatCurrency(net);
    const netCard = document.getElementById('kpiNetCard');
    netCard.style.setProperty('--c', net >= 0 ? '#1F7a4f' : '#c0563f');
    const netMeta = document.getElementById('kpiNetMeta');
    netMeta.textContent = net >= 0 ? 'עודף 🙂' : 'גירעון';
    netMeta.style.color = net >= 0 ? '#1F7a4f' : '#c0563f';
    document.getElementById('kpiOutstanding').textContent = formatCurrency(outstanding);
    document.getElementById('kpiOutstandingMeta').textContent =
      (((summary.data && summary.data.pending_tuition_count) || tuition.length) || 0) + ' חיובים פתוחים';

    document.getElementById('chipChildren').textContent = (summary.data && summary.data.children_count) || 0;
    document.getElementById('chipStaff').textContent = (summary.data && summary.data.staff_count) || 0;

    const max = Math.max(incomeTotal, expenseTotal, 1);
    document.getElementById('barIncome').style.width = (incomeTotal / max * 100) + '%';
    document.getElementById('barExpense').style.width = (expenseTotal / max * 100) + '%';
    document.getElementById('barIncomeAmt').textContent = formatCurrency(incomeTotal);
    document.getElementById('barExpenseAmt').textContent = formatCurrency(expenseTotal);

    if (tuition.length) {
      const rows = tuition.slice(0, 6).map(t => `
        <tr><td>${t.child_name || t.child_id || '-'}</td><td>${formatCurrency(t.amount)}</td><td>${formatDate(t.due_date)}</td></tr>`).join('');
      document.getElementById('pendingTuitionTable').innerHTML =
        `<table><thead><tr><th>ילד</th><th>סכום</th><th>תאריך יעד</th></tr></thead><tbody>${rows}</tbody></table>`;
    } else {
      document.getElementById('pendingTuitionTable').innerHTML = '<div class="empty">אין דמי לימוד פתוחים 🎉</div>';
    }

    const tx = [
      ...income.map(i => ({ date:i.receipt_date, label:i.source_he, cat:i.category_he, amount:+i.amount, type:'in' })),
      ...expenses.map(e => ({ date:e.expense_date, label:e.description_he, cat:e.category_he, amount:-Math.abs(+e.amount), type:'out' })),
    ].sort((a,b) => (b.date || '').localeCompare(a.date || '')).slice(0, 8);

    if (tx.length) {
      const rows = tx.map(t => `
        <tr>
          <td>${t.type === 'in' ? '🟢 הכנסה' : '🔴 הוצאה'}</td>
          <td>${t.label || '-'}${t.cat ? ` <span style="color:#9B8E82;">· ${t.cat}</span>` : ''}</td>
          <td class="${t.amount >= 0 ? 'amt-pos' : 'amt-neg'}">${t.amount >= 0 ? '+' : '-'}${formatCurrency(Math.abs(t.amount))}</td>
          <td>${formatDate(t.date)}</td>
        </tr>`).join('');
      document.getElementById('recentTxTable').innerHTML =
        `<table><thead><tr><th>סוג</th><th>פירוט</th><th>סכום</th><th>תאריך</th></tr></thead><tbody>${rows}</tbody></table>`;
    } else {
      document.getElementById('recentTxTable').innerHTML = '<div class="empty">אין תנועות החודש. אפשר לייבא טבלה 📥</div>';
    }
  } catch (err) {
    showError('שגיאה בטעינת הנתונים: ' + err.message);
  }
}

loadDashboard();
</script>

</body>
</html>
