<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ימי היכרות — רישומים</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Heebo',sans-serif; background:#F4EFE6; color:#3D3228; direction:rtl; min-height:100vh; }
    .wrap { max-width:820px; margin:0 auto; padding:22px 18px 60px; }
    .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; flex-wrap:wrap; gap:10px; }
    h1 { font-size:25px; color:#1F3D34; }
    .back { color:#9B8E82; font-size:13px; text-decoration:none; font-weight:600; }
    .lead { color:#9B8E82; font-size:14px; margin-bottom:16px; line-height:1.6; }
    .bar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px; }
    .btn { background:#1F3D34; color:#fff; border:none; padding:11px 17px; border-radius:11px; cursor:pointer; font-family:'Heebo'; font-weight:700; font-size:13px; }
    .btn.ghost { background:#efe9e0; color:#6f6457; }
    .day { background:#fff; border-radius:16px; padding:16px 18px; box-shadow:0 3px 14px rgba(0,0,0,.06); margin-bottom:14px; }
    .day-h { font-size:17px; font-weight:800; color:#1F3D34; margin-bottom:12px; }
    .caps { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    @media(max-width:560px){ .caps{grid-template-columns:1fr;} }
    .cap-h { font-weight:800; color:#2D5A50; font-size:15px; margin-bottom:7px; direction:ltr; text-align:right; }
    .cap-h .cnt { font-size:12px; font-weight:600; color:#9B8E82; }
    .kid { background:#faf8f4; border:1px solid #f0ece6; border-radius:9px; padding:8px 11px; font-size:14px; margin-bottom:6px; }
    .empty-slot { color:#c3b8a8; font-size:13px; font-style:italic; }
    .empty { color:#b6ab9d; text-align:center; padding:30px; font-size:15px; }
    .toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:#1F3D34; color:#fff; padding:11px 20px; border-radius:12px; font-weight:600; font-size:14px; opacity:0; transition:.2s; pointer-events:none; }
    .toast.show { opacity:1; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <h1>🏠 ימי היכרות — רישומים</h1>
      <a class="back" href="children-manage.html">‹ חזרה לילדים</a>
    </div>
    <div class="lead">מי נרשם לכל קפסולת ביקור באוגוסט (23–27, 30–31). כל קפסולה עד 6 משפחות.</div>
    <div class="bar">
      <button class="btn" onclick="copyLink()">🔗 העתק קישור להורים</button>
      <button class="btn ghost" onclick="load()">↻ רענון</button>
    </div>
    <div id="list"><div class="empty">טוען…</div></div>
  </div>
  <div class="toast" id="toast"></div>

<script src="js/common.js?v=11"></script>
<script src="js/api.js?v=11"></script>
<script>
  const DAY_NAMES = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
  const MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
  const DATES = ['2026-08-23','2026-08-24','2026-08-25','2026-08-26','2026-08-27','2026-08-30','2026-08-31'];
  const SLOTS = [{s:'09:00',e:'09:50'},{s:'10:00',e:'10:50'}];
  const CAP = 6;
  const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const $ = id => document.getElementById(id);
  function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }
  function copyLink(){ const u=location.origin+'/visit'; navigator.clipboard.writeText(u).then(()=>toast('הקישור הועתק: '+u)).catch(()=>toast(u)); }
  function fmtDate(d){ const [y,m,dd]=d.split('-').map(Number); const dow=new Date(y,m-1,dd).getDay(); return `יום ${DAY_NAMES[dow]} · ${dd} ב${MONTHS[m-1]}`; }

  async function load() {
    try {
      const r = await api.getVisitBookings();
      const rows = r.data || [];
      const by = {};
      rows.forEach(e => { const t=(e.event_time||'').slice(0,5); (by[e.event_date+'|'+t] = by[e.event_date+'|'+t] || []).push(e.title); });
      const total = rows.length;
      $('list').innerHTML = (total ? '' : '<div class="empty" style="margin-bottom:14px;">עדיין אין רישומים. שלחו את הקישור להורים 🌿</div>') +
      DATES.map(date => {
        const caps = SLOTS.map(sl => {
          const kids = by[date+'|'+sl.s] || [];
          const list = kids.length ? kids.map(k => `<div class="kid">${esc(k)}</div>`).join('') : '<div class="empty-slot">— אין רישומים —</div>';
          return `<div><div class="cap-h">${sl.s}–${sl.e} <span class="cnt">(${kids.length}/${CAP})</span></div>${list}</div>`;
        }).join('');
        return `<div class="day"><div class="day-h">${fmtDate(date)}</div><div class="caps">${caps}</div></div>`;
      }).join('');
    } catch(e){ $('list').innerHTML = '<div class="empty">שגיאה: ' + esc(e.message) + '</div>'; }
  }
  load();
</script>
</body>
</html>
