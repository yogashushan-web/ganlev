<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>תפריט — גן לב</title>
  <link href="https://fonts.googleapis.com/css2?family=Alef:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Alef',sans-serif; background:#F4EFE6; color:#3D3228; direction:rtl; min-height:100vh; }
    .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; padding-bottom:14px; border-bottom:2px solid #e8e4de; flex-wrap:wrap; gap:12px; }
    .header h1 { font-size:26px; color:#1F3D34; }
    .btn { background:#1F3D34; color:#fff; border:none; padding:11px 20px; border-radius:10px; cursor:pointer; font-family:'Alef'; font-weight:700; font-size:14px; }
    .btn.ghost { background:#efe9e0; color:#6f6457; }
    .btn.soft { background:#fff; color:#1F3D34; box-shadow:0 2px 8px rgba(0,0,0,.06); }
    .btn:disabled { opacity:.5; cursor:default; }
    .err,.ok { padding:12px; border-radius:10px; margin-bottom:14px; display:none; }
    .err { background:#fdf0ef; color:#c94147; } .ok { background:#d4edda; color:#155724; }
    .err.show,.ok.show { display:block; }
    .hide { display:none !important; }

    .steps { display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; }
    .step-pill { padding:7px 14px; border-radius:999px; font-size:12.5px; font-weight:700; background:#fff; color:#8a7f70; border:1px solid #e8e4de; cursor:pointer; font-family:'Alef'; }
    .step-pill:hover { border-color:#1F3D34; color:#1F3D34; }
    .step-pill.on { background:#1F3D34; color:#fff; border-color:#1F3D34; }
    .step-pill.done { background:#e6f4ec; color:#1F7a4f; border-color:#cfe7d9; }

    .card { background:#fff; border-radius:18px; padding:24px 26px; box-shadow:0 2px 14px rgba(0,0,0,.06); margin-bottom:16px; }
    .card h2 { font-size:20px; color:#1F3D34; margin-bottom:5px; }
    .card .sub { color:#9B8E82; font-size:13.5px; margin-bottom:18px; line-height:1.6; }
    .fld { margin-bottom:16px; }
    .fld label { display:block; font-size:13px; font-weight:700; color:#3D3228; margin-bottom:7px; }
    .fld input, .fld select, .fld textarea { width:100%; max-width:340px; padding:11px 13px; border:1.5px solid #e8e4de; border-radius:10px; font-family:'Alef'; font-size:14px; outline:none; }
    .fld textarea { max-width:100%; min-height:72px; resize:vertical; }
    .fld input:focus, .fld select:focus, .fld textarea:focus { border-color:#1F3D34; }
    .nav { display:flex; gap:10px; margin-top:20px; flex-wrap:wrap; }
    .count-line { font-size:12.5px; color:#9B8E82; margin-top:10px; }

    .pick { display:flex; gap:8px; flex-wrap:wrap; }
    .pick .p { border:1.5px solid #e8e4de; background:#fff; border-radius:999px; padding:8px 15px; font-family:'Alef'; font-size:13.5px; font-weight:700; cursor:pointer; color:#6f6457; }
    .pick .p.on { background:#1F3D34; border-color:#1F3D34; color:#fff; }

    /* ---- לוח השבוע ---- */
    .grid { display:grid; grid-template-columns:104px repeat(5,minmax(150px,1fr)); gap:8px; }
    .gh { font-size:13px; font-weight:700; color:#1F3D34; text-align:center; padding:7px 4px; background:#fff; border-radius:10px; }
    .gh em { display:block; font-style:normal; font-size:11px; color:#9B8E82; font-variant-numeric:tabular-nums; }
    .mh { display:flex; flex-direction:column; justify-content:center; gap:2px; font-size:12.5px; font-weight:700; color:#6f6457; background:#FAF8F4; border-radius:10px; padding:9px 11px; }
    .mh em { font-style:normal; font-size:11px; color:#B9AE9F; font-variant-numeric:tabular-nums; }
    .cell { background:#fff; border:1.5px dashed #e8e4de; border-radius:10px; padding:7px; min-height:62px; display:flex; flex-direction:column; gap:5px; }
    .cell.tgt { border-color:#1F3D34; background:#f4f9f6; border-style:solid; }
    .cell.warn { border-color:#f0c9c6; background:#fdf6f5; }
    .chip { display:flex; align-items:center; gap:5px; background:#FAF8F4; border:1px solid #efe9e0; border-radius:8px; padding:5px 7px; font-size:12.5px; cursor:pointer; text-align:right; }
    .chip:hover { border-color:#1F3D34; }
    .chip.sel { background:#1F3D34; border-color:#1F3D34; color:#fff; }
    .chip .nm { flex:1; min-width:0; }
    .chip .al { font-size:10.5px; color:#c94147; font-weight:700; }
    .chip.sel .al { color:#ffd9d6; }
    .chip .rm { background:none; border:none; font-family:'Alef'; font-size:10.5px; font-weight:700; color:#9B8E82; cursor:pointer; padding:1px 3px; border-radius:5px; }
    .chip .rm:hover { background:#fdf0ef; color:#c94147; }
    .chip.sel .rm { color:#cfe0d8; }
    .add { background:none; border:none; font-family:'Alef'; font-size:12px; font-weight:700; color:#9B8E82; cursor:pointer; padding:4px; border-radius:7px; text-align:center; }
    .add:hover { background:#f4f9f6; color:#1F3D34; }
    .daytools { display:flex; gap:5px; justify-content:center; margin-top:5px; }
    .daytools button { background:none; border:none; font-family:'Alef'; font-size:11px; font-weight:700; color:#B9AE9F; cursor:pointer; padding:2px 6px; border-radius:6px; }
    .daytools button:hover { background:#f4f9f6; color:#1F3D34; }
    .movehint { background:#f4f9f6; border:1px solid #cfe7d9; color:#1F7a4f; border-radius:10px; padding:9px 13px; font-size:12.5px; font-weight:700; margin-bottom:11px; display:flex; gap:9px; align-items:center; flex-wrap:wrap; }
    .movehint button { background:#fff; border:1px solid #cfe7d9; border-radius:7px; padding:4px 10px; font-family:'Alef'; font-size:11.5px; font-weight:700; color:#1F7a4f; cursor:pointer; }

    /* ---- בדיקה ---- */
    .vrow { display:flex; gap:10px; align-items:flex-start; padding:11px 13px; border-radius:11px; margin-bottom:8px; font-size:13.5px; line-height:1.6; }
    .vrow.warn { background:#fdf6f5; border:1px solid #f0c9c6; }
    .vrow.note { background:#FAF8F4; border:1px solid #efe9e0; color:#6f6457; }
    .vrow .tag { font-size:11px; font-weight:700; border-radius:999px; padding:2px 9px; flex:0 0 auto; }
    .vrow.warn .tag { background:#f6dedb; color:#9d3b40; }
    .vrow.note .tag { background:#efe9e0; color:#8a7f70; }
    .vrow .go { margin-right:auto; background:#fff; border:1px solid #e8e4de; border-radius:7px; padding:4px 10px; font-family:'Alef'; font-size:11.5px; font-weight:700; color:#1F3D34; cursor:pointer; flex:0 0 auto; }
    .clean { background:#e6f4ec; border:1px solid #cfe7d9; color:#1F7a4f; border-radius:12px; padding:15px 17px; font-size:14px; font-weight:700; }

    /* ---- עיצוב ---- */
    .tpls { display:grid; grid-template-columns:repeat(auto-fit,minmax(214px,1fr)); gap:12px; }
    .tpl { background:#FAF8F4; border:1.5px solid #e8e4de; border-radius:14px; padding:14px; cursor:pointer; text-align:right; font-family:'Alef'; }
    .tpl:hover { border-color:#1F3D34; }
    .tpl.on { border-color:#1F3D34; background:#f4f9f6; box-shadow:0 0 0 3px rgba(31,61,52,.08); }
    .tpl b { display:block; font-size:14.5px; color:#1F3D34; margin-bottom:3px; }
    .tpl em { font-style:normal; font-size:12px; color:#9B8E82; line-height:1.6; }
    .tpl .mini { height:74px; background:#fff; border:1px solid #efe9e0; border-radius:9px; margin-bottom:10px; padding:6px; display:flex; gap:3px; }
    .tpl .mini i { background:#e8e4de; border-radius:3px; display:block; }

    /* ---- תצוגה מקדימה ---- */
    .prev { background:#F4EFE6; border:1px solid #e8e4de; border-radius:14px; padding:4px; overflow:hidden; }
    .prev .wrap { max-width:none; padding:16px 12px 22px; }

    /* ---- מאגר המנות ---- */
    .searchbar { background:#FFF; border-radius:14px; padding:12px 16px; box-shadow:0 2px 11px rgba(0,0,0,0.05); margin-bottom:16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .searchbar input { flex:1; min-width:150px; border:none; outline:none; font-family:'Alef'; font-size:15px; background:transparent; }
    .dishes { display:grid; grid-template-columns:repeat(auto-fill,minmax(236px,1fr)); gap:10px; }
    .dish { background:#fff; border:1.5px solid #e8e4de; border-radius:13px; padding:12px 14px; cursor:pointer; }
    .dish:hover { border-color:#1F3D34; }
    .dish b { display:block; font-size:14.5px; color:#1F3D34; }
    .dish .meta { font-size:11.5px; color:#9B8E82; margin-top:3px; }
    .dish .al { font-size:11px; color:#c94147; font-weight:700; margin-top:5px; }
    .dish .un { font-size:11px; color:#B9AE9F; margin-top:5px; }
    .dish.off { opacity:.5; }
    .catbar { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }

    .homecell { font-size:11.5px; color:#B9AE9F; font-style:italic; text-align:center; padding:6px 0; }
    .dish .ing { font-size:11px; color:#B9AE9F; margin-top:4px; line-height:1.5; }

    /* ---- השלמה אוטומטית מהקטלוג ---- */
    .acwrap { position:relative; max-width:340px; }
    .ac { position:absolute; top:100%; right:0; left:0; z-index:40; background:#fff;
          border:1.5px solid #e8e4de; border-radius:12px; margin-top:4px; overflow:hidden;
          box-shadow:0 10px 30px rgba(0,0,0,.12); max-height:280px; overflow-y:auto; }
    .ac:empty { display:none; }
    .acit { display:block; width:100%; text-align:right; background:none; border:none;
            border-bottom:1px solid #f2ede6; padding:9px 12px; cursor:pointer; font-family:'Alef'; }
    .acit:last-child { border-bottom:none; }
    .acit:hover { background:#f4f9f6; }
    .acit b { display:block; font-size:13.5px; color:#1F3D34; }
    .acit em { display:block; font-style:normal; font-size:11.5px; color:#9B8E82; margin-top:2px; }
    .acit .warnline { display:block; font-size:11px; color:#c94147; font-weight:700; margin-top:3px; }
    .acit .careline { display:block; font-size:11px; color:#b8801f; margin-top:3px; }
    .acit.bad b { color:#c94147; }

    /* ---- חלון ---- */
    .ov { position:fixed; inset:0; background:rgba(31,61,52,.45); display:none; align-items:center; justify-content:center; z-index:9999; padding:18px; }
    .ov.show { display:flex; }
    .modal { background:#fff; border-radius:18px; padding:24px 26px; width:100%; max-width:520px; max-height:86vh; overflow:auto; box-shadow:0 20px 60px rgba(0,0,0,.3); }
    .modal h3 { color:#1F3D34; font-size:19px; margin-bottom:4px; }
    .modal .msub { color:#9B8E82; font-size:13px; margin-bottom:16px; line-height:1.6; }
    .modal input[type=text] { width:100%; padding:11px 13px; border:1.5px solid #e8e4de; border-radius:10px; font-family:'Alef'; font-size:14px; outline:none; }
    .modal input[type=text]:focus { border-color:#1F3D34; }
    .m-actions { display:flex; gap:9px; margin-top:18px; flex-wrap:wrap; }
    .empty-note { color:#9B8E82; font-size:13.5px; line-height:1.7; }
    .plist { max-height:300px; overflow:auto; margin-top:4px; }
    .prow { display:flex; align-items:center; gap:10px; background:#FAF8F4; border:1px solid #efe9e0; border-radius:11px; padding:10px 12px; margin-bottom:7px; cursor:pointer; }
    .prow:hover { border-color:#1F3D34; background:#f4f9f6; }
    .prow .nm { font-weight:700; color:#1F3D34; font-size:14px; }
    .prow .meta { font-size:11.5px; color:#9B8E82; }
    .prow .rm { margin-right:auto; background:#f6f2ec; border:1px solid #e8e1d6; color:#8a7f70; border-radius:8px; padding:5px 10px; font-size:11.5px; font-weight:700; cursor:pointer; font-family:'Alef'; }
    .prow .rm:hover { background:#fdf0ef; border-color:#f3cfc9; color:#c94147; }
    mark { background:#fdf2cf; border-radius:3px; }

    @media (max-width:880px) {
      .grid { grid-template-columns:1fr; }
      .gh { text-align:right; background:#1F3D34; color:#fff; margin-top:9px; }
      .gh em { color:#cfe0d8; }
      .mh { flex-direction:row; align-items:baseline; gap:7px; }
    }
    @media print {
      body { padding:0 !important; background:#fff; }
      .header, .steps, .err, .ok, .ov, .nav, .movehint, #crmSidebar, #crmMenuBtn,
      #trashFab, #error, #success, .pbar { display:none !important; }
      .card { box-shadow:none; padding:0; }
      .prev { border:0; background:#fff; padding:0; }
    }
  </style>
  <style id="menuCss"></style>
</head>
<body>

  <div class="header">
    <h1>🍲 תפריט</h1>
    <div style="display:flex; gap:8px; flex-wrap:wrap;" id="topActions"></div>
  </div>

  <div id="error" class="err"></div>
  <div id="success" class="ok"></div>

  <div class="steps" id="steps"></div>
  <div id="wizard"></div>
  <div id="library" class="hide"></div>

  <div class="ov" id="modalOv" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <h3 id="modalTitle"></h3>
      <div class="msub" id="modalSub"></div>
      <div id="modalBody"></div>
      <div class="m-actions" id="modalActions"></div>
    </div>
  </div>

<script src="js/common.js?v=27"></script>
<script src="js/api.js?v=23"></script>
<script src="js/profile.js?v=1"></script>
<script src="js/menu-render.js?v=2"></script>
<script src="js/menu-check.js?v=1"></script>
<script>
// התפריט **קבוע**. המסך נפתח עליו ולא על אשף: הגננת לא בונה תפריט
// כל שבוע — היא בונה אותו פעם אחת ועורכת כשמשהו משתנה. אשף שעוברים
// בו פעם אחת בחיים הוא התקנה, לא מסך עבודה.
const esc = s => (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MR = MenuRender, MC = MenuCheck;
const DAYS = MR.DAYS;
const ALLERGENS = [
  { code:'milk', name:'חלב' }, { code:'egg', name:'ביצים' }, { code:'peanut', name:'בוטנים' },
  { code:'nuts', name:'אגוזים' }, { code:'sesame', name:'שומשום' }, { code:'gluten', name:'גלוטן' },
];
const CATS = ['בוקר', 'צהריים', 'נשנוש'];
const MEAL_CAT = { breakfast:'בוקר', lunch:'צהריים', snack1:'נשנוש', snack2:'נשנוש' };
const MEAL_SETS = {
  3: [{key:'breakfast',name:'ארוחת בוקר',time:'08:30',icon:'bowl'},
      {key:'lunch',name:'ארוחת צהריים',time:'12:00',icon:'pot'},
      {key:'snack2',name:'נשנוש',time:'15:30',icon:'fruit'}],
  4: MR.MEALS,
  5: [{key:'breakfast',name:'ארוחת בוקר',time:'08:00',icon:'bowl'},
      {key:'snack1',name:'נשנוש',time:'10:00',icon:'fruit'},
      {key:'lunch',name:'ארוחת צהריים',time:'12:00',icon:'pot'},
      {key:'snack2',name:'נשנוש',time:'15:00',icon:'fruit'},
      {key:'supper',name:'ארוחת ערב',time:'17:00',icon:'bowl'}],
};

let dishes = [], menu = null, exceptions = [], sens = [], catalog = [];
let food = { meals: MR.MEALS, days: ['sun','mon','tue','wed','thu'], fromHome: [], facts: [] };
let view = 'menu', libFilter = '', libCat = '', sel = null, picker = null, editing = null;
let acOpen = false, acHits = [];

document.getElementById('menuCss').textContent = MR.MENU_CSS;

const MEALS = () => food.meals;
const dayList = () => DAYS.filter(d => food.days.indexOf(d.key) >= 0);
const at = (day, meal) => (((menu.days[day] = menu.days[day] || {})[meal] = menu.days[day][meal] || []));
const dishById = id => dishes.find(d => d.id === id) || null;
const dishMap = () => { const o = {}; dishes.forEach(d => { o[d.id] = d; }); return o; };
const isHome = (day, meal) => food.fromHome.some(h => h.day === day && h.meal === meal);
const mealOf = k => MEALS().find(m => m.key === k) || MEALS()[0];
const P2 = n => String(n).padStart(2, '0');
const todayIso = () => { const d = new Date(); return `${d.getFullYear()}-${P2(d.getMonth()+1)}-${P2(d.getDate())}`; };
const DAY_OF = iso => ['sun','mon','tue','wed','thu','fri','sat'][new Date(iso + 'T00:00:00').getDay()];

/* ---------- טעינה ---------- */
async function boot() {
  try {
    await GL.load();
    const f = GL.get('food');
    if (f) food = Object.assign(food, f);
  } catch (e) {}
  try {
    const r = await api.getMenu();
    dishes = (r && r.dishes) || [];
    menu = (r && r.menu) || null;
    exceptions = (r && r.exceptions) || [];
  } catch (e) { showErr('הטעינה נכשלה: ' + e.message); }
  loadSens();
  loadCatalog();

  // שאלה בהקשר, לא בשאלון: כמה ארוחות — רק כשנכנסים לכלי בפעם
  // הראשונה, ורק אם זה לא ידוע כבר.
  if (!GL.get('food.meals')) await askMeals();
  if (!menu) {
    menu = { id:'standing', name:'התפריט שלנו', days:{}, template:'table',
             infoPage:true, live:false, names:{} };
  }
  menu.days = menu.days || {};
  render();
}
async function askMeals() {
  const n = await GL.need('food.mealCount', {
    q: 'כמה ארוחות ביום בגן?',
    sub: 'זה קובע כמה שורות יהיו בתפריט. אפשר לשנות בכל רגע בהגדרות הגן.',
    options: [{ v:3, label:'שלוש', note:'בוקר · צהריים · נשנוש' },
              { v:4, label:'ארבע', note:'בוקר · נשנוש · צהריים · נשנוש' },
              { v:5, label:'חמש', note:'כולל ארוחת ערב' }],
    why: 'נשאל פעם אחת. מכאן המערכת תזכור.',
  });
  if (!n) return;
  food.meals = MEAL_SETS[n] || MR.MEALS;
  await GL.set('food.meals', food.meals, 'user');

  // שאלת המשך, ורק אם היא רלוונטית: יום שישי קיים בחלק מהגנים ולא
  // בכולם, ובאלה שכן — לרוב הבוקר מגיע מהבית.
  const fri = await GL.need('food.friday', {
    q: 'יש אוכל בגן בימי שישי?',
    sub: '',
    options: [{ v:'home', label:'כן — ארוחת הבוקר מגיעה מהבית' },
              { v:'full', label:'כן — הגן מגיש כרגיל' },
              { v:'no', label:'לא, הגן סגור בשישי' }],
  });
  if (fri === 'home' || fri === 'full') {
    food.days = ['sun','mon','tue','wed','thu','fri'];
    if (fri === 'home') food.fromHome = [{ day:'fri', meal:'breakfast' }];
  }
  await GL.set('food.days', food.days, 'user');
  await GL.set('food.fromHome', food.fromHome, 'user');
}
async function loadSens() {
  try {
    const [rc, rh] = await Promise.all([api.getChildren(), api.getChildHealth()]);
    const health = (rh && rh.health) || {};
    sens = ((rc && rc.data) || []).map(c => ({
      name: (c.first_name_he + ' ' + (c.last_name_he || '')).trim(),
      codes: health[c.id] || [],
    })).filter(s => s.codes.length);
    if (view === 'menu') render();
  } catch (e) { sens = []; }
}
// 175 מנות עם מרכיבים, מתוך תפריטים שפורסמו והנחיות משרד הבריאות.
// נטען פעם אחת ומשמש להשלמה אוטומטית בלבד — הוא לא נכנס למאגר של הגן
// עד שהגננת בוחרת מנה.
async function loadCatalog() {
  try {
    const r = await fetch('js/dish-catalogue.json?v=1');
    const d = await r.json();
    catalog = (d && d.dishes) || [];
  } catch (e) { catalog = []; }
}

/* ---------- מסגרת ---------- */
function setView(v) { view = v; sel = null; render(); window.scrollTo({ top:0, behavior:'smooth' }); }
function render() {
  document.getElementById('topActions').innerHTML = `
    <button class="btn soft" onclick="setView('lib')">מאגר המנות</button>
    <button class="btn soft" onclick="setView('preview')">תצוגה מקדימה</button>
    <button class="btn" onclick="saveMenu(true)">${menu.live ? 'שמירה' : 'העלאה לאוויר'}</button>`;
  const tabs = [['menu','התפריט'],['exc','שינויים'],['design','עיצוב'],['info','עמוד מידע']];
  document.getElementById('steps').innerHTML = (view === 'lib' || view === 'preview')
    ? `<button class="step-pill" onclick="setView('menu')">חזרה לתפריט</button>`
    : tabs.map(([v,l]) => `<button class="step-pill ${view===v?'on':''}" onclick="setView('${v}')">${l}</button>`).join('');
  const w = document.getElementById('wizard');
  const L = document.getElementById('library');
  L.classList.add('hide'); w.classList.remove('hide');
  if (view === 'menu') w.innerHTML = viewMenu();
  if (view === 'exc') w.innerHTML = viewExc();
  if (view === 'design') w.innerHTML = viewDesign();
  if (view === 'info') w.innerHTML = viewInfo();
  if (view === 'preview') w.innerHTML = viewPreview();
  if (view === 'lib') { w.classList.add('hide'); L.classList.remove('hide'); renderLib(); }
}

/* ---------- התפריט ---------- */
function viewMenu() {
  const warnCells = {};
  const checks = MC.checkWeek({ week: menu, dishes: dishMap(), sensitivities: sens,
                                meals: MEALS(), days: food.days, fromHome: food.fromHome });
  checks.filter(v => v.level === 'warn' && v.day && v.meal)
        .forEach(v => { warnCells[v.day + '|' + v.meal] = true; });
  const warns = checks.filter(v => v.level === 'warn');

  const ds = dayList();
  let g = `<div class="grid" style="grid-template-columns:104px repeat(${ds.length},minmax(140px,1fr))"><div></div>`;
  ds.forEach(d => {
    g += `<div class="gh">${esc(d.name)}
      <div class="daytools"><button onclick="clearDay('${d.key}')">ניקוי</button>
        <button onclick="copyDay('${d.key}')">שכפול</button></div></div>`;
  });
  MEALS().forEach(m => {
    g += `<div class="mh">${esc(m.name)}<em>${esc(m.time)}</em></div>`;
    ds.forEach(d => {
      const ids = at(d.key, m.key), home = isHome(d.key, m.key);
      g += `<div class="cell ${sel ? 'tgt' : ''} ${warnCells[d.key+'|'+m.key] ? 'warn' : ''}"
             onclick="cellTap('${d.key}','${m.key}')">`;
      if (home && !ids.length) g += '<div class="homecell">מהבית</div>';
      ids.forEach((id, idx) => {
        const dd = dishById(id), nm = dd ? dd.name : 'מנה שנמחקה', bad = dd ? alertFor(dd) : '';
        const on = sel && sel.day === d.key && sel.meal === m.key && sel.idx === idx;
        g += `<div class="chip ${on?'sel':''}" onclick="event.stopPropagation();chipTap('${d.key}','${m.key}',${idx})">
                <span class="nm">${esc(nm)}${bad?`<span class="al"> · ${esc(bad)}</span>`:''}</span>
                <button class="rm" onclick="event.stopPropagation();dropDish('${d.key}','${m.key}',${idx})">הסר</button>
              </div>`;
      });
      g += `<button class="add" onclick="event.stopPropagation();openPicker('${d.key}','${m.key}')">הוספת מנה</button></div>`;
    });
  });
  g += '</div>';

  const total = ds.reduce((n,d) => n + MEALS().reduce((k,m) => k + at(d.key,m.key).length, 0), 0);
  return `<div class="card">
    <h2>${esc(menu.name)}</h2>
    <div class="sub">זה התפריט הקבוע של הגן. הוא לא נבנה מחדש כל שבוע —
      הוא נשאר כמו שהוא עד שמשנים אותו, ושינוי חד-פעמי ליום מסוים נרשם
      תחת "שינויים" ולא כאן.</div>
    ${!menu.live ? `<div class="vrow note" style="margin-bottom:12px">
      <span class="tag">טיוטה</span>
      <span>התפריט עוד לא באוויר. ההורים לא רואים אותו.</span></div>` : ''}
    ${sel ? `<div class="movehint">
      <span>«${esc((dishById(at(sel.day,sel.meal)[sel.idx])||{}).name||'')}» נבחרה —
        עכשיו לחיצה על המשבצת שאליה היא עוברת.</span>
      <button onclick="sel=null;render()">ביטול</button></div>` : ''}
    ${g}
    <div class="count-line">${total} מנות בתפריט · ${sens.length
      ? `${sens.length} ילדים עם רגישות מסומנת` : 'אין רגישויות מסומנות בקבוצה'}</div>
    ${warns.length ? `<div style="margin-top:14px">${warns.slice(0,4).map(v =>
      `<div class="vrow warn"><span class="tag">לשים לב</span><span>${esc(v.text)}</span></div>`).join('')}
      ${warns.length > 4 ? `<div class="count-line">ועוד ${warns.length-4}.</div>` : ''}</div>` : ''}
  </div>`;
}
function alertFor(d) {
  if (!Array.isArray(d.allergens) || !d.allergens.length) return '';
  return d.allergens.filter(c => sens.some(s => s.codes.indexOf(c) >= 0))
    .map(c => MC.ALLERGEN_NAME[c] || c).join(', ');
}
function chipTap(day, meal, idx) {
  sel = (sel && sel.day===day && sel.meal===meal && sel.idx===idx) ? null : { day, meal, idx };
  render();
}
function cellTap(day, meal) {
  if (!sel) return;
  const from = at(sel.day, sel.meal), id = from[sel.idx];
  if (!id) { sel = null; render(); return; }
  from.splice(sel.idx, 1); at(day, meal).push(id);
  sel = null; saveMenu(); render();
}
function dropDish(day, meal, idx) { at(day,meal).splice(idx,1); sel=null; saveMenu(); render(); }
function clearDay(day) { MEALS().forEach(m => { menu.days[day] = menu.days[day]||{}; menu.days[day][m.key] = []; }); saveMenu(); render(); }
function copyDay(day) {
  const ds = dayList(), i = ds.findIndex(d => d.key === day), next = ds[i+1];
  if (!next) { showErr('אין יום אחרי ' + ds[i].name); return; }
  MEALS().forEach(m => { menu.days[next.key] = menu.days[next.key]||{}; menu.days[next.key][m.key] = at(day,m.key).slice(); });
  showOk(`יום ${ds[i].name} שוכפל ליום ${next.name}`); saveMenu(); render();
}

/* ---------- שמירה ---------- */
async function saveMenu(live) {
  const names = {};
  dayList().forEach(d => MEALS().forEach(m => at(d.key,m.key).forEach(id => {
    const dd = dishById(id); if (dd) names[id] = dd.name;
  })));
  if (live) menu.live = true;
  menu.names = names;
  try {
    await api.saveMenu(menu);
    if (live) { showOk('באוויר · ' + location.origin + '/menu'); render(); }
  } catch (e) { showErr('השמירה נכשלה: ' + e.message); }
}

function openExc() {
  const t = todayIso();
  openModal('שינוי ליום מסוים', 'התפריט הקבוע נשאר כמו שהוא.',
    `<div class="fld"><label>תאריך</label>
       <input type="date" id="xd" value="${t}" min="${t}" style="max-width:200px"></div>
     <div class="fld"><label>מה לא יוגש</label>
       <div class="pick" id="xm">${MEALS().map(m =>
         `<button class="p" data-k="${m.key}" onclick="this.classList.toggle('on')">${esc(m.name)}</button>`).join('')}</div></div>
     <div class="fld"><label>סיבה — מה ההורים יראו</label>
       <input type="text" id="xn" maxlength="80" placeholder="למשל: טיול שנתי"></div>`,
    `<button class="btn" onclick="addExc()">שמירה</button>
     <button class="btn ghost" onclick="closeModal()">ביטול</button>`);
}
async function addExc() {
  const date = document.getElementById('xd').value;
  if (!date) { showErr('צריך תאריך'); return; }
  const cancelled = Array.from(document.querySelectorAll('#xm .p.on')).map(b => b.dataset.k);
  const note = (document.getElementById('xn').value || '').trim();
  if (!cancelled.length && !note) { showErr('צריך לציין מה משתנה או למה'); return; }
  const x = { date, day: DAY_OF(date), cancelled, note };
  try {
    await api.saveMenuException(x);
    exceptions = exceptions.filter(e => e.date !== date).concat([x])
      .sort((a,b) => a.date.localeCompare(b.date));
    closeModal(); render(); showOk('נשמר · ההורים יראו את זה מעל התפריט');
  } catch (e) { showErr('השמירה נכשלה: ' + e.message); }
}
async function removeExc(i) {
  const x = exceptions[i]; if (!x) return;
  exceptions.splice(i,1); render();
  try { await api.deleteMenuException(x.date); showOk('הוסר · ניתן לשחזור מהפח'); }
  catch (e) { showErr('ההסרה נכשלה: ' + e.message); }
}

function renderPicker() {

function addDish(id) { if (!picker) return; at(picker.day,picker.meal).push(id); saveMenu(); closeModal(); render(); }
function refocus(id) {

function hl(t, q) {
  if (!q) return esc(t);
  const i = t.indexOf(q);
  return i < 0 ? esc(t) : esc(t.slice(0,i)) + '<mark>' + esc(t.slice(i,i+q.length)) + '</mark>' + esc(t.slice(i+q.length));
}

/* ---------- כרטיס מנה + השלמה מהקטלוג ---------- */
function openDish(id, preset) {
  const d = id ? dishById(id) : null;
  editing = d ? JSON.parse(JSON.stringify(d))
              : { id:'', name: preset || '', cat:'צהריים', ingredients:[], allergens:[],
                  allergensSet:false, note:'', active:true };
  acOpen = false; acHits = [];
  openModal(d ? 'עריכת מנה' : 'מנה חדשה',
    'הקלדה בשם המנה מציעה מנות מתוך קטלוג של 175 מנות, עם המרכיבים המקובלים.',
    dishForm(),
    `<button class="btn" onclick="doSaveDish()">שמירה</button>
     <button class="btn ghost" onclick="closeModal()">ביטול</button>
     ${d ? `<button class="prow rm" style="margin-right:auto" onclick="removeDish('${d.id}')">הסרה מהמאגר</button>` : ''}`);
  setTimeout(() => { const e = document.getElementById('dn'); if (e) { e.focus(); e.select(); } }, 60);
}
// חיפוש בקטלוג: תחילת שם, תחילת מילה בתוך השם, או כינוי. "די" מוצא
// "דייסת שיבולת שועל", "פ" מוצא פנקייק ופשטידה.
function acSearch(q) {
  const s = q.trim();
  if (s.length < 1) return [];
  const starts = [], inner = [];
  catalog.forEach(c => {
    const names = [c.name].concat(c.aliases || []);
    if (names.some(n => n.indexOf(s) === 0)) { starts.push(c); return; }
    if (names.some(n => n.split(/\s+/).some(w => w.indexOf(s) === 0))) inner.push(c);
  });
  return starts.concat(inner).slice(0, 7);
}
function onName(v) {
  editing.name = v;
  acHits = acSearch(v);
  acOpen = acHits.length > 0;
  drawAc();
}
function drawAc() {
  const box = document.getElementById('acBox');
  if (!box) return;
  if (!acOpen || !acHits.length) { box.innerHTML = ''; return; }
  box.innerHTML = acHits.map((c,i) => {
    const bad = c.toddler === 'avoid', care = c.toddler === 'caution';
    return `<button class="acit ${bad?'bad':''}" onclick="pickCat(${i})">
      <b>${esc(c.name)}</b>
      <em>${esc((c.ingredients||[]).slice(0,4).join(' · '))}</em>
      ${bad ? `<span class="warnline">לא להגשה בגיל הזה — ${esc(c.toddlerNote||'')}</span>`
            : care ? `<span class="careline">${esc(c.toddlerNote||'')}</span>` : ''}</button>`;
  }).join('');
}
// בחירה מהקטלוג ממלאת קטגוריה ומרכיבים, ו**מציעה** אלרגנים — לא
// מסמנת אותם. מערכת שמסמנת בשקט "אין אלרגנים" במנה שאף אחד לא בדק
// היא בדיוק הדבר שמגיע בסוף לילד אלרגי.
function pickCat(i) {
  const c = acHits[i]; if (!c) return;
  editing.name = c.name;
  editing.cat = c.cat || editing.cat;
  editing.ingredients = (c.ingredients || []).slice();
  editing.suggest = (c.allergenHints || []).slice();
  editing.toddler = c.toddler; editing.toddlerNote = c.toddlerNote || '';
  acOpen = false;
  document.getElementById('modalBody').innerHTML = dishForm();
}
function dishForm() {
  const e = editing;
  const sug = (e.suggest || []).filter(c => (e.allergens||[]).indexOf(c) < 0);
  return `<div class="fld"><label>שם המנה</label>
      <div class="acwrap">
        <input type="text" id="dn" value="${esc(e.name)}" maxlength="60" autocomplete="off"
          placeholder="הקלידי כדי לקבל הצעות" oninput="onName(this.value)"
          onblur="setTimeout(()=>{acOpen=false;drawAc()},180)">
        <div class="ac" id="acBox"></div></div></div>
    ${e.toddler === 'avoid' ? `<div class="vrow warn" style="margin-bottom:14px">
      <span class="tag">אסור בגיל הזה</span><span>${esc(e.toddlerNote||'')}</span></div>`
      : e.toddler === 'caution' ? `<div class="vrow note" style="margin-bottom:14px">
      <span class="tag">זהירות</span><span>${esc(e.toddlerNote||'')}</span></div>` : ''}
    <div class="fld"><label>קטגוריה</label>
      <div class="pick">${CATS.map(c => `<button class="p ${e.cat===c?'on':''}"
        onclick="editing.cat='${c}';redrawForm()">${esc(c)}</button>`).join('')}</div></div>
    <div class="fld"><label>מרכיבים</label>
      <input type="text" id="di" value="${esc((e.ingredients||[]).join(', '))}" placeholder="מופרדים בפסיק"></div>
    ${sug.length ? `<div class="vrow note" style="margin-bottom:14px">
      <span class="tag">הצעה</span>
      <span>לפי המרכיבים יש כאן ${esc(sug.map(c=>MC.ALLERGEN_NAME[c]||c).join(' ו'))}.</span>
      <button class="go" onclick="acceptSug()">לסמן</button></div>` : ''}
    <div class="fld"><label>אלרגנים</label>
      <div class="pick">${ALLERGENS.map(a => `<button class="p ${(e.allergens||[]).indexOf(a.code)>=0?'on':''}"
        onclick="togAl('${a.code}')">${esc(a.name)}</button>`).join('')}</div>
      <div class="count-line">${e.allergensSet ? 'מסומנת ונכנסת לבדיקה.'
        : `עוד לא סומנה. <button class="go" onclick="editing.allergensSet=true;redrawForm()">אין בה אלרגנים</button>`}</div></div>
    <div class="fld"><label>הערה</label>
      <input type="text" id="dnote" value="${esc(e.note||'')}" maxlength="120"></div>
    <div class="fld"><label>סטטוס</label>
      <div class="pick">
        <button class="p ${e.active!==false?'on':''}" onclick="editing.active=true;redrawForm()">פעילה</button>
        <button class="p ${e.active===false?'on':''}" onclick="editing.active=false;redrawForm()">לא פעילה</button>
      </div></div>`;
}
function redrawForm() { grabForm(); document.getElementById('modalBody').innerHTML = dishForm(); }
// הערכים שהמשתמשת הקלידה נאספים לפני כל ציור מחדש, אחרת לחיצה על
// קטגוריה הייתה מוחקת מרכיבים שהיא בדיוק הקלידה.
function grabForm() {
  const n = document.getElementById('dn'), i = document.getElementById('di'), t = document.getElementById('dnote');
  if (n) editing.name = n.value;
  if (i) editing.ingredients = i.value.split(',').map(s => s.trim()).filter(Boolean);
  if (t) editing.note = t.value;
}
function acceptSug() {
  grabForm();
  editing.allergens = (editing.allergens||[]).concat(editing.suggest||[])
    .filter((v,i,a) => a.indexOf(v) === i);
  editing.allergensSet = true; editing.suggest = [];
  document.getElementById('modalBody').innerHTML = dishForm();
}
function togAl(code) {
  grabForm();
  const l = editing.allergens || (editing.allergens = []);
  const i = l.indexOf(code);
  if (i >= 0) l.splice(i,1); else l.push(code);
  editing.allergensSet = true;
  document.getElementById('modalBody').innerHTML = dishForm();
}
async function doSaveDish() {
  grabForm();
  const nm = (editing.name || '').trim();
  if (!nm) { showErr('למנה חייב להיות שם'); return; }
  editing.name = nm;
  delete editing.suggest;
  try {
    const r = await api.saveDish(editing);
    editing.id = editing.id || r.id;
    const i = dishes.findIndex(d => d.id === editing.id);
    if (i >= 0) dishes[i] = editing; else dishes.push(editing);
    dishes.sort((a,b) => String(a.name).localeCompare(String(b.name),'he'));
    closeModal(); renderLib(); showOk('נשמר');
  } catch (e) { showErr('השמירה נכשלה: ' + e.message); }
}
async function removeDish(id) {
  dishes = dishes.filter(d => d.id !== id);
  closeModal(); renderLib();
  try { await api.deleteDish(id); showOk('הוסרה · ניתן לשחזור מהפח'); }
  catch (e) { showErr('ההסרה נכשלה: ' + e.message); }
}

/* ---------- חלון ---------- */
function openModal(title, sub, body, actions) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalSub').textContent = sub || '';
  document.getElementById('modalBody').innerHTML = body || '';
  document.getElementById('modalActions').innerHTML = actions || '';
  document.getElementById('modalOv').classList.add('show');
}
function closeModal() { document.getElementById('modalOv').classList.remove('show'); picker = null; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
function showErr(m) { const el = document.getElementById('error'); el.textContent = m; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 5000); }
function showOk(m) { const el = document.getElementById('success'); el.textContent = m; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 3000); }

boot();
</script>
</body>
</html>
