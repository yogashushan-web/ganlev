<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>תפריט — גן לב</title>
  <link href="https://fonts.googleapis.com/css2?family=Alef:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Alef',sans-serif; background:#F4EFE6; color:#3D3228; direction:rtl; min-height:100vh; }
    .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; padding-bottom:14px; border-bottom:2px solid #e8e4de; flex-wrap:wrap; gap:12px; }
    .header h1 { font-size:26px; color:#1F3D34; }
    .btn { background:#1F3D34; color:#fff; border:none; padding:11px 20px; border-radius:10px; cursor:pointer; font-family:'Alef'; font-weight:700; font-size:14px; }
    .btn.ghost { background:#efe9e0; color:#6f6457; }
    .btn.soft { background:#fff; color:#1F3D34; box-shadow:0 2px 8px rgba(0,0,0,.06); }
    .btn:disabled { opacity:.5; cursor:default; }
    .err,.ok { padding:12px; border-radius:10px; margin-bottom:14px; display:none; }
    .err { background:#fdf0ef; color:#c94147; } .ok { background:#d4edda; color:#155724; }
    .err.show,.ok.show { display:block; }
    .hide { display:none !important; }

    .steps { display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; }
    .step-pill { padding:7px 14px; border-radius:999px; font-size:12.5px; font-weight:700; background:#fff; color:#8a7f70; border:1px solid #e8e4de; cursor:pointer; font-family:'Alef'; }
    .step-pill:hover { border-color:#1F3D34; color:#1F3D34; }
    .step-pill.on { background:#1F3D34; color:#fff; border-color:#1F3D34; }
    .step-pill.done { background:#e6f4ec; color:#1F7a4f; border-color:#cfe7d9; }

    .card { background:#fff; border-radius:18px; padding:24px 26px; box-shadow:0 2px 14px rgba(0,0,0,.06); margin-bottom:16px; }
    .card h2 { font-size:20px; color:#1F3D34; margin-bottom:5px; }
    .card .sub { color:#9B8E82; font-size:13.5px; margin-bottom:18px; line-height:1.6; }
    .fld { margin-bottom:16px; }
    .fld label { display:block; font-size:13px; font-weight:700; color:#3D3228; margin-bottom:7px; }
    .fld input, .fld select, .fld textarea { width:100%; max-width:340px; padding:11px 13px; border:1.5px solid #e8e4de; border-radius:10px; font-family:'Alef'; font-size:14px; outline:none; }
    .fld textarea { max-width:100%; min-height:72px; resize:vertical; }
    .fld input:focus, .fld select:focus, .fld textarea:focus { border-color:#1F3D34; }
    .nav { display:flex; gap:10px; margin-top:20px; flex-wrap:wrap; }
    .count-line { font-size:12.5px; color:#9B8E82; margin-top:10px; }

    .pick { display:flex; gap:8px; flex-wrap:wrap; }
    .pick .p { border:1.5px solid #e8e4de; background:#fff; border-radius:999px; padding:8px 15px; font-family:'Alef'; font-size:13.5px; font-weight:700; cursor:pointer; color:#6f6457; }
    .pick .p.on { background:#1F3D34; border-color:#1F3D34; color:#fff; }

    /* ---- לוח השבוע ---- */
    .grid { display:grid; grid-template-columns:104px repeat(5,minmax(150px,1fr)); gap:8px; }
    .gh { font-size:13px; font-weight:700; color:#1F3D34; text-align:center; padding:7px 4px; background:#fff; border-radius:10px; }
    .gh em { display:block; font-style:normal; font-size:11px; color:#9B8E82; font-variant-numeric:tabular-nums; }
    .mh { display:flex; flex-direction:column; justify-content:center; gap:2px; font-size:12.5px; font-weight:700; color:#6f6457; background:#FAF8F4; border-radius:10px; padding:9px 11px; }
    .mh em { font-style:normal; font-size:11px; color:#B9AE9F; font-variant-numeric:tabular-nums; }
    .cell { background:#fff; border:1.5px dashed #e8e4de; border-radius:10px; padding:7px; min-height:62px; display:flex; flex-direction:column; gap:5px; }
    .cell.tgt { border-color:#1F3D34; background:#f4f9f6; border-style:solid; }
    .cell.warn { border-color:#f0c9c6; background:#fdf6f5; }
    .chip { display:flex; align-items:center; gap:5px; background:#FAF8F4; border:1px solid #efe9e0; border-radius:8px; padding:5px 7px; font-size:12.5px; cursor:pointer; text-align:right; }
    .chip:hover { border-color:#1F3D34; }
    .chip.sel { background:#1F3D34; border-color:#1F3D34; color:#fff; }
    .chip .nm { flex:1; min-width:0; }
    .chip .ord { flex:0 0 auto; width:16px; height:16px; border-radius:50%; background:#efe9e0;
                 color:#8a7f70; font-size:10px; font-weight:700; display:flex; align-items:center;
                 justify-content:center; font-variant-numeric:tabular-nums; }
    .chip.sel .ord { background:rgba(255,255,255,.22); color:#fff; }
    .chip.drop { border-style:dashed; border-color:#cfe7d9; }
    .chip.drop:hover { border-style:solid; border-color:#1F3D34; background:#f4f9f6; }
    .chip .al { font-size:10.5px; color:#c94147; font-weight:700; }
    .chip.sel .al { color:#ffd9d6; }
    .chip .rm { background:none; border:none; font-family:'Alef'; font-size:10.5px; font-weight:700; color:#9B8E82; cursor:pointer; padding:1px 3px; border-radius:5px; }
    .chip .rm:hover { background:#fdf0ef; color:#c94147; }
    .chip.sel .rm { color:#cfe0d8; }
    .add { background:none; border:none; font-family:'Alef'; font-size:12px; font-weight:700; color:#9B8E82; cursor:pointer; padding:4px; border-radius:7px; text-align:center; }
    .add:hover { background:#f4f9f6; color:#1F3D34; }
    .daytools { display:flex; gap:5px; justify-content:center; margin-top:5px; }
    .daytools button { background:none; border:none; font-family:'Alef'; font-size:11px; font-weight:700; color:#B9AE9F; cursor:pointer; padding:2px 6px; border-radius:6px; }
    .daytools button:hover { background:#f4f9f6; color:#1F3D34; }
    .movehint { background:#f4f9f6; border:1px solid #cfe7d9; color:#1F7a4f; border-radius:10px; padding:9px 13px; font-size:12.5px; font-weight:700; margin-bottom:11px; display:flex; gap:9px; align-items:center; flex-wrap:wrap; }
    .movehint button { background:#fff; border:1px solid #cfe7d9; border-radius:7px; padding:4px 10px; font-family:'Alef'; font-size:11.5px; font-weight:700; color:#1F7a4f; cursor:pointer; }

    /* ---- בדיקה ---- */
    .vrow { display:flex; gap:10px; align-items:flex-start; padding:11px 13px; border-radius:11px; margin-bottom:8px; font-size:13.5px; line-height:1.6; }
    .vrow.warn { background:#fdf6f5; border:1px solid #f0c9c6; }
    .vrow.note { background:#FAF8F4; border:1px solid #efe9e0; color:#6f6457; }
    .vrow .tag { font-size:11px; font-weight:700; border-radius:999px; padding:2px 9px; flex:0 0 auto; }
    .vrow.warn .tag { background:#f6dedb; color:#9d3b40; }
    .vrow.note .tag { background:#efe9e0; color:#8a7f70; }
    .vrow .go { margin-right:auto; background:#fff; border:1px solid #e8e4de; border-radius:7px; padding:4px 10px; font-family:'Alef'; font-size:11.5px; font-weight:700; color:#1F3D34; cursor:pointer; flex:0 0 auto; }
    .clean { background:#e6f4ec; border:1px solid #cfe7d9; color:#1F7a4f; border-radius:12px; padding:15px 17px; font-size:14px; font-weight:700; }

    /* ---- עיצוב ---- */
    .tpls { display:grid; grid-template-columns:repeat(auto-fit,minmax(214px,1fr)); gap:12px; }
    .tpl { background:#FAF8F4; border:1.5px solid #e8e4de; border-radius:14px; padding:14px; cursor:pointer; text-align:right; font-family:'Alef'; }
    .tpl:hover { border-color:#1F3D34; }
    .tpl.on { border-color:#1F3D34; background:#f4f9f6; box-shadow:0 0 0 3px rgba(31,61,52,.08); }
    .tpl b { display:block; font-size:14.5px; color:#1F3D34; margin-bottom:3px; }
    .tpl em { font-style:normal; font-size:12px; color:#9B8E82; line-height:1.6; }
    .tpl .mini { height:74px; background:#fff; border:1px solid #efe9e0; border-radius:9px; margin-bottom:10px; padding:6px; display:flex; gap:3px; }
    .tpl .mini i { background:#e8e4de; border-radius:3px; display:block; }

    /* ---- תצוגה מקדימה ---- */
    .prev { background:#F4EFE6; border:1px solid #e8e4de; border-radius:14px; padding:4px; overflow:hidden; }
    .prev .wrap { max-width:none; padding:16px 12px 22px; }

    /* ---- מאגר המנות ---- */
    .searchbar { background:#FFF; border-radius:14px; padding:12px 16px; box-shadow:0 2px 11px rgba(0,0,0,0.05); margin-bottom:16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .searchbar input { flex:1; min-width:150px; border:none; outline:none; font-family:'Alef'; font-size:15px; background:transparent; }
    .dishes { display:grid; grid-template-columns:repeat(auto-fill,minmax(236px,1fr)); gap:10px; }
    .dish { background:#fff; border:1.5px solid #e8e4de; border-radius:13px; padding:12px 14px; cursor:pointer; }
    .dish:hover { border-color:#1F3D34; }
    .dish b { display:block; font-size:14.5px; color:#1F3D34; }
    .dish .meta { font-size:11.5px; color:#9B8E82; margin-top:3px; }
    .dish .al { font-size:11px; color:#c94147; font-weight:700; margin-top:5px; }
    .dish .un { font-size:11px; color:#B9AE9F; margin-top:5px; }
    .dish.off { opacity:.5; }
    .catbar { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }

    .cell.none { background:#FAF8F4; border-style:solid; border-color:#efe9e0; align-items:center;
                 justify-content:center; }
    .cell.none span { font-size:11.5px; color:#C9BFB2; }
    .homecell { font-size:11.5px; color:#B9AE9F; font-style:italic; text-align:center; padding:6px 0; }
    .dish { position:relative; }
    .dish .drm { position:absolute; top:9px; left:10px; background:#f6f2ec; border:1px solid #e8e1d6;
                 color:#8a7f70; border-radius:7px; padding:3px 9px; font-size:11px; font-weight:700;
                 cursor:pointer; font-family:'Alef'; opacity:0; transition:opacity .12s; }
    .dish:hover .drm, .dish .drm:focus { opacity:1; }
    .dish .drm:hover { background:#fdf0ef; border-color:#f3cfc9; color:#c94147; }
    @media (hover:none) { .dish .drm { opacity:1; } }
    .dish .ing { font-size:11px; color:#B9AE9F; margin-top:4px; line-height:1.5; }

    /* ---- השלמה אוטומטית מהקטלוג ---- */
    .acwrap { position:relative; max-width:340px; }
    .ac { position:absolute; top:100%; right:0; left:0; z-index:40; background:#fff;
          border:1.5px solid #e8e4de; border-radius:12px; margin-top:4px; overflow:hidden;
          box-shadow:0 10px 30px rgba(0,0,0,.12); max-height:280px; overflow-y:auto; }
    .ac:empty { display:none; }
    .acit { display:block; width:100%; text-align:right; background:none; border:none;
            border-bottom:1px solid #f2ede6; padding:9px 12px; cursor:pointer; font-family:'Alef'; }
    .acit:last-child { border-bottom:none; }
    .acit:hover { background:#f4f9f6; }
    .acit b { display:block; font-size:13.5px; color:#1F3D34; }
    .acit em { display:block; font-style:normal; font-size:11.5px; color:#9B8E82; margin-top:2px; }
    .acit .warnline { display:block; font-size:11px; color:#c94147; font-weight:700; margin-top:3px; }
    .acit .careline { display:block; font-size:11px; color:#b8801f; margin-top:3px; }
    .acit.bad b { color:#c94147; }

    /* ---- ספר המתכונים ---- */
    .rbook { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:11px; }
    .rc { background:#fff; border:1.5px solid #e8e4de; border-radius:13px; padding:13px 15px; cursor:pointer; }
    .rc:hover { border-color:#1F3D34; }
    .rc b { display:block; font-size:14.5px; color:#1F3D34; }
    .rc .meta { font-size:11.5px; color:#9B8E82; margin-top:3px; }
    .rc.none { background:#FAF8F4; border-style:dashed; }
    .rc.none .meta { color:#B9AE9F; }
    .meter { background:#FAF8F4; border:1px solid #efe9e0; border-radius:12px; padding:13px 15px; margin-bottom:14px; }
    .meter .bar { height:7px; background:#efe9e0; border-radius:99px; overflow:hidden; margin:8px 0 7px; }
    .meter .bar i { display:block; height:100%; background:#1F3D34; border-radius:99px; }
    .meter .t { font-size:13px; font-weight:700; color:#1F3D34; }
    .meter .n { font-size:12px; color:#9B8E82; }
    .plist .ghead { font-size:11px; font-weight:700; letter-spacing:.08em; color:#B9AE9F;
                    margin:12px 2px 7px; }
    .plist .ghead:first-child { margin-top:2px; }
    .prow.sug { background:#fff; border-style:dashed; }
    .prow.sug:hover { background:#f4f9f6; border-style:solid; }
    .prow.has { opacity:.55; cursor:default; }
    .prow.has:hover { border-color:#efe9e0; background:#FAF8F4; }
    .prow .plus { margin-right:auto; font-size:11.5px; font-weight:700; color:#1F3D34;
                  background:#f4f9f6; border:1px solid #cfe7d9; border-radius:7px; padding:5px 11px;
                  flex:0 0 auto; }
    .prow.bad .nm { color:#c94147; }
    .prow .warnline { font-size:11px; color:#c94147; font-weight:700; margin-top:3px; }
    .prow .careline { font-size:11px; color:#b8801f; margin-top:3px; }
    .ritem { display:flex; gap:7px; align-items:center; margin-bottom:6px; }
    .ritem input.q { max-width:76px; text-align:center; }
    .ritem input.u { max-width:76px; }
    .ritem input.n { flex:1; }
    .ritem button { background:none; border:none; font-family:'Alef'; font-size:11px; font-weight:700;
                    color:#9B8E82; cursor:pointer; padding:4px 6px; border-radius:6px; }
    .ritem button:hover { background:#fdf0ef; color:#c94147; }
    .scaled { background:#f4f9f6; border:1px solid #cfe7d9; border-radius:11px; padding:12px 14px;
              font-size:13.5px; line-height:1.9; }
    .scaled b { color:#1F3D34; }

    /* ---- דף מתכון להדפסה ---- */
    .rsheet { background:#fff; border:1px solid #e8e4de; border-radius:14px; padding:26px 28px; }
    .rsheet h3 { font-size:24px; color:#1F3D34; margin-bottom:4px; }
    .rsheet .for { font-size:13px; color:#C4846C; font-weight:700; margin-bottom:18px; }
    .rsheet h4 { font-size:13px; letter-spacing:.08em; color:#B9AE9F; margin:18px 0 9px; }
    .rsheet ul { list-style:none; }
    .rsheet ul li { font-size:16px; padding:7px 0; border-bottom:1px solid #f2ede6; display:flex; gap:10px; }
    .rsheet ul li b { color:#1F3D34; min-width:110px; font-variant-numeric:tabular-nums; }
    .rsheet ol { padding-right:22px; }
    .rsheet ol li { font-size:16px; padding:7px 0; line-height:1.6; }
    .rsheet .al { color:#c94147; font-weight:700; font-size:13.5px; margin-top:14px; }

    /* ---- חלון ---- */
    .ov { position:fixed; inset:0; background:rgba(31,61,52,.45); display:none; align-items:center; justify-content:center; z-index:9999; padding:18px; }
    .ov.show { display:flex; }
    .modal { background:#fff; border-radius:18px; padding:24px 26px; width:100%; max-width:520px; max-height:86vh; overflow:auto; box-shadow:0 20px 60px rgba(0,0,0,.3); }
    .modal h3 { color:#1F3D34; font-size:19px; margin-bottom:4px; }
    .modal .msub { color:#9B8E82; font-size:13px; margin-bottom:16px; line-height:1.6; }
    .modal input[type=text] { width:100%; padding:11px 13px; border:1.5px solid #e8e4de; border-radius:10px; font-family:'Alef'; font-size:14px; outline:none; }
    .modal input[type=text]:focus { border-color:#1F3D34; }
    .m-actions { display:flex; gap:9px; margin-top:18px; flex-wrap:wrap; }
    .empty-note { color:#9B8E82; font-size:13.5px; line-height:1.7; }
    .plist { max-height:300px; overflow:auto; margin-top:4px; }
    .prow { display:flex; align-items:center; gap:10px; background:#FAF8F4; border:1px solid #efe9e0; border-radius:11px; padding:10px 12px; margin-bottom:7px; cursor:pointer; }
    .prow:hover { border-color:#1F3D34; background:#f4f9f6; }
    .prow .nm { font-weight:700; color:#1F3D34; font-size:14px; }
    .prow .meta { font-size:11.5px; color:#9B8E82; }
    .prow .rm { margin-right:auto; background:#f6f2ec; border:1px solid #e8e1d6; color:#8a7f70; border-radius:8px; padding:5px 10px; font-size:11.5px; font-weight:700; cursor:pointer; font-family:'Alef'; }
    .prow .rm:hover { background:#fdf0ef; border-color:#f3cfc9; color:#c94147; }
    mark { background:#fdf2cf; border-radius:3px; }

    @media (max-width:880px) {
      .grid { grid-template-columns:1fr; }
      .gh { text-align:right; background:#1F3D34; color:#fff; margin-top:9px; }
      .gh em { color:#cfe0d8; }
      .mh { flex-direction:row; align-items:baseline; gap:7px; }
    }
    @media print {
      body { padding:0 !important; background:#fff; }
      .header, .steps, .err, .ok, .ov, .nav, .movehint, #crmSidebar, #crmMenuBtn,
      #trashFab, #error, #success, .pbar { display:none !important; }
      .card { box-shadow:none; padding:0; }
      .prev { border:0; background:#fff; padding:0; }
    }
  </style>
  <style id="menuCss"></style>
</head>
<body>

  <div class="header">
    <h1>🍲 תפריט</h1>
    <div style="display:flex; gap:8px; flex-wrap:wrap;" id="topActions"></div>
  </div>

  <div id="error" class="err"></div>
  <div id="success" class="ok"></div>

  <div class="steps" id="steps"></div>
  <div id="wizard"></div>
  <div id="library" class="hide"></div>

  <div class="ov" id="modalOv" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <h3 id="modalTitle"></h3>
      <div class="msub" id="modalSub"></div>
      <div id="modalBody"></div>
      <div class="m-actions" id="modalActions"></div>
    </div>
  </div>

<script src="js/common.js?v=29"></script>
<script src="js/api.js?v=24"></script>
<script src="js/profile.js?v=2"></script>
<script src="js/menu-render.js?v=3"></script>
<script src="js/menu-check.js?v=2"></script>
<script>
// התפריט **קבוע**. המסך נפתח עליו ולא על אשף: הגננת לא בונה תפריט
// כל שבוע — היא בונה אותו פעם אחת ועורכת כשמשהו משתנה. אשף שעוברים
// בו פעם אחת בחיים הוא התקנה, לא מסך עבודה.
const esc = s => (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MR = MenuRender, MC = MenuCheck;
const DAYS = MR.DAYS;
const SIX = [
  { code:'milk', name:'חלב' }, { code:'egg', name:'ביצים' }, { code:'peanut', name:'בוטנים' },
  { code:'nuts', name:'אגוזים' }, { code:'sesame', name:'שומשום' }, { code:'gluten', name:'גלוטן' },
];
// שש הנפוצות ועוד מה שהגן הוסיף. בלי זה ילד עם רגישות לסויה או לדגים
// לא ניתן לרישום, והבדיקה לא תתריע עליו לעולם.
let extraSens = [];
const ALLERGENS = () => SIX.concat(extraSens.map(e => ({ code: e.name, name: e.name })));
const alName = c => (SIX.find(a => a.code === c) || {}).name || c;
const CATS = ['בוקר', 'צהריים', 'נשנוש'];
const MEAL_CAT = { breakfast:'בוקר', lunch:'צהריים', snack1:'נשנוש', snack2:'נשנוש' };
const MEAL_SETS = {
  3: [{key:'breakfast',name:'ארוחת בוקר',time:'08:30',icon:'bowl'},
      {key:'lunch',name:'ארוחת צהריים',time:'12:00',icon:'pot'},
      {key:'snack2',name:'נשנוש',time:'15:30',icon:'fruit'}],
  4: MR.MEALS,
  5: [{key:'breakfast',name:'ארוחת בוקר',time:'08:00',icon:'bowl'},
      {key:'snack1',name:'נשנוש',time:'10:00',icon:'fruit'},
      {key:'lunch',name:'ארוחת צהריים',time:'12:00',icon:'pot'},
      {key:'snack2',name:'נשנוש',time:'15:00',icon:'fruit'},
      {key:'supper',name:'ארוחת ערב',time:'17:00',icon:'bowl'}],
};

let dishes = [], menu = null, exceptions = [], sens = [], catalog = [];
let food = { meals: MR.MEALS, days: ['sun','mon','tue','wed','thu'], fromHome: [], facts: [] };
let view = 'menu', libFilter = '', libCat = '', sel = null, picker = null, editing = null;
let acOpen = false, acHits = [];

document.getElementById('menuCss').textContent = MR.MENU_CSS;

const MEALS = () => food.meals;
const dayList = () => DAYS.filter(d => food.days.indexOf(d.key) >= 0);
// לא בכל יום מגישים את אותן ארוחות. ברירת המחדל היא הכל, כדי שגן
// שלא נגע בהגדרות יראה את מה שראה קודם.
const mealsOn = day => {
  const only = food.dayMeals && food.dayMeals[day];
  return only ? MEALS().filter(m => only.indexOf(m.key) >= 0 || isHome(day, m.key)) : MEALS();
};
const at = (day, meal) => (((menu.days[day] = menu.days[day] || {})[meal] = menu.days[day][meal] || []));
const dishById = id => dishes.find(d => d.id === id) || null;
const dishMap = () => { const o = {}; dishes.forEach(d => { o[d.id] = d; }); return o; };
const isHome = (day, meal) => food.fromHome.some(h => h.day === day && h.meal === meal);
const mealOf = k => MEALS().find(m => m.key === k) || MEALS()[0];
const P2 = n => String(n).padStart(2, '0');
const todayIso = () => { const d = new Date(); return `${d.getFullYear()}-${P2(d.getMonth()+1)}-${P2(d.getDate())}`; };
const DAY_OF = iso => ['sun','mon','tue','wed','thu','fri','sat'][new Date(iso + 'T00:00:00').getDay()];

/* ---------- טעינה ---------- */
async function boot() {
  try {
    await GL.load();
    const f = GL.get('food');
    if (f) food = Object.assign(food, f);
    extraSens = GL.get('health.extra', []) || [];
  } catch (e) {}
  try {
    const r = await api.getMenu();
    dishes = (r && r.dishes) || [];
    menu = (r && r.menu) || null;
    exceptions = (r && r.exceptions) || [];
  } catch (e) { showErr('הטעינה נכשלה: ' + e.message); }
  loadSens();
  loadCatalog();
  loadKids();

  // שאלה בהקשר, לא בשאלון: כמה ארוחות — רק כשנכנסים לכלי בפעם
  // הראשונה, ורק אם זה לא ידוע כבר.
  if (!GL.get('food.meals')) await askMeals();
  if (!menu) {
    menu = { id:'standing', name:'התפריט שלנו', days:{}, template:'table',
             infoPage:true, live:false, names:{} };
  }
  menu.days = menu.days || {};
  render();
}
async function askMeals() {
  const n = await GL.need('food.mealCount', {
    q: 'כמה ארוחות ביום בגן?',
    sub: 'זה קובע כמה שורות יהיו בתפריט. אפשר לשנות בכל רגע בהגדרות הגן.',
    options: [{ v:3, label:'שלוש', note:'בוקר · צהריים · נשנוש' },
              { v:4, label:'ארבע', note:'בוקר · נשנוש · צהריים · נשנוש' },
              { v:5, label:'חמש', note:'כולל ארוחת ערב' }],
    why: 'נשאל פעם אחת. מכאן המערכת תזכור.',
  });
  if (!n) return;
  food.meals = MEAL_SETS[n] || MR.MEALS;
  await GL.set('food.meals', food.meals, 'user');

  // שאלת המשך, ורק אם היא רלוונטית: יום שישי קיים בחלק מהגנים ולא
  // בכולם, ובאלה שכן — לרוב הבוקר מגיע מהבית.
  const fri = await GL.need('food.friday', {
    q: 'יש אוכל בגן בימי שישי?',
    sub: '',
    options: [{ v:'home', label:'כן — ארוחת הבוקר מגיעה מהבית' },
              { v:'full', label:'כן — הגן מגיש כרגיל' },
              { v:'no', label:'לא, הגן סגור בשישי' }],
  });
  if (fri === 'home' || fri === 'full') {
    food.days = ['sun','mon','tue','wed','thu','fri'];
    if (fri === 'home') food.fromHome = [{ day:'fri', meal:'breakfast' }];
  }
  await GL.set('food.days', food.days, 'user');
  await GL.set('food.fromHome', food.fromHome, 'user');
}
async function loadSens() {
  try {
    const [rc, rh] = await Promise.all([api.getChildren(), api.getChildHealth()]);
    const health = (rh && rh.health) || {};
    sens = ((rc && rc.data) || []).map(c => ({
      name: (c.first_name_he + ' ' + (c.last_name_he || '')).trim(),
      codes: health[c.id] || [],
    })).filter(s => s.codes.length);
    if (view === 'menu') render();
  } catch (e) { sens = []; }
}
// 175 מנות עם מרכיבים, מתוך תפריטים שפורסמו והנחיות משרד הבריאות.
// נטען פעם אחת ומשמש להשלמה אוטומטית בלבד — הוא לא נכנס למאגר של הגן
// עד שהגננת בוחרת מנה.
async function loadCatalog() {
  try {
    const r = await fetch('js/dish-catalogue.json?v=1');
    const d = await r.json();
    catalog = (d && d.dishes) || [];
  } catch (e) { catalog = []; }
}

/* ---------- התפריט ---------- */
function viewMenu() {
  const warnCells = {};
  const checks = MC.checkWeek({ week: menu, dishes: dishMap(), sensitivities: sens, meals: MEALS(),
                                days: food.days, fromHome: food.fromHome, dayMeals: food.dayMeals });
  checks.filter(v => v.level === 'warn' && v.day && v.meal)
        .forEach(v => { warnCells[v.day + '|' + v.meal] = true; });
  const warns = checks.filter(v => v.level === 'warn');

  const ds = dayList();
  let g = `<div class="grid" style="grid-template-columns:104px repeat(${ds.length},minmax(140px,1fr))"><div></div>`;
  ds.forEach(d => {
    g += `<div class="gh">${esc(d.name)}
      <div class="daytools"><button onclick="clearDay('${d.key}')">ניקוי</button>
        <button onclick="copyDay('${d.key}')">שכפול</button></div></div>`;
  });
  MEALS().forEach(m => {
    g += `<div class="mh">${esc(m.name)}<em>${esc(m.time)}</em></div>`;
    ds.forEach(d => {
      const served = mealsOn(d.key).some(x => x.key === m.key);
      if (!served) { g += '<div class="cell none"><span>אין</span></div>'; return; }
      const ids = at(d.key, m.key), home = isHome(d.key, m.key);
      g += `<div class="cell ${sel ? 'tgt' : ''} ${warnCells[d.key+'|'+m.key] ? 'warn' : ''}"
             onclick="cellTap('${d.key}','${m.key}')">`;
      if (home && !ids.length) g += '<div class="homecell">מהבית</div>';
      ids.forEach((id, idx) => {
        const dd = dishById(id), nm = dd ? dd.name : 'מנה שנמחקה', bad = dd ? alertFor(dd) : '';
        const on = sel && sel.day === d.key && sel.meal === m.key && sel.idx === idx;
        // מספר סדר רק כשיש יותר ממנה אחת — עם מנה אחת אין סדר, והמספר
        // היה טוען משהו שלא קיים. כשיש כמה, הסדר הוא סדר ההגשה.
        const ord = ids.length > 1 ? `<span class="ord">${idx + 1}</span>` : '';
        g += `<div class="chip ${on?'sel':''} ${sel && !on ? 'drop' : ''}"
                onclick="event.stopPropagation();chipTap('${d.key}','${m.key}',${idx})">
                ${ord}<span class="nm">${esc(nm)}${bad?`<span class="al"> · ${esc(bad)}</span>`:''}</span>
                <button class="rm" onclick="event.stopPropagation();dropDish('${d.key}','${m.key}',${idx})">הסר</button>
              </div>`;
      });
      g += `<button class="add" onclick="event.stopPropagation();openPicker('${d.key}','${m.key}')">הוספת מנה</button></div>`;
    });
  });
  g += '</div>';

  const total = ds.reduce((n,d) => n + MEALS().reduce((k,m) => k + at(d.key,m.key).length, 0), 0);
  return `<div class="card">
    <h2>${esc(menu.name)}</h2>
    <div class="sub">זה התפריט הקבוע של הגן. הוא לא נבנה מחדש כל שבוע —
      הוא נשאר כמו שהוא עד שמשנים אותו, ושינוי חד-פעמי ליום מסוים נרשם
      תחת "שינויים" ולא כאן.<br>
      <b>הסדר בתוך משבצת הוא סדר ההגשה.</b> לחיצה על מנה בוחרת אותה,
      ואז לחיצה על מנה אחרת שמה אותה לפניה.</div>
    ${!menu.live ? `<div class="vrow note" style="margin-bottom:12px">
      <span class="tag">טיוטה</span>
      <span>התפריט עוד לא באוויר. ההורים לא רואים אותו.</span></div>` : ''}
    ${allergenAsk ? `<div class="vrow note" style="margin-bottom:12px">
      <span class="tag">הצעה</span>
      <span>לפי המרכיבים יש ב«${esc((dishById(allergenAsk.id)||{}).name||'')}»
        ${esc(allergenAsk.codes.map(alName).join(' ו'))}.</span>
      <button class="go" onclick="markAsked(true)">לסמן</button>
      <button class="go" onclick="markAsked(false)">לא עכשיו</button></div>` : ''}
    ${sel ? `<div class="movehint">
      <span>«${esc((dishById(at(sel.day,sel.meal)[sel.idx])||{}).name||'')}» נבחרה —
        לחיצה על מנה אחרת תשים אותה <b>לפניה</b>, ולחיצה על שטח ריק
        במשבצת תשים אותה <b>בסוף</b>.</span>
      <button onclick="editSel()">עריכת המנה</button>
      <button onclick="sel=null;render()">ביטול</button></div>` : ''}
    ${g}
    <div class="count-line">${total} מנות בתפריט · ${sens.length
      ? `${sens.length} ילדים עם רגישות מסומנת` : 'אין רגישויות מסומנות בקבוצה'}</div>
    ${warns.length ? `<div style="margin-top:14px">${warns.slice(0,4).map(v =>
      `<div class="vrow warn"><span class="tag">לשים לב</span><span>${esc(v.text)}</span></div>`).join('')}
      ${warns.length > 4 ? `<div class="count-line">ועוד ${warns.length-4}.</div>` : ''}</div>` : ''}
  </div>`;
}
function alertFor(d) {
  if (!Array.isArray(d.allergens) || !d.allergens.length) return '';
  return d.allergens.filter(c => sens.some(s => s.codes.indexOf(c) >= 0))
    .map(alName).join(', ');
}
// כלל אחד לשני הדברים: בוחרים מנה, ואז מקישים לאן היא הולכת.
// הקשה על מנה אחרת = "לפני זו" — וזה מה שמאפשר לקבוע סדר *בתוך*
// המשבצת, כי בגן מגישים בשלבים: קודם סלט, אחר כך כריכים, ואז תוספת.
// הקשה על שטח ריק במשבצת = "בסוף".
// עריכת המרכיבים מתוך הלוח. הגן מוסיף פרי העונה לדייסה, וזה לא קיים
// במתכון המקורי — אין סיבה ללכת בשביל זה למאגר.
function editSel() {
  if (!sel) return;
  const id = at(sel.day, sel.meal)[sel.idx];
  sel = null;
  if (id) openDish(id); else render();
}

function chipTap(day, meal, idx) {
  if (!sel) { sel = { day, meal, idx }; render(); return; }
  if (sel.day === day && sel.meal === meal && sel.idx === idx) { sel = null; render(); return; }
  moveTo(day, meal, idx);
}
function cellTap(day, meal) { if (sel) moveTo(day, meal, null); }

function moveTo(day, meal, beforeIdx) {
  const from = at(sel.day, sel.meal);
  const id = from[sel.idx];
  if (!id) { sel = null; render(); return; }
  const same = sel.day === day && sel.meal === meal;
  from.splice(sel.idx, 1);
  const to = at(day, meal);
  // אחרי ההסרה כל מה שהיה אחרי המנה הוזז אחורה בשורה אחת, ולכן יעד
  // שהיה *אחרי* המקור צריך לרדת באחד. בלי זה הזזה אחת ימינה לא זזה.
  let pos = (beforeIdx == null) ? to.length : beforeIdx;
  if (same && beforeIdx != null && sel.idx < beforeIdx) pos -= 1;
  to.splice(Math.max(0, Math.min(pos, to.length)), 0, id);
  sel = null; saveMenu(); render();
}
function dropDish(day, meal, idx) { at(day,meal).splice(idx,1); sel=null; saveMenu(); render(); }
function clearDay(day) { MEALS().forEach(m => { menu.days[day] = menu.days[day]||{}; menu.days[day][m.key] = []; }); saveMenu(); render(); }
function copyDay(day) {
  const ds = dayList(), i = ds.findIndex(d => d.key === day), next = ds[i+1];
  if (!next) { showErr('אין יום אחרי ' + ds[i].name); return; }
  MEALS().forEach(m => { menu.days[next.key] = menu.days[next.key]||{}; menu.days[next.key][m.key] = at(day,m.key).slice(); });
  showOk(`יום ${ds[i].name} שוכפל ליום ${next.name}`); saveMenu(); render();
}

/* ---------- שמירה ---------- */
async function saveMenu(live) {
  const names = {};
  dayList().forEach(d => MEALS().forEach(m => at(d.key,m.key).forEach(id => {
    const dd = dishById(id); if (dd) names[id] = dd.name;
  })));
  if (live) menu.live = true;
  menu.names = names;
  try {
    await api.saveMenu(menu);
    if (live) { showOk('באוויר · ' + location.origin + '/menu'); render(); }
  } catch (e) { showErr('השמירה נכשלה: ' + e.message); }
}

function viewExc() {
  return `<div class="card">
    <h2>שינויים חד-פעמיים</h2>
    <div class="sub">טיול, חג, יום קצר. השינוי מופיע להורים מעל התפריט, ונעלם
      מעצמו אחרי שהתאריך עובר — בלי שצריך לנקות ובלי לגעת בתפריט הקבוע.</div>
    ${exceptions.length ? exceptions.map((x,i) => `<div class="vrow note">
      <span class="tag">${esc(MC.DAY_NAMES[x.day]||'')} ${esc(MR.fmt(x.date))}</span>
      <span>${esc(x.cancelled && x.cancelled.length
        ? 'אין ' + x.cancelled.map(k => (MEALS().find(m=>m.key===k)||{}).name).filter(Boolean).join(' ו')
        : '')}${x.note ? (x.cancelled&&x.cancelled.length?' · ':'') + esc(x.note) : ''}</span>
      <button class="go" onclick="removeExc(${i})">הסר</button></div>`).join('')
      : `<div class="empty-note">אין שינויים קרובים.<br>זה המצב הרגיל — התפריט
           הקבוע תקף.</div>`}
    <div class="nav"><button class="btn" onclick="openExc()">הוספת שינוי</button></div>
  </div>`;
}
function openExc() {
  const t = todayIso();
  openModal('שינוי ליום מסוים', 'התפריט הקבוע נשאר כמו שהוא.',
    `<div class="fld"><label>תאריך</label>
       <input type="date" id="xd" value="${t}" min="${t}" style="max-width:200px"></div>
     <div class="fld"><label>מה לא יוגש</label>
       <div class="pick" id="xm">${MEALS().map(m =>
         `<button class="p" data-k="${m.key}" onclick="this.classList.toggle('on')">${esc(m.name)}</button>`).join('')}</div></div>
     <div class="fld"><label>סיבה — מה ההורים יראו</label>
       <input type="text" id="xn" maxlength="80" placeholder="למשל: טיול שנתי"></div>`,
    `<button class="btn" onclick="addExc()">שמירה</button>
     <button class="btn ghost" onclick="closeModal()">ביטול</button>`);
}
async function addExc() {
  const date = document.getElementById('xd').value;
  if (!date) { showErr('צריך תאריך'); return; }
  const cancelled = Array.from(document.querySelectorAll('#xm .p.on')).map(b => b.dataset.k);
  const note = (document.getElementById('xn').value || '').trim();
  if (!cancelled.length && !note) { showErr('צריך לציין מה משתנה או למה'); return; }
  const x = { date, day: DAY_OF(date), cancelled, note };
  try {
    await api.saveMenuException(x);
    exceptions = exceptions.filter(e => e.date !== date).concat([x])
      .sort((a,b) => a.date.localeCompare(b.date));
    closeModal(); render(); showOk('נשמר · ההורים יראו את זה מעל התפריט');
  } catch (e) { showErr('השמירה נכשלה: ' + e.message); }
}
async function removeExc(i) {
  const x = exceptions[i]; if (!x) return;
  exceptions.splice(i,1); render();
  try { await api.deleteMenuException(x.date); showOk('הוסר · ניתן לשחזור מהפח'); }
  catch (e) { showErr('ההסרה נכשלה: ' + e.message); }
}

async function saveFacts() {
  const el = document.getElementById('facts');
  if (!el) return;
  food.facts = el.value.split('\n').map(s => s.trim()).filter(Boolean);
  try { await GL.set('food.facts', food.facts, 'user'); showOk('נשמר'); }
  catch (e) { showErr('השמירה נכשלה: ' + e.message); }
}

/* ---------- תצוגה מקדימה ---------- */
function viewPreview() {
  const r = MR.renderMenu({ menu, dishes: dishMap(),
    settings: { facts: food.facts, meals: food.meals, days: food.days, fromHome: food.fromHome },
    exceptions, garden: GL.gardenName() || window.crmGardenName || 'הגן' });
  return `<div class="card">
    <h2>כך ההורים רואים את זה</h2>
    <div class="sub">בדיוק הדף הזה, בקישור ${esc(location.origin)}/menu — קישור
      אחד קבוע שלא משתנה לעולם.</div>
    <div class="prev"><div class="wrap">${MR.wrapMenu(r)}</div></div>
    <div class="nav">
      <button class="btn ghost" onclick="setView('menu')">חזרה</button>
      <button class="btn soft" onclick="window.print()">הדפסה</button>
      ${menu.live ? '' : `<button class="btn" onclick="saveMenu(true)">העלאה לאוויר</button>`}
    </div>
  </div>`;
}

/* ---------- הוספת מנה — חלון אחד ---------- */
// קודם היו שני חלונות: אחד שחיפש רק במאגר של הגן, ושני שחיפש בקטלוג.
// הקלדת "שקשוקה" בראשון לא החזירה כלום, כי השקשוקה יושבת בקטלוג.
// עכשיו שדה אחד מחפש בשניהם, והקשה אחת מוסיפה.
//
// והחיפוש **מתעלם מהקטגוריה**. הסינון קובע רק מה מוצג כשהשדה ריק;
// ברגע שמקלידים שם, מנה נמצאת גם אם היא מסווגת אחרת — אחרת חוזרים
// בדיוק לבאג שבגללו נוצרו שלוש שקשוקות.
let allergenAsk = null;

function openPicker(day, meal) {
  picker = { day, meal }; libFilter = '';
  openModal(`הוספה · ${mealOf(meal).name}`, '',
    '<div id="pickBody"></div>', `<button class="btn ghost" onclick="closeModal()">סגירה</button>`);
  renderPicker();
  setTimeout(() => { const e = document.getElementById('pf'); if (e) e.focus(); }, 60);
}

// הצעות פתיחה: מה שמתאים לארוחה הזו, כדי שהחלון לא ייפתח ריק
function catalogFor(cat, n) {
  return catalog.filter(c => c.cat === cat && c.toddler !== 'avoid').slice(0, n || 6);
}

function renderPicker() {
  const f = libFilter.trim();
  const cat = MEAL_CAT[picker.meal] || '';
  const inSlot = at(picker.day, picker.meal);

  const mine = dishes.filter(d => d.active !== false)
    .filter(d => f ? d.name.indexOf(f) >= 0 : d.cat === cat);
  // מה שכבר במאגר לא חוזר כהצעה מהקטלוג
  const have = {};
  dishes.forEach(d => { have[d.name.trim()] = true; });
  const sug = (f ? acSearch(f, 8) : catalogFor(cat)).filter(c => !have[c.name.trim()]);

  const mineRow = d => {
    const bad = alertFor(d), already = inSlot.indexOf(d.id) >= 0;
    return `<div class="prow ${already ? 'has' : ''}" onclick="${already ? '' : `addDish('${d.id}')`}">
      <div><div class="nm">${hl(d.name, f)}</div>
        <div class="meta">${esc(d.cat || '')}${already ? ' · כבר במשבצת' : ''}${
          bad ? ` · <span style="color:#c94147;font-weight:700">${esc(bad)}</span>` : ''}</div></div>
      <button class="rm" onclick="event.stopPropagation();openDish('${d.id}')">פרטים</button></div>`;
  };
  const sugRow = (c, i) => {
    const warn = c.toddler === 'avoid', care = c.toddler === 'caution';
    return `<div class="prow sug ${warn ? 'bad' : ''}" onclick="addFromCatalog(${i})">
      <div><div class="nm">${hl(c.name, f)}</div>
        <div class="meta">${esc((c.ingredients || []).slice(0, 4).join(' · '))}</div>
        ${warn ? `<div class="warnline">לא להגשה בגיל הזה — ${esc(c.toddlerNote || '')}</div>`
          : care ? `<div class="careline">${esc(c.toddlerNote || '')}</div>` : ''}</div>
      <span class="plus">הוספה</span></div>`;
  };

  document.getElementById('pickBody').innerHTML = `
    <div class="searchbar" style="margin-bottom:12px">
      <input type="text" id="pf" value="${esc(libFilter)}" autocomplete="off"
        placeholder="שם המנה — מחפש גם במאגר שלך וגם בקטלוג"
        oninput="libFilter=this.value;renderPicker();refocus('pf')"></div>
    <div class="plist">
      ${mine.length ? `<div class="ghead">במאגר של הגן</div>${mine.map(mineRow).join('')}` : ''}
      ${sug.length ? `<div class="ghead">מהקטלוג · הקשה מוסיפה גם למאגר</div>${sug.map(sugRow).join('')}` : ''}
      ${!mine.length && !sug.length ? `<div class="empty-note">${f
        ? `לא נמצאה מנה בשם «${esc(f)}», לא במאגר ולא בקטלוג.`
        : 'אין עדיין מנות בקטגוריה הזו.'}</div>` : ''}
      <button class="btn ghost" style="width:100%;margin-top:12px" onclick="newDishHere()">
        ${f ? `יצירת «${esc(f)}» מאפס` : 'יצירת מנה חדשה'}</button>
    </div>`;
}

function addDish(id) {
  if (!picker) return;
  const list = at(picker.day, picker.meal);
  if (list.indexOf(id) >= 0) { showErr('המנה הזו כבר במשבצת'); return; }
  list.push(id); saveMenu(); closeModal(); render();
}

// הקשה על מנה מהקטלוג: נכנסת למאגר של הגן עם המרכיבים שלה, ומיד
// למשבצת. האלרגנים **לא** מסומנים אוטומטית — הם מוצעים בשורה אחת
// אחרי ההוספה, כי סימון שקט של "אין אלרגנים" הוא בדיוק מה שמגיע
// בסוף לילד אלרגי.
let pendingAvoid = null;
async function addFromCatalog(i) {
  const f = libFilter.trim();
  const cat = MEAL_CAT[picker.meal] || '';
  const have = {};
  dishes.forEach(d => { have[d.name.trim()] = true; });
  const list = (f ? acSearch(f, 8) : catalogFor(cat)).filter(c => !have[c.name.trim()]);
  const c = list[i];
  if (!c || !picker) return;

  // מנה שמשרד הבריאות אוסר בגיל הזה דורשת אישור שני ולא נכנסת בהקשה
  if (c.toddler === 'avoid' && pendingAvoid !== c.name) {
    pendingAvoid = c.name;
    document.getElementById('pickBody').innerHTML = `
      <div class="vrow warn"><span class="tag">אסור בגיל הזה</span>
        <span>${esc(c.name)} — ${esc(c.toddlerNote || '')}</span></div>
      <div class="m-actions">
        <button class="btn ghost" onclick="pendingAvoid=null;renderPicker()">חזרה</button>
        <button class="btn" onclick="addFromCatalog(${i})">להוסיף בכל זאת</button></div>`;
    return;
  }
  pendingAvoid = null;

  const d = { id: '', name: c.name, cat: cat || c.cat || 'צהריים',
              ingredients: (c.ingredients || []).slice(), allergens: [],
              allergensSet: false, note: '', active: true };
  const slot = { day: picker.day, meal: picker.meal };
  closeModal();
  try {
    const r = await api.saveDish(d);
    d.id = r.id;
    dishes.push(d);
    dishes.sort((a, b) => String(a.name).localeCompare(String(b.name), 'he'));
    const l = at(slot.day, slot.meal);
    if (l.indexOf(d.id) < 0) l.push(d.id);
    saveMenu();
    // ההצעה לסמן אלרגנים יושבת על המסך ולא בחלון — היא לא חוסמת
    allergenAsk = (c.allergenHints || []).length ? { id: d.id, codes: c.allergenHints.slice() } : null;
    render();
    if (!allergenAsk) showOk(`«${d.name}» נוספה ל${mealOf(slot.meal).name}`);
  } catch (e) { showErr('ההוספה נכשלה: ' + e.message); }
}

async function markAsked(yes) {
  const a = allergenAsk; allergenAsk = null;
  if (!a) return;
  const d = dishById(a.id);
  if (d) {
    d.allergens = yes ? a.codes.slice() : [];
    d.allergensSet = !!yes;
    if (yes) { try { await api.saveDish(d); } catch (e) {} }
  }
  render();
  if (yes) showOk('סומן');
}

function refocus(id) {
  setTimeout(() => { const e = document.getElementById(id); if (e) { e.focus(); e.setSelectionRange(e.value.length, e.value.length); } }, 0);
}
function hl(t, q) {
  if (!q) return esc(t);
  const i = t.indexOf(q);
  return i < 0 ? esc(t) : esc(t.slice(0,i)) + '<mark>' + esc(t.slice(i,i+q.length)) + '</mark>' + esc(t.slice(i+q.length));
}

/* ---------- מאגר המנות ---------- */
function renderLib() {
  const f = libFilter.trim();
  const shown = dishes.filter(d => !libCat || d.cat === libCat).filter(d => !f || d.name.includes(f));
  const unmarked = dishes.filter(d => !d.allergensSet).length;
  document.getElementById('library').innerHTML = `<div class="card">
    <h2>מאגר המנות</h2>
    <div class="sub">כל מה שהגן מכין. התפריט מורכב מכאן.</div>
    <div class="searchbar">
      <input type="text" id="lf" value="${esc(libFilter)}" placeholder="חיפוש מנה…"
        oninput="libFilter=this.value;renderLib();refocus('lf')">
      <button class="btn" onclick="newDishLib()">מנה חדשה</button></div>
    <div class="catbar">
      <button class="p ${!libCat?'on':''}" onclick="libCat='';renderLib()">כל ${dishes.length} המנות</button>
      ${CATS.map(c => `<button class="p ${libCat===c?'on':''}" onclick="libCat='${c}';renderLib()">${esc(c)} · ${dishes.filter(d=>d.cat===c).length}</button>`).join('')}</div>
    ${unmarked ? `<div class="vrow note" style="margin-bottom:12px"><span class="tag">הערה</span>
      <span>${unmarked} מנות עוד בלי סימון אלרגנים, ולכן הבדיקה מדלגת עליהן.</span></div>` : ''}
    <div class="dishes">${shown.length ? shown.map(d => `<div class="dish ${d.active===false?'off':''}" onclick="openDish('${d.id}')">
      <button class="drm" onclick="event.stopPropagation();removeDish('${d.id}')">הסר</button>
      <b>${hl(d.name,f)}</b>
      <div class="meta">${esc(d.cat||'')}${d.active===false?' · לא פעילה':''}</div>
      ${(d.ingredients||[]).length ? `<div class="ing">${esc(d.ingredients.join(' · '))}</div>` : ''}
      ${d.allergensSet
        ? (d.allergens||[]).length
          ? `<div class="al">${(d.allergens||[]).map(c=>esc(alName(c))).join(' · ')}</div>`
          : '<div class="un">בלי אלרגנים</div>'
        : '<div class="un">עוד לא סומנה</div>'}</div>`).join('')
      : `<div class="empty-note">אין מנה כזו במאגר.<br>
          <button class="btn soft" style="margin-top:10px" onclick="newDishLib()">הוספת «${esc(f || 'מנה')}»</button></div>`}</div>
  </div>`;
}

/* ---------- כרטיס מנה + השלמה מהקטלוג ---------- */
// המשבצת שממנה נפתחה יצירת מנה חדשה. בלי זה המנה נשמרת, המסך נסגר,
// והגננת צריכה למצוא אותה שוב ולהוסיף ידנית.
let pendingSlot = null;

// נפתח מתוך חלון הבחירה: הקטגוריה נגזרת מהארוחה שבה עומדים.
// קודם היא הייתה קבועה ל"צהריים", ולכן מנה שנוספה משורת הבוקר נשמרה
// כצהריים, לא חזרה בסינון של הבוקר, ונוצרה שוב ושוב.
function newDishHere() {
  const name = libFilter.trim();
  const cat = picker ? (MEAL_CAT[picker.meal] || '') : libCat;
  pendingSlot = picker ? { day: picker.day, meal: picker.meal } : null;
  closeModal();
  openDish(null, name, cat);
}
function newDishLib() { pendingSlot = null; openDish(null, libFilter.trim(), libCat); }

function openDish(id, preset, cat) {
  const d = id ? dishById(id) : null;
  editing = d ? JSON.parse(JSON.stringify(d))
              : { id:'', name: preset || '', cat: cat || 'צהריים', ingredients:[], allergens:[],
                  allergensSet:false, note:'', active:true };
  acOpen = false; acHits = [];
  openModal(d ? 'עריכת מנה' : 'מנה חדשה',
    'הקלדה בשם המנה מציעה מנות מתוך קטלוג של 175 מנות, עם המרכיבים המקובלים.',
    dishForm(),
    `<button class="btn" onclick="doSaveDish()">שמירה</button>
     <button class="btn ghost" onclick="closeModal()">ביטול</button>
     ${d ? `<button class="btn soft" onclick="closeModal();openRecipe('${d.id}')">מתכון</button>
     <button class="prow rm" style="margin-right:auto" onclick="removeDish('${d.id}')">הסרה מהמאגר</button>` : ''}`);
  setTimeout(() => { const e = document.getElementById('dn'); if (e) { e.focus(); e.select(); } }, 60);
}
// חיפוש בקטלוג: תחילת שם, תחילת מילה בתוך השם, או כינוי. "די" מוצא
// "דייסת שיבולת שועל", "פ" מוצא פנקייק ופשטידה.
function acSearch(q, limit) {
  const s = q.trim();
  if (s.length < 1) return [];
  const starts = [], inner = [];
  catalog.forEach(c => {
    const names = [c.name].concat(c.aliases || []);
    if (names.some(n => n.indexOf(s) === 0)) { starts.push(c); return; }
    if (names.some(n => n.split(/\s+/).some(w => w.indexOf(s) === 0))) inner.push(c);
  });
  return starts.concat(inner).slice(0, limit || 7);
}
function onName(v) {
  editing.name = v;
  acHits = acSearch(v);
  acOpen = acHits.length > 0;
  drawAc();
}
function drawAc() {
  const box = document.getElementById('acBox');
  if (!box) return;
  if (!acOpen || !acHits.length) { box.innerHTML = ''; return; }
  box.innerHTML = acHits.map((c,i) => {
    const bad = c.toddler === 'avoid', care = c.toddler === 'caution';
    return `<button class="acit ${bad?'bad':''}" onclick="pickCat(${i})">
      <b>${esc(c.name)}</b>
      <em>${esc((c.ingredients||[]).slice(0,4).join(' · '))}</em>
      ${bad ? `<span class="warnline">לא להגשה בגיל הזה — ${esc(c.toddlerNote||'')}</span>`
            : care ? `<span class="careline">${esc(c.toddlerNote||'')}</span>` : ''}</button>`;
  }).join('');
}
// בחירה מהקטלוג ממלאת קטגוריה ומרכיבים, ו**מציעה** אלרגנים — לא
// מסמנת אותם. מערכת שמסמנת בשקט "אין אלרגנים" במנה שאף אחד לא בדק
// היא בדיוק הדבר שמגיע בסוף לילד אלרגי.
function pickCat(i) {
  const c = acHits[i]; if (!c) return;
  editing.name = c.name;
  editing.cat = c.cat || editing.cat;
  editing.ingredients = (c.ingredients || []).slice();
  editing.suggest = (c.allergenHints || []).slice();
  editing.toddler = c.toddler; editing.toddlerNote = c.toddlerNote || '';
  acOpen = false;
  document.getElementById('modalBody').innerHTML = dishForm();
}
function dishForm() {
  const e = editing;
  const sug = (e.suggest || []).filter(c => (e.allergens||[]).indexOf(c) < 0);
  return `<div class="fld"><label>שם המנה</label>
      <div class="acwrap">
        <input type="text" id="dn" value="${esc(e.name)}" maxlength="60" autocomplete="off"
          placeholder="הקלידי כדי לקבל הצעות" oninput="onName(this.value)"
          onblur="setTimeout(()=>{acOpen=false;drawAc()},180)">
        <div class="ac" id="acBox"></div></div></div>
    ${e.toddler === 'avoid' ? `<div class="vrow warn" style="margin-bottom:14px">
      <span class="tag">אסור בגיל הזה</span><span>${esc(e.toddlerNote||'')}</span></div>`
      : e.toddler === 'caution' ? `<div class="vrow note" style="margin-bottom:14px">
      <span class="tag">זהירות</span><span>${esc(e.toddlerNote||'')}</span></div>` : ''}
    <div class="fld"><label>קטגוריה</label>
      <div class="pick">${CATS.map(c => `<button class="p ${e.cat===c?'on':''}"
        onclick="editing.cat='${c}';redrawForm()">${esc(c)}</button>`).join('')}</div></div>
    <div class="fld"><label>מרכיבים</label>
      <input type="text" id="di" value="${esc((e.ingredients||[]).join(', '))}" placeholder="מופרדים בפסיק"></div>
    ${sug.length ? `<div class="vrow note" style="margin-bottom:14px">
      <span class="tag">הצעה</span>
      <span>לפי המרכיבים יש כאן ${esc(sug.map(alName).join(' ו'))}.</span>
      <button class="go" onclick="acceptSug()">לסמן</button></div>` : ''}
    <div class="fld"><label>אלרגנים</label>
      <div class="pick">${ALLERGENS().map(a => `<button class="p ${(e.allergens||[]).indexOf(a.code)>=0?'on':''}"
        onclick="togAl('${a.code}')">${esc(a.name)}</button>`).join('')}</div>
      <div class="count-line">${e.allergensSet ? 'מסומנת ונכנסת לבדיקה.'
        : `עוד לא סומנה. <button class="go" onclick="editing.allergensSet=true;redrawForm()">אין בה אלרגנים</button>`}</div></div>
    <div class="fld"><label>הערה</label>
      <input type="text" id="dnote" value="${esc(e.note||'')}" maxlength="120"></div>
    <div class="fld"><label>סטטוס</label>
      <div class="pick">
        <button class="p ${e.active!==false?'on':''}" onclick="editing.active=true;redrawForm()">פעילה</button>
        <button class="p ${e.active===false?'on':''}" onclick="editing.active=false;redrawForm()">לא פעילה</button>
      </div></div>`;
}
function redrawForm() { grabForm(); document.getElementById('modalBody').innerHTML = dishForm(); }
// הערכים שהמשתמשת הקלידה נאספים לפני כל ציור מחדש, אחרת לחיצה על
// קטגוריה הייתה מוחקת מרכיבים שהיא בדיוק הקלידה.
function grabForm() {
  const n = document.getElementById('dn'), i = document.getElementById('di'), t = document.getElementById('dnote');
  if (n) editing.name = n.value;
  if (i) editing.ingredients = i.value.split(',').map(s => s.trim()).filter(Boolean);
  if (t) editing.note = t.value;
}
function acceptSug() {
  grabForm();
  editing.allergens = (editing.allergens||[]).concat(editing.suggest||[])
    .filter((v,i,a) => a.indexOf(v) === i);
  editing.allergensSet = true; editing.suggest = [];
  document.getElementById('modalBody').innerHTML = dishForm();
}
function togAl(code) {
  grabForm();
  const l = editing.allergens || (editing.allergens = []);
  const i = l.indexOf(code);
  if (i >= 0) l.splice(i,1); else l.push(code);
  editing.allergensSet = true;
  document.getElementById('modalBody').innerHTML = dishForm();
}
async function doSaveDish() {
  grabForm();
  const nm = (editing.name || '').trim();
  if (!nm) { showErr('למנה חייב להיות שם'); return; }

  // שתי מנות באותו שם הן תמיד תקלה, לא כוונה. אם היא כבר קיימת —
  // משתמשים בה במקום ליצור עותק שני.
  const dup = dishes.find(d => d.name.trim() === nm && d.id !== editing.id);
  if (dup && !editing.id) {
    const slot = pendingSlot; pendingSlot = null;
    closeModal();
    if (slot) {
      const list = at(slot.day, slot.meal);
      if (list.indexOf(dup.id) < 0) { list.push(dup.id); saveMenu(); }
      render(); showOk(`«${dup.name}» כבר במאגר — נוספה מהמאגר הקיים`);
    } else { renderLib(); showOk(`«${dup.name}» כבר קיימת במאגר`); }
    return;
  }

  editing.name = nm;
  delete editing.suggest;
  const isNew = !editing.id;
  try {
    const r = await api.saveDish(editing);
    editing.id = editing.id || r.id;
    const i = dishes.findIndex(d => d.id === editing.id);
    if (i >= 0) dishes[i] = editing; else dishes.push(editing);
    dishes.sort((a,b) => String(a.name).localeCompare(String(b.name),'he'));
    const slot = pendingSlot; pendingSlot = null;
    closeModal();
    // מנה שנוצרה מתוך משבצת נכנסת אליה מיד. אחרת הגננת שומרת, המסך
    // נסגר, והיא צריכה לחפש אותה שוב.
    if (isNew && slot) {
      const list = at(slot.day, slot.meal);
      if (list.indexOf(editing.id) < 0) list.push(editing.id);
      saveMenu(); render();
      showOk(`«${editing.name}» נוספה ל${mealOf(slot.meal).name}`);
    } else { render(); showOk('נשמר'); }
  } catch (e) { showErr('השמירה נכשלה: ' + e.message); }
}
async function removeDish(id) {
  const name = (dishById(id) || {}).name || 'המנה';
  dishes = dishes.filter(d => d.id !== id);
  // מנה שנמחקה מהמאגר יורדת גם מהתפריט — אחרת היא נשארת שם כ"מנה
  // שנמחקה" וההורים רואים משבצת שבורה.
  let touched = false;
  Object.keys(menu.days || {}).forEach(day => Object.keys(menu.days[day] || {}).forEach(mk => {
    const l = menu.days[day][mk] || [], n = l.filter(x => x !== id);
    if (n.length !== l.length) { menu.days[day][mk] = n; touched = true; }
  }));
  const wasPicker = !!picker;
  closeModal();
  if (touched) saveMenu();
  if (wasPicker) render(); else if (view === 'lib') renderLib(); else render();
  try { await api.deleteDish(id); showOk(`«${name}» הוסרה · ניתן לשחזור מהפח`); }
  catch (e) { showErr('ההסרה נכשלה: ' + e.message); }
}

/* ---------- ספר המתכונים ---------- */
// קורא אחר לגמרי מהתפריט: התפריט הוא להורים, הספר הוא למי שעומדת
// במטבח — ולרוב הוא ייפתח ביום שהבשלנית הקבועה לא הגיעה ויש מחליפה.
// לכן כתב גדול, שלב בשורה, ודף שאפשר לתלות.
let kidsN = 0;
async function loadKids() {
  try { const d = await GL.derived(); kidsN = d.childCount || 0; } catch (e) { kidsN = 0; }
}
const hasRecipe = d => !!(d.recipe && ((d.recipe.items||[]).length || (d.recipe.steps||'').trim()));

function viewRecipes() {
  const used = {};
  dayList().forEach(d => MEALS().forEach(m => at(d.key, m.key).forEach(id => { used[id] = true; })));
  // המנות שבתפריט קודם — ספר שמתחיל ממנות שלא מבשלים הוא ספר שלא ייפתח
  const inMenu = dishes.filter(d => used[d.id]);
  const rest = dishes.filter(d => !used[d.id]);
  const done = inMenu.filter(hasRecipe).length;
  const pct = inMenu.length ? Math.round(done / inMenu.length * 100) : 0;

  const card = d => `<div class="rc ${hasRecipe(d) ? '' : 'none'}" onclick="openRecipe('${d.id}')">
    <b>${esc(d.name)}</b>
    <div class="meta">${hasRecipe(d)
      ? `${(d.recipe.items||[]).length} מרכיבים${d.recipe.minutes ? ' · ' + d.recipe.minutes + ' דקות' : ''}`
      : 'עוד בלי מתכון'}</div></div>`;

  return `<div class="card">
    <h2>ספר המתכונים</h2>
    <div class="sub">הכמויות נשמרות <b>לילד אחד</b>, והמערכת מכפילה לפי מספר
      הילדים בפועל. מתכון שכתוב "ל-20 ילדים" הופך לשגוי ברגע שנרשם ילד.</div>
    <div class="meter">
      <div class="t">${done} מתוך ${inMenu.length} המנות שבתפריט יש להן מתכון</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="n">${done === inMenu.length && inMenu.length
        ? 'הספר שלם. מחליפה שתיכנס מחר תסתדר לבד.'
        : 'אין צורך למלא הכל בבת אחת — מנה אחת בכל פעם.'}</div>
    </div>
    ${inMenu.length ? `<div class="rbook">${inMenu.map(card).join('')}</div>` : ''}
    ${rest.length ? `<h2 style="font-size:15px;margin:22px 0 10px">מנות שלא בתפריט כרגע</h2>
      <div class="rbook">${rest.map(card).join('')}</div>` : ''}
    ${!dishes.length ? '<div class="empty-note">אין עדיין מנות במאגר.</div>' : ''}
    <div class="nav">
      <button class="btn soft" onclick="printBook()">הדפסת הספר</button>
      <span class="count-line" style="margin:0;align-self:center">${kidsN
        ? `הכמויות יחושבו ל-${kidsN} ילדים` : 'אין ילדים פעילים — הכמויות יוצגו לילד אחד'}</span>
    </div>
  </div>`;
}

let rEdit = null;
function openRecipe(id) {
  const d = dishById(id); if (!d) return;
  rEdit = { id, r: JSON.parse(JSON.stringify(d.recipe || { items: [], steps: '', minutes: '' })) };
  if (!rEdit.r.items.length) {
    // המרכיבים כבר קיימים על המנה — אין סיבה להקליד אותם שוב
    rEdit.r.items = (d.ingredients || []).map(n => ({ name: n, qty: '', unit: '' }));
  }
  openModal('מתכון · ' + d.name, 'כמויות לילד אחד.', recipeForm(d),
    `<button class="btn" onclick="saveRecipe()">שמירה</button>
     <button class="btn ghost" onclick="closeModal()">ביטול</button>
     <button class="btn soft" style="margin-right:auto" onclick="printOne('${id}')">הדפסה</button>`);
  drawScaled();
}
function recipeForm(d) {
  const r = rEdit.r;
  return `<div class="fld"><label>מרכיבים · לילד אחד</label>
      <div id="ritems">${r.items.map((it, i) => `<div class="ritem">
        <input class="n" type="text" value="${esc(it.name)}" oninput="rEdit.r.items[${i}].name=this.value">
        <input class="q" type="text" value="${esc(it.qty)}" placeholder="כמות" inputmode="decimal"
          oninput="rEdit.r.items[${i}].qty=this.value;drawScaled()">
        <input class="u" type="text" value="${esc(it.unit)}" placeholder="יחידה"
          oninput="rEdit.r.items[${i}].unit=this.value;drawScaled()">
        <button onclick="rEdit.r.items.splice(${i},1);document.getElementById('modalBody').innerHTML=recipeForm()">הסר</button>
      </div>`).join('')}</div>
      <button class="btn ghost" style="padding:7px 14px;font-size:12.5px"
        onclick="rEdit.r.items.push({name:'',qty:'',unit:''});document.getElementById('modalBody').innerHTML=recipeForm()">
        הוספת מרכיב</button></div>
    <div class="fld"><label>לכמה דקות הכנה</label>
      <input type="text" id="rmin" value="${esc(r.minutes||'')}" style="max-width:120px"
        inputmode="numeric" oninput="rEdit.r.minutes=this.value"></div>
    <div class="fld"><label>אופן ההכנה</label>
      <textarea id="rst" placeholder="שורה לכל שלב" style="min-height:120px"
        oninput="rEdit.r.steps=this.value">${esc(r.steps||'')}</textarea></div>
    <div class="fld"><label>מה שיודפס במטבח</label><div id="scaled"></div></div>`;
}
// הכפלה חיה — זה מה שהופך את "כמות לילד" למשהו שימושי ולא למטלה
function scaledHtml() {
  const n = kidsN || 1;
  const rows = (rEdit.r.items || []).filter(i => (i.name||'').trim());
  if (!rows.length) return '<div class="count-line">אין עדיין מרכיבים.</div>';
  return `<div class="scaled"><b>ל-${n} ילדים</b><br>` + rows.map(i => {
    const q = parseFloat(String(i.qty).replace(',', '.'));
    const tot = isFinite(q) ? +(q * n).toFixed(2) : null;
    return esc(i.name) + (tot != null ? ` — <b>${tot} ${esc(i.unit||'')}</b>` : '');
  }).join('<br>') + '</div>';
}
function drawScaled() { const e = document.getElementById('scaled'); if (e) e.innerHTML = scaledHtml(); }
async function saveRecipe() {
  const d = dishById(rEdit.id); if (!d) return;
  const r = rEdit.r;
  r.items = (r.items || []).filter(i => (i.name||'').trim());
  const next = Object.assign({}, d, { recipe: r });
  try {
    await api.saveDish(next);
    const i = dishes.findIndex(x => x.id === d.id);
    if (i >= 0) dishes[i] = next;
    closeModal(); render(); showOk('המתכון נשמר');
  } catch (e) { showErr('השמירה נכשלה: ' + e.message); }
}

/* ---------- דף מתכון להדפסה ---------- */
function sheetHtml(d) {
  const r = d.recipe || {}, n = kidsN || 1;
  const items = (r.items || []).filter(i => (i.name||'').trim());
  const steps = String(r.steps || '').split('\n').map(x => x.trim()).filter(Boolean);
  const al = (d.allergens || []).map(alName);
  return `<div class="rsheet">
    <h3>${esc(d.name)}</h3>
    <div class="for">ל-${n} ילדים${r.minutes ? ' · ' + esc(r.minutes) + ' דקות הכנה' : ''}</div>
    ${items.length ? `<h4>מרכיבים</h4><ul>${items.map(i => {
      const q = parseFloat(String(i.qty).replace(',', '.'));
      const tot = isFinite(q) ? +(q * n).toFixed(2) : '';
      return `<li><b>${tot ? esc(String(tot)) + ' ' + esc(i.unit||'') : ''}</b><span>${esc(i.name)}</span></li>`;
    }).join('')}</ul>` : ''}
    ${steps.length ? `<h4>הכנה</h4><ol>${steps.map(x => `<li>${esc(x)}</li>`).join('')}</ol>` : ''}
    ${al.length ? `<div class="al">מכיל: ${esc(al.join(' · '))}</div>` : ''}
  </div>`;
}
function printOne(id) {
  const d = dishById(id); if (!d) return;
  if (rEdit && rEdit.id === id) d.recipe = rEdit.r;
  openPrint(sheetHtml(d));
}
function printBook() {
  const withR = dishes.filter(hasRecipe);
  if (!withR.length) { showErr('אין עדיין מתכונים להדפיס'); return; }
  openPrint(withR.map(sheetHtml).join('<div style="page-break-after:always"></div>'));
}
// חלון הדפסה נפרד: דף המטבח הוא מסמך אחר מהמסך, ולא גרסה מוקטנת שלו
function openPrint(body) {
  const css = document.querySelector('style').textContent;
  const w = window.open('', '_blank');
  if (!w) { showErr('הדפדפן חסם את חלון ההדפסה'); return; }
  w.document.write(`<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
    <title>ספר המתכונים</title>
    <link href="https://fonts.googleapis.com/css2?family=Alef:wght@400;700&display=swap" rel="stylesheet">
    <style>${css}
      body{background:#fff;padding:0}
      .rsheet{border:0;border-radius:0;padding:14mm}
      @page{size:A4;margin:0}
    </style></head><body>${body}</body></html>`);
  w.document.close();
  setTimeout(() => { w.focus(); w.print(); }, 500);
}

/* ---------- חלון ---------- */
function openModal(title, sub, body, actions) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalSub').textContent = sub || '';
  document.getElementById('modalBody').innerHTML = body || '';
  document.getElementById('modalActions').innerHTML = actions || '';
  document.getElementById('modalOv').classList.add('show');
}
function closeModal() { document.getElementById('modalOv').classList.remove('show'); picker = null; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
function showErr(m) { const el = document.getElementById('error'); el.textContent = m; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 5000); }
function showOk(m) { const el = document.getElementById('success'); el.textContent = m; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 3000); }

boot();
</script>
</body>
</html>
