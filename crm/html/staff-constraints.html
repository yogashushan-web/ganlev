<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>אילוצים לסידור עבודה — גן לב ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Heebo',sans-serif; background:linear-gradient(135deg,#1F3D34 0%,#2D5A50 100%); color:#3D3228; direction:rtl; min-height:100vh; padding:24px; }
    .card { background:#fff; border-radius:22px; max-width:560px; margin:20px auto; padding:36px 32px; box-shadow:0 20px 60px rgba(0,0,0,.3); }
    .head { text-align:center; margin-bottom:20px; }
    .head img { width:80px; height:80px; border-radius:50%; object-fit:cover; margin:0 auto 10px; display:block; }
    .head h1 { font-size:21px; color:#1F3D34; margin-bottom:8px; line-height:1.4; }
    .head p { font-size:13.5px; color:#9B8E82; line-height:1.65; }
    .who-list { display:flex; flex-direction:column; gap:8px; margin-top:20px; }
    .who-btn { padding:14px; border:1.5px solid #e3ddd2; border-radius:12px; background:#fff; font-family:'Heebo'; font-size:15px; font-weight:700; cursor:pointer; color:#1F3D34; text-align:center; }
    .who-btn:hover { border-color:#1F3D34; background:#f6f1e9; }
    .entries { display:flex; flex-direction:column; gap:12px; margin:18px 0; }
    .entry { border:1.5px solid #e3ddd2; border-radius:13px; padding:14px 16px; position:relative; }
    .entry-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
    @media(max-width:480px){ .entry-row{grid-template-columns:1fr;} }
    .entry label { display:block; font-size:11.5px; font-weight:700; color:#9B8E82; margin-bottom:4px; }
    .entry input, .entry select { width:100%; padding:9px 11px; border:1.5px solid #e3ddd2; border-radius:9px; font-family:'Heebo'; font-size:13.5px; outline:none; }
    .entry input:focus, .entry select:focus { border-color:#1F3D34; }
    .rm-btn { position:absolute; top:10px; left:10px; background:none; border:none; color:#c0563f; font-size:18px; cursor:pointer; line-height:1; }
    .btn-add-entry { width:100%; padding:13px; border:1.5px dashed #C4846C; border-radius:12px; background:#fff; color:#C4846C; font-family:'Heebo'; font-size:14px; font-weight:700; cursor:pointer; }
    .btn-add-entry:hover { background:#fbf3ef; }
    .btn { width:100%; margin-top:18px; padding:15px; border:none; border-radius:12px; background:#1F3D34; color:#fff; font-family:'Heebo'; font-size:16px; font-weight:700; cursor:pointer; }
    .btn:hover { background:#154428; }
    .btn:disabled { background:#cfc8bd; cursor:not-allowed; }
    .msg { display:none; text-align:center; padding:30px 10px; }
    .msg .v { font-size:46px; }
    .msg h2 { color:#1F3D34; margin:10px 0 6px; }
    .msg p { color:#9B8E82; }
    .err { background:#fdf0ef; color:#c0563f; padding:12px; border-radius:10px; font-size:14px; margin-bottom:14px; display:none; }
    .responded-note { background:#f1f5f2; color:#1F7a4f; padding:11px 14px; border-radius:10px; font-size:13px; margin-bottom:14px; }
    .empty-hint { text-align:center; color:#9B8E82; font-size:13px; padding:10px 0; }
  </style>
</head>
<body>
  <div class="card">
    <div id="wrap">
      <div class="head">
        <img src="logo.png" alt="גן לב">
        <h1 id="titleLine">אילוצים לסידור העבודה</h1>
        <p id="introLine">בחרו את שמכם מהרשימה</p>
      </div>
      <div class="err" id="err"></div>
      <div id="loading" style="text-align:center; color:#9B8E82; padding:20px;">טוען...</div>

      <div id="whoBlock" style="display:none;">
        <div class="who-list" id="whoList"></div>
      </div>

      <div id="formBlock" style="display:none;">
        <div id="respondedNote" class="responded-note" style="display:none;">מילאת כבר לתקופה הזו — אפשר לערוך ולשלוח שוב.</div>
        <div id="entries" class="entries"></div>
        <div id="emptyHint" class="empty-hint">אם אין לכם ימי היעדרות בתקופה הזו — פשוט לחצו על "שליחה" למטה.</div>
        <button type="button" class="btn-add-entry" onclick="addEntry()">+ הוסף יום היעדרות</button>
        <button class="btn" id="submitBtn">שליחת האילוצים</button>
      </div>
    </div>
    <div class="msg" id="thanks">
      <div class="v">✅</div>
      <h2>נשמר!</h2>
      <p>תודה, נעדכן את הסידור בהתאם 💛</p>
    </div>
  </div>

<script>
const params = new URLSearchParams(location.search);
const ROUND = params.get('round');
let staffList = [], myId = null, myName = '', roundInfo = null;
let rows = []; // {date, part, reason, reason_note, replacement_staff_id}

const REASON_LABELS = { family: 'משפחתי', vacation: 'חופשה', sick: 'מחלה', other: 'אחר' };
const PART_LABELS = { full: 'יום שלם', morning: 'בוקר בלבד', afternoon: 'צהריים בלבד' };

function showErr(m) { const e = document.getElementById('err'); e.textContent = m; e.style.display = 'block'; }
function esc(s) { return (s == null ? '' : String(s)).replace(/</g, '&lt;').replace(/"/g, '&quot;'); }

async function loadWho() {
  if (!ROUND) { showErr('קישור לא תקין'); document.getElementById('loading').style.display = 'none'; return; }
  try {
    const res = await fetch('/.netlify/functions/staff-constraints?round=' + encodeURIComponent(ROUND));
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'שגיאה');
    document.getElementById('loading').style.display = 'none';
    staffList = data.staff || [];
    document.getElementById('whoList').innerHTML = staffList.map(s =>
      `<button type="button" class="who-btn" onclick="selectSelf('${s.id}')">${esc(s.name)}</button>`).join('');
    document.getElementById('whoBlock').style.display = 'block';
  } catch (e) {
    document.getElementById('loading').style.display = 'none';
    showErr(e.message);
  }
}

async function selectSelf(staffId) {
  document.getElementById('whoBlock').style.display = 'none';
  document.getElementById('loading').style.display = 'block';
  document.getElementById('err').style.display = 'none';
  try {
    const res = await fetch(`/.netlify/functions/staff-constraints?round=${encodeURIComponent(ROUND)}&staff=${encodeURIComponent(staffId)}`);
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'שגיאה');
    myId = staffId; myName = data.staff_name; roundInfo = data.round;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('titleLine').textContent = 'אילוצים לסידור העבודה — ' + myName;
    document.getElementById('introLine').textContent = 'הוסיפו כל יום שבו אתם לא זמינים, וציינו מי מחליף/ה אתכם.';
    document.getElementById('respondedNote').style.display = data.responded ? 'block' : 'none';
    rows = (data.entries || []).map(e => ({ date: e.date, part: e.part, reason: e.reason, reason_note: e.reason_note || '', replacement_staff_id: e.replacement_staff_id }));
    renderRows();
    document.getElementById('formBlock').style.display = 'block';
  } catch (e) {
    document.getElementById('loading').style.display = 'none';
    showErr(e.message);
  }
}

function addEntry() {
  rows.push({ date: roundInfo.start_date, part: 'full', reason: 'family', reason_note: '', replacement_staff_id: '' });
  renderRows();
}
function removeEntry(i) { rows.splice(i, 1); renderRows(); }
function updateRow(i, field, value) { rows[i][field] = value; if (field !== 'reason_note') renderRows(); }

function renderRows() {
  document.getElementById('emptyHint').style.display = rows.length ? 'none' : 'block';
  const others = staffList.filter(s => s.id !== myId);
  document.getElementById('entries').innerHTML = rows.map((r, i) => `
    <div class="entry">
      <button type="button" class="rm-btn" onclick="removeEntry(${i})">✕</button>
      <div class="entry-row">
        <div><label>תאריך</label><input type="date" min="${roundInfo.start_date}" max="${roundInfo.end_date}" value="${r.date}" onchange="updateRow(${i},'date',this.value)"></div>
        <div><label>חלק היום</label><select onchange="updateRow(${i},'part',this.value)">
          ${Object.entries(PART_LABELS).map(([k, v]) => `<option value="${k}" ${r.part === k ? 'selected' : ''}>${v}</option>`).join('')}
        </select></div>
      </div>
      <div class="entry-row">
        <div><label>סיבה</label><select onchange="updateRow(${i},'reason',this.value)">
          ${Object.entries(REASON_LABELS).map(([k, v]) => `<option value="${k}" ${r.reason === k ? 'selected' : ''}>${v}</option>`).join('')}
        </select></div>
        <div><label>מי מחליף/ה אתכם</label><select onchange="updateRow(${i},'replacement_staff_id',this.value)">
          <option value="">בחרו...</option>
          ${others.map(s => `<option value="${s.id}" ${r.replacement_staff_id === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}
        </select></div>
      </div>
      ${r.reason === 'other' ? `<div><label>פרטו בבקשה</label><input type="text" value="${esc(r.reason_note)}" oninput="updateRow(${i},'reason_note',this.value)"></div>` : ''}
    </div>`).join('');
}

document.getElementById('submitBtn').addEventListener('click', async () => {
  for (const r of rows) {
    if (!r.date || !r.replacement_staff_id) { showErr('יש למלא תאריך ומחליף/ה לכל שורה'); return; }
  }
  document.getElementById('err').style.display = 'none';
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'שולח...';
  try {
    const res = await fetch('/.netlify/functions/staff-constraints', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ round_id: ROUND, staff_id: myId, entries: rows }),
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'שגיאה');
    document.getElementById('wrap').style.display = 'none';
    document.getElementById('thanks').style.display = 'block';
  } catch (e) {
    showErr(e.message);
    btn.disabled = false; btn.textContent = 'שליחת האילוצים';
  }
});

loadWho();
</script>
</body>
</html>
